<!DOCTYPE html>
<html lang="en" class="h-100">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Shashin</title>
        <script src="/js/jquery-3.5.1.min.js" nonce="0"></script>
        <script src="/js/popper.min.js" nonce="0"></script>
        <script src="/js/bootstrap.min.js" nonce="0"></script>
        <link href="/css/bootstrap.min.css" rel="stylesheet">
        <link href="/css/bootstrap-icons.css" rel="stylesheet">
        <link href="/css/cover.css" rel="stylesheet" type="text/css">
        <script src="/js/site/min/util.min.js" th:nonce="0"></script>
    </head>

    <body class="d-flex h-100 text-center">

        <div class="cover-container d-flex w-100 h-100 p-3 mx-auto flex-column">
            <header class="mb-auto">
                <div>
                    <h3 class="float-md-start mb-0"><a class="link-unstyled" href="/">Shashin</a></h3>
                    <nav class="nav justify-content-center float-md-end">
                        <a class="nav-link" aria-current="page" href="/features">Features</a>
                        <a class="nav-link" aria-current="page" href="/articles">Quick Start</a>
                        <a class="nav-link" href="/users/login">Login</a>
                    </nav>
                </div>
            </header>

            <main class="px-3">
                <h1>Welcome to Shashin</h1>
                <p class="lead">A self-hosted gallery for your photos and videos.</p>
                <p class="lead">
                    <a href="/features" class="btn btn-lg btn-primary fw-bold">Learn more</a>
                </p>
            </main>

            <footer class="mt-auto">
                <div class="form-switch">
                    <input class="form-check-input" type="checkbox" id="darkmodeSwitch">&nbsp;
                    <label class="form-check-label" for="darkmodeSwitch">Dark mode</label>
                </div>
                &copy; <span id="copyrightYear"></span> Shashin
            </footer>
        </div>

        <script type="text/javascript" nonce="0">
            $("#copyrightYear").text("2021-"+new Date().getFullYear());
            Util.activateDarkModeListener();
        </script>

    </body>
</html>
