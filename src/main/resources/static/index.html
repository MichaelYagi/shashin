<!DOCTYPE html>
<html lang="en" class="h-100">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Shashin</title>
        <script src="/js/jquery-3.5.1.min.js" nonce="0"></script>
        <script src="/js/popper.min.js" nonce="0"></script>
        <script src="/js/bootstrap.min.js" nonce="0"></script>
        <link href="/css/bootstrap.min.css" rel="stylesheet">
        <link href="/css/bootstrap-icons.css" rel="stylesheet">
        <link href="/css/cover.css" rel="stylesheet" type="text/css">
        <style>
            .bd-placeholder-img {
                font-size: 1.125rem;
                text-anchor: middle;
                -webkit-user-select: none;
                -moz-user-select: none;
                user-select: none;
            }

            @media (min-width: 768px) {
                .bd-placeholder-img-lg {
                    font-size: 3.5rem;
                }
            }
        </style>
    </head>

    <body class="d-flex h-100 text-center text-black bg-light">

        <div class="cover-container d-flex w-100 h-100 p-3 mx-auto flex-column">
            <header class="mb-auto">
                <div>
                    <h3 class="float-md-start mb-0">Shashin</h3>
                    <nav class="nav nav-masthead justify-content-center float-md-end">
                        <a class="nav-link" aria-current="page" href="/features">Features</a>
<!--                        <a class="nav-link" aria-current="page" href="/docs">Docs</a>-->
                        <a class="nav-link" href="/users/login">Login</a>
                    </nav>
                </div>
            </header>

            <main class="px-3">
                <h1>Welcome to Shashin</h1>
                <p class="lead">A self-hosted gallery for your photos and videos.</p>
                <p class="lead">
                    <a href="/features" class="btn btn-lg btn-primary fw-bold">Learn more</a>
                </p>
            </main>

            <footer class="mt-auto text-black-50">
                <p>&copy; <span id="copyrightYear"></span> Shashin</p>
            </footer>
        </div>

        <script type="text/javascript" nonce="0">
            $("#copyrightYear").text("2021-"+new Date().getFullYear());
        </script>

    </body>
</html>
