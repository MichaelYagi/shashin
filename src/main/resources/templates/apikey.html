<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:insert="fragments/head :: head(${activePage},${titleDescriptor})"></head>
<body class="thumb d-flex flex-column vh-100">

<div th:replace="fragments/topnav :: topnav(${currentUser},${activePage},'')"></div>

<div id="container" class="container-fluid pb-3 flex-grow-1 d-flex flex-column overflow-auto">
    <div class="row flex-grow-sm-1 flex-grow-0">
        <div th:replace="fragments/sidebaroffcanvas :: sidebaroffcanvas(${activeSidebar},${currentUser})"></div>
        <main role="main" class="col overflow-auto h-100">
            <div th:replace="fragments/content :: content(${message},${activePage},${authority},${parameter},'',${faceRecogServicesAvailable},${objectRecogEnabled})"
                 class="col-sm p-3 min-vh-100"></div>

<!--            <h2>Manage API key</h2>-->

            <div class="row mt-4">
                <div class="col-lg-4">
                    <div class="input-group mb-3">
                        <button id="copyapikey" data-clipboard-target="#apikey" class="btn btn-secondary" type="button" title="Copy API key">
                            <span id="apikeycopyicon" class="bi-clipboard-plus" style="font-size: 1rem;"></span>
                        </button>
                        <input id="apikey" type="text" class="form-control" aria-label="API key" th:data-clipboard-text="${user.apikey}" th:value="${user.apikey}" readonly>
                        <button id="updateapikey" class="btn btn-danger" type="button" title="Update API key">
                            <span class="bi-arrow-clockwise" style="font-size: 1rem;"></span>
                        </button>
                    </div>
                </div>
                <p>RSS feed <a id="rssFeedLink" th:href="${rssFeedLink}" th:text="${rssFeedLink}" target="_blank"></a></p>
                <p>ATOM feed <a id="atomFeedLink" th:href="${atomFeedLink}" th:text="${atomFeedLink}" target="_blank"></a></p>
                <p>View API documentaion <a href="/articles/endpoints">here</a>.</p>
            </div>

            <th:block th:if="${message != '' and alertClass != ''}">
                <div class="col-12">
                    <div th:class="${'alert ' + alertClass + ' alert-dismissible fade show'}" role="alert"
                         th:utext="${message+'&lt;button type=&quot;button&quot; class=&quot;btn-close&quot; data-bs-dismiss=&quot;alert&quot; aria-label=&quot;Close&quot;&gt;&lt;/button&gt;'}"/>
                </div>
            </th:block>

            <div id="footer"
                 th:replace="fragments/footer :: footer(${copyrightYear},${operatingSystemInfo},${buildProperties},${activeProfile})"></div>
        </main>
    </div>
</div>

<div class="modal fade" id="apikeyUpdateConfirmation" tabindex="-1" role="dialog" aria-labelledby="apikey"
     aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="trashModalLabel">Update API key</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">Are you sure you want to update your API key?</div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" data-bs-dismiss="modal" id="confirmUpdateApiKey">Confirm
                </button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript" th:inline="javascript" th:nonce="${cspNonce}">
    $(document).ready(function () {
        /*<![CDATA[*/
        shashin.nonce = /*[[${cspNonce}]]*/ '';
        /*]]>*/

        $("#appSearchInput").val("Manage API Key");

        $("#copyapikey").on("click", function (e) {
            e.preventDefault();

            let apikey = $("#apikey").val();

            if (apikey !== null && apikey !== "") {
                Util.copyToClipboard(apikey, function (successfullyCopied) {
                    if (successfullyCopied) {
                        $("#apikeycopyicon").removeClass("bi-clipboard-plus").removeClass("bi-clipboard-x").addClass("bi-clipboard-check");
                        $('#apikeycopyicon').fadeOut(5000, function () {
                            $(this).removeClass("bi-clipboard-check").removeClass("bi-clipboard-x").addClass("bi-clipboard-plus");
                        }).fadeIn(400)
                    } else {
                        $("#apikeycopyicon").removeClass("bi-clipboard-plus").removeClass("bi-clipboard-check").addClass("bi-clipboard-x");
                    }
                });
            } else {
                $("#apikeycopyicon").removeClass("bi-clipboard-plus").removeClass("bi-clipboard-check").addClass("bi-clipboard-x");
                shashin.showToastMessage("Operation failed", "API key must not be blank", {
                    icon: "bi-exclamation-triangle",
                    iconColor: "#FF0000",
                    borderColor:"danger"
                });
            }
        });

        $("#updateapikey").on("click", async function (e) {
            $("#apikeyUpdateConfirmation").modal('show');
        });

        $("#confirmUpdateApiKey").on("click", async function (e) {
            e.preventDefault();

            const currentApikey = $("#apikey").val();

            if (currentApikey !== null && currentApikey !== "") {
                const http = new Http("apikey update");
                const json = {currentApikey: currentApikey};

                let data = await http.ajax("post", "/users/update/apikey", JSON.stringify(json));
                if (data.hasOwnProperty("updatedApikey") && data["updatedApikey"] !== "" &&
                    data.hasOwnProperty("rssFeedLink") && data["rssFeedLink"] !== "") {
                    $("#apikey").val(data["updatedApikey"]);

                    $("#rssFeedLink").text(data["rssFeedLink"]);
                    $("#rssFeedLink").attr("href", data["rssFeedLink"]);

                    $("#atomFeedLink").text(data["atomFeedLink"]);
                    $("#atomFeedLink").attr("href", data["atomFeedLink"]);

                    shashin.showToastMessage("API key updated", "API key has been updated.", {
                        icon: "bi-info-circle",
                        iconColor: "#777777",
                        target: shashin.toast.target.one
                    });
                } else {
                    shashin.showToastMessage("Operation failed", "Could not regenerate API key", {
                        icon: "bi-exclamation-triangle",
                        iconColor: "#FF0000",
                        borderColor:"danger"
                    });
                    // $("#msg").html("<div class=\"alert alert-warning\" role=\"alert\">Could not regenerate API key</div>");
                }
            } else {
                shashin.showToastMessage("Operation failed", "API key must not be blank", {
                    icon: "bi-exclamation-triangle",
                    iconColor: "#FF0000",
                    borderColor:"danger"
                });
                // $("#msg").html("<div class=\"alert alert-warning\" role=\"alert\">Link must not be blank</div>");
            }

        });
    });
</script>

</body>
</html>
