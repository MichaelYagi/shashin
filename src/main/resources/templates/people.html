<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:insert="~{fragments/head :: head(${activePage},${titleDescriptor})}"></head>
<body class="thumb d-flex flex-column vh-100">

<div th:replace="~{fragments/topnav :: topnav(${currentUser},${activePage},'')}"></div>

<div id="container" class="container-fluid pb-3 flex-grow-1 d-flex flex-column overflow-auto">
    <div class="row flex-grow-sm-1 flex-grow-0">
        <div th:replace="~{fragments/sidebaroffcanvas :: sidebaroffcanvas(${activeSidebar},${currentUser},${copyrightYear},${operatingSystemInfo},${buildProperties},${activeProfile})}"></div>
        <main role="main" class="col overflow-auto h-100" id="timelineMain">
            <div th:replace="~{fragments/content :: content(${message},${activePage},${authority},${parameter},'',${faceRecogServicesAvailable},${objectRecogEnabled})}" class="col-sm p-3 min-vh-100"></div>
            <div id="albumsMessage"></div>

            <th:block th:if="${not #lists.isEmpty(peopleList)}">
                <div class="row image-group-padding">
                    <th:block th:each="person, iterStat: ${peopleList}">
                        <th:block th:if="${person.name != null and person.name != 'null'}">
                            <div class="card" style="width:235px;padding-top:10px;margin-right:-1px;margin-bottom:-1px;">
                                <a th:href="'/person/'+${person.id}"  style="text-decoration: none !important;color: #777777;" th:id="'person'+${person.id}">
                                    <th:block th:if="${#maps.containsKey(coverUrls, person.id)}">
                                        <img loading="lazy" class="card-img-top" th:src="${coverUrls.get(person.id)}" width="209" height="209">
                                    </th:block>
                                </a>
                                <div class="card-body" style="display: flex;flex-direction: column;">
                                    <p class="card-text"><strong th:text="${person.name}"></strong></p>
                                    <p class="card-text">
                                        <span style="margin-top: auto;">
                                            <small class="text-muted" th:text="${person.tagCount + (person.tagCount == 1 ? ' item' : ' items')}"></small>
                                            <th:block th:if="${#maps.containsKey(counts, person.id)}">
                                                <br><small class="text-muted" th:text="${counts.get(person.id) + (counts.get(person.id) == 1 ? ' match' : ' matches')}"></small>
                                            </th:block>
                                        </span>
                                    </p>
                                </div>
                            </div>
                        </th:block>
                    </th:block>
                </div>
            </th:block>

            <div th:replace="~{fragments/footer :: footer(${copyrightYear},${operatingSystemInfo},${buildProperties},${activeProfile})}"></div>
        </main>
    </div>
</div>

<script th:inline="javascript" type="text/javascript" th:nonce="${cspNonce}">
    $(document).ready(function() {
        shashin.updateSearchInput("People");
    });
</script>
</body>
</html>
