<!DOCTYPE html>
<th:block th:insert="~{fragments/asciiart :: asciiart()}"></th:block>
<html th:lang="${locale}" xmlns:th="http://www.thymeleaf.org">
<head th:insert="~{fragments/head :: head(${activePage},${titleDescriptor})}"></head>
<body class="thumb d-flex flex-column vh-100">

<div th:replace="~{fragments/topnav :: topnav(${currentUser},${activePage},'')}"></div>

<div id="container" class="container-fluid pb-3 flex-grow-1 d-flex flex-column overflow-auto">
    <div class="row flex-grow-sm-1 flex-grow-0">
        <div th:replace="~{fragments/sidebaroffcanvas :: sidebaroffcanvas(${activeSidebar},${currentUser})}"></div>
        <main role="main" class="col overflow-auto h-100">
            <div th:replace="~{fragments/hiddenfields :: hiddenfields(${message})}"></div>

            <div class="row mt-4">
                <div class="col pb-4">
                    <div class="card">
                        <div class="card-header">
                            <h5 class="card-title"><th:block th:text="#{main.pages.dashboard.usage}"></th:block></h5>
                        </div>
                        <div class="card-body">
                            <div class="card-text">
                                <div class="row pb-5">
                                    <div class="col-sm text-center">
                                        <h1 class="display-6" id="uptimeText"></h1>
                                    </div>

                                    <div class="col-sm text-center" id="mediaStatusContainer" style="display: none">
                                        <h1 class="display-6"><th:block th:text="#{main.pages.dashboard.media}"></th:block>&nbsp;<span id="mediaStatus"></span></h1>
                                    </div>

                                    <div class="col-sm text-center" id="nominatimStatusContainer" style="display: none">
                                        <h1 class="display-6"><th:block th:text="#{main.pages.dashboard.nominatim}"></th:block>&nbsp;<span id="nominatimStatus"></span></h1>
                                    </div>

                                    <div class="col-sm text-center" id="compreFaceStatusContainer" style="display: none">
                                        <h1 class="display-6"><span id="compreFaceText"></span></strong>&nbsp;<span id="compreFaceStatus"></h1>
                                    </div>
                                </div>
                                <div class="row pb-5">
                                    <div class="col-sm-4" style="height:450px;">
                                        <canvas id="osChart"></canvas>
                                    </div>

                                    <div class="col-sm-4" style="height:450px;">
                                        <canvas id="browserChart"></canvas>
                                    </div>

                                    <div class="col-sm-4" style="height:450px;">
                                        <canvas id="userChart"></canvas>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col pb-4">
                    <div class="card h-100">
                        <div class="card-header">
                            <h5 class="card-title"><th:block th:text="#{main.pages.dashboard.pagemetrics}"></th:block></h5>
                        </div>
                        <div class="card-body">
                            <div class="card-text">
                                <div class="row pb-5">
                                    <div class="col-sm-4">
                                        <strong><th:block th:text="#{main.pages.dashboard.totaltime}"></th:block></strong>
                                    </div>

                                    <div class="col-sm">
                                        <span id="endpointProcessingTimeMS"></span>
                                    </div>
                                </div>
                                <div class="row pb-5">
                                    <div class="col-sm-4">
                                        <strong><th:block th:text="#{main.pages.dashboard.average}"></th:block></strong>
                                    </div>

                                    <div class="col-sm">
                                        <span id="endpointAverageProcessingTimeMS"></span>
                                    </div>
                                </div>
                                <div class="row pb-5">
                                    <div class="col-sm-4">
                                        <strong><th:block th:text="#{main.pages.dashboard.fastest}"></th:block></strong>
                                    </div>

                                    <div class="col-sm">
                                        <span id="endpointFastestProcessingTimeMS"></span>
                                    </div>
                                </div>
                                <div class="row pb-5">
                                    <div class="col-sm-4">
                                        <strong><th:block th:text="#{main.pages.dashboard.slowest}"></th:block></strong>
                                    </div>

                                    <div class="col-sm">
                                        <span id="endpointSlowestProcessingTimeMS"></span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col pb-4">
                    <div class="card">
                        <div class="card-header">
                            <h5 class="card-title"><th:block th:text="#{main.pages.dashboard.cpu}"></th:block></h5>
                        </div>
                        <div class="card-body">
                            <div class="card-text">
                                <canvas id="cpuChart" height="400"></canvas>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col pb-4">
                    <div class="card">
                        <div class="card-header">
                            <h5 class="card-title"><th:block th:text="#{main.pages.dashboard.memory}"></th:block></h5>
                        </div>
                        <div class="card-body">
                            <div class="card-text">
                                <canvas id="memoryChart" height="400"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col pb-4">
                    <div class="card">
                        <div class="card-header">
                            <div class="row">
                                <div class="col-sm-3">
                                    <h2 id="sidecarUsedSizeText"></h2>
                                </div>
                                <div class="col-sm-9 mt-2">
                                    <div id="sidecarUsageContainer" class="progress" role="progressbar" aria-label="Sidecar data used" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
                                        <div id="sidecarUsageGraph" class="progress-bar" style="width: 0">0%</div>
                                    </div>
                                    <div class="d-flex justify-content-end">
                                        <div id="sidecarUsableSizeText"></div>
                                    </div>
                                </div>
                            </div>
                            <p class="text-muted"><th:block th:text="#{main.pages.dashboard.sidecarsize}"></th:block></p>
                        </div>
                        <div class="card-body">
                            <h5 class="card-title"><th:block th:text="#{main.pages.dashboard.gallerystats}"></th:block></h5>
                            <p class="card-text">
                                <canvas id="siteStatChart" height="400"></canvas>
                            </p>
                        </div>
                    </div>
                </div>

                <div class="col pb-4">
                    <div class="card">
                        <div class="card-header">
                            <h2 id="mediaCount"></h2>
                            <p class="text-muted"><th:block th:text="#{main.pages.dashboard.totalmedia}"></th:block></p>
                        </div>
                        <div class="card-body">
                            <h5 class="card-title"><th:block th:text="#{main.pages.dashboard.mediastats}"></th:block></h5>
                            <p class="card-text">
                                <canvas id="mediaChart" height="400"></canvas>
                            </p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col pb-4">
                    <div class="card">
                        <div class="card-header">
                            <h2 id="cameraCount"></h2>
                            <p class="text-muted"><th:block th:text="#{main.pages.dashboard.cameramodels}"></th:block></p>
                        </div>
                        <div class="card-body">
                            <h5 class="card-title"><th:block th:text="#{main.pages.dashboard.camerastats}"></th:block></h5>
                            <p class="card-text">
                                <canvas id="cameraChart" height="600"></canvas>
                            </p>
                        </div>
                    </div>
                </div>

                <div class="col pb-4">
                    <div class="card">
                        <div class="card-header">
                            <h2 id="keywordCount"></h2>
                            <p class="text-muted"><th:block th:text="#{main.pages.dashboard.keywords}"></th:block></p>
                        </div>
                        <div class="card-body">
                            <h5 class="card-title"><th:block th:text="#{main.pages.dashboard.keywordsstats}"></th:block></h5>
                            <p class="card-text">
                                <canvas id="keywordChart" height="600"></canvas>
                            </p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col pb-4">
                    <div class="card">
                        <div class="card-header">
                            <h2 id="placenameCount"></h2>
                            <p class="text-muted"><th:block th:text="#{main.pages.dashboard.placenames}"></th:block></p>
                        </div>
                        <div class="card-body">
                            <h5 class="card-title"><th:block th:text="#{main.pages.dashboard.placenamestats}"></th:block></h5>
                            <p class="card-text">
                                <canvas id="placenameChart" height="600"></canvas>
                            </p>
                        </div>
                    </div>
                </div>
            </div>

            <div id="footer" th:replace="~{fragments/footer :: footer(${copyrightYear},${operatingSystemInfo},${buildProperties},${activeProfile},${activePage})}"></div>
        </main>
    </div>
</div>

<th:block th:if="${@environment.getProperty('app.js.useMinified') == 'false'}">
    <script src="/js/site/dashboard.js" type="text/javascript" th:nonce="${cspNonce}"></script>
</th:block>
<th:block th:if="${@environment.getProperty('app.js.useMinified') == 'true'}">
    <script src="/js/site/min/dashboard.min.js" type="text/javascript" th:nonce="${cspNonce}"></script>
</th:block>
<script th:inline="javascript" type="text/javascript" th:nonce="${cspNonce}">
    $(document).ready(function() {

        /*<![CDATA[*/
        shashin.nonce = /*[[${cspNonce}]]*/ '';
        const shashinServerStartUnixMSStr = /*[[${shashinServerStartUnixMS}]]*/ '0';
        /*]]>*/

        const shashinServerStartUnixMS = Number(shashinServerStartUnixMSStr);

        shashin.updateSearchInput(shashin.getTranslatedValue("main.sidebar.dashboard"));

        function numberWithCommas(x) {
            return x.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        }

        Util.updateProgressBar(100, {autoVisibility: false});
        $("#progressBarWrapper").visible();

        if (shashinServerStartUnixMS > 0) {
            setInterval(function () {
                $("#uptimeText").html(shashin.getTranslatedValue("main.pages.dashboard.uptime") + " <code>" + Util.convertMSToRelativeTime(Date.now()-shashinServerStartUnixMS) + "</code>");
            }, 1000);
        }

        $(document).ready(function () {
            setTimeout(function () {
                shashin.showToastMessage(shashin.getTranslatedValue("main.toast.dashboard.title"), shashin.getTranslatedValue("main.toast.dashboard.body")+"...", {
                    icon: "bi-info-circle",
                    iconColor: "#777777",
                    autohide: false,
                    tag: "dashboard",
                    closeButton: false
                });
                const http = new Http("dashboard data");
                http.ajax("get", "/dashboard/data").then(function (data) {
                    shashin.printMessageToConsole(JSON.stringify(data), {tags: ["dashboard", "data"]});

                    if (data["imageAvailable"] !== null) {
                        $("#mediaStatusContainer").css("display", "block");
                        $("#mediaStatus").css({
                            "color": (data["mediaAvailable"] ? "green" : "red"),
                            "font-size": "2rem"
                        });
                        $("#mediaStatus").addClass((data["mediaAvailable"] ? "bi-check-circle" : "bi-x-circle"));
                        $("#mediaStatus").attr("title", "Media is " + (data["mediaAvailable"] ? "" : "not " ) + "available");
                    }
                    if (data["nominatimAvailable"] !== null) {
                        $("#nominatimStatusContainer").css("display", "block");
                        $("#nominatimStatus").css({
                            "color": (data["nominatimAvailable"] ? "green" : "red"),
                            "font-size": "2rem"
                        });
                        $("#nominatimStatus").addClass((data["nominatimAvailable"] ? "bi-check-circle" : "bi-x-circle"));
                        $("#nominatimStatus").attr("title", "Nominatim is " + (data["nominatimAvailable"] ? "" : "not " ) + "available");
                    }
                    if (data["compreFaceAvailable"] !== null) {
                        $("#compreFaceStatusContainer").css("display", "block");
                        $("#compreFaceStatus").css({
                            "color": (data["compreFaceAvailable"] ? "green" : "red"),
                            "font-size": "2rem"
                        });
                        $("#compreFaceStatus").attr("title", "CompreFace is " + (data["compreFaceAvailable"] ? "" : "not " ) + "available");
                        $("#compreFaceStatus").addClass((data["compreFaceAvailable"] ? "bi-check-circle" : "bi-x-circle"));
                        if (data["compreFaceAvailable"]) {
                            $("#compreFaceText").text(shashin.getTranslatedValue("main.pages.dashboard.compreface"));
                        } else {
                            $("#compreFaceText").html('<a href="/settings" target="_blank">'+shashin.getTranslatedValue("main.pages.dashboard.compreface")+'</a>');
                        }
                    }
                    $("#endpointProcessingTimeMS").text("0 ms");
                    if (data["endpointProcessingTimeMS"] !== null) {
                        $("#endpointProcessingTimeMS").text(data["endpointProcessingTimeMS"] + " ms");
                    }
                    $("#endpointAverageProcessingTimeMS").text("0 ms");
                    if (data["endpointAverageProcessingTimeMS"] !== null && data["endpointAllTimings"] !== null) {
                        $("#endpointAverageProcessingTimeMS").text(data["endpointAverageProcessingTimeMS"] + " ms over " + data["endpointAllTimings"].length + " calls");
                    }
                    $("#endpointFastestProcessingTimeMS").text("0 ms");
                    if (data["endpointFastestProcessingTimeMS"] !== null && data["endpointFastestProcessingTimeModule"] !== null) {
                        $("#endpointFastestProcessingTimeMS").text(data["endpointFastestProcessingTimeMS"] + " ms processing module " + data["endpointFastestProcessingTimeModule"]);
                    }
                    $("#endpointSlowestProcessingTimeMS").text("0 ms");
                    if (data["endpointSlowestProcessingTimeMS"] !== null && data["endpointSlowestProcessingTimeModule"] !== null) {
                        $("#endpointSlowestProcessingTimeMS").text(data["endpointSlowestProcessingTimeMS"] + " ms processing module " + data["endpointSlowestProcessingTimeModule"]);
                    }

                    const sidecarUsedSizeB = parseInt(data["sidecarUsedSizeB"]);
                    const sidecarTotalSizeB = parseInt(data["sidecarTotalSizeB"]);
                    const percentUsed = parseInt((sidecarUsedSizeB / sidecarTotalSizeB) * 100);

                    shashin.printMessageToConsole("sidecar space used raw: " + data["sidecarUsedSizeB"], {tag: "dashboard"});
                    shashin.printMessageToConsole("sidecar space used: " + data["sidecarUsedSizeText"], {tag: "dashboard"});
                    shashin.printMessageToConsole("sidecar space usable raw: " + data["sidecarUsableSizeB"], {tag: "dashboard"});
                    shashin.printMessageToConsole("sidecar space usable: " + data["sidecarUsableSizeText"], {tag: "dashboard"});
                    shashin.printMessageToConsole("sidecar space total raw: " + data["sidecarTotalSizeB"], {tag: "dashboard"});
                    shashin.printMessageToConsole("sidecar space total: " + data["sidecarTotalSizeText"], {tag: "dashboard"});

                    if (percentUsed > 0) {
                        $("#sidecarUsageContainer").attr("aria-valuenow", percentUsed);
                        $("#sidecarUsageGraph").css("width", percentUsed + "%");
                        $("#sidecarUsageGraph").text(percentUsed + "%");
                        if (percentUsed > 90) {
                            if (percentUsed > 97) {
                                $("#sidecarUsageGraph").addClass("bg-danger");
                            } else {
                                $("#sidecarUsageGraph").addClass("bg-warning");
                            }
                            const http = new Http("get sidecar data");
                            const type = "sidecardatasize";
                            const maxUsed = "90";
                            const sidecarTotalSizeText = data["sidecarTotalSizeText"];
                            http.ajax("get", "/notifications/exists/" + type + "/" + maxUsed).then(function (data) {
                                if (data.hasOwnProperty("exists")) {
                                    const exists = data.exists;
                                    if (exists === false) {
                                        const json = {
                                            message: sidecarTotalSizeText + " usable space left",
                                            type: type,
                                            identifier: maxUsed
                                        };
                                        http.ajax("post", "/notifications/create", JSON.stringify(json)).then(function (data) {
                                            shashin.printMessageToConsole(JSON.stringify(data), {tag: type});
                                        });
                                    }
                                }
                            });
                        }
                    }
                    $("#sidecarUsedSizeText").html(data["sidecarUsedSizeText"]);
                    $("#sidecarUsableSizeText").html("<small class='text-muted'>" + data["sidecarUsableSizeText"] + " " + shashin.getTranslatedValue("main.pages.dashboard.usablespace") + "</small>");
                    $("#mediaCount").text(numberWithCommas(parseInt(data["photoCount"]) + parseInt(data["videoCount"])));
                    $("#cameraCount").text(numberWithCommas(parseInt(data["cameraTotalCount"])));
                    $("#placenameCount").text(numberWithCommas(parseInt(data["placenameTotalCount"])));
                    $("#keywordCount").text(numberWithCommas(parseInt(data["keywordTotalCount"])));

                    const siteStatChartData = {};
                    siteStatChartData["photosWithPeopleTaggedCount"] = data["photosWithPeopleTaggedCount"];
                    siteStatChartData["favoritesCount"] = data["favoritesCount"];
                    siteStatChartData["commentsCount"] = data["commentsCount"];
                    siteStatChartData["albumCount"] = data["albumCount"];

                    const userChartData = {};
                    userChartData["activeUserCount"] = data["allowedUserCount"];
                    userChartData["pendingUserCount"] = data["notAllowedUserCount"];
                    userChartData["activeAdminCount"] = data["allowedAdminCount"];
                    userChartData["pendingAdminCount"] = data["notAllowedAdminCount"];
                    userChartData["activeSuperCount"] = data["allowedSuperCount"];
                    userChartData["pendingSuperCount"] = data["notAllowedSuperCount"];

                    const mediaChartData = {};
                    mediaChartData["photoCount"] = data["photoCount"];
                    mediaChartData["videoCount"] = data["videoCount"];
                    mediaChartData["notLocatedCount"] = data["notLocatedCount"];
                    mediaChartData["hiddenCount"] = data["hiddenCount"];

                    const cameraChartData = {};
                    cameraChartData["cameraCountJson"] = data["cameraCountJson"];

                    const placenameChartData = {};
                    placenameChartData["placenameCountJson"] = data["placenameCountJson"];

                    const agentNameChartData = {};
                    agentNameChartData["agentNameCountJson"] = data["agentNameCountJson"];

                    const osNameChartData = {};
                    osNameChartData["osNameCountJson"] = data["osNameCountJson"];

                    const keywordChartData = {};
                    keywordChartData["keywordCountJson"] = data["keywordCountJson"];

                    const dashboard = new Dashboard();
                    dashboard.displaySiteStatChart(siteStatChartData);
                    dashboard.displayUserChart(userChartData);
                    dashboard.displayMediaChart(mediaChartData);
                    dashboard.displayCameraChart(cameraChartData);
                    dashboard.displayPlacenameChart(placenameChartData)
                    dashboard.displayAgentNameChart(agentNameChartData);
                    dashboard.displayOsNameChart(osNameChartData);
                    dashboard.displayKeywordChart(keywordChartData);
                    const cpuChart = dashboard.displayCpuChart();
                    const memoryChart = dashboard.displayMemoryChart();
                    dashboard.startWebSocket(cpuChart, memoryChart);

                    $("#progressBarWrapper").invisible();
                    Util.updateProgressBar(0, {autoVisibility: false});
                    shashin.closeToastMessages({
                        tag: "dashboard"
                    });
                });
            }, 0);
        });
    });
</script>

</body>
</html>
