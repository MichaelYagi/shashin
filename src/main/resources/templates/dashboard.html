<!DOCTYPE html>
<html lang="en" xmlns:th="http://thymeleaf.org">
<head th:insert="fragments/head :: head(${titleDescriptor})"></head>
<body class="thumb d-flex flex-column vh-100">

<div th:replace="fragments/topnav :: topnav(${currentUser},${hasNotifications},${activePage})"></div>

<div id="container" class="container-fluid pb-3 flex-grow-1 d-flex flex-column overflow-auto">
    <div class="row flex-grow-sm-1 flex-grow-0">
        <div th:replace="fragments/sidebaroffcanvas :: sidebaroffcanvas(${activeSidebar},${currentUser},${hasNotifications})"></div>
        <main role="main" class="col overflow-auto h-100">
            <div th:replace="fragments/content :: content(${message},${activePage},${authority},${parameter})" class="col-sm p-3 min-vh-100"></div>
            <div th:replace="fragments/appjs :: appjs()"></div>
            <h1>Dashboard</h1><br>

            <div class="row pb-4">

                <div class="col">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">CPU</h5>
                            <p class="card-text">
                                <canvas id="cpuChart" height="400"></canvas>
                            </p>
                        </div>
                    </div>
                </div>

                <div class="col">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">Memory</h5>
                            <p class="card-text">
                                <canvas id="memoryChart" height="400"></canvas>
                            </p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row pb-4">
                <div class="col">
                    <div class="card">
                        <div class="card-header">
                            <h2 th:text="${sidecarSizeMB}+' MB'"></h2>
                            <p class="text-muted">Sidecar Data Size</p>
                        </div>
                        <div class="card-body">
                            <h5 class="card-title">Gallery Stats</h5>
                            <p class="card-text">
                                <canvas id="siteStatChart" height="400"></canvas>
                            </p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row pb-4">

                <div class="col">
                    <div class="card">
                        <div class="card-header">
                            <h2 th:text="${allowedUserCount+notAllowedUserCount+allowedAdminCount+notAllowedAdminCount}"></h2>
                            <p class="text-muted">Total Users</p>
                        </div>
                        <div class="card-body">
                            <h5 class="card-title">User Stats</h5>
                            <p class="card-text">
                                <canvas id="userChart" height="400"></canvas>
                            </p>
                        </div>
                    </div>
                </div>

                <div class="col">
                    <div class="card">
                        <div class="card-header">
                            <h2 th:text="${photoCount+videoCount}"></h2>
                            <p class="text-muted">Total Media</p>
                        </div>
                        <div class="card-body">
                            <h5 class="card-title">Media Stats</h5>
                            <p class="card-text">
                                <canvas id="mediaChart" height="400"></canvas>
                            </p>
                        </div>
                    </div>
                </div>

                <div class="col">
                    <div class="card">
                        <div class="card-header">
                            <h2 th:text="${cameraTotalCount}"></h2>
                            <p class="text-muted">Camera Types Used In Media</p>
                        </div>
                        <div class="card-body">
                            <h5 class="card-title">Camera Stats</h5>
                            <p class="card-text">
                                <canvas id="cameraChart" height="400"></canvas>
                            </p>
                        </div>
                    </div>
                </div>
            </div>

            <div id="footer" th:replace="fragments/footer :: footer(${copyrightYear},${operatingSystemInfo},${buildProperties})"></div>
        </main>
    </div>
</div>

<script type="text/javascript">
    /*<![CDATA[*/
    let ctx = $('#siteStatChart');
    const photosWithPeopleTaggedCount = [[${photosWithPeopleTaggedCount}]];
    const favoritesCount = [[${favoritesCount}]];
    const commentsCount = [[${commentsCount}]];
    const albumCount = [[${albumCount}]];
    const siteStatChart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: ['Photos With People Tagged','Total Favorites','Total Comments','Total Albums'],
            datasets: [{
                data: [photosWithPeopleTaggedCount,favoritesCount,commentsCount,albumCount],
                backgroundColor: [
                    'rgba(54, 162, 235, 0.2)',
                    'rgba(255, 206, 86, 0.2)',
                    'rgba(153, 102, 255, 0.2)',
                    'rgba(255, 159, 64, 0.2)'
                ],
                borderColor: [
                    'rgba(54, 162, 235, 1)',
                    'rgba(255, 206, 86, 1)',
                    'rgba(153, 102, 255, 1)',
                    'rgba(255, 159, 64, 1)'
                ],
                borderWidth: 1
            }]
        },
        options: {
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: {
                        stepSize: 1
                    }
                }
            },
            plugins: {
                legend: false
            },
            maintainAspectRatio: false
        }
    });

    ctx = $('#userChart');
    const activeUserCount = [[${allowedUserCount}]];
    const pendingUserCount = [[${notAllowedUserCount}]];
    const activeAdminCount = [[${allowedAdminCount}]];
    const pendingAdminCount = [[${notAllowedAdminCount}]];
    const loggedInCount = [[${loggedInCount}]];
    const userChart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: ['Active Users','Active Admins','Pending Users','Pending Admins','Logged In'],
            datasets: [{
                data: [activeUserCount,activeAdminCount,pendingUserCount,pendingAdminCount,loggedInCount],
                backgroundColor: [
                    'rgba(54, 162, 235, 0.2)',
                    'rgba(255, 206, 86, 0.2)',
                    'rgba(54, 162, 235, 0.2)',
                    'rgba(255, 206, 86, 0.2)',
                    'rgba(153, 102, 255, 0.2)'
                ],
                borderColor: [
                    'rgba(54, 162, 235, 1)',
                    'rgba(255, 206, 86, 1)',
                    'rgba(54, 162, 235, 1)',
                    'rgba(255, 206, 86, 1)',
                    'rgba(153, 102, 255, 1)'
                ],
                borderWidth: 1
            }]
        },
        options: {
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: {
                        stepSize: 1
                    }
                }
            },
            plugins: {
                legend: false
            },
            maintainAspectRatio: false
        }
    });

    ctx = $('#mediaChart');
    const photoCount = [[${photoCount}]];
    const videoCount = [[${videoCount}]];
    const locatedCount = [[${locatedCount}]];
    const notLocatedCount = [[${notLocatedCount}]];
    const mediaChart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: ['Photos','Videos','GPS Data','Missing GPS Data'],
            datasets: [{
                data: [photoCount,videoCount,locatedCount,notLocatedCount],
                backgroundColor: [
                    'rgba(54, 162, 235, 0.2)',
                    'rgba(255, 206, 86, 0.2)',
                    'rgba(153, 102, 255, 0.2)',
                    'rgba(255, 159, 64, 0.2)'
                ],
                borderColor: [
                    'rgba(54, 162, 235, 1)',
                    'rgba(255, 206, 86, 1)',
                    'rgba(153, 102, 255, 1)',
                    'rgba(255, 159, 64, 1)'
                ],
                borderWidth: 1
            }]
        },
        options: {
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: {
                        stepSize: 1
                    }
                }
            },
            plugins: {
                legend: false
            },
            maintainAspectRatio: false
        }
    });

    ctx = $('#cameraChart');
    const cameraCounts = JSON.parse(decodeHtml('[[${cameraCountJson}]]'));
    const cameraChart = new Chart(ctx, {
        type: 'bar',
        data: {
            datasets: [{
                data: cameraCounts
            }]
        },
        options: {
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: {
                        stepSize: 1
                    }
                }
            },
            plugins: {
                legend: false
            },
            maintainAspectRatio: false
        }
    });
    /*]]>*/

    ctx = $('#cpuChart');
    const cpuChart = new Chart(ctx, {
        type: 'line',
        labels: [],
        data: {
            datasets: [
                {
                    label: 'JVM CPU %',
                    data: [],
                    fill: false,
                    borderColor: 'rgb(54, 162, 235)',
                    tension: 0.1
                },
                {
                    label: 'System CPU %',
                    data: [],
                    fill: false,
                    borderColor: 'rgb(255, 206, 86)',
                    tension: 0.1
                }
            ]
        },
        options: {
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: {
                        stepSize: 20
                    },
                    max: 100
                }
            },
            plugins: {
                legend: true
            },
            maintainAspectRatio: false
        }
    });

    ctx = $('#memoryChart');
    const memoryChart = new Chart(ctx, {
        type: 'line',
        labels: [],
        data: {
            datasets: [
                {
                    label: 'Memory Used %',
                    data: [],
                    fill: false,
                    borderColor: 'rgb(54, 162, 235)',
                    tension: 0.1
                }
            ]
        },
        options: {
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: {
                        stepSize: 20
                    },
                    max: 100
                }
            },
            plugins: {
                legend: true
            },
            maintainAspectRatio: false
        }
    });

    function addData(chart, label, data, index) {
        if (label !== null) {
            chart.data.labels.push(label);
        }
        chart.data.datasets[index].data.push(data);
        chart.update();
    }

    function removeData(chart) {
        chart.data.labels.shift();
        chart.data.datasets.forEach((dataset) => {
            dataset.data.shift();
        });
        chart.update();
    }

    let stompClient = null;
    const showDebug = false;
    // Socket polling refresh rate
    const refreshRateMS = 1000*5;
    // Update chart every 10 seconds
    const intervalMS = 1000*10;
    // Pop values after 3 minutes
    const maxElapsedMS = 1000*60*3;
    let elapsedMS = 0;

    connect();

    function scanRefresh() {
        sendMessage();
        elapsedMS += refreshRateMS
        setTimeout(scanRefresh, refreshRateMS);
    }

    function connect() {
        const socket = new SockJS('/websocket-endpoint');
        stompClient = Stomp.over(socket);
        if (showDebug === false) {
            stompClient.debug = null
        }

        printMessageToConsole("Socket Connecting");

        stompClient.connect({}, function() {
            scanRefresh();
            printMessageToConsole( "Connected STOMP client");

            this.subscribe("/topic/statmessages", function (message) {
                let respMessageJsonString = JSON.parse(message.body).content;
                const systemStats = JSON.parse(respMessageJsonString);

                const processCpuLoadPercent = Math.ceil(systemStats["processCpuLoadPercentDouble"]*100)|0;
                const processCpuLoadData = ~~processCpuLoadPercent;
                printMessageToConsole("processCpuLoadData: "+processCpuLoadData);

                const systemCpuLoadPercent = Math.ceil(systemStats["systemCpuLoadPercentDouble"]*100)|0;
                const systemCpuLoadData = ~~systemCpuLoadPercent
                printMessageToConsole("systemCpuLoadData: "+systemCpuLoadData);

                const memoryUsedPercent = Math.ceil(systemStats["usedHeapMemoryGB"]/systemStats["maxHeapMemoryGB"]*100)|0;
                const memoryUsedData = ~~memoryUsedPercent
                printMessageToConsole("usedHeapMemoryGB: "+systemStats["usedHeapMemoryGB"]);
                printMessageToConsole("maxHeapMemoryGB: "+systemStats["maxHeapMemoryGB"]);
                printMessageToConsole("memoryUsedData: "+memoryUsedData);

                if (elapsedMS >= maxElapsedMS && elapsedMS % intervalMS === 0) {
                    removeData(cpuChart);
                    removeData(memoryChart);
                }
                if (elapsedMS === refreshRateMS || elapsedMS % intervalMS === 0) {
                    addData(cpuChart, systemStats["timestamp"], processCpuLoadData, 0)
                    addData(cpuChart, null, systemCpuLoadData, 1)
                    addData(memoryChart, systemStats["timestamp"], memoryUsedData, 0)
                }
                printMessageToConsole("Message:"+respMessageJsonString);
            });
        }, function(e) {
            printMessageToConsole("Socket connection error: " + e.toString())
        });
    }

    function disconnect() {
        if (stompClient !== null) {
            stompClient.disconnect();
        }
        printMessageToConsole("Disconnected");
    }

    function sendMessage() {
        if (stompClient !== null) {
            stompClient.send("/app/statmessage", {}, JSON.stringify({'message': "getStatMessage"}));
        } else {
            printMessageToConsole("Trying to send message but STOMP client is null")
        }
    }

    function printMessageToConsole(msg) {
        if (showDebug === true) {
            console.log(msg);
        }
    }
</script>

</body>
</html>
