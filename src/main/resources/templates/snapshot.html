<!DOCTYPE html>
<html lang="en" xmlns:th="http://thymeleaf.org">
<head th:insert="fragments/head :: head(${titleDescriptor})"></head>
<body class="thumb d-flex flex-column vh-100">

<div th:replace="fragments/topnav :: topnav(${currentUser},${activePage},'')"></div>

<div id="container" class="container-fluid pb-3 flex-grow-1 d-flex flex-column overflow-auto">
    <div class="row flex-grow-sm-1 flex-grow-0">
        <div th:replace="fragments/sidebaroffcanvas :: sidebaroffcanvas(${activeSidebar},${currentUser})"></div>
        <main role="main" class="col overflow-auto h-100">
            <div th:replace="fragments/content :: content(${message},${activePage},${authority},${parameter},'')" class="col-sm p-3 min-vh-100"></div>

            <div class="row">
                <div class="col-md-auto">
                    <form method="post" action="/settings/snapshot/export">
                        <button class="btn btn-primary" type="submit" id="export" name="snapshot" value="export">Export metadata</button>
                    </form>
                </div>
                <div class="col-lg-10">
                    <form method="post" enctype="multipart/form-data" action="/settings/snapshot" class="col-lg-4">
                        <div class="input-group">
                            <input type="file" class="form-control" id="snapshotFile" name="snapshotFile" aria-describedby="snapshotFile" aria-label="Upload">
                            <button class="btn btn-secondary" id="import" type="submit" name="snapshot" value="import">Import metadata</button>
                        </div>
                    </form>
                </div>
            </div>
            <div th:replace="fragments/footer :: footer(${copyrightYear},${operatingSystemInfo},${buildProperties})"></div>
        </main>
    </div>
</div>

<script type="text/javascript" th:nonce="${cspNonce}">
    /*<![CDATA[*/
    shashin.nonce = /*[[${cspNonce}]]*/ '';
    /*]]>*/

    $(document).ready(function () {
        const fileChooser = $("#snapshotFile");
        if (fileChooser.val() === "") {
            $("#import").addClass('disabled');
        }

        fileChooser.on("change", function(){
            if (fileChooser.val() === "") {
                $("#import").addClass('disabled');
            } else {
                $("#import").removeClass('disabled');
            }
        });

        $("#import").on("click", function() {
            $("#msg").text("Importing metadata.");
        });

        const tokenName = "ShashinSnapshotName";
        const tokenSize = "ShashinSnapshotSize";
        let attempts = 120;
        let downloadTimer;

        $("#export").on("click", function() {
            attempts = 120;
            $("#msg").text("Exporting metadata.");
            setTimeout(function () { $("#export").prop("disabled", true); }, 0);

            setCookie(tokenName, "", "/settings/snapshot");
            setCookie(tokenSize, "", "/settings/snapshot");

            downloadTimer = window.setInterval( function() {
                const tokenCookieValue = getCookie(tokenName);
                const tokenCookieSize = getCookie(tokenSize);

                if ((tokenCookieValue !== "" && tokenCookieSize !== "") || attempts === 0) {
                    let fileSize = 0;
                    let unit = "kb";

                    if (tokenCookieSize > 100000000) {
                        fileSize = tokenCookieSize/10000000;
                        unit = "gb";
                    } else if (tokenCookieSize > 10000000) {
                        fileSize = tokenCookieSize/1000000;
                        unit = "mb";
                    } else {
                        fileSize = tokenCookieSize/1000;
                        unit = "kb";
                    }

                    $("#msg").text("File name: " + tokenCookieValue + ". File size: " + fileSize + " " + unit + ".");
                    $("#export").prop("disabled", false);
                    deleteCookie(tokenName, "/settings/snapshot");
                    deleteCookie(tokenSize, "/settings/snapshot");
                    window.clearInterval(downloadTimer);
                }

                attempts--;
            }, 1000);

            function getCookie(name) {
                const parts = document.cookie.split(name + "=");

                if (parts.length === 2) {
                    return parts.pop().split(";").shift();
                }

                return "";
            }

            function setCookie(name, value, path) {
                const d = new Date();
                d.setTime(d.getTime() + (3600*1000));
                document.cookie = name + "=" + ((value !== "") ? value : "") + ((path) ? ";path=" + path : "") + "; expires=" + d.toUTCString();
            }

            function deleteCookie( name, path, domain ) {
                if (getCookie(name)) {

                    document.cookie = name + "=" +
                        ((path) ? ";path=" + path : "") +
                        ((domain) ? ";domain=" + domain : "") +
                        ";expires=Thu, 01 Jan 1970 00:00:01 GMT";
                }
            }
        });
    });
</script>

</body>
</html>
