<!DOCTYPE html>
<html lang="en" xmlns:th="http://thymeleaf.org">
<head th:insert="fragments/head :: head(${titleDescriptor})"></head>
<body class="thumb d-flex flex-column vh-100">

<div th:replace="fragments/topnav :: topnav(${currentUser},${activePage},'')"></div>

<div id="container" class="container-fluid pb-3 flex-grow-1 d-flex flex-column overflow-auto">
    <div class="row flex-grow-sm-1 flex-grow-0">
        <div th:replace="fragments/sidebaroffcanvas :: sidebaroffcanvas(${activeSidebar},${currentUser})"></div>
        <main role="main" class="col overflow-auto h-100">
            <div th:replace="fragments/content :: content(${message},${activePage},${authority},${parameter},'')" class="col-sm p-3 min-vh-100"></div>

            <div class="row">
                <div class="col-md-auto">
                    <form method="post" action="/settings/snapshot/export">
                        <button class="btn btn-primary" type="submit" id="export" name="snapshot" value="export">Export metadata</button>
                    </form>
                </div>
                <div class="col-lg-10">
                    <form method="post" enctype="multipart/form-data" action="/settings/snapshot" class="col-lg-4">
                        <div class="input-group">
                            <input type="file" class="form-control" id="snapshotFile" name="snapshotFile" aria-describedby="snapshotFile" aria-label="Upload">
                            <button class="btn btn-secondary" id="import" type="submit" name="snapshot" value="import">Import metadata</button>
                        </div>
                    </form>
                </div>
            </div>
            <div th:replace="fragments/footer :: footer(${copyrightYear},${operatingSystemInfo},${buildProperties})"></div>
        </main>
    </div>
</div>

<script type="text/javascript" th:nonce="${cspNonce}">
    $(document).ready(function () {
        const fileChooser = $("#snapshotFile");
        if (fileChooser.val() === "") {
            $("#import").addClass('disabled');
        }

        fileChooser.on("change", function(){
            if (fileChooser.val() === "") {
                $("#import").addClass('disabled');
            } else {
                $("#import").removeClass('disabled');
            }
        });

        $("#import").on("click", function() {
            $("#msg").text("Importing metadata.");
        });

        $("#export").on("click", function() {
            $("#msg").text("Exporting metadata.");
        });
    });
</script>

</body>
</html>
