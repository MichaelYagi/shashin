<!DOCTYPE html>
<th:block th:insert="~{fragments/asciiart :: asciiart()}"></th:block>
<html th:lang="${locale}" xmlns:th="http://www.thymeleaf.org">
<head th:insert="~{fragments/head :: head(${activePage},${titleDescriptor})}"></head>
<body class="thumb d-flex flex-column vh-100">

<div th:replace="~{fragments/topnav :: topnav(${currentUser},${activePage},'')}"></div>

<div th:replace="~{fragments/settingsgroup :: settings(${activePage},${faceRecogServicesAvailable},${objectRecogEnabled},${facialRecogEnabled})}"></div>

<div id="container" class="container-fluid pb-3 flex-grow-1 d-flex flex-column overflow-auto">
    <div class="row flex-grow-sm-1 flex-grow-0">
        <div th:replace="~{fragments/sidebaroffcanvas :: sidebaroffcanvas(${activeSidebar},${currentUser})}"></div>
        <main role="main" class="col overflow-auto h-100">
            <div th:replace="~{fragments/hiddenfields :: hiddenfields(${message})}"></div>

            <div class="row mt-4">
                <div class="col-md-auto">
                    <form method="post" action="/settings/snapshot/export">
                        <button class="btn btn-primary" type="submit" id="export" name="snapshot" value="export"><th:block th:text="#{main.pages.snapshot.exportbutton}"></th:block></button>
                    </form>
                </div>
                <div class="col-lg-10">
                    <form method="post" enctype="multipart/form-data" action="/settings/snapshot" class="col-lg-4">
                        <div class="input-group">
                            <input type="file" accept=".zip" class="form-control" id="snapshotFile" name="snapshotFile" aria-describedby="snapshotFile" aria-label="Upload">
                            <button class="btn btn-secondary" id="import" type="submit" name="snapshot" value="import"><th:block th:text="#{main.pages.snapshot.importbutton}"></th:block></button>
                        </div>

                        <div class="input-group">
                            <input class="form-check-input" type="checkbox" name="importDatabase" id="importDatabase">&nbsp;
                            <label class="form-check-label" for="importDatabase"><th:block th:text="#{main.pages.snapshot.importcheck}"></th:block></label>
                        </div>
                    </form>
                </div>
            </div>
            <span class="bi-info-circle" style="font-size: 1rem;color: blue;"></span> <th:block th:text="#{main.pages.snapshot.info}"></th:block>
            <div th:replace="~{fragments/footer :: footer(${copyrightYear},${operatingSystemInfo},${buildProperties},${activeProfile},${activePage})}"></div>
        </main>
    </div>
</div>

<script th:inline="javascript" type="text/javascript" th:nonce="${cspNonce}">
    $(document).ready(function () {
        /*<![CDATA[*/
        shashin.nonce = /*[[${cspNonce}]]*/ '';
        const toastMessage = /*[[${toastMessage}]]*/ '';
        const status = /*[[${status}]]*/ '';
        /*]]>*/

        const snapshotInstance = new Snapshot();
        snapshotInstance.init();

        if (toastMessage !== '' && status !== '') {
            const statusMessage = status.charAt(0).toUpperCase() + status.slice(1);
            let options = {
                icon: "bi-exclamation-triangle",
                iconColor: "#FF0000"
            };

            if (status === shashin.apiResponse.SUCCESS) {
                options = {
                    icon:"bi-info-circle",
                    iconColor:"#777777"
                };
            }

            options["tag"] = "importexport";
            options["autohide"] = false;

            shashin.showToastMessage(statusMessage, toastMessage, options);
        }
    });
</script>

</body>
</html>
