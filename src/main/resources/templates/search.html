<!DOCTYPE html>
<html lang="en" xmlns:th="http://thymeleaf.org">
<head th:insert="fragments/head :: head(${titleDescriptor})"></head>
<body class="thumb d-flex flex-column vh-100">

<div th:replace="fragments/topnav :: topnav(${currentUser},${hasNotifications},${activePage})"></div>

<div th:replace="fragments/infomodal :: infomodal()"></div>

<div id="container" class="container-fluid pb-3 flex-grow-1 d-flex flex-column overflow-auto">
    <div class="row flex-grow-sm-1 flex-grow-0">
        <div th:replace="fragments/sidebaroffcanvas :: sidebaroffcanvas(${activeSidebar},${currentUser},${hasNotifications})"></div>
        <main role="main" class="col overflow-auto h-100">
            <div th:replace="fragments/content :: content(${message},${activePage},${authority},${parameter})" class="col-sm p-3 min-vh-100"></div>
            <input type="hidden" id="currentlat" name="currentlat">
            <input type="hidden" id="currentlng" name="currentlng">
            <input type="hidden" id="currentfilename" name="currentfilename">
            <input type="hidden" id="currentPage" name="currentPage" value="0">

            <div id="scroll-gallery">
                <th:block th:if="${searchTerm != '' and metadataSearchList != ''}">
                    <h1 th:text="'Results for \''+${searchTerm}+'\''"></h1>
                    <div class="row p-3">
                        <th:block th:each="metadata, iterStat: ${metadataSearchList}">
                            <div class="photo-thumbnail-container photo-thumbnail" th:style="${'width:'+metadata.thumbnailSmallWidth+'px;height:'+metadata.thumbnailSmallHeight+'px;padding-left:0;padding-right:0;'}">
                                <a class="lightGalleryIndexAnchor" th:name="${'lightGalleryIndex'+iterStat.index}"></a>

                                <img th:src="${#uris.escapePath(metadata.thumbnailUrlSmall)}" class="photo-thumbnail-image" th:id="'image'+${metadata.id}" th:width="${metadata.thumbnailSmallWidth}" th:height="${metadata.thumbnailSmallHeight}" th:onError="shashin.errorImg(this,[[${metadata.title}]],209)">

                                <th:block th:if="${metadata.type.contains('video')}">
                                    <div class="thumbnail-tr" th:id="'tntr'+${metadata.id}">
                                        <span class="overlayIconBackground"><th:block th:text="${metadata.duration != null ? metadata.duration : '0:00'}"></th:block>&nbsp;<span class="bi-camera-video overlayIcon"></span></span>
                                    </div>
                                </th:block>

                                <th:block th:if="${!metadata.type.contains('video') and metadata.originalImageWidth != null and metadata.originalImageHeight != null and metadata.originalImageWidth > metadata.originalImageHeight*2}">
                                    <div class="thumbnail-tr" th:id="'tntr'+${metadata.id}">
                                        <span class="bi-aspect-ratio overlayIcon overlayIconBackground"></span>
                                    </div>
                                </th:block>

                                <div class="thumbnail-bl" th:id="'tnbl'+${metadata.id}">
                                    <a href="#" th:id="'infoModalEdit'+${metadata.id}">
                                        <span class="bi-info-circle" style="font-size: 1rem;color: lightgray;"></span>
                                    </a>
                                </div>

                                <div class="thumbnail-centered" th:id="'tncentered'+${metadata.id}">
                                    <th:block th:unless="${metadata.type.contains('video')}">
                                        <th:block th:unless="${metadata.year==null or metadata.month==null or metadata.day==null}">
                                            <th:block th:with="sdf = ${new java.text.SimpleDateFormat('yyyy-M-d')}">
                                                <a class="mediaLink" th:onclick="return searchSettings.openGallery(event,[[${iterStat.index}]])"
                                                   th:data-src="${metadata.thumbnailUrlOriginal}" th:href="${metadata.thumbnailUrlOriginal}"
                                                   th:data-sub-html="${(metadata.placeName != null ? '<a href=&quot;/map?lat='+metadata.lat+'&lng='+metadata.lng+'&quot; target=&quot;_blank&quot;>'+metadata.placeName+'</a><br>' : '<br>')+metadata.fileName+' taken on  '+#dates.format(sdf.parse(metadata.year+'-'+metadata.month+'-'+metadata.day), 'EEE, MMM dd, yyyy')}">
                                                    <span class="bi-play-circle" style="font-size: 4rem;color: lightgray;"></span>
                                                </a>
                                            </th:block>
                                        </th:block>
                                        <th:block th:if="${metadata.year==null or metadata.month==null or metadata.day==null}">
                                            <a class="mediaLink" th:onclick="return searchSettings.openGallery(event,[[${iterStat.index}]])"
                                               th:data-src="${metadata.thumbnailUrlOriginal}" th:href="${metadata.thumbnailUrlOriginal}"
                                               th:data-sub-html="${(metadata.placeName != null ? '<a href=&quot;/map?lat='+metadata.lat+'&lng='+metadata.lng+'&quot; target=&quot;_blank&quot;>'+metadata.placeName+'</a><br>' : '<br>')+metadata.fileName}">
                                                <span class="bi-play-circle" style="font-size: 4rem;color: lightgray;"></span>
                                            </a>
                                        </th:block>
                                    </th:block>

                                    <th:block th:if="${metadata.type.contains('video')}">
                                        <th:block th:unless="${metadata.year==null or metadata.month==null or metadata.day==null}">
                                            <th:block th:with="sdf = ${new java.text.SimpleDateFormat('yyyy-M-d')}">
                                                <a class="mediaLink" th:onclick="return searchSettings.openGallery(event,[[${iterStat.index}]])"
                                                   th:data-video="${'{&quot;source&quot;: [{&quot;src&quot;:&quot;'+metadata.videoUrl+'&quot;, &quot;type&quot;:&quot;video/mp4&quot;}], &quot;attributes&quot;: {&quot;preload&quot;: false, &quot;controls&quot;: true}}'}"
                                                   th:data-sub-html="${(metadata.placeName != null ? '<a href=&quot;/map?lat='+metadata.lat+'&lng='+metadata.lng+'&quot; target=&quot;_blank&quot;>'+metadata.placeName+'</a><br>' : '<br>')+metadata.fileName+' taken on '+#dates.format(sdf.parse(metadata.year+'-'+metadata.month+'-'+metadata.day), 'EEE, MMM dd, yyyy')}">
                                                    <span class="bi-play-circle" style="font-size: 4rem;color: lightgray;"></span>
                                                </a>
                                            </th:block>
                                        </th:block>
                                        <th:block th:if="${metadata.year==null or metadata.month==null or metadata.day==null}">
                                            <a class="mediaLink" th:onclick="return searchSettings.openGallery(event,[[${iterStat.index}]])"
                                               th:data-video="${'{&quot;source&quot;: [{&quot;src&quot;:&quot;'+metadata.videoUrl+'&quot;, &quot;type&quot;:&quot;video/mp4&quot;}], &quot;attributes&quot;: {&quot;preload&quot;: false, &quot;controls&quot;: true}}'}"
                                               th:data-sub-html="${(metadata.placeName != null ? '<a href=&quot;/map?lat='+metadata.lat+'&lng='+metadata.lng+'&quot; target=&quot;_blank&quot;>'+metadata.placeName+'</a><br>' : '<br>')+metadata.fileName}">
                                                <span class="bi-play-circle" style="font-size: 4rem;color: lightgray;"></span>
                                            </a>
                                        </th:block>
                                    </th:block>
                                </div>
                            </div>

                            <script th:inline="javascript" type="text/javascript">
                                /*<![CDATA[*/
                                shashin.setPhotoOverlays(/*[[${metadata}]]*/{}, /*[[${activePage}]]*/'search');
                                searchSettings.activateMetadataListeners(/*[[${metadata}]]*/{});
                                $("#infoModalEdit"+/*[[${metadata.id}]]*/"00000000-00000000-00000000-00000000").attr("tag",JSON.stringify(/*[[${metadata}]]*/{}));
                                $("#infoModalEdit"+/*[[${metadata.id}]]*/"00000000-00000000-00000000-00000000").click(function(e) {
                                    e.preventDefault();
                                    const metadataObj = JSON.parse($(this).attr("tag"));
                                    shashin.openInfoModal(metadataObj);
                                });
                                /*]]>*/
                            </script>

                            <span class="appendSearchPhotos" style="width:0;height:0;padding:0"></span>

                        </th:block>
                    </div>

                    <th:block th:if="${#lists.size(metadataSearchList) == 0}">
                        <span class="appendSearchPhotos" style="width:0;height:0;padding:0;display:none;">EOL</span>
                    </th:block>

                </th:block>
            </div>

            <div id="footer" th:replace="fragments/footer :: footer(${copyrightYear},${operatingSystemInfo},${buildProperties})"></div>
        </main>
    </div>
</div>

<script src="/js/site/applisteners.js"></script>
<script th:inline="javascript" type="text/javascript">
    $(document).ready(function(){
        searchSettings.setLightGalleryElement('scroll-gallery');
        searchSettings.setLightGallery();

        $(function() {
            $('[data-bs-toggle="tooltip"]').tooltip()
        })

        let mediaContentList = [];
        $.each($('.mediaLink'), function(index, element) {
            const mediaContent = {};
            mediaContent.subHtml =$(this).attr("data-sub-html")
            if ($(this).attr("data-src")) {
                mediaContent.src = $(this).attr("data-src");
            } else if ($(this).attr("data-video")) {
                mediaContent.video = $(this).attr("data-video");
            }
            mediaContentList.push(mediaContent);
        });
        if (searchSettings.getLightGallery() !== null) {
            searchSettings.getLightGallery().refresh(mediaContentList);
            searchSettings.infiniteScrollGallery.addEventListener('lgAfterSlide', function(e) {
                shashin.jumpToLightGalleryIndex(e.detail.index);
            })
        }

        function loadNextPage() {
            $("#spinner").css("display","block");
            const currentPage = parseInt($("#currentPage").val());
            const nextPage = currentPage + 1;
            /*<![CDATA[*/
            const activePage = /*[[${activePage}]]*/ 'search';
            const searchTerm = /*[[${searchTerm}]]*/ '';
            /*]]>*/
            searchSettings.updateSearch(nextPage,searchTerm,activePage).then(function(additionalMediaContentList) {
                if (additionalMediaContentList.length > 0) {
                    mediaContentList = mediaContentList.concat(additionalMediaContentList);
                    searchSettings.getLightGallery().refresh(mediaContentList);
                    searchSettings.infiniteScrollGallery.addEventListener('lgAfterSlide', function(e) {
                        shashin.jumpToLightGalleryIndex(e.detail.index);
                    })
                }
            });
            $("#currentPage").val(nextPage);
        }

        const refreshIntervalId = window.setInterval(function () {
            if (!$("#container").hasScrollBar() && !$("main").hasScrollBar()) {
                setTimeout(() => {
                    loadNextPage();
                }, 1000);
            } else {
                clearInterval(refreshIntervalId);
            }
            /*<![CDATA[*/
            const metadataSearchList = /*[[${metadataSearchList}]]*/ '[]';
            /*]]>*/
            if ($(".appendSearchPhotos").last().text() === "EOL" || metadataSearchList === '' || metadataSearchList === '[]') {
                clearInterval(refreshIntervalId);
            }
        }, 200);
        $("#container").on('scroll', function() {
            if (shashin.atEndOfPage(this) && $(".appendSearchPhotos").last().text() !== "EOL") {
                loadNextPage();
            }
        })
        $("main").on('scroll', function() {
            if (shashin.atEndOfPage(this) && $(".appendSearchPhotos").last().text() !== "EOL") {
                loadNextPage();
            }
        })
    });
</script>

</body>
</html>
