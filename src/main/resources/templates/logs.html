<!DOCTYPE html>
<html lang="en" xmlns:th="http://thymeleaf.org">
<head th:insert="fragments/head :: head(${titleDescriptor})"></head>
<body class="thumb d-flex flex-column vh-100">

<div th:replace="fragments/topnav :: topnav(${currentUser},${hasNotifications},${activePage},'')"></div>

<div id="container" class="container-fluid pb-3 flex-grow-1 d-flex flex-column overflow-auto">
    <div class="row flex-grow-sm-1 flex-grow-0">
        <div th:replace="fragments/sidebaroffcanvas :: sidebaroffcanvas(${activeSidebar},${currentUser},${hasNotifications})"></div>
        <main role="main" class="col overflow-auto h-100">
            <div th:replace="fragments/content :: content(${message},${activePage},${authority},${parameter},'')" class="col-sm p-3 min-vh-100"></div>
            <th:block th:if="${logList != ''}">
                <br>
                <script type="text/javascript">
                    function setLineLimit() {
                        const lineLimit = $("#lineLimit").val()
                        if (lineLimit !== "" && Math.floor($('#lineLimit').val()) == $('#lineLimit').val() && $.isNumeric($('#lineLimit').val())) {
                            window.location.href = '/settings/logs?lines=' + lineLimit;
                        }
                    }
                </script>
                <div class="row">
                    <div class="col-sm-2">
                        <input type="text" class="form-control" id="lineLimit" value="">
                    </div>
                    <div class="col-sm-3">
                        <button class="btn btn-outline-secondary" type="button" onclick="return setLineLimit();">Set Line Limit</button>
                    </div>
                </div>
                <br>
                <th:block th:each="logLine, iterStat: ${logList}">
                    <th:block th:if="${#strings.contains(logLine, 'INFO')}">
                        <pre style="margin-top:0px;margin-bottom: 0px;" class='bg-info text-white' th:text="${logLine}"></pre>
                    </th:block>
                    <th:block th:if="${#strings.contains(logLine, 'WARN')}">
                        <pre style="margin-top:0px;margin-bottom: 0px;" class='bg-warning text-dark' th:text="${logLine}"></pre>
                    </th:block>
                    <th:block th:if="${#strings.contains(logLine, 'ERROR')}">
                        <pre style="margin-top:0px;margin-bottom: 0px;" class='bg-danger text-white' th:text="${logLine}"></pre>
                    </th:block>
                    <th:block th:unless="${#strings.contains(logLine, 'ERROR') or #strings.contains(logLine, 'WARN') or #strings.contains(logLine, 'INFO')}">
                        <pre style="margin-top:0px;margin-bottom: 0px;" class='bg-light text-dark' th:text="${logLine}"></pre>
                    </th:block>
                </th:block>
            </th:block>

            <div th:replace="fragments/footer :: footer(${copyrightYear},${operatingSystemInfo},${buildProperties})"></div>
        </main>
    </div>
</div>

<script type="text/javascript">
    const lines = Util.getParameterByName("lines");
    if (lines === null) {
        $("#lineLimit").val(1000);
    } else {
        $("#lineLimit").val(lines);
    }
</script>

</body>
</html>
