<!DOCTYPE html>
<html  xmlns:th="http://www.thymeleaf.org">
<head th:fragment="docshead(titleDescriptor)">
    <th:block th:with="titleDescriptorLower = ${#strings.toLowerCase(titleDescriptor)}">
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title th:text="${@environment.getProperty('app.build.properties.name')} + (${#strings.isEmpty(titleDescriptor)} ? '' : ': ' + ${#strings.replace(titleDescriptor,'Docs/','')})"></title>
        <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
        <link rel="manifest" href="/images/site.webmanifest">
        <link rel="mask-icon" href="/images/safari-pinned-tab.svg" color="#5bbad5">
        <script src="/js/jquery-3.5.1.min.js"></script>
        <script src="/js/popper.min.js"></script>
        <script src="/js/bootstrap.min.js"></script>
        <link href="/css/bootstrap.min.css" rel="stylesheet">
        <link href="/css/bootstrap-icons.css" rel="stylesheet">
        <link href="/css/site/docsstyle.css" rel="stylesheet">
        <meta name="theme-color" content="#7952b3">
        <th:block th:if="${@environment.getProperty('app.js.useMinified') == 'false'}">
            <script src="/js/site/util.js"></script>
        </th:block>
        <th:block th:if="${@environment.getProperty('app.js.useMinified') == 'true'}">
            <script src="/js/site/min/util.min.js"></script>
        </th:block>
    </th:block>
</head>
<body></body>
</html>
