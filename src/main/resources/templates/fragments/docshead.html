<!DOCTYPE html>
<html  xmlns:th="http://www.thymeleaf.org">
<head th:fragment="docshead(titleDescriptor)">
    <th:block th:with="titleDescriptorLower = ${#strings.toLowerCase(titleDescriptor)}">
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title th:text="${@environment.getProperty('app.build.properties.name')} + (${#strings.isEmpty(titleDescriptor)} ? '' : ' ' + ${titleDescriptor})"></title>
        <script src="/js/jquery-3.5.1.min.js"></script>
        <script src="/js/popper.min.js"></script>
        <script src="/js/bootstrap.min.js"></script>
        <link href="/css/bootstrap.min.css" rel="stylesheet">
        <link href="/css/bootstrap-icons.css" rel="stylesheet">
        <link href="/css/site/docsstyle.css" rel="stylesheet">
        <meta name="theme-color" content="#7952b3">
    </th:block>
</head>
<body></body>
</html>
