<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body th:fragment="aboutmodal(activeProfile, buildProperties, operatingSystemInfo, copyrightYear, darkMode)">

<div class="modal fade" id="propAbout" tabindex="-1" role="dialog" aria-labelledby="labelAboutContent">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-sm" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="aboutLabel"><img id="aboutIcon" th:src="${darkMode == true ? '/images/kamon_transparent_inverted.png' : '/images/kamon_transparent.png'}" width="25px" height="25px" class="mb-1">&nbsp;&nbsp;&nbsp;About</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p>A self-hosted media gallery.</p>
                <th:block th:if="${activeProfile != 'prod'}">
                    <span th:text="${#strings.capitalize(activeProfile)+' Build'}"></span><br>
                </th:block>
                Version <span th:text="${buildProperties.getVersion()}"></span><span id="gitVersionId"></span><br>
                <th:block th:if="${operatingSystemInfo != ''}">
                    <span th:text="${operatingSystemInfo}"></span><br>
                </th:block>
                <br>
                &copy; <span th:text="'2021-'+${copyrightYear}+' '+${@environment.getProperty('app.build.properties.name')}"></span><br>
                <a class="me-2" href="https://github.com/MichaelYagi" target="_blank"><span class="bi-github" style="font-size: 1.5rem;color: lightgray;"></span></a>
                <a class="me-2" href="https://www.youtube.com/@MichaelTakayukiYagi" target="_blank"><span class="bi-youtube" style="font-size: 1.5rem;color: lightgray;"></span></a>
                <a class="me-2" href="https://bsky.app/profile/mtyagi.bsky.social" target="_blank"><span class="bi-bluesky" style="font-size: 1.5rem;color: lightgray;"></span></a>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript" type="text/javascript" th:nonce="${cspNonce}">
    $(document).ready(function() {
        $("#propAbout").on('shown.bs.modal', function () {
            $("#gitVersionId").html("");
            let currentRelease = 'v' + /*[[${buildProperties.getVersion()}]]*/ '';

            const http = new Http("get releases");
            http.ajax("get", "/releases").then(function (data) {
                if (data.hasOwnProperty("releases")) {
                    const releaseArray = data.releases;
                    if (releaseArray.length > 0 && currentRelease !== "v") {
                        for (let i in releaseArray) {
                            const releaseInfo = releaseArray[i];
                            if (releaseInfo.hasOwnProperty("name")) {
                                const ghReleaseName = releaseInfo.name;
                                if (currentRelease === ghReleaseName) {
                                    if (i > 0) {
                                        // let link = "https://github.com/MichaelYagi/shashin";
                                        // if (releaseInfo.hasOwnProperty("zipball_url")) {
                                        //     link = releaseInfo.zipball_url;
                                        //     link = link.replace("api.", "");
                                        //     link = link.replace("repos/", "");
                                        //     link = link.replace("zipball/", "");
                                        //     link = link.replace("refs/", "releases/");
                                        //     link = link.replace("tags/", "tag/");
                                        // }
                                        $("#gitVersionId").html("<br><em>A new <a href='https://api.repoflow.io/browse/universal/cd373a98-3f60-419f-9c40-d10a1180ccda/shashin/shashin' target='_blank'>release</a> is available.</em>");
                                    }
                                    break;
                                }
                            }
                        }
                    }
                }

            });
        });
    });
</script>
