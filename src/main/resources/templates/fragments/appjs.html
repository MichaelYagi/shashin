<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body th:fragment="appjs()">
<script type="text/javascript">
    $.fn.hasScrollBar = function() {
        return this.get(0).scrollHeight > this.height();
    }

    // Detect scrolling to bottom of page
    function atEndOfPage() {
        var c = [document.scrollingElement.scrollHeight, document.body.scrollHeight, document.body.offsetHeight].sort(function(a,b){return b-a}) // select longest candidate for scrollable length
        return ((window.innerHeight + window.scrollY)*1.5  >= c[0]) // compare with scroll position + some give
    }

    function makeShareLinkId(minLength, maxLength) {
        var length = Math.floor(
            Math.random() * (Math.ceil(maxLength) - Math.floor(minLength) + 1) + minLength
        );
        var result           = '';
        var characters       = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
        var charactersLength = characters.length;
        for ( var i = 0; i < length; i++ ) {
            result += characters.charAt(Math.floor(Math.random() *
                charactersLength));
        }
        return result;
    }

    function fallbackCopyTextToClipboard(text) {
        var msg = "";
        var textArea = document.createElement("textarea");
        textArea.value = text;

        // Avoid scrolling to bottom
        textArea.style.top = "0";
        textArea.style.left = "0";
        textArea.style.position = "fixed";

        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();

        try {
            var successful = document.execCommand('copy');
            msg = "<div class=\"alert alert-warning\" role=\"alert\">Could not copy text</div>";
            if (successful === true) {
                msg = "<div class=\"alert alert-success\" role=\"alert\">Link copied to clipboard!</div>";
            }
        } catch (err) {
            msg = "<div class=\"alert alert-warning\" role=\"alert\">Could not copy text</div>";
        }

        document.body.removeChild(textArea);

        return msg;
    }

    function copyTextToClipboard(text,albumId) {
        if (!navigator.clipboard) {
            $("#msg"+albumId).html(fallbackCopyTextToClipboard(text));
        }

        navigator.clipboard.writeText(text).then(function() {
            $("#msg"+albumId).html("<div class=\"alert alert-success\" role=\"alert\">Link copied to clipboard!</div>");
        }, function(err) {
            $("#msg"+albumId).html("<div class=\"alert alert-warning\" role=\"alert\">Could not copy text</div>");
        });
    }

    function updateShareLink(baseUrl,albumId,action) {
        $("#generateLink"+albumId).prop('disabled', true);
        $("#msg"+albumId).html("");
        var relativeShareLink = "";
        if (action === "generate") {
            relativeShareLink = makeShareLinkId(8, 11);
            $("#shareLink"+albumId).val(relativeShareLink);
        }
        if ($("#shareLink"+albumId).val() !== "") {
            $("#copyLink"+albumId).prop('disabled', false);
        } else {
            $("#copyLink"+albumId).prop('disabled', true);
        }

        let json = {albumId: albumId,relativeShareUrl: relativeShareLink}
        const posting = $.post({
            url: "/album/"+albumId+"/save/sharelink",
            data: JSON.stringify(json),
            contentType: 'application/json; charset=utf-8'
        });

        posting.done(function (data) {
            if (data.hasOwnProperty("status") && data.hasOwnProperty("msg") && data.hasOwnProperty("relativeShareUrl")) {
                let message = "Generated link not saved";
                let relativeShareUrlData = data["relativeShareUrl"] === null ? "" : data["relativeShareUrl"];
                $("#shareLink"+albumId).val(relativeShareUrlData);
                $("#fullShareLinkContainer"+albumId).css("display","none");
                $("#fullShareLink"+albumId).text("");
                if (relativeShareUrlData !== "") {
                    $("#fullShareLinkContainer"+albumId).css("display","block");
                    $("#fullShareLink"+albumId).html("<a target='_blank' href='"+baseUrl+"share/"+relativeShareUrlData+"/album/"+albumId+"'>"+baseUrl+"share/"+relativeShareUrlData+"/album/"+albumId+"</a>");
                }
                if (data["status"] === "success" && $("#shareLink"+albumId).val() === relativeShareUrlData) {
                    message = '<div class="alert alert-success" role="alert">' + data["msg"] + '</div>';
                } else {
                    message = '<div class="alert alert-danger" role="alert">' + data["msg"] + '</div>';
                }
                $("#generateLink"+albumId).prop('disabled', false);
                $("#msg"+albumId).html(message);
            } else {
                $("#generateLink"+albumId).prop('disabled', false);
                $("#msg"+albumId).html("<div class=\"alert alert-danger\" role=\"alert\">Generated link not saved</div>");
            }
        });
    }

    $.fn.serializeObject = function() {
        var o = {};
        var a = this.serializeArray();
        $.each(a, function() {
            if (o[this.name]) {
                if (!o[this.name].push) {
                    o[this.name] = [o[this.name]];
                }
                o[this.name].push(this.value || '');
            } else {
                o[this.name] = this.value || '';
            }
        });
        return o;
    };

    function getLightGalleryConfigs() {
        return {
            plugins: [lgZoom, lgVideo, lgRelativeCaption],
            counter: false,
            download: true,
            preload: false,
            speed:0,
            licenseKey: "A8E2CC75-7F9D45CA-9CE65C4E-FFF50CE3"
        }
    }

    function getDateString(year,month,day) {
        if (year !== null && year !== "" &&
            month !== null && month !== "" &&
            day !== null && day !== ""
        ) {
            let date = new Date(month+"/"+day+"/"+year);
            let shortMonth = getShortMonths(date.getMonth());
            let adjustedDay = ('0' + date.getDate()).slice(-2);
            let dayOfWeek = getShortDay(date.getDay());
            return dayOfWeek + ", " + shortMonth + " " + adjustedDay + ", " + year;
        }
        return "";
    }

    function getShortDay(index) {
        var days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
        return days[index];
    }
    function getShortMonths(index) {
        var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        return months[index];
    }

    function isNumeric(str) {
        if (typeof str != "string") return false // we only process strings!
        return !isNaN(str) && // use type coercion to parse the _entirety_ of the string (`parseFloat` alone does not do this)...
            !isNaN(parseFloat(str)) // ...and ensure strings of whitespace fail
    }

    function validateMetadataInputs(day, month, year, latlng, msgId) {
        var dayValidate = "([1-9]|[12]\d|3[01])";
        var monthValidate = "^(0?[1-9]|1[012])$";

        var msg = "";
        if (day !== "" && !day.match(dayValidate)) {
            msg = "Enter Valid Day";
        }

        if (month !== "" && !month.match(monthValidate)) {
            msg = "Enter Valid Month";
        }

        if (year !== "" && !(+year >= 1888 && +year <= new Date().getFullYear())) {
            msg = "Enter Valid Year";
        }

        if (latlng !== "") {
            latlng = $.trim(latlng);
            var latlngArr = latlng.split(",");

            if (latlngArr.length !== 2 || latlng.split(".").length !== 3 || !isNumeric(latlngArr[0]) || !isNumeric(latlngArr[1])) {
                msg = "Enter Valid Latitude/Longitude";
            }
        }

        if (msg !== "") {
            $("#"+msgId).html('<div class="alert alert-danger" role="alert">'+msg+'</div>');
            return false;
        } else {
            return true;
        }

    }

    function decodeHtml(html) {
        var txt = document.createElement("textarea");
        txt.innerHTML = html;
        return txt.value;
    }

    function encodeHtml(str) {
        return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function setPhotoOverlays(rawMetadata, view) {
        var metadata = JSON.parse(decodeHtml(rawMetadata));

        $("#select" + metadata.id).click(function (e) {
            e.preventDefault();

            if ($("#tlicon" + metadata.id).attr("class") === "bi-circle") {
                $("#tlicon" + metadata.id).addClass('bi-circle-fill').removeClass('bi-circle');
                $("#image" + metadata.id).css("opacity", 0.3);
                $("#tncentered" + metadata.id).css("display", "none");
                $("#tnbr" + metadata.id).css("display", "none");
                $("#tnbl" + metadata.id).css("display", "none");
            } else {
                $(this).css("display", "block");
                $("#tlicon" + metadata.id).addClass('bi-circle').removeClass('bi-circle-fill');
                $("#image" + metadata.id).css("opacity", 1.0);
                $("#tncentered" + metadata.id).css("display", "block");
                $("#tnbr" + metadata.id).css("display", "block");
                $("#tnbl" + metadata.id).css("display", "block");
            }

            if ($('.bi-circle-fill')[0] || $(this).attr("class") === "bi-circle-fill") {
                $("#appSearch").css("display", "none");
                if (view === "album" || view === "favorites") {
                    $("#albumAppTools").css("display", "block");
                } else if (view === "timeline") {
                    $("#timelineAppTools").css("display", "block");
                } else if (view === "matches" || view === "person") {
                    $("#matchesAppTools").css("display", "block");
                }

                // Hide all center and bottom left icons
                $('.thumbnail-br').hide();
                $('.thumbnail-bl').hide();
                $('.thumbnail-centered').hide();
            } else {
                $('.thumbnail-br').show();
                $("#appSearch").css("display", "block");
                $("#timelineAppTools").css("display", "none");
                $("#albumAppTools").css("display", "none");
                $("#matchesAppTools").css("display", "none");
            }
        });

        $("#image" + metadata.id).click(function (e) {
            e.preventDefault();

            // Fill top left icon when clicking anywhere on thumbnail
            if ($('.bi-circle-fill')[0]) {
                if ($("#tlicon" + metadata.id).attr("class") === "bi-circle-fill") {
                    $("#tlicon" + metadata.id).addClass('bi-circle').removeClass('bi-circle-fill');
                } else {
                    $("#tlicon" + metadata.id).addClass('bi-circle-fill').removeClass('bi-circle');
                }
            }

            if ($('.bi-circle-fill')[0] || $(this).attr("class") === "bi-circle-fill") {
                $("#appSearch").css("display", "none");
                if (view === "album" || view === "favorites") {
                    $("#albumAppTools").css("display", "block");
                } else if (view === "timeline") {
                    $("#timelineAppTools").css("display", "block");
                } else if (view === "matches" || view === "person") {
                    $("#matchesAppTools").css("display", "block");
                }

                // Hide all center and bottom left icons
                $('.thumbnail-br').hide();
                $('.thumbnail-bl').hide();
                $('.thumbnail-centered').hide();
            } else {
                $("#appSearch").css("display", "block");
                $('.thumbnail-br').show();
                $("#timelineAppTools").css("display", "none");
                $("#albumAppTools").css("display", "none");
                $("#matchesAppTools").css("display", "none");
            }
        });

        $("#image" + metadata.id).hover(function () {
            $(this).css("opacity", 0.3);
            $(this).siblings().css("display", "block");
            if ($("#tlicon" + metadata.id).attr("class") === "bi-circle-fill") {
                $("#tncentered" + metadata.id).css("display", "none");
                $("#tnbl" + metadata.id).css("display", "none");
                $("#tnbr" + metadata.id).css("display", "none");
            }
            if ($('.bi-circle-fill')[0] || $(this).attr("class") === "bi-circle-fill") {
                $('.thumbnail-bl').hide();
                $('.thumbnail-centered').hide();
                $('.thumbnail-br').hide();
            }
        }, function () {
            if ($("#tlicon" + metadata.id).attr("class") !== "bi-circle-fill") {
                $(this).css("opacity", 1.0);
                $(this).siblings(".thumbnail-tl").css("display", "none");
                $(this).siblings(".thumbnail-bl").css("display", "none");
                $(this).siblings(".thumbnail-centered").css("display", "none");
            } else {
                if ($('.bi-circle-fill')[0] || $(this).attr("class") === "bi-circle-fill") {
                    $('.thumbnail-bl').hide();
                    $('.thumbnail-centered').hide();
                }
                $("#tncentered" + metadata.id).css("display", "none");
                $("#tnbl" + metadata.id).css("display", "none");
            }
        });

        $("#tncentered" + metadata.id).hover(function () {
            $('#currentlat').val(metadata.lat === null ? "" : metadata.lat);
            $('#currentlng').val(metadata.lng === null ? "" : metadata.lng);
            $('#currentyear').val(metadata.year === null ? "" : metadata.year);
            $('#currentmonth').val(metadata.month === null ? "" : metadata.month);
            $('#currentday').val(metadata.day === null ? "" : metadata.day);
            $('#currentfilename').val(metadata.fileName === null ? "" : metadata.fileName);
            $('.bi-play-circle').css("color", "darkorange");
            $(this).css("display", "block");
            $(this).siblings(".thumbnail-tl").css("display", "block");
            $(this).siblings(".thumbnail-bl").css("display", "block");
            $(this).siblings(".photo-thumbnail-image").css("opacity", 0.3);
            if ($('.bi-circle-fill')[0] || $(this).attr("class") === "bi-circle-fill") {
                $('.thumbnail-bl').hide();
                $('.thumbnail-centered').hide();
            }
        }, function () {
            $('.bi-play-circle').css("color", "lightgray");
            $(this).css("display", "none");
            $(this).siblings(".thumbnail-tl").css("display", "none");
            $(this).siblings(".thumbnail-bl").css("display", "none");
            $(this).siblings(".photo-thumbnail-image").css("opacity", 1.0);
        });

        $("#tntl" + metadata.id).hover(function () {
            if ($("#tlicon" + metadata.id).attr("class") !== "bi-circle-fill") {
                $(this).css("display", "block");
                $(this).siblings(".thumbnail-centered").css("display", "block");
                $(this).siblings(".thumbnail-bl").css("display", "block");
                $(this).siblings(".photo-thumbnail-image").css("opacity", 0.3);
                if ($('.bi-circle-fill')[0] || $(this).attr("class") === "bi-circle-fill") {
                    $('.thumbnail-bl').hide();
                    $('.thumbnail-centered').hide();
                }
            }
        }, function () {
            $(this).css("display", "none");
            $(this).siblings(".thumbnail-centered").css("display", "none");
            $(this).siblings(".thumbnail-bl").css("display", "none");
            $(this).siblings(".photo-thumbnail-image").css("opacity", 1.0);
        });

        $("#tnbl" + metadata.id).hover(function () {
            $(this).css("display", "block");
            $(this).siblings(".thumbnail-tl").css("display", "block");
            $(this).siblings(".thumbnail-centered").css("display", "block");
            $(this).siblings(".photo-thumbnail-image").css("opacity", 0.3);
            if ($('.bi-circle-fill')[0] || $(this).attr("class") === "bi-circle-fill") {
                $('.thumbnail-bl').hide();
                $('.thumbnail-centered').hide();
            }
        }, function () {
            $(this).css("display", "none");
            $(this).siblings(".thumbnail-tl").css("display", "none");
            $(this).siblings(".thumbnail-centered").css("display", "none");
            $(this).siblings(".photo-thumbnail-image").css("opacity", 1.0);
        });

        $("#tnbr" + metadata.id).hover(function () {
            $(this).siblings(".thumbnail-tl").css("display", "block");
            $(this).siblings(".thumbnail-centered").css("display", "block");
            $(this).siblings(".thumbnail-bl").css("display", "block");
            $(this).siblings(".photo-thumbnail-image").css("opacity", 0.3);
            if ($('.bi-circle-fill')[0] || $(this).attr("class") === "bi-circle-fill") {
                $('.thumbnail-bl').hide();
                $('.thumbnail-centered').hide();
            }
        }, function () {
            $(this).siblings(".thumbnail-tl").css("display", "none");
            $(this).siblings(".thumbnail-bl").css("display", "none");
            $(this).siblings(".thumbnail-centered").css("display", "none");
            $(this).siblings(".photo-thumbnail-image").css("opacity", 1.0);
        });

        $("#tntr" + metadata.id).hover(function () {
            $("#image" + metadata.id).css("opacity", 0.3);
            if ($("#tlicon" + metadata.id).attr("class") === "bi-circle-fill") {
                $("#tntl" + metadata.id).css("display", "block");
                $("#tnbl" + metadata.id).css("display", "none");
                $("#tncentered" + metadata.id).css("display", "none");
            } else {
                $("#tncentered" + metadata.id).css("display", "block");
                $("#tntl" + metadata.id).css("display", "block");
                $("#tnbl" + metadata.id).css("display", "block");
            }
            if ($('.bi-circle-fill')[0] || $(this).attr("class") === "bi-circle-fill") {
                $('.thumbnail-bl').hide();
                $('.thumbnail-centered').hide();
            }
        });
    }

    $("#appToolsBatchEdit").click(function(e) {
        e.preventDefault();

        let metadataIdList = [];
        let filenameList = "";
        $('.bi-circle-fill').each(function(i, obj) {
            var metadataId = obj.id.substring(6, obj.id.length);
            metadataIdList.push(metadataId);
            filenameList += $("#filename"+metadataId).val().trim()+", ";
        });
        filenameList = filenameList.replace(/,\s*$/, "");

        $("#batchMetadataIds").val(JSON.stringify(metadataIdList));
        if (filenameList !== "") {
            $("#editPhotosNamesModalLabel").text(filenameList);
        }
        $("#propBatchMetadata").modal('show');
    });

    $("#appToolsDeselectAll").click(function(e) {
        e.preventDefault();

        clearTimelineSelection();
    })

    function clearTimelineSelection() {
        $(".thumbnail-centered").css("display", "none");
        $(".thumbnail-bl").css("display", "none");
        $(".thumbnail-tl").css("display", "none");
        $(".photo-thumbnail-image").css("opacity", 1.0);
        $(".thumbnail-tl a span").addClass('bi-circle').removeClass('bi-circle-fill');

        $("#appSearch").css("display", "block");
        $("#timelineAppTools").css("display", "none");
        $("#albumAppTools").css("display", "none");
        $("#matchesAppTools").css("display", "none");
    }

    $("#appToolsAddAlbum").click(function(e) {
        e.preventDefault();

        let metadataIdList = [];
        $('.bi-circle-fill').each(function(i, obj) {
            metadataIdList.push(obj.id.substring(6, obj.id.length));
        });

        $("#albumMetadataIds").val(JSON.stringify(metadataIdList));
        $("#propAddAlbum").modal('show');
    });

    $("#albumAppToolsRemoveAlbum").click(function(e) {
        e.preventDefault();

        let metadataIdList = [];
        $('.bi-circle-fill').each(function(i, obj) {
            metadataIdList.push(obj.id.substring(6, obj.id.length));
        });

        let albumId = $('#albumId').text();
        if (metadataIdList.length > 0 && albumId.length > 0) {
            let json = {metadataIdList: metadataIdList, albumId: parseInt(albumId)}

            const posting = $.post({
                url: "/album/delete/batch",
                data: JSON.stringify(json),
                contentType: 'application/json; charset=utf-8'
            });

            posting.done(function (data) {
                if (data.hasOwnProperty("status") && data.hasOwnProperty("msg")) {
                    if (data["status"] === "redirect") {
                        window.location.replace(data["msg"]);
                    } else {
                        let message = "Error";
                        if (data["status"] === "success") {
                            message = '<div class="alert alert-success" role="alert">' + data["msg"] + '</div>';
                            window.top.location = window.top.location
                        } else {
                            message = '<div class="alert alert-danger" role="alert">' + data["msg"] + '</div>';
                        }
                        $("#albumMessage").html(message);
                    }
                }
            });
        }
    });

    $("#albumAppToolsRemoveFavorites").click(function(e) {
        e.preventDefault();

        let metadataIdList = [];
        $('.bi-circle-fill').each(function(i, obj) {
            metadataIdList.push(obj.id.substring(6, obj.id.length));
        });

        if (metadataIdList.length > 0) {
            let json = {metadataIdList: metadataIdList}

            const posting = $.post({
                url: "/favorites/delete",
                data: JSON.stringify(json),
                contentType: 'application/json; charset=utf-8'
            });

            posting.done(function (data) {
                if (data.hasOwnProperty("status") && data.hasOwnProperty("msg")) {
                    let message = "Error";
                    if (data["status"] === "success") {
                        message = '<div class="alert alert-success" role="alert">' + data["msg"] + '</div>';
                        window.top.location = window.top.location
                    } else {
                        message = '<div class="alert alert-danger" role="alert">' + data["msg"] + '</div>';
                    }
                    $("#favoritesMessage").html(message);
                }
            });
        }

        return false;
    });

    function matchingListeners() {
        $("#matchToolsDeselectAll").click(function(e) {
            e.preventDefault();

            $(".thumbnail-centered").css("display", "none");
            $(".thumbnail-bl").css("display", "none");
            $(".thumbnail-tl").css("display", "none");
            $(".photo-thumbnail-image").css("opacity", 1.0);
            $(".thumbnail-tl a span").addClass('bi-circle').removeClass('bi-circle-fill');

            $("#appSearch").css("display", "block");
            $("#timelineAppTools").css("display", "none");
            $("#albumAppTools").css("display", "none");
            $("#matchesAppTools").css("display", "none");
        })

        $("#matchesAppTools").css("display", "none");

        $("#matchToolsBatchEdit").click(function(e) {
            e.preventDefault();

            let metadataIdList = [];
            let filenameList = "";
            $('.bi-circle-fill').each(function(i, obj) {
                var metadataId = obj.id.substring(6, obj.id.length);
                metadataIdList.push(metadataId);
                filenameList += $("#filename"+metadataId).val().trim()+", ";
            });
            filenameList = filenameList.replace(/,\s*$/, "");

            $("#batchMetadataIds").val(JSON.stringify(metadataIdList));
            if (filenameList !== "") {
                $("#editPhotosNamesModalLabel").text(filenameList);
            }
            $("#propBatchMetadata").modal('show');
        });
    }
</script>

</body>
</html>
