<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body th:fragment="sidebar(activeSidebar, authority)">
<nav class="col-md-2 d-none d-md-block bg-light sidebar">
    <div class="sidebar-sticky">
        <ul class="nav flex-column">
            <th:block th:if="${authority == 'ADMIN'}">
                <li class="nav-item">
                    <a th:attr="class='nav-link' + ${activeSidebar=='timeline' ? ' active' : ''}" href="/timeline">
                        <span class="bi-calendar4"></span>
                        Timeline
                    </a>
                </li>
            </th:block>
            <li class="nav-item">
                <a th:attr="class='nav-link' + ${activeSidebar=='albums' ? ' active' : ''}" href="/albums">
                    <span class="bi-images"></span>
                    Albums
                </a>
            </li>
            <li class="nav-item">
                <a th:attr="class='nav-link' + ${activeSidebar=='comments' ? ' active' : ''}" href="/comments">
                    <span class="bi-chat-right-text"></span>
                    Comments
                </a>
            </li>
            <th:block th:if="${authority == 'ADMIN'}">
                <li class="nav-item">
                    <a th:attr="class='nav-link' + ${activeSidebar=='settings' or activeSidebar=='scan' ? ' active' : ''}" href="/settings">
                        <span class="bi-wrench"></span>
                        Settings
                    </a>
                </li>
            </th:block>
        </ul>
    </div>
</nav>
</body>
</html>
