<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body th:fragment="albumsjs(album,authority)">

<th:block th:if="${authority == 'ROLE_ADMIN'}">
    <script th:inline="javascript" type="text/javascript" th:nonce="${cspNonce}">
        /*<![CDATA[*/
        $("#share[[${album.id}]]").click(function(e) {
            e.preventDefault();

            $("#propsharealbums[[${album.id}]]").modal('show');
        });

        $("#edit[[${album.id}]]").click(function(e) {
            e.preventDefault();

            $("#propeditalbums[[${album.id}]]").modal('show');
        });

        $("#trash[[${album.id}]]").click(function(e) {
            e.preventDefault();

            $("#proptrashalbums[[${album.id}]]").modal('show');
        });
    </script>
</th:block>

<script th:inline="javascript" type="text/javascript" th:nonce="${cspNonce}">
    $("#comment[[${album.id}]]").click(function(e) {
        e.preventDefault();

        $("#propcommentalbums[[${album.id}]]").modal('show');
    });
    /*]]>*/
</script>

</body>
</html>
