<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body th:fragment="matchesmodal(recognitionLabels)">

<div class="modal fade" id="propBatchMetadata" tabindex="-1" role="dialog" aria-labelledby="labelBatchMetadata"
     aria-hidden="true">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="editPhotosModalLabel">Edit Photos<br><span
                        id="editPhotosNamesModalLabel"></span></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p class="text-muted">Empty fields will be ignored</p>
                <form id="saveBatchData">
                    <input type="hidden" id="batchMetadataIds" name="batchMetadataIds" value="">

                    <div class="form-group row">
                        <div class="col-sm">
                            <label for="tagBatchDataInput" class="col-form-label">Tag People (comma separated)</label>
                            <div class="input-group">
                                <input type="text" class="form-control"
                                       onfocus="return matchModalBatchSettings.closeBatchTagPeopleDropdown();"
                                       aria-label="Tag People" id="tagBatchDataInput" name="tagBatchDataInput" value="">

                                <th:block th:if="${recognitionLabels != ''}">
                                    <div class="input-group-append">
                                        <button class="btn btn-outline-secondary dropdown-toggle"
                                                onclick="return matchModalBatchSettings.toggleBatchTagPeopleDropdown();"
                                                id="tagpeopledropdown" type="button" aria-haspopup="true"
                                                aria-expanded="false">People
                                        </button>
                                        <div class="dropdown-menu" id="albumNameList">
                                            <th:block th:each="recognitionLabel, iterStat: ${recognitionLabels}">
                                                <button class="dropdown-item" type="button">
                                                    <input type="checkbox"
                                                           onclick="return matchModalBatchSettings.populateBatchLabel();"
                                                           th:id="${recognitionLabel.id}"
                                                           th:value="${recognitionLabel.name}"
                                                           name="recognitionLabel[]">
                                                    <label th:for="${recognitionLabel.id}"
                                                           th:text="${recognitionLabel.name}"></label>
                                                </button>
                                            </th:block>
                                        </div>
                                    </div>
                                </th:block>
                            </div>
                            <div class="form-group row">
                                <div class="col-sm">
                                    <input type="checkbox" name="batchisobject" id="batchisobject">
                                    <label class="form-check-label" for="batchisobject">These are objects</label>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
                <div class="col-sm">
                    <span id="msgBatchMetadata"></span>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" id="saveBatchMetadata">Save</button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            </div>
        </div>
    </div>
</div>
<script src="/js/site/matchesmodal.js"></script>

</body>
</html>
