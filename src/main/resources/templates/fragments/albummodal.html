<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body th:fragment="albummodal(album, metadata)">
<div class="modal fade" th:id="'propalbum'+${metadata.id}" tabindex="-1" role="dialog" th:aria-labelledby="'label'+${metadata.id}" aria-hidden="true">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="exampleModalLabel">Edit <th:block th:text="${metadata.fileName}"></th:block></h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <form th:id="'saveData'+${metadata.id}">
                    <input type="hidden" name="id" th:value="${metadata.id}">

                    <div class="form-group row">
                        <div class="col-sm">
                            <label th:for="'dayTaken'+${metadata.id}" class="col-form-label">Day</label>
                            <input type="text" class="form-control" th:id="'dayTaken'+${metadata.id}" name="day" th:value="${metadata.day}">
                        </div>
                        <div class="col-sm">
                            <label th:for="'monthTaken'+${metadata.id}" class="col-form-label">Month</label>
                            <input type="text" class="form-control" th:id="'monthTaken'+${metadata.id}" name="month" th:value="${metadata.month}">
                        </div>
                        <div class="col-sm">
                            <label th:for="'yearTaken'+${metadata.id}" class="col-form-label">Year</label>
                            <input type="text" class="form-control" th:id="'yearTaken'+${metadata.id}" name="year" th:value="${metadata.year}">
                        </div>
                    </div>
                    <div class="form-group row">
                        <div class="col-sm">
                            <label th:for="'lat'+${metadata.id}" class="col-form-label">Latitude</label>
                            <input type="text" class="form-control" th:id="'lat'+${metadata.id}" name="lat" th:value="${metadata.lat}">
                        </div>
                        <div class="col-sm">
                            <label th:for="'lng'+${metadata.id}" class="col-form-label">Longitude</label>
                            <input type="text" class="form-control" th:id="'lng'+${metadata.id}" name="lng" th:value="${metadata.lng}">
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" th:id="'saveAlbum'+${metadata.id}">Save</button>
                <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
            </div>
            <script type="text/javascript">
                $.fn.serializeObject = function() {
                    var o = {};
                    var a = this.serializeArray();
                    $.each(a, function() {
                        if (o[this.name]) {
                            if (!o[this.name].push) {
                                o[this.name] = [o[this.name]];
                            }
                            o[this.name].push(this.value || '');
                        } else {
                            o[this.name] = this.value || '';
                        }
                    });
                    return o;
                };

                /*<![CDATA[*/
                $("#saveAlbum[[${metadata.id}]]").click(function (e) {
                    e.preventDefault();

                    const posting = $.post({
                        url: "/album/update/[[${metadata.id}]]_[[${album.id}]]",
                        data: JSON.stringify($('#saveData[[${metadata.id}]]').serializeObject()),
                        contentType: 'application/json; charset=utf-8'
                    });

                    posting.done(function (data) {
                        if (data.hasOwnProperty("status") && data.hasOwnProperty("msg")) {
                            let message = "Error";
                            if (data["status"] === "success") {
                                message = '<div class="alert alert-success" role="alert">' + data["msg"] + '</div>';
                            } else {
                                message = '<div class="alert alert-danger" role="alert">' + data["msg"] + '</div>';
                            }
                            $("#msg[[${metadata.id}]]").html(message);
                            window.top.location = window.top.location
                        }
                    });

                    return false;
                });
                /*]]>*/
            </script>
        </div>
    </div>
</div>
</body>
</html>
