<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body th:fragment="detailsinfo(${currentUser})">

<br>

<div class="row">
    <th:block th:if="${(currentUser.authority == 'ROLE_ADMIN' || currentUser.authority == 'ROLE_SUPER') and activePage != 'timeline'}">
        <span class="shareUrlDetailsA"></span>
    </th:block>
    <th:block th:unless="${(currentUser.authority == 'ROLE_ADMIN' || currentUser.authority == 'ROLE_SUPER') and activePage != 'timeline'}">
        <span class="shareUrlDetails"></span>
    </th:block>
</div>

<br>

<div class="row"><strong class="metadataIdLabel">Metadata ID:&nbsp;</strong><span class="metadataIdDetails"></span></div>
<div class="row"><strong class="descriptionLabel">Description:&nbsp;</strong><span class="descriptionDetails"></span></div>
<div class="row"><strong class="pathLabel">File name:&nbsp;</strong><span class="pathDetails"></span></div>
<div class="row"><strong class="keywordsLabel">Keywords:&nbsp;</strong><span class="keywordsDetails"></span></div>
<div class="row"><strong class="albumsLabel">Albums:&nbsp;</strong><span class="albumsDetails"></span></div>
<div class="row"><strong class="coordinatesLabel">Coordinates:&nbsp;</strong><span class="coordinatesDetails"></span></div>
<div class="row"><strong class="locationLabel">Location:&nbsp;</strong><span class="locationDetails"></span></div>
<div class="row"><strong class="locationTypeLabel">Location type:&nbsp;</strong><span class="locationTypeDetails"></span></div>
<div class="row"><strong class="typeLabel">File type:&nbsp;</strong><span class="typeDetails"></span></div>
<div class="row"><strong class="compressionLabel">Compression:&nbsp;</strong><span class="compressionDetails"></span></div>
<div class="row"><strong class="resolutionLabel">Resolution:&nbsp;</strong><span class="resolutionDetails"></span></div>
<div class="row"><strong class="isoLabel">ISO:&nbsp;</strong><span class="isoDetails"></span></div>
<div class="row"><strong class="exposureLabel">Exposure:&nbsp;</strong><span class="exposureDetails"></span></div>
<div class="row"><strong class="fNumberLabel">F-stop:&nbsp;</strong><span class="fNumberDetails"></span></div>
<div class="row"><strong class="focalLengthLabel">Focal length:&nbsp;</strong><span class="focalLengthDetails"></span></div>
<div class="row"><strong class="cameraLabel">Camera:&nbsp;</strong><span class="cameraDetails"></span></div>
<div class="row"><strong class="lensLabel">Lens:&nbsp;</strong><span class="lensDetails"></span></div>
<div class="row"><strong class="qualityLabel">Quality:&nbsp;</strong><span class="qualityDetails"></span></div>
<!--<div class="row"><strong class="takenAtLabel">Taken:&nbsp;</strong><span class="takenAtDetails"></span></div>-->
<div class="row"><strong class="manualTakenAtLabel">Taken:&nbsp;</strong><span class="manualTakenAtDetails"></span></div>
<div class="row"><strong class="timeZoneLabel">GMT Offset:&nbsp;</strong><span class="timeZoneDetails"></span></div>
<div class="row"><strong class="createdAtLabel">Created:&nbsp;</strong><span class="createdAtDetails"></span></div>
<div class="row"><strong class="addedAtLabel">Added:&nbsp;</strong><span class="addedAtDetails"></span></div>
<div class="row"><strong class="modifiedAtLabel">Modified:&nbsp;</strong><span class="modifiedAtDetails"></span></div>
<div class="row"><strong class="accessedAtLabel">Accessed:&nbsp;</strong><span class="accessedAtDetails"></span></div>

</body>
</html>
