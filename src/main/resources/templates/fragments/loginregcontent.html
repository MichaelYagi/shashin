<!DOCTYPE html>
<html lang="en">
<head></head>
<body th:fragment="loginregcontent(activePage)">
<div class="container">
    <form class="form-signin" method="post" th:action="'users/'+${activePage}">
        <h2 class="form-signin-heading"><th:block th:text="'Please ' + ${#strings.capitalize(activePage)}"></th:block></h2>
        <p>
            <label for="username" class="sr-only">Username</label>
            <input type="text" id="username" name="username" class="form-control" placeholder="Username" required autofocus>
        </p>
        <p>
            <label for="password" class="sr-only">Password</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="Password" required>
        </p>
        <button class="btn btn-lg btn-primary btn-block" type="submit"><th:block th:text="${#strings.capitalize(activePage)}"></th:block></button>
        <th:block th:if="${activePage == 'login'}">
        <a href="/users/register">Register</a>
        </th:block>
    </form>
</div>
</body>
</html>
