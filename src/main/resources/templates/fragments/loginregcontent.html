<!DOCTYPE html>
<html lang="en" xmlns:th="http://thymeleaf.org">
<head></head>
<body th:fragment="loginregcontent(activePage, message)">
<div class="container">
    <form class="form-signin" method="post" th:object="${user}" th:action="'/users/'+${activePage}">
        <th:block th:if="${message != ''}">
            <div class="alert alert-info" role="alert">
                <th:block th:text="${message}"></th:block>
            </div>
        </th:block>
        <h2 class="form-signin-heading"><th:block th:text="'Please ' + ${#strings.capitalize(activePage)}"></th:block></h2>
        <p>
            <label for="username" class="sr-only">Username</label>
            <input type="text" id="username" name="username" class="form-control" placeholder="Username" required autofocus>
        </p>
        <p>
            <label for="password" class="sr-only">Password</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="Password" required>
        </p>
        <th:block th:if="${activePage == 'login'}">
        <p>
            <input type="checkbox" id="remember-me" name="remember-me" class="form-check-inline">
            <label class="form-check-label" for="remember-me">Remember me</label>
        </p>
        </th:block>

        <button class="btn btn-lg btn-primary btn-block form-control" type="submit"><th:block th:text="${#strings.capitalize(activePage)}"></th:block></button>
        <div class="row">
            <div class="col">
                <th:block th:if="${activePage == 'login'}">
                    <a href="/users/register">Register</a>
                </th:block>
                <th:block th:if="${activePage == 'register'}">
                    <a href="/users/login">Login</a>
                </th:block>
            </div>
            <div class="col">
                <div class="form-check form-switch float-end">
                    <input class="form-check-input" type="checkbox" id="darkmodeSwitch">
                    <label class="form-check-label" for="darkmodeSwitch">Dark mode</label>
                </div>
            </div>
        </div>
    </form>

    <script type="text/javascript" th:nonce="${cspNonce}">
        const mode = Util.getParameterByName("m");

        if (mode === "dark") {
            $("#darkmodeSwitch").prop('checked', true);
        }

        $('#darkmodeSwitch').click(function() {
            if($("#darkmodeSwitch").is(':checked')) {
                window.location.href = window.location.pathname+"?"+$.param({'m':'dark'})
            } else {
                window.location = window.location.href.split("?")[0];
            }
        });
    </script>
</div>

</body>
</html>
