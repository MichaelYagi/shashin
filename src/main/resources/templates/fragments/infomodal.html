<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body th:fragment="infomodal(${currentUser})">

<!--Modal for each photo-->
<div class="modal fade" id="propInfoModal" tabindex="-1" role="dialog" aria-labelledby="labelInfoModal" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="exampleModalLabel">Viewing &ldquo;<span id="infoModalTitle"></span>&rdquo;<div id="propInfoModalThumbnail"></div></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" name="metadataId" id="metadataId" value="">
                <ul class="nav nav-tabs">
                    <li class="nav-item">
                        <a class="nav-link active" data-bs-toggle="tab" id="detailsTabLinkInfo" href="#detailsTab">Details</a>
                    </li>
                    <th:block th:if="${authority == 'ROLE_ADMIN'}">
                        <li class="nav-item">
                            <a class="nav-link" data-bs-toggle="tab" id="exifTabLinkInfo" href="#exifTab">EXIF data</a>
                        </li>
                    </th:block>
                    <li class="nav-item">
                        <a class="nav-link" data-bs-toggle="tab" id="mapTabLinkInfo" href="#mapTab">Map</a>
                    </li>
                </ul>
                <div class="tab-content">
                    <div class="tab-pane container show active" id="detailsTab">
                        <div th:replace="fragments/detailsinfo :: detailsinfo(${currentUser})"></div>
                    </div>
                    <div class="tab-pane container fade" id="exifTab">
                        <textarea class="form-control" id="exifInfo" rows="20" readonly></textarea>
                    </div>
                    <div class="tab-pane container fade" id="mapTab">
                        <br>
                        <span id="mapTabMessage">No map data</span>
                        <br>
                        <div id="map" class="map" style="width: 100%;height: 400px"></div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <div id="infoModalStatus" class="spinner-grow me-auto" style="visibility: hidden;font-size: 2rem;" role="status" aria-hidden="true"></div>
                <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript" th:nonce="${cspNonce}">
    // Clear message on modal close
    $('#propInfoModal').on('hide.bs.modal', function () {
        const tab = new bootstrap.Tab($("#detailsTabLinkInfo"));
        tab.show();
    });

    $("#mapTabLinkInfo").on("click", function (e) {
        e.preventDefault();

        const metadataId = $("#metadataId").val();

        if (metadataId.length > 0) {
            shashin.getMetadata(metadataId).then(function (metadata) {
                shashin.openMap(metadata)
            });
        }
    })

    $("#exifTabLinkInfo").on("click", async function (e) {
        e.preventDefault();

        $("#exifInfo").val("");

        // Get exif yaml data and display
        const metadataId = $("#metadataId").val();
        const http = new Http("get exif");
        const data = await http.ajax("get", "/api/v1/exif/metadata/" + metadataId);

        let exif = "";
        if (data.hasOwnProperty("exif")) {
            exif = JSON.stringify(data["exif"], null, 2);
        }
        $("#exifInfo").val(exif);
    });
</script>

</body>
</html>
