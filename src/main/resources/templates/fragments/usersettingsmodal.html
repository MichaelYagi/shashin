<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body th:fragment="usersettingsmodal(user)">

<div class="modal fade" th:id="'proptrashuser'+${user.id}" tabindex="-1" role="dialog" th:aria-labelledby="'labeltrash'+${user.id}" aria-hidden="true">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="trashModalLabel">Delete <th:block th:text="${user.username}"></th:block></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">Are you sure you want to delete this user?</div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" th:id="'deleteUser'+${user.id}">Confirm</button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            </div>
            <script type="text/javascript">
                /*<![CDATA[*/
                $("#deleteUser[[${user.id}]]").click(function(e) {
                    e.preventDefault();

                    let userId = "[[${user.id}]]";

                    let json = {userId: userId, delete: true}
                    const posting = $.post({
                        url: "/settings/user/delete/"+userId,
                        data: JSON.stringify(json),
                        contentType: 'application/json; charset=utf-8'
                    });

                    posting.done(function (data) {
                        if (data.hasOwnProperty("status") && data.hasOwnProperty("msg")) {
                            let message = "Error";
                            if (data["status"] === "success") {
                                message = '<div class="alert alert-success" role="alert">' + data["msg"] + '</div>';
                                window.location.replace("/settings/users");
                            } else {
                                message = '<div class="alert alert-danger" role="alert">' + data["msg"] + '</div>';
                            }
                            $("#usersSettingsMessage").html(message);
                        }
                    });

                });
                /*]]>*/
            </script>
        </div>
    </div>
</div>

<div class="modal fade" th:id="'proproleuser'+${user.id}" tabindex="-1" role="dialog" th:aria-labelledby="'labelroleuser'+${user.id}" aria-hidden="true">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="roleuserModalLabel">Change <th:block th:text="${user.username}"></th:block> to <th:block th:text="${user.authority == 'ROLE_ADMIN' ? 'user' : 'admin'}"></th:block></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">Are you sure you want to change this users role?</div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" th:id="'roleUser'+${user.id}">Confirm</button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            </div>
            <script type="text/javascript">
                /*<![CDATA[*/
                $("#roleUser[[${user.id}]]").click(function(e) {
                    e.preventDefault();

                    let userId = "[[${user.id}]]";
                    let currentRole = "[[${user.authority}]]";
                    let changeTo = currentRole === "ROLE_USER" ? "ROLE_ADMIN" : "ROLE_USER";

                    let json = {userId: userId, changeTo: changeTo}
                    const posting = $.post({
                        url: "/settings/user/role/"+userId,
                        data: JSON.stringify(json),
                        contentType: 'application/json; charset=utf-8'
                    });

                    posting.done(function (data) {
                        if (data.hasOwnProperty("status") && data.hasOwnProperty("msg")) {
                            let message = "Error";
                            if (data["status"] === "success") {
                                message = '<div class="alert alert-success" role="alert">' + data["msg"] + '</div>';
                                window.location.replace("/settings/users");
                            } else {
                                message = '<div class="alert alert-danger" role="alert">' + data["msg"] + '</div>';
                            }
                            $("#usersSettingsMessage").html(message);
                        }
                    });

                });
                /*]]>*/
            </script>
        </div>
    </div>
</div>

<div class="modal fade" th:id="'propisalloweduser'+${user.id}" tabindex="-1" role="dialog" th:aria-labelledby="'labelalloweduser'+${user.id}" aria-hidden="true">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="alloweduserModalLabel">Change <th:block th:text="${user.username}"></th:block> permission to <th:block th:text="${user.isAllowed == true ? 'not login?' : 'login?'}"></th:block></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">Are you sure you want to change this users permissions?</div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" th:id="'allowUser'+${user.id}">Confirm</button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            </div>
            <script type="text/javascript">
                /*<![CDATA[*/
                $("#allowUser[[${user.id}]]").click(function(e) {
                    e.preventDefault();

                    let userId = "[[${user.id}]]";
                    let currentPermission = [[${user.isAllowed}]];
                    let changeTo = currentPermission !== true;

                    let json = {userId: userId, changeTo: changeTo}
                    const posting = $.post({
                        url: "/settings/user/permission/"+userId,
                        data: JSON.stringify(json),
                        contentType: 'application/json; charset=utf-8'
                    });

                    posting.done(function (data) {
                        if (data.hasOwnProperty("status") && data.hasOwnProperty("msg")) {
                            let message = "Error";
                            if (data["status"] === "success") {
                                message = '<div class="alert alert-success" role="alert">' + data["msg"] + '</div>';
                                window.location.replace("/settings/users");
                            } else {
                                message = '<div class="alert alert-danger" role="alert">' + data["msg"] + '</div>';
                            }
                            $("#usersSettingsMessage").html(message);
                        }
                    });

                });
                /*]]>*/
            </script>
        </div>
    </div>
</div>

</body>
</html>
