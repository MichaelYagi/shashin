<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body th:fragment="albumsmodal(album,users,userAlbums,currentUser,userCount,sharedAlbums,albumsCommentsMap,baseUrl)">

<div class="modal fade" th:id="'propalbums'+${album.id}" tabindex="-1" role="dialog" th:aria-labelledby="'label'+${album.id}" aria-hidden="true">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="exampleModalLabel">Share <th:block th:text="${album.name}"></th:block><div th:id="'propalbums'+${album.id}"><img th:src="${#uris.escapePath(album.coverUrl)}" width="100" height="100" th:onError="shashin.errorImg(this,[[${album.name}]],100)"></div></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form th:id="'saveData'+${album.id}">
                    <input type="hidden" name="id" th:value="${album.id}">
                    <strong>Share with other people</strong><br>
                    <div class="input-group">
                        <input type="text" placeholder="Share Link" th:id="'shareLink'+${album.id}" th:name="'shareLink'+${album.id}" class="form-control" th:value="${album.shareUrl != null ? album.shareUrl : ''}" disabled>
                        <div class="input-group-append">
                            <button class="btn btn-outline-secondary" th:id="'generateLink'+${album.id}" type="button" data-bs-toggle="tooltip" data-bs-placement="top" title="Generate link"><span class="bi-arrow-clockwise"></span></button>
                            <button class="btn btn-outline-secondary" th:id="'clearLink'+${album.id}" type="button" data-bs-toggle="tooltip" data-bs-placement="top" title="Clear link"><span class="bi-x"></span></button>
                            <button class="btn btn-outline-secondary" th:id="'copyLink'+${album.id}" type="button"data-bs-toggle="tooltip" data-bs-placement="top" title="Copy link"><span class="bi-clipboard-plus"></span></button>
                        </div>
                    </div>
                    <div th:id="'fullShareLinkContainer'+${album.id}" class="card" th:style="${album.shareUrl == null ? 'display: none;' : ''}"><div th:id="'fullShareLink'+${album.id}" class="card-body"><a target="_blank" th:href="${album.shareUrl == null ? '' : baseUrl+'share/'+album.shareUrl+'/album/'+album.id}" th:text="${album.shareUrl == null ? '' : baseUrl+'share/'+album.shareUrl+'/album/'+album.id}"></a></div></div>
                    <br>
                    <th:block th:if="${sharedAlbums !=''}">
                        <strong>Share with other users</strong><br>
                        <th:block th:each="sharedAlbumsMap: ${sharedAlbums}">
                            <th:block th:if="${album.id == sharedAlbumsMap.get('albumId')}">
                                <div class="col-auto form-check">
                                    <th:block th:if="${sharedAlbumsMap.get('isShared') == 1}">
                                        <input type="checkbox" class="form-check-input" th:id="'id-'+${sharedAlbumsMap.get('userId')}+'-'+${sharedAlbumsMap.get('albumId')}" th:name="'userShare'+${sharedAlbumsMap.get('albumId')}" checked>
                                    </th:block>
                                    <th:block th:if="${sharedAlbumsMap.get('isShared')} == 0">
                                        <input type="checkbox" class="form-check-input" th:id="'id-'+${sharedAlbumsMap.get('userId')}+'-'+${sharedAlbumsMap.get('albumId')}" th:name="'userShare'+${sharedAlbumsMap.get('albumId')}">
                                    </th:block>
                                    <label class="form-check-label" th:text="${sharedAlbumsMap.get('username')}"></label>
                                </div>
                            </th:block>
                        </th:block>
                    </th:block>
                </form>
                <br>
                <div class="col-sm">
                    <span th:id="'msg'+${album.id}"></span>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" th:id="'saveUserShare'+${album.id}">Save</button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            </div>
            <script type="text/javascript">
                /*<![CDATA[*/
                if ($("#shareLink[[${album.id}]]").val() === "") {
                    $("#copyLink[[${album.id}]]").prop('disabled', true);
                }

                $("#clearLink[[${album.id}]]").click(function(e) {
                    e.preventDefault();
                    albumsModalSettings.updateShareLink("[[${baseUrl}]]",[[${album.id}]],"clear");
                });

                $("#generateLink[[${album.id}]]").click(function(e) {
                    e.preventDefault();
                    albumsModalSettings.updateShareLink("[[${baseUrl}]]",[[${album.id}]],"generate");
                });

                $('#propalbums[[${album.id}]]').on('hide.bs.modal', function () {
                    $("#msg[[${album.id}]]").html("");
                })

                $("#copyLink[[${album.id}]]").click(function(e) {
                    e.preventDefault();

                    var shareLink = $("#shareLink[[${album.id}]]").val().trim();

                    if (shareLink !== "") {
                        var fullShareLink = "[[${baseUrl}]]share/"+shareLink+"/album/[[${album.id}]]";
                        shashin.copyTextToClipboard(fullShareLink,[[${album.id}]]);
                    } else {
                        $("#msg[[${album.id}]]").html("<div class=\"alert alert-warning\" role=\"alert\">Link must not be blank</div>");
                    }
                });

                $("#saveUserShare[[${album.id}]]").click(function(e) {
                    e.preventDefault();

                    let albumId = "[[${album.id}]]";
                    let userShareMap = {};
                    $('input[name^="userShare[[${album.id}]]"]').each( function() {
                        let checkboxId = $(this).attr('id');
                        let isChecked = $(this).prop("checked");

                        let checkboxIdArray = checkboxId.split("-");
                        let userId = checkboxIdArray[1];
                        userShareMap[userId] = isChecked
                    });

                    let json = {albumId: albumId,userShareMap: JSON.stringify(userShareMap)}
                    const posting = $.post({
                        url: "/album/share/" + albumId,
                        data: JSON.stringify(json),
                        contentType: 'application/json; charset=utf-8'
                    });

                    posting.done(function (data) {
                        if (data.hasOwnProperty("status") && data.hasOwnProperty("msg")) {
                            let message = "Error";
                            if (data["status"] === "success") {
                                message = '<div class="alert alert-success" role="alert">' + data["msg"] + '</div>';
                            } else {
                                message = '<div class="alert alert-danger" role="alert">' + data["msg"] + '</div>';
                            }
                            $("#albumsMessage").html(message);
                        }
                        $("#propalbums[[${album.id}]]").modal('hide');
                    });

                });
                /*]]>*/
            </script>
        </div>
    </div>
</div>

<div class="modal fade" th:id="'proptrashalbums'+${album.id}" tabindex="-1" role="dialog" th:aria-labelledby="'labeltrash'+${album.id}" aria-hidden="true">
    <div class="modal-dialog modal-sm" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="trashModalLabel">Delete <th:block th:text="${album.name}"></th:block><div th:id="'proptrashalbums'+${album.id}"><img th:src="${#uris.escapePath(album.coverUrl)}" width="100" height="100" th:onError="shashin.errorImg(this,[[${album.name}]],100)"></div></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">Are you sure you want to delete this album?</div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" th:id="'deleteAlbum'+${album.id}">Confirm</button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            </div>
            <script type="text/javascript">
                /*<![CDATA[*/
                $("#deleteAlbum[[${album.id}]]").click(function(e) {
                    e.preventDefault();

                    let albumId = "[[${album.id}]]";

                    let json = {albumId: albumId, delete: true}
                    const posting = $.post({
                        url: "/album/delete/" + albumId,
                        data: JSON.stringify(json),
                        contentType: 'application/json; charset=utf-8'
                    });

                    posting.done(function (data) {
                        if (data.hasOwnProperty("status") && data.hasOwnProperty("msg")) {
                            let message = "Error";
                            if (data["status"] === "success") {
                                message = '<div class="alert alert-success" role="alert">' + data["msg"] + '</div>';
                                window.top.location = window.top.location
                            } else {
                                message = '<div class="alert alert-danger" role="alert">' + data["msg"] + '</div>';
                            }
                            $("#albumsMessage").html(message);
                        }
                    });

                });
                /*]]>*/
            </script>
        </div>
    </div>
</div>

<div class="modal fade" th:id="'propcommentalbums'+${album.id}" tabindex="-1" role="dialog" th:aria-labelledby="'labelcomment'+${album.id}" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="commentModalLabel">Comments for  <th:block th:text="${album.name}"></th:block><div th:id="'propalbumphotocomment'+${album.id}"><img th:src="${#uris.escapePath(album.coverUrl)}" width="100" height="100" th:onError="shashin.errorImg(this,[[${album.name}]],100)"></div></h5>
<!--                <span th:id="'albumCommentMessage'+${album.id}"></span>-->
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" th:id="'currentCommentId'+${album.id}" th:name="'currentCommentId'+${album.id}">
                <script type="text/javascript">
                    (function( albumsCommentsSettings, $, undefined ) {
                        albumsCommentsSettings.deleteComment = function(commentId, albumId) {

                            let json = {commentId: commentId}

                            const posting = $.post({
                                url: "/comment/album/delete/",
                                data: JSON.stringify(json),
                                contentType: 'application/json; charset=utf-8'
                            });

                            posting.done(function (data) {
                                if (data.hasOwnProperty("status") && data.hasOwnProperty("msg") && data.hasOwnProperty("commentId")) {
                                    let commentId = data["commentId"];
                                    let message = "Error";
                                    if (data["status"] === "success") {
                                        message = '<div class="alert alert-success" role="alert">' + data["msg"] + '</div>';

                                        // Delete comment
                                        $("#comment"+commentId).remove();
                                    } else {
                                        message = '<div class="alert alert-danger" role="alert">' + data["msg"] + '</div>';
                                    }
                                }
                            });

                            $("#currentCommentId"+albumId).val("");
                        }

                        albumsCommentsSettings.editComment = function(albumId,commentId) {
                            if ($("#currentCommentId"+albumId).val() === "") {
                                $("#currentCommentId"+albumId).val(commentId);

                                $("#saveCommentAlbum"+albumId).hide();
                                $("#dismissModalCommentAlbum"+albumId).hide();
                                $("#updateCommentAlbum"+albumId).show();
                                $("#cancelEditCommentAlbum"+albumId).show();

                                $("#commentcontainer"+commentId).hide();
                                $("#textareacontainer"+commentId).show();
                                var commentText = $("#commentcontent"+commentId).text();
                                $("#textareacontainer"+commentId).html('<textarea class="form-control" id="commenttext' + commentId + '" rows="2">'+commentText+'</textarea>');
                            }
                        }
                    }( window.albumsCommentsSettings = window.albumsCommentsSettings || {}, jQuery ));



                </script>
                <ul class="list-group" th:id="'commentList'+${album.id}">
                    <th:block th:if="${albumCommentsMap != ''}" th:each="comments: ${albumsCommentsMap.get(album.id)}">
                        <th:block th:if="${comments.get('albumId') == album.id}">
                            <li th:id="'comment'+${comments.get('commentId')}" th:class="'list-group-item'+${comments.get('userId') == currentUser.id ? ' list-group-item-secondary' : ''}">
                                <span th:id="'commentcontainer'+${comments.get('commentId')}">
                                    <p th:id="'commentcontent'+${comments.get('commentId')}" th:text="${comments.get('comment')}"></p>
                                    <small><strong th:text="${comments.get('username')}"></strong><span th:text="' on '+${comments.get('createdAt')}"></span></small>
                                    <th:block th:if="${comments.get('userId') == currentUser.id}">
                                        <small><span style="float: right">
                                            <a href="#" th:id="'deletecomment'+${comments.get('commentId')}"><span class="bi-trash"></span></a>&nbsp;&nbsp;
                                            <a href="#" th:id="'editcomment'+${comments.get('commentId')}"><span class="bi-pencil"></span></a>
                                        </span></small>
                                    </th:block>
                                </span>
                                <span th:id="'textareacontainer'+${comments.get('commentId')}"></span>
                            </li>

                            <script type="text/javascript">
                                /*<![CDATA[*/
                                $("#deletecomment[[${comments.get('commentId')}]]").click(function(e) {
                                    e.preventDefault();
                                    albumsCommentsSettings.deleteComment([[${comments.get('commentId')}]],[[${album.id}]]);
                                });

                                $("#editcomment[[${comments.get('commentId')}]]").click(function(e) {
                                    e.preventDefault();
                                    albumsCommentsSettings.editComment([[${album.id}]],[[${comments.get('commentId')}]]);
                                });
                                /*]]>*/
                            </script>
                        </th:block>
                    </th:block>
                </ul>
            </div>
            <div class="modal-footer">
                <textarea class="form-control" th:id="'commentText'+${album.id}" rows="2"></textarea>
                <button type="button" class="btn btn-primary" th:id="'saveCommentAlbum'+${album.id}">Save</button>
                <button type="button" class="btn btn-primary" th:id="'updateCommentAlbum'+${album.id}">Update</button>
                <button type="button" class="btn btn-secondary" th:id="'dismissModalCommentAlbum'+${album.id}" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-secondary" th:id="'cancelEditCommentAlbum'+${album.id}" data-bs-dismiss="modal">Cancel</button>
            </div>
            <script type="text/javascript">
                /*<![CDATA[*/
                $("#propcommentalbums[[${album.id}]]").on('show.bs.modal', function () {
                    var promise = $.ajax({
                        type: 'get',
                        url: "/notifications/markread/album/[[${album.id}]]",
                        contentType: 'application/json; charset=utf-8',
                        async:true
                    }).then(function (data) {

                    });
                })

                $("#updateCommentAlbum[[${album.id}]]").hide();
                $("#cancelEditCommentAlbum[[${album.id}]]").hide();

                $("#cancelEditCommentAlbum[[${album.id}]]").click(function (e) {
                    e.preventDefault();

                    var currentCommentId = $("#currentCommentId[[${album.id}]]").val()

                    if (currentCommentId !== "") {
                        $("#saveCommentAlbum[[${album.id}]]").show();
                        $("#dismissModalCommentAlbum[[${album.id}]]").show();
                        $("#updateCommentAlbum[[${album.id}]]").hide();
                        $("#cancelEditCommentAlbum[[${album.id}]]").hide();

                        $("#commentcontainer" + currentCommentId).show();
                        $("#textareacontainer" + currentCommentId).html('');
                        $("#textareacontainer" + currentCommentId).hide();

                        $("#currentCommentId[[${album.id}]]").val("");
                    }
                });

                $("#updateCommentAlbum[[${album.id}]]").click(function (e) {
                    e.preventDefault();

                    var currentCommentId = $("#currentCommentId[[${album.id}]]").val()

                    if (currentCommentId !== "") {
                        var updatedComment = $.trim($("#commenttext"+currentCommentId).val());

                        if (updatedComment.length > 0) {
                            let json = {commentId: currentCommentId, comment: updatedComment}

                            const posting = $.post({
                                url: "/comment/update",
                                data: JSON.stringify(json),
                                contentType: 'application/json; charset=utf-8'
                            });

                            posting.done(function (data) {
                                if (data.hasOwnProperty("status") && data.hasOwnProperty("msg") && data.hasOwnProperty("commentId")) {
                                    let commentId = data["commentId"];
                                    let message = "Error";
                                    if (data["status"] === "success") {
                                        message = '<div class="alert alert-success" role="alert">' + data["msg"] + '</div>';
                                    } else {
                                        message = '<div class="alert alert-danger" role="alert">' + data["msg"] + '</div>';
                                    }

                                    // Update comment
                                    $("#commentcontent"+commentId).text(updatedComment);

                                    $("#saveCommentAlbum[[${album.id}]]").show();
                                    $("#dismissModalCommentAlbum[[${album.id}]]").show();
                                    $("#updateCommentAlbum[[${album.id}]]").hide();
                                    $("#cancelEditCommentAlbum[[${album.id}]]").hide();

                                    $("#commentcontainer" + commentId).show();
                                    $("#textareacontainer" + commentId).html('');
                                    $("#textareacontainer" + commentId).hide();
                                    $("#commenttext"+commentId).val("");
                                }
                            });
                        }

                        $("#saveCommentAlbum[[${album.id}]]").show();
                        $("#dismissModalCommentAlbum[[${album.id}]]").show();
                        $("#updateCommentAlbum[[${album.id}]]").hide();
                        $("#cancelEditCommentAlbum[[${album.id}]]").hide();

                        $("#commentcontainer" + currentCommentId).show();
                        $("#textareacontainer" + currentCommentId).html('');
                        $("#textareacontainer" + currentCommentId).hide();

                        $("#currentCommentId[[${album.id}]]").val("");
                    }
                });

                $("#saveCommentAlbum[[${album.id}]]").click(function(e) {
                    e.preventDefault();

                    let comment = $.trim($("#commentText[[${album.id}]]").val());

                    if (comment.length > 0) {
                        let json = {albumId: [[${album.id}]], comment: comment}

                        const posting = $.post({
                            url: "/comment/album/save/",
                            data: JSON.stringify(json),
                            contentType: 'application/json; charset=utf-8'
                        });

                        posting.done(function (data) {
                            if (data.hasOwnProperty("status") && data.hasOwnProperty("msg") && data.hasOwnProperty("commentId")) {
                                let commentId = data["commentId"];
                                let message = "Error";
                                if (data["status"] === "success") {
                                    message = '<div class="alert alert-success" role="alert">' + data["msg"] + '</div>';
                                } else {
                                    message = '<div class="alert alert-danger" role="alert">' + data["msg"] + '</div>';
                                }

                                //$("#albumCommentMessage[[${album.id}]]").html(message);

                                // Insert comment at top of list
                                var commentItem = '<li class="list-group-item list-group-item-secondary" id="comment'+commentId+'">\n' +
                                    '<span id="commentcontainer'+commentId+'">\n<p id="commentcontent'+commentId+'">'+comment+'</p>\n' +
                                    '<small>[[${currentUser.username}]]<span style="float: right"><a href="#" id="deletecomment'+commentId+'"><span class="bi-trash"></span></a>&nbsp;&nbsp;<a href="#" id="editcomment'+commentId+'"><span class="bi-pencil"></span></a></span></small></span>' +
                                    '<span id="textareacontainer'+commentId+'"></span></li>';
                                $("#commentText[[${album.id}]]").val("")
                                $("#commentList[[${album.id}]]").prepend(commentItem);

                                $("#deletecomment"+commentId).click(function(e) {
                                    e.preventDefault();
                                    albumsCommentsSettings.deleteComment(commentId,[[${album.id}]]);
                                });

                                $("#editcomment"+commentId).click(function(e) {
                                    e.preventDefault();
                                    albumsCommentsSettings.editComment([[${album.id}]],commentId);
                                });
                            }
                        });
                    }
                });
                /*]]>*/
            </script>
        </div>
    </div>
</div>

<script type="text/javascript">
    (function( albumsModalSettings, $, undefined ) {
        albumsModalSettings.updateShareLink = function (baseUrl,albumId,action) {
            $("#generateLink"+albumId).prop('disabled', true);
            $("#msg"+albumId).html("");
            var relativeShareLink = "";
            if (action === "generate") {
                relativeShareLink = albumsModalSettings.makeShareLinkId(8, 11);
                $("#shareLink"+albumId).val(relativeShareLink);
            }
            if ($("#shareLink"+albumId).val() !== "") {
                $("#copyLink"+albumId).prop('disabled', false);
            } else {
                $("#copyLink"+albumId).prop('disabled', true);
            }

            let json = {albumId: albumId,relativeShareUrl: relativeShareLink}
            const posting = $.post({
                url: "/album/"+albumId+"/save/sharelink",
                data: JSON.stringify(json),
                contentType: 'application/json; charset=utf-8'
            });

            posting.done(function (data) {
                if (data.hasOwnProperty("status") && data.hasOwnProperty("msg") && data.hasOwnProperty("relativeShareUrl")) {
                    let message = "Generated link not saved";
                    let relativeShareUrlData = data["relativeShareUrl"] === null ? "" : data["relativeShareUrl"];
                    $("#shareLink"+albumId).val(relativeShareUrlData);
                    $("#fullShareLinkContainer"+albumId).css("display","none");
                    $("#fullShareLink"+albumId).text("");
                    if (relativeShareUrlData !== "") {
                        $("#fullShareLinkContainer"+albumId).css("display","block");
                        $("#fullShareLink"+albumId).html("<a target='_blank' href='"+baseUrl+"share/"+relativeShareUrlData+"/album/"+albumId+"'>"+baseUrl+"share/"+relativeShareUrlData+"/album/"+albumId+"</a>");
                    }
                    if (data["status"] === "success" && $("#shareLink"+albumId).val() === relativeShareUrlData) {
                        message = '<div class="alert alert-success" role="alert">' + data["msg"] + '</div>';
                    } else {
                        message = '<div class="alert alert-danger" role="alert">' + data["msg"] + '</div>';
                    }
                    $("#generateLink"+albumId).prop('disabled', false);
                    $("#msg"+albumId).html(message);
                } else {
                    $("#generateLink"+albumId).prop('disabled', false);
                    $("#msg"+albumId).html("<div class=\"alert alert-danger\" role=\"alert\">Generated link not saved</div>");
                }
            });
        }

        albumsModalSettings.makeShareLinkId = function (minLength, maxLength) {
            var length = Math.floor(
                Math.random() * (Math.ceil(maxLength) - Math.floor(minLength) + 1) + minLength
            );
            var result           = '';
            var characters       = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            var charactersLength = characters.length;
            for ( var i = 0; i < length; i++ ) {
                result += characters.charAt(Math.floor(Math.random() *
                    charactersLength));
            }
            return result;
        }
    }( window.albumsModalSettings = window.albumsModalSettings || {}, jQuery ));
</script>

</body>
</html>
