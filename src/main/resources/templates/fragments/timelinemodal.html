<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body th:fragment="timelinemodal()">

<script type="text/javascript">
    function toggleTagPeopleDropdown(metadataId) {
        $("#tagpeopledropdown"+metadataId).dropdown('toggle')
    }

    function closeTagPeopleDropdown(metadataId) {
        $("#tagpeopledropdown"+metadataId).dropdown('hide')
    }

    function populateLabel(metadataId,recognitionLabelId) {
        var checkedBoxes = $('input[name="recognitionLabel'+metadataId+'[]"]:checked')
        var labelString = ""
        checkedBoxes.each(function() {
            labelString += $(this).val() + ",";
        });
        if (labelString.length > 0) {
            labelString = labelString.slice(0,-1)
        }
        //
        $("#tagpeople"+metadataId).val(decodeHtml(labelString));
        // $("#labelids"+metadataId).val(recognitionLabelId);
    }

    function renderTimelineModal(rawMetadata,rawRecognitionLabels,taggedPeopleList) {
        var metadata = JSON.parse(decodeHtml(rawMetadata));
        var recognitionLabels = rawRecognitionLabels.length  > 0 ? JSON.parse(decodeHtml(rawRecognitionLabels)) : "";

        var latlngValue = (metadata.lat != null || metadata.lng != null) ? (metadata.lat+', '+metadata.lng) : '';
        var keywordsList = (metadata.keywords == null) ? "" : metadata.keywords;

        var html = '<div class="modal fade" id="prop'+metadata.id+'" tabindex="-1" role="dialog" aria-labelledby="label'+metadata.id+'" aria-hidden="true"><div class="modal-dialog modal-lg" role="document"><div class="modal-content">\n' +
            '<div class="modal-header"><h5 class="modal-title" id="exampleModalLabel">Edit '+metadata.fileName+'</h5>\n' +
            '<button type="button" class="close" data-dismiss="modal" aria-label="Close">\n' +
            '   <span aria-hidden="true">&times;</span>\n' +
            '</button></div>\n' +
            '<div class="modal-body">\n' +
            '   <ul class="nav nav-tabs">\n' +
            '       <li class="nav-item">\n' +
            '           <a class="nav-link show active" data-toggle="tab" id="generaltablink'+metadata.id+'" href="#general'+metadata.id+'">General</a>\n' +
            '       </li>\n' +
            '       <li class="nav-item">\n' +
            '           <a class="nav-link" data-toggle="tab" id="detailstablink'+metadata.id+'" href="#details'+metadata.id+'">Details</a>\n' +
            '       </li>\n' +
            '   </ul>\n' +
            '   <div class="tab-content">\n' +
            '       <div class="tab-pane container show active" id="general'+metadata.id+'">\n' +
            '           <form th:id="saveData'+metadata.id+'">\n' +
            '               <input type="hidden" name="id" value="'+metadata.id+'">\n' +
            '               <div class="form-group row">\n' +
            '                   <div class="col-sm">\n' +
            '                       <label for="dayTaken'+metadata.id+'" class="col-form-label">Day taken</label>\n' +
            '                       <input type="text" class="form-control" id="dayTaken'+metadata.id+'" name="day" value="'+(metadata.day == null ? "" : metadata.day)+'">\n' +
            '                       <a href="#" id="refreshTakenDate'+metadata.id+'" data-toggle="tooltip" data-placement="right" title="Sync original taken date"><span class="bi-arrow-clockwise"></span></a>\n' +
            '                   </div>\n' +
            '                   <div class="col-sm">\n' +
            '                       <label for="monthTaken'+metadata.id+'" class="col-form-label">Month taken</label>\n' +
            '                       <input type="text" class="form-control" id="monthTaken'+metadata.id+'" name="month" value="'+(metadata.month == null ? "" : metadata.month)+'">\n' +
            '                   </div>\n' +
            '                   <div class="col-sm">\n' +
            '                       <label for="yearTaken'+metadata.id+'" class="col-form-label">Year taken</label>\n' +
            '                       <input type="text" class="form-control" id="yearTaken'+metadata.id+'" name="year" value="'+(metadata.year == null ? "" : metadata.year)+'">\n' +
            '                   </div>\n' +
            '               </div>\n' +
            '               <div class="form-group row">\n' +
            '                   <div class="col-sm">\n' +
            '                       <label for="latlng'+metadata.id+'" class="col-form-label">Latitude, Longitude</label>\n' +
            '                       <input type="text" class="form-control" id="latlng'+metadata.id+'" name="latlng" value="'+latlngValue+'">\n' +
            '                   </div>\n' +
            '                   <div class="col-sm">\n' +
            '                       <label for="tagpeople'+metadata.id+'" class="col-form-label">Tag People (Comma separated)</label>\n' +
            '                       <div class="input-group">\n' +
            '                           <input type="text" onfocus="return closeTagPeopleDropdown(\''+metadata.id+'\');" class="form-control" aria-label="Tag People" id="tagpeople'+metadata.id+'" name="tagpeople" value="'+taggedPeopleList+'">\n';
        if (recognitionLabels.length > 0) {
            html += '                   <div class="input-group-append">\n' +
                '                           <button class="btn btn-outline-secondary dropdown-toggle" onclick="return toggleTagPeopleDropdown(\''+metadata.id+'\');" id="tagpeopledropdown'+metadata.id+'" type="button" aria-haspopup="true" aria-expanded="false">People</button>\n' +
                '                           <div class="dropdown-menu" id="recognitionLabelsList'+metadata.id+'">\n';
            for (var index in recognitionLabels) {
                var recognitionLabel = recognitionLabels[index];
                var taggedPeopleArray = taggedPeopleList.split(",");
                var checkedString = "";
                if (jQuery.inArray(recognitionLabel.name, taggedPeopleArray) !== -1) {
                    checkedString = " checked";
                }
                html += '                       <button class="dropdown-item" type="button">\n' +
                        '                           <input type="checkbox" onclick="return populateLabel(\''+metadata.id+'\','+recognitionLabel.id+');" value="'+recognitionLabel.name+'" name="recognitionLabel'+metadata.id+'[]" id="'+metadata.id+'-'+recognitionLabel.id+'"'+checkedString+'>\n' +
                        '                           <label for="'+metadata.id+'-'+recognitionLabel.id+'" id="label-'+metadata.id+'-'+recognitionLabel.id+'">'+recognitionLabel.name+'</label>\n' +
                        '                       </button>\n';
            }
            html += '                       </div>\n' +
            '                           </div>\n';

        }
        html +=
            '                       </div>\n' +
            '                   </div>\n' +
            '               </div>\n' +
            '               <div class="form-group row">\n' +
            '                   <div class="col-sm">\n' +
            '                       <label for="keywords'+metadata.id+'" class="col-form-label">Keywords (comma seperated)</label>\n' +
            '                       <input type="text" class="form-control" id="keywords'+metadata.id+'" name="keywords" value="'+keywordsList+'">\n' +
            '                   </div>\n' +
            '               </div>\n' +
            '           </form>\n' +
            '       </div>' +
            '       <div class="tab-pane container fade" id="details'+metadata.id+'">\n';
        if (metadata.path != null) {
            html += '<div class="row"><strong>File name:&nbsp;</strong>'+metadata.path+'</div>\n';
        }
        if (metadata.type != null) {
            html += '<div class="row"><strong>File type:&nbsp;</strong>'+metadata.type+'</div>\n';
        }
        if (metadata.iso != null) {
            html += '<div class="row"><strong>ISO:&nbsp;</strong>'+metadata.iso+'</div>\n';
        }
        if (metadata.exposure != null) {
            html += '<div class="row"><strong>Exposure:&nbsp;</strong>'+metadata.exposure+'</div>\n';
        }
        if (metadata.fNumber != null) {
            html += '<div class="row"><strong>F-stop:&nbsp;</strong>'+metadata.fNumber+'</div>\n';
        }
        if (metadata.focalLength != null) {
            html += '<div class="row"><strong>Focal length:&nbsp;</strong>'+metadata.focalLength+'</div>\n';
        }
        if (metadata.camera != null) {
            html += '<div class="row"><strong>Camera:&nbsp;</strong>'+metadata.camera+'</div>\n';
        }
        if (metadata.lens != null) {
            html += '<div class="row"><strong>Lens:&nbsp;</strong>'+metadata.lens+'</div>\n';
        }
        if (metadata.quality != null) {
            html += '<div class="row"><strong>Quality:&nbsp;</strong>'+metadata.quality+'</div>\n';
        }
        if (metadata.createdAt != null) {
            html += '<div class="row"><strong>Created:&nbsp;</strong>'+metadata.createdAt+'</div>\n';
        }
        if (metadata.modifiedAt != null) {
            html += '<div class="row"><strong>Modified:&nbsp;</strong>'+metadata.modifiedAt+'</div>\n';
        }
        if (metadata.takenAt != null) {
            html += '<div class="row"><strong>Taken:&nbsp;</strong>'+metadata.takenAt+'</div>\n';
        }
        if (metadata.year != null || metadata.month != null || metadata.day != null) {
            html += '<div class="row"><strong>Manually Adjusted Taken:&nbsp;</strong>'+metadata.year+'-'+metadata.month+'-'+metadata.day+'</div>\n';
        }
        if (metadata.timeZone != null) {
            html += '<div class="row"><strong>Time zone:&nbsp;</strong>'+metadata.timeZone+'</div>\n';
        }
        html += '</div>\n' +
            '       <div class="col-sm">\n' +
            '           <span id="msg'+metadata.id+'"></span>\n' +
            '       </div>\n' +
            '   </div>\n' +
            '</div>\n' +
            '<div class="modal-footer">\n' +
            '   <button type="button" class="btn btn-primary" id="saveMetadata'+metadata.id+'">Save</button>\n' +
            '   <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>\n' +
            '</div></div></div></div>';

        $("#timelinemodal"+metadata.id).after(html);

        $("#detailstablink"+metadata.id).click(function (e) {
            $("#saveMetadata"+metadata.id).prop('disabled', true);
        });
        $("#generaltablink"+metadata.id).click(function (e) {
            $("#saveMetadata"+metadata.id).prop('disabled', false);
        });

        $("#saveMetadata"+metadata.id).click(function (e) {
            e.preventDefault();

            if (validateMetadataInputs(
                $("#dayTaken"+metadata.id).val(),
                $("#monthTaken"+metadata.id).val(),
                $("#yearTaken"+metadata.id).val(),
                $("#latlng"+metadata.id).val(),
                "msg"+metadata.id
            ) === true) {
                var json = {
                    id:metadata.id,
                    year:$("#yearTaken"+metadata.id).val(),
                    month:$("#monthTaken"+metadata.id).val(),
                    day:$("#dayTaken"+metadata.id).val(),
                    latlng:$("#latlng"+metadata.id).val(),
                    keywords:$("#keywords"+metadata.id).val(),
                    // labelIds:$("#labelids"+metadata.id).val(),
                    tagpeople:$("#tagpeople"+metadata.id).val()
                }
                const posting = $.post({
                    url: "/timeline/update/"+metadata.id,
                    data: JSON.stringify(json),
                    contentType: 'application/json; charset=utf-8'
                });

                posting.done(function (data) {
                    if (data.hasOwnProperty("status") && data.hasOwnProperty("msg")) {
                        let message = "Error";
                        if (data["status"] === "success") {
                            message = '<div class="alert alert-success" role="alert">' + data["msg"] + '</div>';
                            // window.top.location = window.top.location
                        } else {
                            message = '<div class="alert alert-danger" role="alert">' + data["msg"] + '</div>';
                        }
                        $("#msg"+metadata.id).html(message);
                    }
                });
            }

            return false;
        });

        $("#refreshTakenDate"+metadata.id).click(function (e) {
            e.preventDefault();

            var json = {
                id:metadata.id
            }
            const posting = $.post({
                url: "/timeline/sync/"+metadata.id,
                data: JSON.stringify(json),
                contentType: 'application/json; charset=utf-8'
            });

            posting.done(function (data) {
                if (data.hasOwnProperty("status") && data.hasOwnProperty("msg")) {
                    let message = "Error";
                    if (data["status"] === "success") {
                        message = '<div class="alert alert-success" role="alert">' + data["msg"] + '</div>';
                        if (data["year"] !== "" && data["month"] !== "" && data["day"] !== "") {
                            $("#yearTaken"+metadata.id).val(data["year"]);
                            $("#monthTaken"+metadata.id).val(data["month"]);
                            $("#dayTaken"+metadata.id).val(data["day"]);
                        }
                        // window.top.location = window.top.location
                    } else {
                        message = '<div class="alert alert-danger" role="alert">' + data["msg"] + '</div>';
                    }
                    $("#msg"+metadata.id).html(message);
                }
            });

            return false;
        });

        // Clear message on modal close
        $('#prop'+metadata.id).on('hidden.bs.modal', function () {
            $("#msg"+metadata.id).html("");
        });

        // Clear message on input editing
        $('#prop'+metadata.id+' input').bind('keypress', function() {
            $("#msg"+metadata.id).html("");
        });
    }
</script>

</body>
</html>
