<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body th:fragment="timelinemodal(${currentUser})">

<!--Modal for each photo-->
<div class="modal fade" id="propTimelineModal" tabindex="-1" role="dialog" aria-labelledby="labelTimelineModal" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="exampleModalLabel">Edit &ldquo;<span id="timelineModalTitle"></span>&rdquo;<div id="propTimelineModalThumbnail"></div></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body ui-front">
                <ul class="nav nav-tabs">
                    <li class="nav-item">
                        <a class="nav-link show active" data-bs-toggle="tab" id="generalTabLink" href="#generalTab">General</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" data-bs-toggle="tab" id="detailsTabLink" href="#detailsTab">Details</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" data-bs-toggle="tab" id="mapTabLink" href="#mapTab">Map</a>
                    </li>
                </ul>
                <div class="tab-content">
                    <div class="tab-pane container show active" id="generalTab">
                        <form id="saveTimelineModalForm">
                            <input type="hidden" name="metadataId" id="metadataId" value="">
                            <div class="form-group row">
                                <div class="col-sm">
                                    <label for="title" class="col-form-label">Title</label>
                                    <input type="text" class="form-control" id="title" name="title" value="">
                                </div>
                                <div class="col-sm">
                                    <label for="camera" class="col-form-label">Camera</label>
                                    <input type="text" class="form-control" id="camera" name="camera" value="">
                                    <input type="hidden" id="camerasString" th:value="${cameras}">
                                </div>
                            </div>
                            <div class="form-group row">
                                <div class="col-sm">
                                    <label for="description" class="col-form-label">Description</label>
                                    <input type="text" class="form-control" id="description" name="description" value="" maxlength="500">
                                </div>
                            </div>
                            <div class="form-group row">
                                <div class="col-sm">
                                    <label for="yearTaken" class="col-form-label">Year taken</label>
                                    <input type="number" class="form-control" id="yearTaken" name="year" value="" maxlength="4" min="1826">
                                </div>
                                <div class="col-sm">
                                    <label for="monthTaken" class="col-form-label">Month taken</label>
                                    <input type="number" class="form-control" id="monthTaken" name="month" value="" maxlength="2" min="1">
                                </div>
                                <div class="col-sm">
                                    <label for="dayTaken" class="col-form-label">Day taken</label>
                                    <input type="number" class="form-control" id="dayTaken" name="day" value="" maxlength="2" min="1">
                                </div>
                                <div class="col-sm">
                                    <label for="timeTaken" class="col-form-label">Time taken</label>
                                    <input type="text" class="form-control" id="timeTaken" name="time" value="" placeholder="hh:mm:ss" maxlength="8">
                                </div>
                                <div class="col-sm">
                                    <label for="offsetTaken" class="col-form-label">GMT Offset</label>
                                    <select class="form-select" id="offsetTaken" name="offset">
                                        <option value="">--GMT--</option>
                                        <th:block th:each="offset, iterStat: ${timeOffsets}">
                                            <option th:value="${offset}" th:text="${offset}"></option>
                                        </th:block>
                                    </select>
                                </div>
                            </div>
                            <a href="#" id="refreshTakenDate" data-bs-toggle="tooltip" data-bs-placement="right" title="Sync original taken date"><span class="bi-arrow-clockwise"></span></a>

                            <div class="form-group row">
                                <div class="col-sm">
                                    <label for="latlng" class="col-form-label">Latitude, Longitude</label>
                                    <input type="text" class="form-control" id="latlng" name="latlng" value="">
                                </div>
                                <div class="col-sm">
                                    <label for="keywords" class="col-form-label">Keywords (comma separated)</label>
                                    <input type="text" class="form-control" id="keywords" name="keywords" value="">
                                    <input type="hidden" id="keywordsString" th:value="${keywords}">
                                </div>
                            </div>
                            <div class="form-group row">
                                <div class="col-sm">
                                    <label for="albumnames" class="col-form-label">Add to Album (comma separated)</label>
                                    <div class="input-group" id="batchAlbumNames">
                                        <div class="input-group">
                                            <input type="text" class="form-control" aria-label="Albums Name" id="albumnames" name="albumnames" value="">

                                            <!-- Populated in timeline.js -->
                                            <span id="albumNameData"></span>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-sm">
                                    <label for="tagpeople" class="col-form-label">Tag People (comma separated)</label>
                                    <div class="input-group">
                                        <input type="text" class="form-control" aria-label="Tag People" id="tagpeople" name="tagpeople" value="">
                                        <!-- if there's label id data -->
                                        <span id="labelIdData"></span>
                                    </div>
                                    <div class="form-group row">
                                        <div class="col-sm">
                                            <input type="checkbox" name="isobject" id="isobject">
                                            <label class="form-check-label" for="isobject">Cannot identify</label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <hr>
                            <div class="form-group row">
                                <div class="col-sm">
                                    <input type="checkbox" name="hidden" id="hidden">
                                    <label class="form-check-label" for="hidden">Remove Photo</label>
                                </div>
                            </div>
                            <br>
                            <div class="row">
                                <div class="col-sm">
                                    <span id="timelineModalMsg"></span>
                                </div>
                            </div>
                        </form>
                    </div>
                    <div class="tab-pane container fade" id="detailsTab">
                        <div th:replace="fragments/detailsinfo :: detailsinfo(${currentUser})"></div>
                    </div>
                    <div class="tab-pane container fade" id="mapTab">
                        <br>
                        <span id="mapTabMessage">No map data</span>
                        <br>
                        <div id="map" class="map" style="width: 100%;height: 400px"></div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <div id="timelineModalStatus" class="spinner-grow me-auto" style="visibility: hidden;font-size: 2rem;" role="status" aria-hidden="true" data-bs-toggle="tooltip" data-bs-placement="right" title=""></div>
                <button type="button" class="btn btn-primary" id="saveMetadata">Save</button>
                <button id="timelineModalCancel" type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            </div>
        </div>
    </div>
</div>

<th:block th:if="${@environment.getProperty('app.js.useMinified') == 'false'}">
    <script src="/js/site/timelinemodal.js" type="text/javascript"></script>
</th:block>
<th:block th:if="${@environment.getProperty('app.js.useMinified') == 'true'}">
    <script src="/js/site/timelinemodal.min.js" type="text/javascript"></script>
</th:block>
</body>
</html>
