<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body th:fragment="content(data,activePage)">
<span th:if="${activePage == 'settings' or activePage == 'scan'}">
    <div th:replace="fragments/settings :: settings(${activePage})"></div>
</span>
<span th:if="${data != ''}">
    <p id="msg" th:text="${data}"></p>
</span>
</body>
</html>
