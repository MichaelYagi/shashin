<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body th:fragment="content(message,activePage,authority,parameter,counts,faceRecogServicesAvailable,objectRecogEnabled)">
<th:block th:if="${message != ''}">
    <br>
    <div class="card">
        <div class="card-body">
            <span id="msg" th:utext="${message == 'No message available' ? 'Oops! Something went wrong.' : message}"></span>
        </div>
    </div>
    <th:block th:if="${activePage == 'scan' or activePage == 'match'}">
        <br>
    </th:block>
<!--    <br><p id="msg" th:text="${message == 'No message available' ? 'Oops! Something went wrong.' : message}"></p>-->
</th:block>

<input type="hidden" id="multiSelectMetadataIds" name="multiSelectMetadataIds" value="[]">
<input type="hidden" id="multiSelectFilenames" name="multiSelectFilenames" value="[]">
<input type="hidden" id="multiSelectThumbnails" name="multiSelectThumbnails" value="[]">
<input type="hidden" id="currentlat" name="currentlat">
<input type="hidden" id="currentlng" name="currentlng">
<input type="hidden" id="currentyear" name="currentyear">
<input type="hidden" id="currentmonth" name="currentmonth">
<input type="hidden" id="currentday" name="currentday">
<input type="hidden" id="currentfilename" name="currentfilename">
<input type="hidden" id="currentPage" name="currentPage" value="0">
</body>
</html>
