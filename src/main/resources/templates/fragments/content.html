<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body th:fragment="content(data,activePage)">
<th:block th:if="${activePage == 'settings' or activePage == 'scan'}">
    <div th:replace="fragments/settings :: settings(${activePage})"></div>
</th:block>
<th:block th:if="${data != ''}">
    <p id="msg" th:text="${data}"></p>
</th:block>
</body>
</html>
