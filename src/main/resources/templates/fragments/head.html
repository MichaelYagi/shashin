<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(activePage,titleDescriptor)">
    <th:block th:with="activePageLower = ${#strings.toLowerCase(activePage)}">
        <meta charset="UTF-8">
        <title th:text="${(#strings.isEmpty(titleDescriptor) ? '' : titleDescriptor+' - ') + @environment.getProperty('app.build.properties.name')}"></title>
        <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
        <link rel="manifest" href="/images/site.webmanifest">
        <link rel="mask-icon" href="/images/safari-pinned-tab.svg" color="#5bbad5">
        <meta name="msapplication-TileColor" content="#da532c">
        <meta name="theme-color" content="#ffffff">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <meta name="robots" content="noindex">
        <th:block th:if="${(activePageLower == 'share' or activePageLower == 'album') and album.coverUrl != null}">
            <th:block th:if="${activePageLower == 'share'}">
                <meta property="og:url" th:content="${album.shareUrl}">
            </th:block>
            <th:block th:if="${activePageLower == 'album'}">
                <meta property="og:url" th:content="${baseUrl + 'album/' + album.id}">
            </th:block>
            <meta property="og:type" content="image.photo.video.movie">
            <meta property="og:image" th:content="${baseUrl + #strings.substring(#strings.replace(#uris.escapePath(album.coverUrl),';','%3B'), 1, #strings.length(#strings.replace(#uris.escapePath(album.coverUrl),';','%3B')))}">
            <meta property="og:title" th:content="${album.name}">
            <meta property="og:description" th:content="${album.name + ' album'}">
            <meta property="og:image:width" content="209">
            <meta property="og:image:height" content="209">
            <meta property="description" th:content="${album.name + ' album'}">
        </th:block>

        <script th:inline="javascript" type="text/javascript" th:nonce="${cspNonce}">
            /*<![CDATA[*/
            const isMobile = /*[[${isMobile}]]*/ false;
            const activePage = /*[[${activePage}]]*/ "";
            /*]]>*/

            // Use value already implemented in Kotlin
            Util.isMobile = function () {
                return isMobile;
            };

            Util.konamiCodeListener(function(sequenceComplete) {
               if (sequenceComplete === true) {
                   if (shashin.uglified === false) {
                       Util.uglify(activePage);
                       shashin.uglified = true;
                   } else {
                       Util.deuglify(activePage);
                       shashin.uglified = false;
                   }
               }
            });
        </script>
