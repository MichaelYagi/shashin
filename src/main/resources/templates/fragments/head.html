<!DOCTYPE html>
<html  xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titleDescriptor)">
    <th:block th:with="titleDescriptorLower = ${#strings.toLowerCase(titleDescriptor)}">
        <meta charset="UTF-8">
        <title th:text="${@environment.getProperty('app.build.properties.name')} + (${#strings.isEmpty(titleDescriptor)} ? ': Home' : ': ' + ${titleDescriptor})"></title>
        <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
        <link rel="manifest" href="/images/site.webmanifest">
        <link rel="mask-icon" href="/images/safari-pinned-tab.svg" color="#5bbad5">
        <meta name="msapplication-TileColor" content="#da532c">
        <meta name="theme-color" content="#ffffff">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <script src="/js/jquery-3.5.1.min.js"></script>
        <script src="/js/popper.min.js"></script>
        <script src="/js/clipboard.min.js"></script>
        <script src="/js/bootstrap.min.js"></script>
        <script src="/js/bootstrap-autocomplete.min.js"></script>
        <script src="/js/date.format.js"></script>
        <link href="/css/bootstrap.min.css" rel="stylesheet">
        <link href="/css/bootstrap-icons.css" rel="stylesheet">
        <th:block th:if="${@environment.getProperty('app.js.useMinified') == 'true'}">
            <link href="/css/site/style.min.css" rel="stylesheet">
        </th:block>
        <th:block th:if="${@environment.getProperty('app.js.useMinified') == 'false'}">
            <link href="/css/site/style.css" rel="stylesheet">
        </th:block>
        <th:block th:if="${titleDescriptorLower == 'person' or
        titleDescriptorLower == 'matches' or
        titleDescriptorLower == 'timeline' or
        titleDescriptorLower == 'album' or
        titleDescriptorLower == 'favorites' or
        titleDescriptorLower == 'map' or
        titleDescriptorLower == 'search' or
        titleDescriptorLower == 'share' or
        titleDescriptorLower == 'trash' or
        titleDescriptorLower == 'recent' or
        titleDescriptorLower == 'folder'}">
            <script src="/js/lightgallery.min.js"></script>
            <script src="/js/lg-video.min.js"></script>
            <script src="/js/lg-zoom.min.js"></script>
            <script src="/js/lg-relative-caption.min.js"></script>
            <script src="/js/lg-fullscreen.min.js"></script>
            <script src="/js/ol.min.js"></script>
            <script src="/js/lg-editlocation.js"></script>
            <script src="/js/lg-metadata-detail.js"></script>
            <script src="/js/cast.min.js"></script>
            <script src="/js/lg-cast-media.js"></script>
            <link href="/css/lightgallery.min.css" rel="stylesheet">
            <link href="/css/lg-video.min.css" rel="stylesheet">
            <link href="/css/lg-zoom.min.css" rel="stylesheet">
            <link href="/css/lg-relative-caption.min.css" rel="stylesheet">
            <link href="/css/lg-fullscreen.min.css" rel="stylesheet">
            <link href="/css/ol.min.css" rel="stylesheet">
            <link href="/css/lg-editlocation.css" rel="stylesheet">
            <link href="/css/lg-metadata-detail.css" rel="stylesheet">
            <link href="/css/lg-cast-media.css" rel="stylesheet">
        </th:block>
        <th:block th:if="${titleDescriptorLower == 'timeline'}">
            <style>
                #container {
                    -ms-overflow-style: none;  /* Internet Explorer 10+ */
                    scrollbar-width: none;  /* Firefox */
                }
                #container::-webkit-scrollbar {
                    display: none;  /* Safari and Chrome */
                }
            </style>
            <script src="/js/withinviewport.js"></script>
            <script src="/js/jquery.withinviewport.js"></script>
        </th:block>
        <th:block th:if="${titleDescriptorLower == 'scan' or titleDescriptorLower == 'match' or titleDescriptorLower == 'dashboard'}">
            <script src="/js/stomp.min.js"></script>
            <script src="/js/sockjs.min.js"></script>
        </th:block>
        <th:block th:if="${titleDescriptorLower == 'dashboard'}">
            <script src="/js/chart.min.js"></script>
        </th:block>

        <th:block th:if="${@environment.getProperty('app.js.useMinified') == 'false'}">
            <script src="/js/site/util.js"></script>
            <script src="/js/site/app.js"></script>
            <th:block th:if="${titleDescriptorLower == 'album'}">
                <script src="/js/site/album.js"></script>
            </th:block>
            <th:block th:if="${titleDescriptorLower == 'timeline'}">
                <script src="/js/site/timeline.js"></script>
            </th:block>
            <th:block th:if="${titleDescriptorLower == 'recent'}">
                <script src="/js/site/recent.js"></script>
            </th:block>
            <th:block th:if="${titleDescriptorLower == 'folder'}">
                <script src="/js/site/folder.js"></script>
            </th:block>
            <th:block th:if="${titleDescriptorLower == 'favorites'}">
                <script src="/js/site/favorites.js"></script>
            </th:block>
            <th:block th:if="${titleDescriptorLower == 'search'}">
                <script src="/js/site/search.js"></script>
            </th:block>
            <th:block th:if="${titleDescriptorLower == 'trash'}">
                <script src="/js/site/trash.js"></script>
            </th:block>
            <th:block th:if="${titleDescriptorLower == 'share'}">
                <script src="/js/site/share.js"></script>
            </th:block>
            <th:block th:if="${titleDescriptorLower == 'person'}">
                <script src="/js/site/person.js"></script>
            </th:block>
            <th:block th:if="${titleDescriptorLower == 'albums'}">
                <script src="/js/site/albumsmodallisteners.js"></script>
            </th:block>
        </th:block>

        <th:block th:if="${@environment.getProperty('app.js.useMinified') == 'true'}">
            <script src="/js/site/util.min.js"></script>
            <script src="/js/site/app.min.js"></script>
            <th:block th:if="${titleDescriptorLower == 'album'}">
                <script src="/js/site/album.min.js"></script>
            </th:block>
            <th:block th:if="${titleDescriptorLower == 'timeline'}">
                <script src="/js/site/timeline.min.js"></script>
            </th:block>
            <th:block th:if="${titleDescriptorLower == 'recent'}">
                <script src="/js/site/recent.min.js"></script>
            </th:block>
            <th:block th:if="${titleDescriptorLower == 'folder'}">
                <script src="/js/site/folder.min.js"></script>
            </th:block>
            <th:block th:if="${titleDescriptorLower == 'favorites'}">
                <script src="/js/site/favorites.min.js"></script>
            </th:block>
            <th:block th:if="${titleDescriptorLower == 'search'}">
                <script src="/js/site/search.min.js"></script>
            </th:block>
            <th:block th:if="${titleDescriptorLower == 'trash'}">
                <script src="/js/site/trash.min.js"></script>
            </th:block>
            <th:block th:if="${titleDescriptorLower == 'share'}">
                <script src="/js/site/share.min.js"></script>
            </th:block>
            <th:block th:if="${titleDescriptorLower == 'person'}">
                <script src="/js/site/person.min.js"></script>
            </th:block>
            <th:block th:if="${titleDescriptorLower == 'albums'}">
                <script src="/js/site/albumsmodallisteners.min.js"></script>
            </th:block>
        </th:block>
    </th:block>
</head>
<body></body>
</html>
