<!DOCTYPE html>
<html  xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titleDescriptor)">
    <meta charset="UTF-8">
    <title th:text="'Shashin' + (${#strings.isEmpty(titleDescriptor)} ? ': Home' : ': ' + ${titleDescriptor})"></title>
    <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
    <link rel="manifest" href="/images/site.webmanifest">
    <link rel="mask-icon" href="/images/safari-pinned-tab.svg" color="#5bbad5">
    <meta name="msapplication-TileColor" content="#da532c">
    <meta name="theme-color" content="#ffffff">
    <script src="/js/babel.min.js"></script>
    <script src="/js/jquery-3.5.1.min.js"></script>
    <script src="/js/popper.min.js"></script>
    <script src="/js/bootstrap.min.js"></script>
    <link href="/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
    <th:block th:if="${titleDescriptor == 'Person' or titleDescriptor == 'Matches' or titleDescriptor == 'Timeline' or titleDescriptor == 'Album' or titleDescriptor == 'Favorites' or titleDescriptor == 'Map' or titleDescriptor == 'Search' or titleDescriptor == 'Share'}">
        <script src="/js/lightgallery.min.js"></script>
        <script src="/js/lg-video.min.js"></script>
        <script src="/js/lg-zoom.min.js"></script>
        <script src="/js/lg-relative-caption.min.js"></script>
        <link href="/css/lightgallery.min.css" rel="stylesheet">
        <link href="/css/lg-video.min.css" rel="stylesheet">
        <link href="/css/lg-zoom.min.css" rel="stylesheet">
        <link href="/css/lg-relative-caption.min.css" rel="stylesheet">
    </th:block>
    <th:block th:if="${titleDescriptor == 'Scan' or titleDescriptor == 'Match'}">
        <script src="/js/stomp.min.js"></script>
        <script src="/js/sockjs.min.js"></script>
    </th:block>
    <th:block th:if="${titleDescriptor == 'Map'}">
        <script src="/js/ol.js"></script>
        <link href="/css/ol.css" rel="stylesheet">
    </th:block>
</head>
<body></body>
</html>
