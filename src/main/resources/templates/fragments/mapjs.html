<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body th:fragment="mapjs(mapdata)">
<div th:replace="fragments/appjs :: appjs()"></div>

<script type="text/javascript">
    $(document).ready(function() {
        /*<![CDATA[*/
        var mapdata = JSON.parse(decodeHtml("[[${mapdata}]]"));
        /*]]>*/

        var mapView = new ol.View({
            center: ol.proj.fromLonLat([-73.1234, 45.678]),
            zoom: 2
        });
        if ("lat" in localStorage && "lng" in localStorage) {
            mapView = new ol.View({
                center: ol.proj.fromLonLat([localStorage.getItem("lng"), localStorage.getItem("lat")]),
                zoom: 20
            });
            localStorage.removeItem('lat');
            localStorage.removeItem('lng');
        }
        const lightGalleryConfigs = getLightGalleryConfigs();
        lightGalleryConfigs["controls"] = false;
        lightGalleryConfigs["dynamic"] = true;
        const $dynamicGallery = document.getElementById('light-gallery-photo');
        var dynamicGallery = lightGallery($dynamicGallery, lightGalleryConfigs);

        var map = new ol.Map({
            target: 'map',
            layers: [
                new ol.layer.Tile({
                    source: new ol.source.OSM()
                })
            ],
            view: mapView
        });

        var iconFeatures = [];

        for (index in mapdata) {
            var data = mapdata[index];

            if (data["lat"] !== null && data["lng"] !== null &&
                data["lat"] !== "" && data["lng"] !== "") {
                var lat = data["lat"];
                var lng = data["lng"];

                var year = data["year"];
                var month = data["month"];
                var day = data["day"];
                var fileName = data["fileName"];
                var mapMarkerUrl = data["mapMarkerUrl"];
                var thumbnailUrlOriginal = data["thumbnailUrlOriginal"];
                var thumbnailUrlSmall = data["thumbnailUrlSmall"];
                var videoUrl = data["videoUrl"];
                var type = data["type"];
                var placeName = data["placeName"];
                var metadataId = data["id"];

                var iconFeature = new ol.Feature({
                    geometry: new ol.geom.Point(ol.proj.transform([lng, lat], 'EPSG:4326', 'EPSG:900913')),
                    fileName: fileName,
                    thumbnailUrlSmall: thumbnailUrlSmall,
                    photoUrl: thumbnailUrlOriginal,
                    videoUrl: videoUrl,
                    year: year,
                    month: month,
                    day: day,
                    placeName: placeName,
                    metadataId: metadataId,
                    lat: lat,
                    lng: lng,
                    type: type
                });
                var iconStyle = new ol.style.Style({
                    image: new ol.style.Icon(({
                        anchor: [0.5, 46],
                        anchorXUnits: 'fraction',
                        anchorYUnits: 'pixels',
                        opacity: 1.0,
                        src: mapMarkerUrl
                    }))
                });
                iconFeature.setStyle(iconStyle);
                iconFeatures.push(iconFeature);
            }
        }

        if (iconFeatures.length > 0) {
            var vectorSource = new ol.source.Vector({
                features: iconFeatures //add an array of features
            });
            var layer = new ol.layer.Vector({
                source: vectorSource
            });
            map.addLayer(layer);
        }

        map.on("click", function (e) {
            // Return first feature
            const feature = map.forEachFeatureAtPixel(e.pixel, function (feature) {
                return feature;
            });

            if (typeof feature !== 'undefined' && feature.getProperties) {
                var featureProperties = feature.getProperties();
                // console.log(featureProperties);

                let dateString = getDateString(featureProperties["year"], featureProperties["month"], featureProperties["day"]);

                var mediaContent = {}
                if (featureProperties.type.includes("image")) {
                    mediaContent = {
                        src: featureProperties.photoUrl,
                        subHtml: (featureProperties.placeName !== null ? featureProperties.placeName : "") + '&nbsp;&nbsp;<a class="bi-pencil" href="javascript:editLocation(\''+featureProperties["metadataId"]+'\',\''+featureProperties["lat"]+'\',\''+featureProperties["lng"]+'\')"></a><br>' + featureProperties.fileName + (dateString !== "" ? ' taken on ' + dateString : '')
                    }
                } else if (featureProperties.type.includes("video")) {
                    mediaContent = {
                        video: {
                            "source": [{"src": featureProperties.videoUrl, "type": "video/mp4"}],
                            "attributes": {"preload": false, "controls": true}
                        },
                        subHtml: (featureProperties.placeName !== null ? featureProperties.placeName : "") + '&nbsp;&nbsp;<a class="bi-pencil" href="javascript:editLocation(\''+featureProperties["metadataId"]+'\',\''+featureProperties["lat"]+'\',\''+featureProperties["lng"]+'\')"></a><br>' + featureProperties.fileName + (dateString !== "" ? ' taken on ' + dateString : '')
                    }
                }

                dynamicGallery.destroy();
                lightGalleryConfigs["dynamicEl"] = [
                    mediaContent
                ];
                setTimeout(() => {
                    dynamicGallery = lightGallery($dynamicGallery, lightGalleryConfigs);
                    dynamicGallery.openGallery(0);
                }, 500);
            }
        });

        map.on("pointermove", function (evt) {
            var hit = this.forEachFeatureAtPixel(evt.pixel, function () {
                return true;
            });
            if (hit) {
                this.getTargetElement().style.cursor = 'pointer';
            } else {
                this.getTargetElement().style.cursor = '';
            }
        });

        function decodeHtml(html) {
            var txt = document.createElement("textarea");
            txt.innerHTML = html;
            return txt.value;
        }

        $("#propMetadataLocation").on('hide.bs.modal', function (e) {
            $(this).find(':input').val('');
            $("#locationMapResponseMsg").html("");
        })

        $("#saveMetadata").click(function (e) {
            e.preventDefault();
            let metadataIdList = [];
            metadataIdList.push($("#mapMetadataId").val());

            var data = {
                "batchMetadataIds": JSON.stringify(metadataIdList),
                "latlngBatchData": $("#locationDataInput").val()
            }

            const posting = $.post({
                url: "/timeline/update/batch",
                data: JSON.stringify(data),
                contentType: 'application/json; charset=utf-8'
            });

            posting.done(function (data) {
                if (data.hasOwnProperty("status") && data.hasOwnProperty("msg")) {
                    let message = "Error";
                    if (data["status"] === "success") {
                        message = '<div class="alert alert-success" role="alert">' + data["msg"] + '</div>';
                        var latlng = $("#locationDataInput").val();
                        var latlngArray = latlng.split(",");
                        var lat = latlngArray[0].trim();
                        var lng = latlngArray[1].trim();
                        map.getView().setCenter(ol.proj.transform([lng, lat], 'EPSG:4326', 'EPSG:900913'));
                        map.getView().setZoom(15);
                        localStorage.setItem("lat", lat);
                        localStorage.setItem("lng", lng);

                        window.top.location = window.top.location
                    } else {
                        message = '<div class="alert alert-danger" role="alert">' + data["msg"] + '</div>';
                    }
                    $("#locationMapResponseMsg").html(message);
                }
            });

        });
    });
</script>

<div class="modal fade" id="propMetadataLocation" tabindex="-1" role="dialog" aria-labelledby="labelMetadata" aria-hidden="true">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="editPhotoModalLabel">Edit Location <span id="editPhotoLocationModalLabel"></span></h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <form id="saveData">
                    <div class="form-group row">
                        <div class="col-sm">
                            <label for="locationDataInput" class="col-form-label">Edit Location</label>
                            <div class="input-group">
                                <input type="text" class="form-control" aria-label="Tag Location" id="locationDataInput" name="locationDataInput" value="">
                                <input type="hidden" id="mapMetadataId" name="mapMetadataId" value="">
                            </div>
                        </div>
                    </div>
                </form>
                <div class="col-sm">
                    <span id="locationMapResponseMsg"></span>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" id="saveMetadata">Save</button>
                <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
            </div>
        </div>
    </div>
</div>

</body>
</html>
