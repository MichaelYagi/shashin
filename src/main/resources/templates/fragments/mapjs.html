<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body th:fragment="mapjs(mapdata)">
<div th:replace="fragments/appjs :: appjs()"></div>

<script type="text/javascript">
    $(document).ready(function() {
        /*<![CDATA[*/
        var mapdata = JSON.parse(decodeHtml("[[${mapdata}]]"));
        /*]]>*/

        const textFill = new ol.style.Fill({
            color: '#fff',
        });
        const textStroke = new ol.style.Stroke({
            color: 'rgba(0, 0, 0, 0.6)',
            width: 5,
        });
        const invisibleFill = new ol.style.Fill({
            color: 'rgba(255, 255, 255, 0.01)',
        });

        function createMapStyle(feature) {
            const mapMarkerUrl = feature.get('mapMarkerUrl');
            
            return new ol.style.Style({
                geometry: feature.getGeometry(),
                image: new ol.style.Icon(({
                    anchor: [0.5, 46],
                    anchorXUnits: 'fraction',
                    anchorYUnits: 'pixels',
                    opacity: 1.0,
                    src: mapMarkerUrl
                }))
            });
        }

        let maxFeatureCount;
        let vector = null;
        const calculateClusterInfo = function (resolution) {
            maxFeatureCount = 0;
            const features = vector.getSource().getFeatures();
            let feature, radius;

            // Sort by number of features for radius calculation
            features.sort((a, b) => a.get('features').length > b.get('features').length ? 1 : -1);

            // console.log("============================================");
            // console.log("number of features:"+features.length);

            for (let i = features.length - 1; i >= 0; --i) {
                feature = features[i];
                const originalFeatures = feature.get('features');
                const extent = ol.extent.createEmpty();
                let j, jj;
                for (j = 0, jj = originalFeatures.length; j < jj; ++j) {
                    ol.extent.extend(extent, originalFeatures[j].getGeometry().getExtent());
                }
                maxFeatureCount = Math.max(maxFeatureCount, jj);

                //radius = (0.45 * (ol.extent.getWidth(extent) + ol.extent.getHeight(extent))) / resolution;
                radius = (15 * ((maxFeatureCount + jj)/maxFeatureCount));

                // console.log("---------------------------");
                // console.log("originalRadius:"+(0.45 * (ol.extent.getWidth(extent) + ol.extent.getHeight(extent))) / resolution);
                // console.log("extentWidth:"+ol.extent.getWidth(extent));
                // console.log("extentHeight:"+ol.extent.getHeight(extent));
                // console.log("resolution:"+resolution);
                // console.log("Feature count:"+jj);
                // console.log("maxFeatureCount:"+maxFeatureCount);
                // console.log("radius: " + radius);

                feature.set('radius', radius);
            }
        };

        let currentResolution;
        function styleFunction(feature, resolution) {
            if (resolution !== currentResolution) {
                calculateClusterInfo(resolution);
                currentResolution = resolution;
            }
            let style;
            const size = feature.get('features').length;
            if (size > 1) {
                style = new ol.style.Style({
                    image: new ol.style.Circle({
                        radius: feature.get('radius'),
                        fill: new ol.style.Fill({
                            color: [0, 77, 255, Math.min(0.8, 0.4 + size / maxFeatureCount)],
                        }),
                    }),
                    text: new ol.style.Text({
                        text: size.toString(),
                        fill: textFill,
                        stroke: textStroke,
                        scale: 1.5
                    }),
                });
            } else {
                const originalFeature = feature.get('features')[0];
                style = createMapStyle(originalFeature);
            }
            return style;
        }

        function selectStyleFunction(feature) {
            // Return first map marker
            const styles = [
                new ol.style.Style({
                    image: new ol.style.Circle({
                        radius: feature.get('radius'),
                        fill: invisibleFill,
                    }),
                }),
            ];
            const originalFeatures = feature.get('features');
            let originalFeature = originalFeatures[originalFeatures.length-1];
            styles.push(createMapStyle(originalFeature));

            // Show gallery for each cluster
            var mediaContentList = [];
            for (let i = originalFeatures.length - 1; i >= 0; --i) {
                var featureProperties = originalFeatures[i].getProperties();
                let dateString = getDateString(featureProperties["year"], featureProperties["month"], featureProperties["day"]);

                var mediaContent = {}
                if (featureProperties.type.includes("image")) {
                    mediaContent = {
                        src: featureProperties.photoUrl,
                        subHtml: (featureProperties.placeName !== null ? featureProperties.placeName : "") + '&nbsp;&nbsp;<a class="bi-pencil" href="javascript:editLocation(\''+featureProperties["metadataId"]+'\',\''+featureProperties["lat"]+'\',\''+featureProperties["lng"]+'\')"></a><br>' + featureProperties.fileName + (dateString !== "" ? ' taken on ' + dateString : '')
                    }
                } else if (featureProperties.type.includes("video")) {
                    mediaContent = {
                        video: {
                            "source": [{"src": featureProperties.videoUrl, "type": "video/mp4"}],
                            "attributes": {"preload": false, "controls": true}
                        },
                        subHtml: (featureProperties.placeName !== null ? featureProperties.placeName : "") + '&nbsp;&nbsp;<a class="bi-pencil" href="javascript:editLocation(\''+featureProperties["metadataId"]+'\',\''+featureProperties["lat"]+'\',\''+featureProperties["lng"]+'\')"></a><br>' + featureProperties.fileName + (dateString !== "" ? ' taken on ' + dateString : '')
                    }
                }
                mediaContentList.push(mediaContent);
            }

            // Destroy gallery instance hack
            dynamicGallery.closeGallery(true);
            dynamicGallery.destroyModules(true);
            dynamicGallery.invalidateItems();
            $(window).off(`.lg.global${dynamicGallery.lgId}`);
            dynamicGallery.LGel.off('.lg');
            setTimeout(() => {
                // https://github.com/sachinchoolur/lightGallery/blob/383d51852657ab44bb8697748c570cf110723f97/src/lightgallery.ts#L2396
                // Hack because lg.destroy() errors out
                // when photos appear slower than destroy called, then there's an error
                try {
                    dynamicGallery.$container.remove();
                } catch(e) {
                    console.log(e);
                }
                lightGalleryConfigs["dynamicEl"] = mediaContentList;
                dynamicGallery = lightGallery($dynamicGallery, lightGalleryConfigs);
                dynamicGallery.openGallery(0);
            }, 500);

            return styles;
        }

        var mapView = new ol.View({
            center: ol.proj.fromLonLat([-73.1234, 45.678]),
            zoom: 2
        });
        if ("lat" in localStorage && "lng" in localStorage) {
            mapView = new ol.View({
                center: ol.proj.fromLonLat([localStorage.getItem("lng"), localStorage.getItem("lat")]),
                zoom: 20
            });
            localStorage.removeItem('lat');
            localStorage.removeItem('lng');
        }
        const lightGalleryConfigs = getLightGalleryConfigs();
        lightGalleryConfigs["controls"] = false;
        lightGalleryConfigs["dynamic"] = true;
        lightGalleryConfigs["counter"] = true;
        const $dynamicGallery = document.getElementById('light-gallery-photo');
        var dynamicGallery = lightGallery($dynamicGallery, lightGalleryConfigs);

        var map = new ol.Map({
            target: 'map',
            layers: [
                new ol.layer.Tile({
                    source: new ol.source.OSM()
                    // visible: true,
                    // preload: Infinity,
                    // source: new ol.source.BingMaps({
                    //     key: 'AgLAysLWWJdjeVeOTVUYlNfUddxeF6QFeXCciHblaYSG7xYx3OUuAnpX98MNQUFR', // Dev/Test
                    //     imagerySet: 'RoadOnDemand', // 'Aerial', 'RoadOnDemand', 'AerialWithLabels', etc.
                    //     // use maxZoom 19 to see stretched tiles instead of the Bing Maps
                    //     // "no photos at this zoom level" tiles
                    //     maxZoom: 19
                    // })
                })
            ],
            interactions: ol.interaction.defaults().extend([
                new ol.interaction.Select({
                    condition: function (evt) {
                        return evt.type === 'singleclick';
                    },
                    style: selectStyleFunction,
                }),
            ]),
            view: mapView
        });
        const zoomSlider = new ol.control.ZoomSlider();
        map.addControl(zoomSlider);

        var iconFeatures = [];

        for (index in mapdata) {
            var data = mapdata[index];

            if (data["lat"] !== null && data["lng"] !== null &&
                data["lat"] !== "" && data["lng"] !== "") {
                var lat = data["lat"];
                var lng = data["lng"];

                var year = data["year"];
                var month = data["month"];
                var day = data["day"];
                var fileName = data["fileName"];
                var mapMarkerUrl = data["mapMarkerUrl"];
                var thumbnailUrlOriginal = data["thumbnailUrlOriginal"];
                var thumbnailUrlSmall = data["thumbnailUrlSmall"];
                var videoUrl = data["videoUrl"];
                var type = data["type"];
                var placeName = data["placeName"];
                var metadataId = data["id"];

                var iconFeature = new ol.Feature({
                    geometry: new ol.geom.Point(ol.proj.transform([lng, lat], 'EPSG:4326', 'EPSG:900913')),
                    fileName: fileName,
                    thumbnailUrlSmall: thumbnailUrlSmall,
                    photoUrl: thumbnailUrlOriginal,
                    mapMarkerUrl: mapMarkerUrl,
                    videoUrl: videoUrl,
                    year: year,
                    month: month,
                    day: day,
                    placeName: placeName,
                    metadataId: metadataId,
                    lat: lat,
                    lng: lng,
                    type: type,
                    name: fileName
                });
                var iconStyle = new ol.style.Style({
                    image: new ol.style.Icon(({
                        anchor: [0.5, 46],
                        anchorXUnits: 'fraction',
                        anchorYUnits: 'pixels',
                        opacity: 1.0,
                        src: mapMarkerUrl
                    }))
                });
                iconFeature.setStyle(iconStyle);
                iconFeatures.push(iconFeature);
            }
        }

        if (iconFeatures.length > 0) {
            var vectorSource = new ol.source.Vector({
                features: iconFeatures //add an array of features
            });
            var clusterSource = new ol.source.Cluster({
                distance: 40,
                source: vectorSource,
            })
            vector = new ol.layer.Vector({
                source: clusterSource,
                style: styleFunction
            });
            map.addLayer(vector);
        }

        map.on("pointermove", function (evt) {
            var hit = this.forEachFeatureAtPixel(evt.pixel, function () {
                return true;
            });
            if (hit) {
                this.getTargetElement().style.cursor = 'pointer';
            } else {
                this.getTargetElement().style.cursor = '';
            }
        });

        function decodeHtml(html) {
            var txt = document.createElement("textarea");
            txt.innerHTML = html;
            return txt.value;
        }

        $("#propMetadataLocation").on('hide.bs.modal', function (e) {
            $(this).find(':input').val('');
            $("#locationMapResponseMsg").html("");
        })

        $("#saveMetadata").click(function (e) {
            e.preventDefault();
            let metadataIdList = [];
            metadataIdList.push($("#mapMetadataId").val());

            var data = {
                "batchMetadataIds": JSON.stringify(metadataIdList),
                "latlngBatchData": $("#locationDataInput").val()
            }

            const posting = $.post({
                url: "/timeline/update/batch",
                data: JSON.stringify(data),
                contentType: 'application/json; charset=utf-8'
            });

            posting.done(function (data) {
                if (data.hasOwnProperty("status") && data.hasOwnProperty("msg")) {
                    let message = "Error";
                    if (data["status"] === "success") {
                        message = '<div class="alert alert-success" role="alert">' + data["msg"] + '</div>';
                        var latlng = $("#locationDataInput").val();
                        var latlngArray = latlng.split(",");
                        var lat = latlngArray[0].trim();
                        var lng = latlngArray[1].trim();
                        localStorage.setItem("lat", lat);
                        localStorage.setItem("lng", lng);

                        window.top.location = window.top.location
                    } else {
                        message = '<div class="alert alert-danger" role="alert">' + data["msg"] + '</div>';
                    }
                    $("#locationMapResponseMsg").html(message);
                }
            });

        });
    });
</script>

<div class="modal fade" id="propMetadataLocation" tabindex="-1" role="dialog" aria-labelledby="labelMetadata" aria-hidden="true">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="editPhotoModalLabel">Edit Location <span id="editPhotoLocationModalLabel"></span></h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <form id="saveData">
                    <div class="form-group row">
                        <div class="col-sm">
                            <label for="locationDataInput" class="col-form-label">Edit Location</label>
                            <div class="input-group">
                                <input type="text" class="form-control" aria-label="Tag Location" id="locationDataInput" name="locationDataInput" value="">
                                <input type="hidden" id="mapMetadataId" name="mapMetadataId" value="">
                            </div>
                        </div>
                    </div>
                </form>
                <div class="col-sm">
                    <span id="locationMapResponseMsg"></span>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" id="saveMetadata">Save</button>
                <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
            </div>
        </div>
    </div>
</div>

</body>
</html>
