<!DOCTYPE html>
<html th:lang="${locale}" xmlns:th="http://www.thymeleaf.org">
<body th:fragment="infosidebar(${currentUser})">

<div class="offcanvas offcanvas-end" tabindex="-1" id="propInfoSidebar" aria-labelledby="offcanvasMenuLabel">
    <div class="offcanvas-header text-break">
        <h5 class="offcanvas-title" id="exampleSidebarLabel"><button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" id="offcanvasInfoSidebarCloseButton" aria-label="Close"></button><br>Viewing &ldquo;<span id="infoSidebarTitle"></span>&rdquo;<div id="propInfoSidebarThumbnail"></div></h5>
    </div>
    <hr>
    <div class="offcanvas-body" style="word-wrap: break-word;">
        <div th:replace="~{fragments/detailsinfo :: detailsinfo(${currentUser})}"></div>
    </div>
</div>

<script type="text/javascript" th:nonce="${cspNonce}">
    $(document).ready(function () {

        $(document).on("click", function (event) {
            const $target = $(event.target);
            if (!$target.closest('#propInfoSidebar').length &&
                !$target.closest('.bi-info-circle.lg-icon').length &&
                $("#propInfoSidebar").css("visibility") === "visible") {
                $("#offcanvasInfoSidebarCloseButton").click();
            }
        });

        $('#propInfoSidebar').on('hide.bs.offcanvas', function () {
            if (shashin.map !== null) {
                // Set map target to null and reset
                shashin.map.setTarget(null);
                shashin.map = null;
            }

            if (shashin.layer !== null) {
                shashin.layer.getSource().clear();
            }

            $("#headerMap").remove();
        });
    });
</script>
</body>
</html>
