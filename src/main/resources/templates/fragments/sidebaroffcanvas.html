<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body th:fragment="sidebaroffcanvas(activeSidebar,authority)">

<div class="offcanvas offcanvas-start" data-bs-scroll="true" tabindex="-1" id="offcanvasMenu" aria-labelledby="offcanvasMenuLabel">
    <div class="offcanvas-header">
        <a class="d-flex align-items-center col-lg-4 mb-2 mb-lg-0 link-dark text-decoration-none" th:href="${authority == 'ROLE_ADMIN' ? '/timeline/mediatype/all' : '/albums'}">
            <span class="lead" style="font-size: medium">Shashin</span>
        </a>
        <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body">
        <ul class="nav nav-pills flex-column mb-auto">
            <th:block th:if="${authority == 'ROLE_ADMIN'}">
                <li class="nav-item">
                    <a th:attr="class='nav-link' + ${activeSidebar=='timeline' ? ' active' : ''}" href="/timeline/mediatype/all">
                        <span class="bi-calendar4" style="font-size: 1rem;"></span> Timeline
                    </a>
                </li>
            </th:block>
            <li class="nav-item">
                <a th:attr="class='nav-link' + ${activeSidebar=='albums' or activeSidebar=='album'? ' active' : ''}" href="/albums">
                    <span class="bi-images" style="font-size: 1rem;"></span> Albums
                </a>
            </li>
            <li class="nav-item">
                <a th:attr="class='nav-link' + ${activeSidebar=='people' or activeSidebar=='person' or activeSidebar=='matches' ? ' active' : ''}" href="/people">
                    <span class="bi-person-square" style="font-size: 1rem;"></span> People
                </a>
            </li>
            <li class="nav-item">
                <a th:attr="class='nav-link' + ${activeSidebar=='map' ? ' active' : ''}" href="/map">
                    <span class="bi-map" style="font-size: 1rem;"></span> Map
                </a>
            </li>
            <th:block th:if="${authority == 'ROLE_ADMIN'}">
                <li class="nav-item">
                    <a th:attr="class='nav-link' + ${activeSidebar=='favorites' ? ' active' : ''}" href="/favorites">
                        <span class="bi-suit-heart" style="font-size: 1rem;"></span> Favorites
                    </a>
                </li>
                <li class="nav-item">
                    <a th:attr="class='nav-link' + ${activeSidebar=='settings' or activeSidebar=='scan' or activeSidebar=='users' or activeSidebar=='match' or activeSidebar=='logs' ? ' active' : ''}" href="/settings">
                        <span class="bi-wrench" style="font-size: 1rem;"></span> Settings
                    </a>
                </li>
                <li class="nav-item">
                    <a th:attr="class='nav-link' + ${activeSidebar=='trash' ? ' active' : ''}" href="/trash">
                        <span class="bi-trash" style="font-size: 1rem;"></span> Trash
                    </a>
                </li>
            </th:block>
        </ul>
    </div>
</div>

</body>
</html>
