<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body th:fragment="timelinejs()">
<script type="text/javascript">
    function activateMetadataListeners(rawMetadata) {
        var metadata = JSON.parse(decodeHtml(rawMetadata));
        // console.log(metadata.id);

        $("#favorite"+metadata.id).click(function (e) {
            e.preventDefault();

            var metadataId = metadata.id;

            if ($("#bricon" + metadataId).attr("class") === "bi-suit-heart") {
                $("#bricon" + metadataId).attr("class", "bi-suit-heart-fill");
            } else if ($("#bricon" + metadataId).attr("class") === "bi-suit-heart-fill") {
                $("#bricon" + metadataId).attr("class", "bi-suit-heart");
            }

            var isFavorite = ($("#bricon" + metadataId).attr("class") === "bi-suit-heart-fill");

            var json = {metadataId: metadataId, isFavorite: isFavorite}
            var posting;

            if (isFavorite === true) {
                posting = $.post({
                    url: "/favorite/save",
                    data: JSON.stringify(json),
                    contentType: 'application/json; charset=utf-8'
                });
            } else {
                posting = $.post({
                    url: "/favorite/delete",
                    data: JSON.stringify(json),
                    contentType: 'application/json; charset=utf-8'
                });
            }

            posting.done(function (data) {
                if (data.hasOwnProperty("status") && data.hasOwnProperty("msg")) {
                    // console.log(data["status"]);
                    // console.log(data["msg"]);
                }
            });

            return false;
        });

        $("#select"+metadata.id).click(function (e) {
            e.preventDefault();

            if ($("#tlicon"+metadata.id).attr("class") === "bi-circle") {
                $("#tlicon"+metadata.id).addClass('bi-circle-fill').removeClass('bi-circle');
                $("#image"+metadata.id).css("opacity", 0.3);
                $("#tncentered"+metadata.id).css("display", "none");
                $("#tnbl"+metadata.id).css("display", "none");
            } else {
                $("#tlicon"+metadata.id).addClass('bi-circle').removeClass('bi-circle-fill');
                $("#image"+metadata.id).css("opacity", 1.0);
                $("#tncentered"+metadata.id).css("display", "block");
                $("#tnbl"+metadata.id).css("display", "block");
            }

            if ($('.bi-circle-fill')[0] || $(this).attr("class") === "bi-circle-fill") {
                $("#appSearch").css("display", "none");
                $("#timelineAppTools").css("display", "block");

                // Hide all center and bottom left icons
                $('.thumbnail-bl').hide();
                $('.thumbnail-centered').hide();
            } else {
                $("#appSearch").css("display", "block");
                $("#timelineAppTools").css("display", "none");
                $("#albumAppTools").css("display", "none");
            }
        });

        $("#image"+metadata.id).click(function (e) {
            e.preventDefault();

            // Fill top left icon when clicking anywhere on thumbnail
            if ($('.bi-circle-fill')[0]) {
                if ($("#tlicon"+metadata.id).attr("class") === "bi-circle-fill") {
                    $("#tlicon"+metadata.id).addClass('bi-circle').removeClass('bi-circle-fill');
                } else {
                    $("#tlicon"+metadata.id).addClass('bi-circle-fill').removeClass('bi-circle');
                }
            }

            if ($('.bi-circle-fill')[0] || $(this).attr("class") === "bi-circle-fill") {
                $("#appSearch").css("display", "none");
                $("#timelineAppTools").css("display", "block");

                // Hide all center and bottom left icons
                $('.thumbnail-bl').hide();
                $('.thumbnail-centered').hide();
            } else {
                $("#appSearch").css("display", "block");
                $("#timelineAppTools").css("display", "none");
                $("#albumAppTools").css("display", "none");
            }
        });

        $("#image"+metadata.id).hover(function () {
            $(this).css("opacity", 0.3);
            $(this).siblings().css("display", "block");
            if ($("#tlicon"+metadata.id).attr("class") === "bi-circle-fill") {
                $("#tncentered"+metadata.id).css("display", "none");
                $("#tnbl"+metadata.id).css("display", "none");
            }
            if ($('.bi-circle-fill')[0] || $(this).attr("class") === "bi-circle-fill") {
                $('.thumbnail-bl').hide();
                $('.thumbnail-centered').hide();
            }
        }, function () {
            if ($("#tlicon"+metadata.id).attr("class") !== "bi-circle-fill") {
                $(this).css("opacity", 1.0);
                $(this).siblings(".thumbnail-tl").css("display", "none");
                $(this).siblings(".thumbnail-bl").css("display", "none");
                $(this).siblings(".thumbnail-centered").css("display", "none");
            } else {
                if ($('.bi-circle-fill')[0] || $(this).attr("class") === "bi-circle-fill") {
                    $('.thumbnail-bl').hide();
                    $('.thumbnail-centered').hide();
                }
                $("#tncentered"+metadata.id).css("display", "none");
                $("#tnbl"+metadata.id).css("display", "none");
            }
        });

        $("#tncentered"+metadata.id).hover(function () {
            $('#currentlat').val(metadata.lat);
            $('#currentlng').val(metadata.lng);
            $('#currentfilename').val(metadata.fileName);
            $('.bi-play-circle').css("color", "darkorange");
            $(this).css("display", "block");
            $(this).siblings(".thumbnail-tl").css("display", "block");
            $(this).siblings(".thumbnail-bl").css("display", "block");
            $(this).siblings(".photo-thumbnail-image").css("opacity", 0.3);
            if ($('.bi-circle-fill')[0] || $(this).attr("class") === "bi-circle-fill") {
                $('.thumbnail-bl').hide();
                $('.thumbnail-centered').hide();
            }
        }, function () {
            $('.bi-play-circle').css("color", "lightgray");
            $(this).css("display", "none");
            $(this).siblings(".thumbnail-tl").css("display", "none");
            $(this).siblings(".thumbnail-bl").css("display", "none");
            $(this).siblings(".photo-thumbnail-image").css("opacity", 1.0);
        });

        $("#tntl"+metadata.id).hover(function () {
            if ($("#tlicon"+metadata.id).attr("class") !== "bi-circle-fill") {
                $(this).css("display", "block");
                $(this).siblings(".thumbnail-centered").css("display", "block");
                $(this).siblings(".thumbnail-bl").css("display", "block");
                $(this).siblings(".photo-thumbnail-image").css("opacity", 0.3);
                if ($('.bi-circle-fill')[0] || $(this).attr("class") === "bi-circle-fill") {
                    $('.thumbnail-bl').hide();
                    $('.thumbnail-centered').hide();
                }
            }
        }, function () {
            $(this).css("display", "none");
            $(this).siblings(".thumbnail-centered").css("display", "none");
            $(this).siblings(".thumbnail-bl").css("display", "none");
            $(this).siblings(".photo-thumbnail-image").css("opacity", 1.0);
        });

        $("#tnbl"+metadata.id).hover(function () {
            $(this).css("display", "block");
            $(this).siblings(".thumbnail-tl").css("display", "block");
            $(this).siblings(".thumbnail-centered").css("display", "block");
            $(this).siblings(".photo-thumbnail-image").css("opacity", 0.3);
            if ($('.bi-circle-fill')[0] || $(this).attr("class") === "bi-circle-fill") {
                $('.thumbnail-bl').hide();
                $('.thumbnail-centered').hide();
            }
        }, function () {
            $(this).css("display", "none");
            $(this).siblings(".thumbnail-tl").css("display", "none");
            $(this).siblings(".thumbnail-centered").css("display", "none");
            $(this).siblings(".photo-thumbnail-image").css("opacity", 1.0);
        });

        $("#tntr"+metadata.id).hover(function () {
            $("#image"+metadata.id).css("opacity", 0.3);
            if ($("#tlicon"+metadata.id).attr("class") === "bi-circle-fill") {
                $("#tntl"+metadata.id).css("display", "block");
                $("#tnbl"+metadata.id).css("display", "none");
                $("#tncentered"+metadata.id).css("display", "none");
            } else {
                $("#tncentered"+metadata.id).css("display", "block");
                $("#tntl"+metadata.id).css("display", "block");
                $("#tnbl"+metadata.id).css("display", "block");
            }
            if ($('.bi-circle-fill')[0] || $(this).attr("class") === "bi-circle-fill") {
                $('.thumbnail-bl').hide();
                $('.thumbnail-centered').hide();
            }
        });

        $("#tntr"+metadata.id).hover(function () {
            $("#image"+metadata.id).css("opacity", 0.3);
            if ($("#tlicon"+metadata.id).attr("class") === "bi-circle-fill") {
                $("#tntl"+metadata.id).css("display", "block");
                $("#tnbl"+metadata.id).css("display", "none");
                $("#tncentered"+metadata.id).css("display", "none");
            } else {
                $("#tncentered"+metadata.id).css("display", "block");
                $("#tntl"+metadata.id).css("display", "block");
                $("#tnbl"+metadata.id).css("display", "block");
            }
            if ($('.bi-circle-fill')[0] || $(this).attr("class") === "bi-circle-fill") {
                $('.thumbnail-bl').hide();
                $('.thumbnail-centered').hide();
            }
        });
    }

    function updateTimeline(
        nextPage,
        lastYearTaken,
        lastMonthTaken,
        lastDayTaken,
        lastDateTakenHeading
    ) {
        // console.log(lastYearTaken);
        // console.log(lastMonthTaken);
        // console.log(lastDayTaken);
        // console.log("nextPage:"+nextPage);

        // Get paged results
        const posting = $.get({
            url: "/timeline/"+nextPage,
            contentType: 'application/json; charset=utf-8'
        });

        posting.done(function (data) {
            if (data.hasOwnProperty("status") && data.hasOwnProperty("msg")) {
                let message = "Error";
                if (data["status"] === "success") {
                    if (data.hasOwnProperty("metadataList") && data.hasOwnProperty("favorites") && data.hasOwnProperty("albumList")) {
                        var metadataList = data["metadataList"] === "" ? null : data["metadataList"];
                        var favoritesList = data["favorites"] === "" ? null : data["favorites"];
                        var albumList = data["albumList"] === "" ? null : data["albumList"];

                        // console.log(favoritesList);
                        // console.log(albumList);
                        var html = "";
                        var undatedCount = 0;
                        lastYearTaken = lastYearTaken !== "" ? parseInt(lastYearTaken) : 0;
                        lastMonthTaken = lastMonthTaken !== "" ? parseInt(lastMonthTaken) : 0;
                        lastDayTaken = lastDayTaken !== "" ? parseInt(lastDayTaken) : 0;


                        for (var index in metadataList) {
                            var metadata = metadataList[index];
                            var currentDateTaken = metadata["year"]+"-"+metadata["month"]+"-"+metadata["day"];

                            // console.log(lastDateTakenHeading);
                            // console.log(currentDateTaken);
                            //
                            // console.log(lastYearTaken);
                            // console.log(lastMonthTaken);
                            // console.log(lastDayTaken);
                            //
                            // console.log(metadata["year"]);
                            // console.log(metadata["month"]);
                            // console.log(metadata["day"]);

                            var appended = false;

                            // Undated
                            if (metadata["year"] === null ||
                                metadata["month"] === null ||
                                metadata["day"] === null)
                            {
                                // console.log("undated");
                                if (undatedCount > 0 || $('#undatedTimelinePhotos').length > 0) {
                                    // Append
                                    appended = true;
                                    // console.log("appended");
                                } else {
                                    // Create new
                                    html += '<br><p id="undatedTimelinePhotos"><strong>Undated</strong></p>\n' +
                                        '<div class="row">\n';
                                    // console.log("new");
                                }
                                undatedCount++;
                            } else if (lastYearTaken === metadata["year"] && // Append (test: 1st photo set has 10 photos within date)
                                lastMonthTaken === metadata["month"] &&
                                lastDayTaken === metadata["day"] &&
                                lastDateTakenHeading === currentDateTaken)
                            {
                                // console.log("append date");
                                appended = true;
                            } else { // New date div
                                // console.log("new date");
                                let date = new Date(metadata["year"], metadata["month"], metadata["day"]);
                                let dayOfWeek = getShortDay(date.getDay());
                                let shortMonth = getShortMonths(date.getMonth());
                                let day = ('0' + date.getDate()).slice(-2);
                                let dateString = dayOfWeek+", "+shortMonth+" "+day+", "+metadata["year"];

                                html += '<br><p><strong>'+dateString+'</strong></p>\n' +
                                    '<span style="display: none;" class="dateTakenHeading">'+metadata["year"]+'-'+metadata["month"]+'-'+metadata["day"]+'</span>\n' +
                                    '<div class="row">\n' +
                                    '<span style="display: none;" class="yearTaken">'+metadata["year"]+'</span>\n' +
                                    '<span style="display: none;" class="monthTaken">'+metadata["month"]+'</span>\n' +
                                    '<span style="display: none;" class="dayTaken">'+metadata["day"]+'</span>\n';
                            }

                            html += '<div class="photo-thumbnail-container photo-thumbnail">\n' +
                                    '   <img src="'+metadata.thumbnailUrlSmall+'" class="photo-thumbnail-image" id="image'+metadata.id+'">\n' +
                                    '   <input type="hidden" name="filename'+metadata.id+'" id="filename'+metadata.id+'" value="'+metadata.fileName+'">\n';
                            if (metadata.type.includes("video")) {
                                html +=
                                    '   <div class="thumbnail-tr" id="tntr'+metadata.id+'">\n' +
                                    '       <span class="bi-camera-video-fill" style="font-size: 1rem;color: lightcoral;"></span>\n' +
                                    '   </div>\n';
                            }
                            var favoriteIcon = favoritesList[metadata.id] === true ? 'bi-suit-heart-fill' : 'bi-suit-heart';
                            html += '   <div class="thumbnail-tl" id="tntl'+metadata.id+'">\n' +
                                    '       <a href="#" id="select'+metadata.id+'">\n' +
                                    '           <span id="tlicon'+metadata.id+'" class="bi-circle" style="font-size: 1rem;color: lightgray;"></span>\n' +
                                    '       </a>\n' +
                                    '   </div>\n' +
                                    '   <div class="thumbnail-br" id="tnbr'+metadata.id+'">\n' +
                                    '       <a href="#" id="favorite'+metadata.id+'">\n' +
                                    '           <span id="bricon'+metadata.id+'" class="'+favoriteIcon+'" style="font-size: 1rem;color: red;"></span>\n' +
                                    '       </a>\n' +
                                    '   </div>\n' +
                                    '   <div class="thumbnail-bl" id="tnbl'+metadata.id+'">\n' +
                                    '       <a href="#" data-toggle="modal" data-target="#prop'+metadata.id+'">\n' +
                                    '           <span class="bi-pencil" style="font-size: 1rem;color: lightgray;"></span>\n' +
                                    '       </a>\n' +
                                    '   </div>\n' +
                                    '   <div class="thumbnail-centered" id="tncentered'+metadata.id+'">\n';
                            if (metadata.type.includes("video")) {
                                html +=
                                    '   <a href="'+metadata.videoUrl+'"\n' +
                                    '       data-featherlight="iframe"\n' +
                                    '       data-featherlight-iframe-style="display:block;border:none;height:85vh;width:85vw;"\n' +
                                    '       data-featherlight-iframe-frameborder="0"\n' +
                                    '       data-featherlight-iframe-allowfullscreen="true">\n' +
                                    '       <span class="bi-play-circle" style="font-size: 4rem;color: lightgray;"></span>\n' +
                                    '   </a>\n';
                            } else {
                                html +=
                                    '   <a href="'+metadata.thumbnailUrlOriginal+'" data-featherlight="image">\n' +
                                    '       <span class="bi-play-circle" style="font-size: 4rem;color: lightgray;"></span>\n' +
                                    '   </a>\n';
                            }
                            html += '</div></div>\n<div id="timelinemodal'+metadata.id+'"></div><span class="appendMetadataPhotos"></span>\n';

                            if (appended === true) {
                                // Append
                                $(html).insertAfter($(".appendMetadataPhotos").last())
                            } else {
                                html += '</div><span class="attachMetadataPhotos"></span>';
                                $(html).insertAfter($(".attachMetadataPhotos").last())
                            }

                            var htmlEncodedMetadata = encodeHtml(JSON.stringify(metadata));
                            renderTimelineModal(htmlEncodedMetadata);
                            activateMetadataListeners(htmlEncodedMetadata);

                            html = "";
                        }
                    }
                } else {
                    message = '<div class="alert alert-danger" role="alert">' + data["msg"] + '</div>';
                    $("#msgTimeline").html(message);
                }
            }
        });
    }
</script>

</body>
</html>
