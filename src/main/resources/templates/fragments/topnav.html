<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body th:fragment="topnav(currentUser,hasNotification,activePage,searchTerm)">

<header class="py-2 mb-3 border-bottom shadow">
    <div class="container-fluid align-items-center d-flex">
        <div class="flex-shrink-0">
            <a class="align-items-center mb-lg-0 link-dark text-decoration-none" data-bs-toggle="offcanvas" data-bs-placement="bottom" href="#offcanvasMenu" aria-controls="offcanvasMenu" title="Show Menu">
                <span class="bi-list position-relative" style="font-size: 1.5rem;">
                    <th:block th:if="${hasNotifications}">
                        <span id="topNavAlertBadge" class="position-absolute top-0 start-50 p-1 bg-danger border border-light rounded-circle">
                            <span class="visually-hidden">New alerts</span>
                        </span>
                    </th:block>
                </span>
            </a>
            <th:block th:if="${activePage == 'timeline'}">
                <span id="timelineTools">
                    &nbsp;
                    <a class="align-items-center mb-lg-0 link-dark text-decoration-none" id="timelineTocToggle" data-bs-toggle="offcanvas" data-bs-placement="bottom" href="#offcanvasToc" aria-controls="offcanvasToc" title="Show timeline" style="display: none">
                        <span class="bi-calendar3" style="font-size: 1.5rem;"></span>
                    </a>
                    &nbsp;
                    <a class="align-items-center mb-lg-0 link-dark text-decoration-none" id="timelineMediaTypeToggle" data-bs-toggle="offcanvas" data-bs-placement="bottom" href="#mediaTypeToggle" aria-controls="mediaTypeToggle" title="Toggle media type">
                        <span id="timelineMediaTypeToggleIcon" class="bi-camera-video" style="font-size: 1.5rem;"></span>
                    </a>
                </span>
            </th:block>
            <th:block th:if="${activePage == 'logs'}">
                &nbsp;&nbsp;
                <a class="align-items-center mb-lg-0 link-dark text-decoration-none" href="/settings/logs/download" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Download logs">
                    <span class="bi-download" style="font-size: 1.5rem;"></span>
                </a>
            </th:block>
        </div>
        &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
        <div class="flex-grow-1 d-flex align-items-center">
            <form id="appSearch" class="form-control-dark w-100" action="/search" method="post">
                <input id="appSearchInput" name="appSearchInput" class="form-control form-control-dark w-100" type="text" placeholder="Search" aria-label="Search" th:value="${searchTerm}">
                <input type="submit" style="position: absolute; left: -9999px"/>
                <script th:inline="javascript" type="text/javascript">
                    $(document).ready(function () {
                        const ajaxParams = {
                            type: "get",
                            url: "/api/v1/search/history",
                            contentType: 'application/json; charset=utf-8',
                            retries: shashin.ajaxRetries
                        }

                        $.ajax(ajaxParams)
                            .fail(function(xhr, textStatus) {shashin.onFail(xhr, textStatus, ajaxParams, " getting search history")}).then(function (data) {
                            if (data.hasOwnProperty("status") && data.hasOwnProperty("msg")) {
                                if (data["status"] === "success") {
                                    if (data.hasOwnProperty("searchHistoryList")) {
                                        const searchHistoryList = data["searchHistoryList"];

                                        if (searchHistoryList.length > 0) {
                                            let searchHistoryData = [];
                                            for (const index in searchHistoryList) {
                                                const searchHistoryObj = searchHistoryList[index];
                                                searchHistoryData.push(searchHistoryObj.term)
                                            }

                                            /*<![CDATA[*/
                                            shashin.createAutocomplete("#appSearchInput", searchHistoryData, false, /*[[${searchHistoryLimit}]]*/15);
                                            /*]]>*/
                                        }
                                    }
                                }
                            }
                        });
                    });
                </script>
            </form>
            <div id="timelineAppTools">
                <a href="#" id="appToolsBatchEdit" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Edit Photos"><span class="bi-pencil" style="font-size: 1.5rem;color: dimgrey;"></span></a>&nbsp;&nbsp;
                <a href="#" id="appToolsDeselectAll" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Clear Selection"><span class="bi-backspace" style="font-size: 1.5rem;color: dimgrey;"></span></a>
                &nbsp;&nbsp;<span id="timelineNumberSelected"></span>
            </div>
            <th:block th:if="${activePage == 'matches' or activePage == 'person'}">
                <div id="matchesAppTools">
                    <a href="#" id="matchToolsBatchEdit" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Edit Photos"><span class="bi-pencil" style="font-size: 1.5rem;color: dimgrey;"></span></a>&nbsp;&nbsp;
                    <a href="#" id="matchToolsDeselectAll" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Clear Selection"><span class="bi-backspace" style="font-size: 1.5rem;color: dimgrey;"></span></a>
                    &nbsp;&nbsp;<span id="matchesNumberSelected"></span>
                </div>
            </th:block>
            <th:block th:if="${activePage == 'favorites'}">
                <div id="albumAppTools">
                    <a href="#" id="albumAppToolsRemoveFavorites" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Remove From Favorites"><span class="bi-heart" style="font-size: 1.5rem;color: dimgrey;"></span></a>&nbsp;&nbsp;
                    <a href="#" id="albumAppToolsDeselectAll" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Clear Selection"><span class="bi-backspace" style="font-size: 1.5rem;color: dimgrey;"></span></a>
                    &nbsp;&nbsp;<span id="favoritesNumberSelected"></span>
                </div>
            </th:block>
            <th:block th:if="${activePage == 'trash'}">
                <div id="albumAppTools">
                    <a href="#" id="albumAppToolsRestore" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Restore"><span class="bi-arrow-repeat" style="font-size: 1.5rem;color: dimgrey;"></span></a>&nbsp;&nbsp;
                    <a href="#" id="albumAppToolsDeselectAll" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Clear Selection"><span class="bi-backspace" style="font-size: 1.5rem;color: dimgrey;"></span></a>
                    &nbsp;&nbsp;<span id="trashNumberSelected"></span>
                </div>
            </th:block>
            <th:block th:unless="${activePage == 'favorites'}">
                <div id="albumAppTools">
                    <a href="#" id="albumAppToolsRemoveAlbum" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Remove From Album"><span class="bi-bookmark-x" style="font-size: 1.5rem;color: dimgrey;"></span></a>&nbsp;&nbsp;
                    <a href="#" id="albumAppToolsDeselectAll" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Clear Selection"><span class="bi-backspace" style="font-size: 1.5rem;color: dimgrey;"></span></a>
                    &nbsp;&nbsp;<span id="albumNumberSelected"></span>
                </div>
            </th:block>
        </div>
        <div class="flex-shrink-0 dropdown dropstart">
            <a id="dLabel" class="d-block link-dark text-decoration-none dropdown-toggle" role="button" data-bs-toggle="dropdown" data-bs-auto-close="true" aria-expanded="false">
                <span class="bi-person-circle" style="font-size: 1.5rem;"></span>
                <span class="caret"></span>
            </a>
            <div class="dropdown-menu dropdown-menu-end shadow" aria-labelledby="dropdownMenuButton" style="z-index: 9999">
                <h6 class="dropdown-header" th:text="${currentUser.username}"></h6>
                <a class="dropdown-item" href="/users/update">Change password</a>
                <a class="dropdown-item" href="/users/logout">Sign out</a>
            </div>
        </div>
    </div>

    <div class="progress" id="progressBarWrapper" style="height: 1px;visibility: hidden;">
        <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" id="progressBar" style="width: 0%" aria-valuenow="0" aria-valuemin="0" aria-valuemax=""></div>
    </div>
</header>

</body>
</html>
