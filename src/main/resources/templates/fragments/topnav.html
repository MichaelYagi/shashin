<!DOCTYPE html>
<html th:lang="${locale}" xmlns:th="http://www.thymeleaf.org">
<body th:fragment="topnav(currentUser,activePage,term)">

<span th:replace="~{fragments/translations.html :: translations()}"></span>

<div th:replace="~{fragments/aboutmodal :: aboutmodal(${activeProfile}, ${buildProperties}, ${operatingSystemInfo}, ${copyrightYear}, ${currentUser.darkMode})}"></div>

<div th:replace="~{fragments/toastmessages :: toastmessages()}"></div>

<div th:replace="~{fragments/slideshow :: slideshow()}"></div>

<div class="modal fade" id="slideshowAlbumSelection" data-bs-keyboard=false tabindex="-1" role="dialog" aria-labelledby="dropdownSelection" style="z-index: 9999999;">
    <div class="modal-dialog modal-dialog-scrollable modal-sm" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="slideshowAlbumSelectionLabel"><th:block th:text="#{main.pages.map.modal.selectalbum}"></th:block></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" id="slideshowAlbumSelectionList"></div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" data-bs-dismiss="modal" id="confirmSlideshowAlbumSelection"><th:block th:text="#{main.modal.save}"></th:block></button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" id="cancelSlideshowAlbumSelection"><th:block th:text="#{main.modal.cancel}"></th:block></button>
            </div>
        </div>
    </div>
</div>

<header class="py-2"> <!--  mb-1 border-bottom shadow -->
    <div class="container-fluid align-items-center d-flex">
        <div class="flex-shrink-0">
            <input type="hidden" id="activePage" th:value="${activePage}">
            <input type="hidden" id="scanPhotoMsg">
            <a class="align-items-center mb-lg-0 link-dark text-decoration-none" data-bs-toggle="offcanvas" data-bs-placement="bottom" href="#offcanvasMenu" aria-controls="offcanvasMenu" th:title="#{main.pages.tooltip.topnav.msg.menu}">
                <span id="sidebarMenuDrawer" th:class="'bi-list placeholder position-relative'+${currentUser.darkMode ? ' darkmodeIcons' : ' lightmodeIcons'}" style="font-size: 1.6rem;">
                </span>
            </a>
            <th:block th:if="${activePage == 'sandbox'}">
                <span id="sandboxtest">
                    &nbsp;
                    <a class="align-items-center mb-lg-0 link-dark text-decoration-none" data-bs-placement="bottom" href="#" aria-controls="back" id="doit" th:title="Remove section">
                        <span th:class="'bi-arrow-through-heart placeholder'+${currentUser.darkMode ? ' darkmodeIcons' : ' lightmodeIcons'}" style="font-size: 1.6rem;"></span>
                    </a>
                </span>
            </th:block>
            <th:block th:if="${activeProfile != 'prod'}">
                <span id="environmentLabel" class="align-items-center link-dark text-decoration-none ms-2" style="font-size: 1.6rem;">
                    <th:block th:if="${activeProfile == 'dev'}">
                        <span class="alert alert-primary shadow" th:text="${#strings.toUpperCase(activeProfile)}"></span>
                    </th:block>
                    <th:block th:if="${activeProfile == 'test'}">
                        <span class="alert alert-success shadow" th:text="${#strings.toUpperCase(activeProfile)}"></span>
                    </th:block>
                </span>
            </th:block>
            <th:block th:if="${activePage == 'timeline' || activePage == 'folder' || activePage == 'person' || activePage == 'matches' || activePage == 'compreface'}">
                <span id="timelineTools">
                    <th:block th:if="${activePage == 'timeline'}">
                        &nbsp;
                        <a class="align-items-center mb-lg-0 link-dark text-decoration-none" id="timelineTocToggle" data-bs-toggle="offcanvas" data-bs-placement="bottom" href="#offcanvasToc" aria-controls="offcanvasToc" th:title="#{main.pages.tooltip.topnav.msg.timeline}" style="display: none">
                            <span th:class="'bi-calendar3 placeholder'+${currentUser.darkMode ? ' darkmodeIcons' : ' lightmodeIcons'}" style="font-size: 1.6rem"></span>
                        </a>
                    </th:block>
                    <th:block th:if="${activePage == 'folder'}">
                        &nbsp;
                        <a class="align-items-center mb-lg-0 link-dark text-decoration-none" data-bs-placement="bottom" href="/folders" aria-controls="back" th:title="#{main.pages.tooltip.topnav.msg.backfolders}">
                            <span th:class="'bi-arrow-left placeholder'+${currentUser.darkMode ? ' darkmodeIcons' : ' lightmodeIcons'}" style="font-size: 1.6rem;"></span>
                        </a>
                    </th:block>
                    <th:block th:if="${activePage == 'person' || activePage == 'matches' || activePage == 'compreface'}">
                        &nbsp;
                        <a class="align-items-center mb-lg-0 link-dark text-decoration-none" data-bs-placement="bottom" href="/people" aria-controls="back" th:title="#{main.pages.tooltip.topnav.msg.back}">
                            <span th:class="'bi-arrow-left placeholder'+${currentUser.darkMode ? ' darkmodeIcons' : ' lightmodeIcons'}" style="font-size: 1.6rem;"></span>
                        </a>
                    </th:block>
                </span>
            </th:block>
            <th:block th:if="${activePage == 'album'}">
                <span id="albumTools">
                    &nbsp;
                    <a class="align-items-center mb-lg-0 link-dark text-decoration-none" data-bs-placement="bottom" href="/albums" aria-controls="back" th:title="#{main.pages.tooltip.topnav.msg.backalbums}">
                        <span th:class="'bi-arrow-left placeholder'+${currentUser.darkMode ? ' darkmodeIcons' : ' lightmodeIcons'}" style="font-size: 1.6rem;"></span>
                    </a>
                    <th:block th:if="${activePage == 'album'}">
                        <th:block th:if="${hasMediaUploadDirectory == true}">
                            &nbsp;
                            <a class="align-items-center mb-lg-0 link-dark text-decoration-none" data-bs-placement="bottom" id="uploadToAlbum" aria-controls="back" th:title="#{main.pages.tooltip.topnav.msg.uploadalbums}">
                                <span th:class="'bi-upload placeholder'+${currentUser.darkMode ? ' darkmodeIcons' : ' lightmodeIcons'}" id="uploadAlbumIcon" style="font-size: 1.6rem;"></span>
                            </a>
                            <iframe name="dummyframe" id="dummyframe" style="display: none;"></iframe>
                            <form style="display: none" id="uploadToAlbumForm" action="" method="post" enctype="multipart/form-data" target="dummyframe">
                                <input type="file" id="uploadMediaAlbum" name="uploadMediaAlbum" th:accept="${'.'+#strings.listJoin(acceptedMediaTypes, ',.')}" multiple>
                            </form>
                        </th:block>
                    </th:block>
                </span>
            </th:block>
            <th:block th:if="${activePage == 'map'}">
                <span id="mapTools">
                    &nbsp;
                    <a class="btn btn-link link-dark text-decoration-none" style="line-height:0;display: inline-block; background: none;outline: none;text-decoration: none;margin: -12px 0 -3px 0;padding:0;" data-bs-placement="bottom" id="mapFilterButton" role="button" href="#" aria-controls="back" th:title="#{main.pages.map.modal.title}">
                        <span th:class="'bi-globe-americas placeholder'+${currentUser.darkMode ? ' darkmodeIcons' : ' lightmodeIcons'}" style="font-size: 1.6rem;"></span>
                    </a>
                </span>
            </th:block>
            <th:block th:if="${activePage == 'logs'}">
                &nbsp;&nbsp;
                <a class="align-items-center mb-lg-0 link-dark text-decoration-none" href="/settings/logs/download" data-bs-toggle="tooltip" data-bs-placement="bottom" th:title="#{main.pages.tooltip.topnav.msg.download}">
                    <span th:class="'bi-download placeholder'+${currentUser.darkMode ? ' darkmodeIcons' : ' lightmodeIcons'}" style="font-size: 1.6rem;"></span>
                </a>
            </th:block>
            <th:block th:if="${activePage == 'recent' || activePage == 'modified' || activePage == 'taken' || activePage == 'accessed'}">
                <th:block th:if="${hasMediaUploadDirectory == true}">
                    &nbsp;
                    <a class="align-items-center mb-lg-0 link-dark text-decoration-none" data-bs-placement="bottom" id="uploadToMedia" aria-controls="back" th:title="#{main.pages.tooltip.topnav.msg.uploadmedia}">
                        <span th:class="'bi-upload placeholder'+${currentUser.darkMode ? ' darkmodeIcons' : ' lightmodeIcons'}" id="uploadMediaIcon" style="font-size: 1.6rem;"></span>
                    </a>
                    <iframe name="dummyframe" id="dummyframe" style="display: none;"></iframe>
                    <form style="display: none" id="uploadForm" action="/metadata/media/upload/batch" method="post" enctype="multipart/form-data" target="dummyframe">
                        <input type="file" id="uploadMedia" name="uploadMedia" th:accept="${'.'+#strings.listJoin(acceptedMediaTypes, ',.')}" multiple>
                    </form>
                </th:block>
            </th:block>
        </div>
        &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
        <div class="flex-grow-1 d-flex align-items-center">
            <form id="appSearch" class="w-100" action="/search" method="post">
                <input id="appSearchInput" name="appSearchInput" class="form-control rounded-pill border border-secondary-subtle" type="search" th:placeholder="#{main.pages.map.modal.search}" aria-label="Search" th:value="${term}">
                <input type="submit" id="appSearchSubmit" style="position: absolute; left: -9999px"/>
            </form>
            <th:block th:if="${activePage != 'favorites' and activePage != 'album'}">
                <div id="timelineAppTools">
                    <th:block th:if="${authority == 'ROLE_ADMIN' || authority == 'ROLE_SUPER'}">
                    <a href="#" id="appToolsBatchEdit" data-bs-toggle="tooltip" data-bs-placement="bottom" th:title="#{main.modal.batch.header}"><span th:class="'bi-pencil placeholder'+${currentUser.darkMode ? ' darkmodeIcons' : ' lightmodeIcons'}" style="font-size: 1.6rem;"></span></a>&nbsp;&nbsp;
                    </th:block>
                    <a href="#" id="appToolsBatchDownload" data-bs-toggle="tooltip" data-bs-placement="bottom" th:title="#{main.pages.tooltip.topnav.msg.downloadmedia}"><span th:class="'bi-download placeholder'+${currentUser.darkMode ? ' darkmodeIcons' : ' lightmodeIcons'}" style="font-size: 1.6rem;"></span></a>&nbsp;&nbsp;
                    <a href="#" id="appToolsDeselectAll" data-bs-toggle="tooltip" data-bs-placement="bottom" th:title="#{main.pages.tooltip.topnav.msg.clearselect}"><span th:class="'bi-x-circle placeholder'+${currentUser.darkMode ? ' darkmodeIcons' : ' lightmodeIcons'}" style="font-size: 1.6rem;"></span></a>
                    &nbsp;&nbsp;<span id="timelineNumberSelected"></span>
                </div>
            </th:block>
            <th:block th:if="${activePage == 'matches' or activePage == 'person'}">
                <div id="matchesAppTools">
                    <th:block th:if="${authority == 'ROLE_ADMIN' || authority == 'ROLE_SUPER'}">
                    <a href="#" id="matchToolsBatchEdit" data-bs-toggle="tooltip" data-bs-placement="bottom" th:title="#{main.modal.batch.header}"><span th:class="'bi-pencil placeholder'+${currentUser.darkMode ? ' darkmodeIcons' : ' lightmodeIcons'}" style="font-size: 1.6rem;"></span></a>&nbsp;&nbsp;
                    </th:block>
                    <a href="#" id="matchToolsBatchDownload" data-bs-toggle="tooltip" data-bs-placement="bottom" th:title="#{main.pages.tooltip.topnav.msg.downloadmedia}"><span th:class="'bi-download placeholder'+${currentUser.darkMode ? ' darkmodeIcons' : ' lightmodeIcons'}" style="font-size: 1.6rem;"></span></a>&nbsp;&nbsp;
                    <a href="#" id="matchToolsDeselectAll" data-bs-toggle="tooltip" data-bs-placement="bottom" th:title="#{main.pages.tooltip.topnav.msg.clearselect}"><span th:class="'bi-x-circle placeholder'+${currentUser.darkMode ? ' darkmodeIcons' : ' lightmodeIcons'}" style="font-size: 1.6rem;"></span></a>
                    &nbsp;&nbsp;<span id="matchesNumberSelected"></span>
                </div>
            </th:block>
            <th:block th:if="${activePage == 'favorites'}">
                <div id="albumAppTools">
                    <th:block th:if="${authority == 'ROLE_ADMIN' || authority == 'ROLE_SUPER'}">
                    <a href="#" id="appToolsBatchEdit" data-bs-toggle="tooltip" data-bs-placement="bottom" th:title="#{main.modal.batch.header}"><span th:class="'bi-pencil placeholder'+${currentUser.darkMode ? ' darkmodeIcons' : ' lightmodeIcons'}" style="font-size: 1.6rem;"></span></a>&nbsp;&nbsp;
                    </th:block>
                    <a href="#" id="albumAppToolsRemoveFavorites" data-bs-toggle="tooltip" data-bs-placement="bottom" th:title="#{main.pages.tooltip.topnav.msg.removefave}"><span th:class="'bi-heartbreak placeholder'+${currentUser.darkMode ? ' darkmodeIcons' : ' lightmodeIcons'}" style="font-size: 1.6rem;"></span></a>&nbsp;&nbsp;
                    <a href="#" id="albumAppToolsBatchDownload" data-bs-toggle="tooltip" data-bs-placement="bottom" th:title="#{main.pages.tooltip.topnav.msg.downloadmedia}"><span th:class="'bi-download placeholder'+${currentUser.darkMode ? ' darkmodeIcons' : ' lightmodeIcons'}" style="font-size: 1.6rem;"></span></a>&nbsp;&nbsp;
                    <a href="#" id="albumAppToolsDeselectAll" data-bs-toggle="tooltip" data-bs-placement="bottom" th:title="#{main.pages.tooltip.topnav.msg.clearselect}"><span th:class="'bi-x-circle placeholder'+${currentUser.darkMode ? ' darkmodeIcons' : ' lightmodeIcons'}" style="font-size: 1.6rem;"></span></a>
                    &nbsp;&nbsp;<span id="favoritesNumberSelected"></span>
                </div>
            </th:block>
            <th:block th:if="${activePage == 'archived'}">
                <div id="albumAppTools">
                    <a href="#" id="albumAppToolsRestore" data-bs-toggle="tooltip" data-bs-placement="bottom" th:title="#{main.toast.app.media.restored}"><span id="albumAppToolsRestoreIcon" th:class="'bi-arrow-repeat placeholder'+${currentUser.darkMode ? ' darkmodeIcons' : ' lightmodeIcons'}" style="font-size: 1.6rem;"></span></a>&nbsp;&nbsp;
                    <a href="#" id="albumAppToolsDeselectAll" data-bs-toggle="tooltip" data-bs-placement="bottom" th:title="#{main.pages.tooltip.topnav.msg.clearselect}"><span th:class="'bi-x-circle placeholder'+${currentUser.darkMode ? ' darkmodeIcons' : ' lightmodeIcons'}" style="font-size: 1.6rem;"></span></a>
                    &nbsp;&nbsp;<span id="trashNumberSelected"></span>
                </div>
            </th:block>
            <th:block th:if="${activePage != 'favorites' and activePage != 'archived'}">
                <div id="albumAppTools">
                    <th:block th:if="${authority == 'ROLE_ADMIN' || authority == 'ROLE_SUPER'}">
                        <a href="#" id="appToolsBatchEdit" data-bs-toggle="tooltip" data-bs-placement="bottom" th:title="#{main.modal.batch.header}"><span th:class="'bi-pencil placeholder'+${currentUser.darkMode ? ' darkmodeIcons' : ' lightmodeIcons'}" style="font-size: 1.6rem;"></span></a>&nbsp;&nbsp;
                        <a href="#" id="albumAppToolsRemoveAlbum" data-bs-toggle="tooltip" data-bs-placement="bottom" th:title="#{main.pages.tooltip.topnav.msg.removealbum}"><span th:class="'bi-bookmark-x placeholder'+${currentUser.darkMode ? ' darkmodeIcons' : ' lightmodeIcons'}" style="font-size: 1.6rem;"></span></a>&nbsp;&nbsp;
                    </th:block>
                    <a href="#" id="albumAppToolsBatchDownload" data-bs-toggle="tooltip" data-bs-placement="bottom" th:title="#{main.pages.tooltip.topnav.msg.downloadmedia}"><span th:class="'bi-download placeholder'+${currentUser.darkMode ? ' darkmodeIcons' : ' lightmodeIcons'}" style="font-size: 1.6rem;"></span></a>&nbsp;&nbsp;
                    <a href="#" id="albumAppToolsDeselectAll" data-bs-toggle="tooltip" data-bs-placement="bottom" th:title="#{main.pages.tooltip.topnav.msg.clearselect}"><span th:class="'bi-x-circle placeholder'+${currentUser.darkMode ? ' darkmodeIcons' : ' lightmodeIcons'}" style="font-size: 1.6rem;"></span></a>
                    &nbsp;&nbsp;<span id="albumNumberSelected"></span>
                </div>
            </th:block>
            <th:block th:if="${activePage == 'compreface'}">
                <div id="comprefaceAppTools">
                    <a href="#" id="comprefaceBatchDelete" data-bs-toggle="tooltip" data-bs-placement="bottom" th:title="#{main.pages.tooltip.topnav.msg.removecf}"><span th:class="'bi-trash placeholder'+${currentUser.darkMode ? ' darkmodeIcons' : ' lightmodeIcons'}" style="font-size: 1.6rem;"></span></a>&nbsp;&nbsp;
                    <a href="#" id="comprefaceDeselectAll" data-bs-toggle="tooltip" data-bs-placement="bottom" th:title="#{main.pages.tooltip.topnav.msg.clearselect}"><span th:class="'bi-x-circle placeholder'+${currentUser.darkMode ? ' darkmodeIcons' : ' lightmodeIcons'}" style="font-size: 1.6rem;"></span></a>
                    &nbsp;&nbsp;<span id="comprefaceNumberSelected"></span>
                </div>
            </th:block>
            <div id="mediaScanSpinner" style="height: 37px; width: 37px;margin-left: 10px;margin-right: -48px;display: none;">
                <span class="spinner-border spinner-border-xl" style="width: 38px; height: 38px;"></span>
            </div>
        </div>
        <th:block th:if="${currentUser.profile == null or currentUser.profile == ''}">
        <div id="profileDropdown" class="flex-shrink-0 dropdown" style="margin-left: 10px; margin-right: 15px; margin-top: -19px;height:38px;width:38px;">
        </th:block>
        <th:block th:unless="${currentUser.profile == null or currentUser.profile == ''}">
        <div id="profileDropdown" class="flex-shrink-0 dropdown" style="margin-left: 10px; margin-right: 15px;height:38px;width:38px;">
        </th:block>
            <a id="dLabel" th:class="'d-block link-dark text-decoration-none dropdown-toggle placeholder'+${currentUser.darkMode ? ' darkmodeIcons' : ' lightmodeIcons'}+${currentUser.profile == null or currentUser.profile == '' ? ' no-profile-dropdown-toggle' : ''}+${activePage == 'timeline' ? ' disabled' : ''}" role="button" th:aria-disabled="${activePage == 'timeline' ? 'true' : 'false'}" th:tabindex="${activePage == 'timeline' ? '-1' : '0'}" data-bs-toggle="dropdown" data-bs-auto-close="true" aria-expanded="false">
                <th:block th:if="${currentUser.profile == null or currentUser.profile == ''}">
                    <span id="profileImagePlaceholder" class="bi-person-circle" style="font-size:37px;"></span>
                    <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAgAAAAIAQMAAAD+wSzIAAAABlBMVEX///+/v7+jQ3Y5AAAADklEQVQI12P4AIX8EAgALgAD/aNpbtEAAAAASUVORK5CYII" id="profileImage" style="display:none;width:32px;height:32px" />
                    <span class="caret" style="margin-left: 2px;" id="profileCarat"></span>
                </th:block>
                <th:block th:unless="${currentUser.profile == null or currentUser.profile == ''}">
                    <span id="profileImagePlaceholder" class="bi-person-circle" style="display:none;font-size:1.6rem;"></span>
                    <img th:src="${currentUser.profile + '?' + randomString}" id="profileImage" style="display:inline-block;width:39px;height:39px" />
                    <span class="caret" id="profileCarat"></span>
                </th:block>
            </a>
            <div class="dropdown-menu dropdown-menu-end shadow" aria-labelledby="dropdownMenuButton" style="z-index: 9999">
                <h6 class="dropdown-header" th:text="${currentUser.username}"></h6>
                <a th:class="'dropdown-item'+${activePage=='account'?' active':''}" href="/users/account"><th:block th:text="#{main.pages.account.title}"></th:block></a>
                <th:block th:if="${hasImageMedia}">
                    <a href="#" class="dropdown-item" id="viewSlideshow"><th:block th:text="#{main.view.slideshow}"></th:block></a>
                </th:block>
                <a class="dropdown-item" href="#" data-bs-toggle="modal" data-bs-target="#propAbout"><th:block th:text="#{main.modal.about.title}"></th:block></a>
                <div class="dropdown-divider"></div>
                <a class="dropdown-item" href="/users/logout"><th:block th:text="#{main.view.signout}"></th:block></a>
            </div>
        </div>
    </div>

    <div class="progress" id="progressBarWrapper" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" style="height: 1px; margin-top: 9px; margin-bottom: -9px; visibility: hidden;">
        <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" id="progressBar" style="width: 0%;"></div>
    </div>

    <th:block th:if="${@environment.getProperty('app.js.useMinified') == 'false'}">
        <script src="/js/site/fragments/slideshow/main.js" type="text/javascript" th:nonce="${cspNonce}"></script>
        <script src="/js/site/fragments/slideshow/globals.js" type="text/javascript" th:nonce="${cspNonce}"></script>
        <script src="/js/site/fragments/mediauploads.js" type="text/javascript" th:nonce="${cspNonce}"></script>
        <script src="/js/site/fragments/topnavwebsocket.js" type="text/javascript" th:nonce="${cspNonce}"></script>
        <script src="/js/site/fragments/topnav.js" type="text/javascript" th:nonce="${cspNonce}"></script>
    </th:block>
    <th:block th:if="${@environment.getProperty('app.js.useMinified') == 'true'}">
        <script src="/js/site/min/fragments/slideshow/main.min.js" type="text/javascript" th:nonce="${cspNonce}"></script>
        <script src="/js/site/min/fragments/slideshow/globals.min.js" type="text/javascript" th:nonce="${cspNonce}"></script>
        <script src="/js/site/min/fragments/mediauploads.min.js" type="text/javascript" th:nonce="${cspNonce}"></script>
        <script src="/js/site/min/fragments/topnavwebsocket.min.js" type="text/javascript" th:nonce="${cspNonce}"></script>
        <script src="/js/site/min/fragments/topnav.min.js" type="text/javascript" th:nonce="${cspNonce}"></script>
    </th:block>
    <script th:inline="javascript" type="text/javascript" th:nonce="${cspNonce}">
        $(document).ready(function () {
            $("header .placeholder").removeClass("placeholder");

            /*<![CDATA[*/
            setGlobalListeners(/*[[${currentUser.darkMode}]]*/ false, /*[[${currentUser.showPlacename}]]*/ false, /*[[${timezone}]]*/ "America/Los_Angeles", /*[[${currentUser.notificationAlerts}]]*/ true, /*[[${searchHistoryLimit}]]*/ 10,/*[[${hasMediaUploadDirectory}]]*/ false, /*[[${currentUser.autoplayVideo}]]*/ false, /*[[${locale}]]*/ 'en');
            initializeSlideshow(/*[[${authority == "ROLE_SUPER" || authority == "ROLE_ADMIN"}]]*/ false, /*[[${queryLimit}]]*/ 30, /*[[${currentUser.slideshowInterval}]]*/ 10, /*[[${albumImageCount}]]*/ 0, /*[[${locale}]]*/ 'en', /*[[${currentUser.slideshowProgress}]]*/ false, /*[[${currentUser.slideshowOrientation}]]*/ 0, /*[[${currentUser.slideshowFillScreen}]]*/ false);
            /*]]>*/
        });
    </script>
</header>

</body>
</html>
