<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body th:fragment="topnav(currentUser,activePage,term)">

<!-- For live toast messages, use shashin.showToastMessage() to display toast messages -->
<div class="position-fixed bottom-0 start-50 translate-middle-x" id="toastContainer" style="z-index: 999999">
    <div class="toast-container">
        <div id="defaultToastTarget" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header">
                <span id="toastIcon"></span><span id="toastSpacer"></span>
                <strong id="toastTitle" class="me-auto"></strong>
                <small id="headerSubtext"></small>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div id="toastMessage" class="toast-body"></div>
        </div>

        <div id="toastTarget1" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header">
                <span id="toastIcon1"></span><span id="toastSpacer1"></span>
                <strong id="toastTitle1" class="me-auto"></strong>
                <small id="headerSubtext1"></small>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div id="toastMessage1" class="toast-body"></div>
        </div>

        <div id="toastTarget2" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header">
                <span id="toastIcon2"></span><span id="toastSpacer2"></span>
                <strong id="toastTitle2" class="me-auto"></strong>
                <small id="headerSubtext2"></small>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div id="toastMessage2" class="toast-body"></div>
        </div>

        <div id="toastTarget3" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header">
                <span id="toastIcon3"></span><span id="toastSpacer3"></span>
                <strong id="toastTitle3" class="me-auto"></strong>
                <small id="headerSubtext3"></small>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div id="toastMessage3" class="toast-body"></div>
        </div>

        <div id="toastTarget4" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header">
                <span id="toastIcon4"></span><span id="toastSpacer4"></span>
                <strong id="toastTitle4" class="me-auto"></strong>
                <small id="headerSubtext4"></small>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div id="toastMessage4" class="toast-body"></div>
        </div>
    </div>
</div>

<header class="py-2 mb-1 border-bottom shadow">
    <div class="container-fluid align-items-center d-flex">
        <div class="flex-shrink-0">
            <input type="hidden" id="activePage" th:value="${activePage}">
            <input type="hidden" id="scanPhotoMsg">
            <a class="align-items-center mb-lg-0 link-dark text-decoration-none" data-bs-toggle="offcanvas" data-bs-placement="bottom" href="#offcanvasMenu" aria-controls="offcanvasMenu" title="Show Menu">
                <span id="sidebarMenuDrawer" th:class="'bi-list placeholder position-relative'+${currentUser.darkMode ? ' darkmodeIcons' : ' lightmodeIcons'}" style="font-size: 1.5rem;">
                </span>
            </a>
            <th:block th:if="${activeProfile != 'prod'}">
                <span id="environmentLabel" class="align-items-center link-dark text-decoration-none ms-2" style="font-size: 1.5rem;">
                    <th:block th:if="${activeProfile == 'dev'}">
                        <span class="alert alert-primary shadow" th:text="${#strings.toUpperCase(activeProfile)}"></span>
                    </th:block>
                    <th:block th:if="${activeProfile == 'test'}">
                        <span class="alert alert-success shadow" th:text="${#strings.toUpperCase(activeProfile)}"></span>
                    </th:block>
                </span>
            </th:block>
            <th:block th:if="${activePage == 'timeline' || activePage == 'folder' || activePage == 'person' || activePage == 'matches' || activePage == 'compreface'}">
                <span id="timelineTools">
                    <th:block th:if="${activePage == 'timeline'}">
                    &nbsp;
                    <a class="align-items-center mb-lg-0 link-dark text-decoration-none" id="timelineTocToggle" data-bs-toggle="offcanvas" data-bs-placement="bottom" href="#offcanvasToc" aria-controls="offcanvasToc" title="Show timeline" style="display: none">
                        <span th:class="'bi-calendar3 placeholder'+${currentUser.darkMode ? ' darkmodeIcons' : ' lightmodeIcons'}" style="font-size: 1.5rem"></span>
                    </a>
                    &nbsp;
                    <a class="align-items-center mb-lg-0 link-dark text-decoration-none" id="timelineMediaTypeToggle" data-bs-placement="bottom" href="#mediaTypeToggle" aria-controls="mediaTypeToggle" title="Toggle media type">
                        <span id="timelineMediaTypeToggleIcon" th:class="'bi-camera-video placeholder'+${currentUser.darkMode ? ' darkmodeIcons' : ' lightmodeIcons'}" style="font-size: 1.5rem;"></span>
                    </a>
                    </th:block>
                    <th:block th:if="${activePage == 'folder'}">
                    &nbsp;
                    <a class="align-items-center mb-lg-0 link-dark text-decoration-none" data-bs-placement="bottom" href="/folders" aria-controls="back" title="Go back to folders">
                        <span th:class="'bi-arrow-left placeholder'+${currentUser.darkMode ? ' darkmodeIcons' : ' lightmodeIcons'}" style="font-size: 1.5rem;"></span>
                    </a>
                    </th:block>
                    <th:block th:if="${activePage == 'person' || activePage == 'matches' || activePage == 'compreface'}">
                    &nbsp;
                    <a class="align-items-center mb-lg-0 link-dark text-decoration-none" data-bs-placement="bottom" href="/people" aria-controls="back" title="Go back">
                        <span th:class="'bi-arrow-left placeholder'+${currentUser.darkMode ? ' darkmodeIcons' : ' lightmodeIcons'}" style="font-size: 1.5rem;"></span>
                    </a>
                    </th:block>
                </span>
            </th:block>
            <th:block th:if="${activePage == 'album' || activePage == 'slideshow'}">
                <span id="albumTools">
                    &nbsp;
                    <a class="align-items-center mb-lg-0 link-dark text-decoration-none" data-bs-placement="bottom" href="/albums" aria-controls="back" title="Go back to albums">
                        <span th:class="'bi-arrow-left placeholder'+${currentUser.darkMode ? ' darkmodeIcons' : ' lightmodeIcons'}" style="font-size: 1.5rem;"></span>
                    </a>
                    <th:block th:if="${activePage == 'album'}">
                    &nbsp;
                    <a class="align-items-center mb-lg-0 link-dark text-decoration-none" id="albumMediaTypeToggle" data-bs-placement="bottom" href="#mediaTypeToggle" aria-controls="mediaTypeToggle" title="Toggle media type">
                        <span id="albumMediaTypeToggleIcon" th:class="'bi-camera-video placeholder'+${currentUser.darkMode ? ' darkmodeIcons' : ' lightmodeIcons'}" style="font-size: 1.5rem;"></span>
                    </a>
                    </th:block>
                </span>
            </th:block>
            <th:block th:if="${activePage == 'map'}">
                <span id="mapTools">
                    &nbsp;
                    <a class="btn btn-link link-dark text-decoration-none" style="line-height:0;display: inline-block; background: none;outline: none;text-decoration: none;margin: -12px 0 -3px 0;padding:0;" data-bs-placement="bottom" id="mapFilterButton" role="button" href="#" aria-controls="back" title="Filter Map">
                        <span th:class="'bi-globe-americas placeholder'+${currentUser.darkMode ? ' darkmodeIcons' : ' lightmodeIcons'}" style="font-size: 1.5rem;"></span>
                    </a>
                </span>
            </th:block>
            <th:block th:if="${activePage == 'logs'}">
                &nbsp;&nbsp;
                <a class="align-items-center mb-lg-0 link-dark text-decoration-none" href="/settings/logs/download" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Download logs">
                    <span th:class="'bi-download placeholder'+${currentUser.darkMode ? ' darkmodeIcons' : ' lightmodeIcons'}" style="font-size: 1.5rem;"></span>
                </a>
            </th:block>
        </div>
        &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
        <div class="flex-grow-1 d-flex align-items-center">
            <form id="appSearch" class="w-100" action="/search" method="post">
                <input id="appSearchInput" name="appSearchInput" class="form-control" type="search" placeholder="Search" aria-label="Search" th:value="${term}">
                <input type="submit" id="appSearchSubmit" style="position: absolute; left: -9999px"/>
                <script th:inline="javascript" type="text/javascript" th:nonce="${cspNonce}">
                    $(document).ready(async function () {
                        $("#appSearch").on("submit", function (e) {
                            const searchTerm = $("#appSearchInput").val().trim();
                            if (searchTerm === "") {
                                e.preventDefault();
                            }
                        })

                        const http = new Http("search history");
                        const data = await http.ajax("get", "/search/history");

                        if (data.hasOwnProperty("status") && data.hasOwnProperty("msg")) {
                            if (data["status"] === "success") {
                                if (data.hasOwnProperty("searchHistoryList")) {
                                    const searchHistoryList = data["searchHistoryList"];

                                    if (searchHistoryList.length > 0) {
                                        let searchHistoryData = [];
                                        for (const index in searchHistoryList) {
                                            const searchHistoryObj = searchHistoryList[index];
                                            searchHistoryData.push(searchHistoryObj.term)
                                        }

                                        /*<![CDATA[*/
                                        shashin.createAutocomplete("#appSearchInput", searchHistoryData, false, /*[[${searchHistoryLimit}]]*/10, function () {
                                            $("#appSearchSubmit").click();
                                        });
                                        /*]]>*/
                                    }
                                }
                            }
                        }
                    });
                </script>
            </form>
            <th:block th:if="${activePage != 'favorites' and activePage != 'album'}">
                <div id="timelineAppTools">
                    <th:block th:if="${authority == 'ROLE_ADMIN' || authority == 'ROLE_SUPER'}">
                    <a href="#" id="appToolsBatchEdit" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Edit Metadata"><span th:class="'bi-info-circle placeholder'+${currentUser.darkMode ? ' darkmodeIcons' : ' lightmodeIcons'}" style="font-size: 1.5rem;"></span></a>&nbsp;&nbsp;
                    </th:block>
                    <a href="#" id="appToolsBatchDownload" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Download"><span th:class="'bi-download placeholder'+${currentUser.darkMode ? ' darkmodeIcons' : ' lightmodeIcons'}" style="font-size: 1.5rem;"></span></a>&nbsp;&nbsp;
                    <a href="#" id="appToolsDeselectAll" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Clear Selection"><span th:class="'bi-x-circle placeholder'+${currentUser.darkMode ? ' darkmodeIcons' : ' lightmodeIcons'}" style="font-size: 1.5rem;"></span></a>
                    &nbsp;&nbsp;<span id="timelineNumberSelected"></span>
                </div>
            </th:block>
            <th:block th:if="${activePage == 'matches' or activePage == 'person'}">
                <div id="matchesAppTools">
                    <th:block th:if="${authority == 'ROLE_ADMIN' || authority == 'ROLE_SUPER'}">
                    <a href="#" id="matchToolsBatchEdit" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Edit Metadata"><span th:class="'bi-info-circle placeholder'+${currentUser.darkMode ? ' darkmodeIcons' : ' lightmodeIcons'}" style="font-size: 1.5rem;"></span></a>&nbsp;&nbsp;
                    </th:block>
                    <a href="#" id="matchToolsBatchDownload" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Download"><span th:class="'bi-download placeholder'+${currentUser.darkMode ? ' darkmodeIcons' : ' lightmodeIcons'}" style="font-size: 1.5rem;"></span></a>&nbsp;&nbsp;
                    <a href="#" id="matchToolsDeselectAll" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Clear Selection"><span th:class="'bi-x-circle placeholder'+${currentUser.darkMode ? ' darkmodeIcons' : ' lightmodeIcons'}" style="font-size: 1.5rem;"></span></a>
                    &nbsp;&nbsp;<span id="matchesNumberSelected"></span>
                </div>
            </th:block>
            <th:block th:if="${activePage == 'favorites'}">
                <div id="albumAppTools">
                    <th:block th:if="${authority == 'ROLE_ADMIN' || authority == 'ROLE_SUPER'}">
                    <a href="#" id="appToolsBatchEdit" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Edit Metadata"><span th:class="'bi-info-circle placeholder'+${currentUser.darkMode ? ' darkmodeIcons' : ' lightmodeIcons'}" style="font-size: 1.5rem;"></span></a>&nbsp;&nbsp;
                    </th:block>
                    <a href="#" id="albumAppToolsRemoveFavorites" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Remove From Favorites"><span th:class="'bi-heart placeholder'+${currentUser.darkMode ? ' darkmodeIcons' : ' lightmodeIcons'}" style="font-size: 1.5rem;"></span></a>&nbsp;&nbsp;
                    <a href="#" id="albumAppToolsBatchDownload" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Download"><span th:class="'bi-download placeholder'+${currentUser.darkMode ? ' darkmodeIcons' : ' lightmodeIcons'}" style="font-size: 1.5rem;"></span></a>&nbsp;&nbsp;
                    <a href="#" id="albumAppToolsDeselectAll" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Clear Selection"><span th:class="'bi-x-circle placeholder'+${currentUser.darkMode ? ' darkmodeIcons' : ' lightmodeIcons'}" style="font-size: 1.5rem;"></span></a>
                    &nbsp;&nbsp;<span id="favoritesNumberSelected"></span>
                </div>
            </th:block>
            <th:block th:if="${activePage == 'trash'}">
                <div id="albumAppTools">
                    <a href="#" id="albumAppToolsRestore" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Restore"><span id="albumAppToolsRestoreIcon" th:class="'bi-arrow-repeat placeholder'+${currentUser.darkMode ? ' darkmodeIcons' : ' lightmodeIcons'}" style="font-size: 1.5rem;"></span></a>&nbsp;&nbsp;
                    <a href="#" id="albumAppToolsDeselectAll" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Clear Selection"><span th:class="'bi-x-circle placeholder'+${currentUser.darkMode ? ' darkmodeIcons' : ' lightmodeIcons'}" style="font-size: 1.5rem;"></span></a>
                    &nbsp;&nbsp;<span id="trashNumberSelected"></span>
                </div>
            </th:block>
            <th:block th:if="${activePage != 'favorites' and activePage != 'trash'}">
                <div id="albumAppTools">
                    <th:block th:if="${authority == 'ROLE_ADMIN' || authority == 'ROLE_SUPER'}">
                        <a href="#" id="appToolsBatchEdit" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Edit Metadata"><span th:class="'bi-info-circle placeholder'+${currentUser.darkMode ? ' darkmodeIcons' : ' lightmodeIcons'}" style="font-size: 1.5rem;"></span></a>&nbsp;&nbsp;
                        <a href="#" id="albumAppToolsRemoveAlbum" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Remove From Album"><span th:class="'bi-bookmark-x placeholder'+${currentUser.darkMode ? ' darkmodeIcons' : ' lightmodeIcons'}" style="font-size: 1.5rem;"></span></a>&nbsp;&nbsp;
                    </th:block>
                    <a href="#" id="albumAppToolsBatchDownload" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Download"><span th:class="'bi-download placeholder'+${currentUser.darkMode ? ' darkmodeIcons' : ' lightmodeIcons'}" style="font-size: 1.5rem;"></span></a>&nbsp;&nbsp;
                    <a href="#" id="albumAppToolsDeselectAll" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Clear Selection"><span th:class="'bi-x-circle placeholder'+${currentUser.darkMode ? ' darkmodeIcons' : ' lightmodeIcons'}" style="font-size: 1.5rem;"></span></a>
                    &nbsp;&nbsp;<span id="albumNumberSelected"></span>
                </div>
            </th:block>
            <th:block th:if="${activePage == 'compreface'}">
                <div id="comprefaceAppTools">
                    <a href="#" id="comprefaceBatchDelete" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Remove From CompreFace"><span th:class="'bi-trash placeholder'+${currentUser.darkMode ? ' darkmodeIcons' : ' lightmodeIcons'}" style="font-size: 1.5rem;"></span></a>&nbsp;&nbsp;
                    <a href="#" id="comprefaceDeselectAll" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Clear Selection"><span th:class="'bi-x-circle placeholder'+${currentUser.darkMode ? ' darkmodeIcons' : ' lightmodeIcons'}" style="font-size: 1.5rem;"></span></a>
                    &nbsp;&nbsp;<span id="comprefaceNumberSelected"></span>
                </div>
            </th:block>
            <div id="mediaScanSpinner" style="display: none;">
                <span class="spinner-border spinner-border-sm"></span>
            </div>
        </div>
        <div class="flex-shrink-0 dropdown" style="margin-left: 10px;">
            <a id="dLabel" th:class="'d-block link-dark text-decoration-none dropdown-toggle placeholder'+${currentUser.darkMode ? ' darkmodeIcons' : ' lightmodeIcons'}" role="button" data-bs-toggle="dropdown" data-bs-auto-close="true" aria-expanded="false">
                <th:block th:if="${currentUser.profile == null or currentUser.profile == ''}">
                    <span id="profileImagePlaceholder" class="bi-person-circle" style="font-size:1.5rem;"></span>
                    <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAgAAAAIAQMAAAD+wSzIAAAABlBMVEX///+/v7+jQ3Y5AAAADklEQVQI12P4AIX8EAgALgAD/aNpbtEAAAAASUVORK5CYII" id="profileImage" style="display:none;width:32px;height:32px" />
                </th:block>
                <th:block th:unless="${currentUser.profile == null or currentUser.profile == ''}">
                    <span id="profileImagePlaceholder" class="bi-person-circle" style="display:none;font-size:1.5rem;"></span>
                    <img th:src="${currentUser.profile + '?' + randomString}" id="profileImage" style="display:inline-block;width:32px;height:32px" />
                </th:block>
                <span class="caret"></span>
            </a>
            <div class="dropdown-menu dropdown-menu-end shadow" aria-labelledby="dropdownMenuButton" style="z-index: 9999">
                <h6 class="dropdown-header" th:text="${currentUser.username}"></h6>
                <a th:class="'dropdown-item'+${activePage=='profile'?' active':''}" href="/users/profile">View profile</a>
                <a th:class="'dropdown-item'+${activePage=='update'?' active':''}" href="/users/update">Change password</a>
                <a th:class="'dropdown-item'+${activePage=='apikey'?' active':''}" href="/users/apikey">Manage API key</a>
                <div class="dropdown-item">
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="darkModeSwitch" th:checked="${currentUser.darkMode}">
                        <label class="form-check-label" for="darkModeSwitch">Dark mode</label>
                    </div>
                </div>
                <div class="dropdown-item">
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="autoplayVideoSwitch" th:checked="${currentUser.autoplayVideo}">
                        <label class="form-check-label" for="autoplayVideoSwitch">Autoplay videos</label>
                    </div>
                </div>
                <div class="dropdown-item">
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="showPlacenameSwitch" th:checked="${currentUser.showPlacename}">
                        <label class="form-check-label" for="showPlacenameSwitch">Show place names</label>
                    </div>
                </div>
                <div class="dropdown-item">
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="showNotificationAlertsSwitch" th:checked="${currentUser.notificationAlerts}">
                        <label class="form-check-label" for="showNotificationAlertsSwitch">Show notifications</label>
                    </div>
                </div>
                <div class="dropdown-divider"></div>
                <a class="dropdown-item" href="/users/logout">Sign out</a>
                <script th:inline="javascript" type="text/javascript" th:nonce="${cspNonce}">
                    $("#darkModeSwitch").change(async function () {
                        const darkMode = this.checked;
                        shashin.darkMode = darkMode;
                        const http = new Http("dark mode");
                        const json = {darkMode: darkMode};
                        const data = await http.ajax("post", "/users/darkmode", JSON.stringify(json));

                        if (data.hasOwnProperty("status") && data.hasOwnProperty("msg")) {
                            if (data["status"] === "success") {
                                let html = $("html");

                                html.hide();
                                Util.darkModeToggle(darkMode);
                                html.show();
                            }
                        }
                    });

                    $("#showNotificationAlertsSwitch").change(async function () {
                        const notificationAlerts = this.checked;
                        const http = new Http("show notificationAlerts");
                        const json = {notificationAlerts: notificationAlerts};
                        const data = await http.ajax("post", "/users/shownotificationalerts", JSON.stringify(json));

                        if (data.hasOwnProperty("status") && data.hasOwnProperty("msg")) {
                            if (data["status"] === "success") {
                                window.location.reload();
                            }
                        }
                    });

                    $("#showPlacenameSwitch").change(async function () {
                        const activePage = $("#activePage").val();
                        const showPlacename = this.checked;
                        shashin.showPlacename = showPlacename;
                        const http = new Http("show placename");
                        const json = {showPlacename: showPlacename};
                        const data = await http.ajax("post", "/users/showplacename", JSON.stringify(json));

                        if (data.hasOwnProperty("status") && data.hasOwnProperty("msg")) {
                            if (data["status"] === "success") {
                                if (activePage === "timeline") {
                                    Util.reinitLightGalleryInstance();
                                } else {
                                    window.location.reload();
                                }
                            }
                        }
                    });

                    $("#autoplayVideoSwitch").change(async function () {
                        const activePage = $("#activePage").val();
                        const autoplayVideo = this.checked;
                        shashin.autoplayVideo = autoplayVideo;
                        const http = new Http("autoplay video");
                        const json = {autoplayVideo: autoplayVideo};
                        const data = await http.ajax("post", "/users/autoplayvideo", JSON.stringify(json));

                        if (data.hasOwnProperty("status") && data.hasOwnProperty("msg")) {
                            if (data["status"] === "success") {
                                if (activePage === "timeline") {
                                    Util.reinitLightGalleryInstance();
                                } else {
                                    window.location.reload();
                                }
                            }
                        }
                    });
                </script>
            </div>
        </div>
    </div>

    <div class="progress" id="progressBarWrapper" style="height: 1px;visibility: hidden;">
        <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" id="progressBar" style="width: 0%" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
    </div>

    <script th:inline="javascript" type="text/javascript" th:nonce="${cspNonce}">
        $(window).bind("load", function () {
            $("header .placeholder").removeClass("placeholder");
        });

        $(document).ready(async function () {
            /*<![CDATA[*/
            shashin.darkMode = /*[[${currentUser.darkMode}]]*/ false;
            shashin.showPlacename = /*[[${currentUser.showPlacename}]]*/ false;
            const activePage = /*[[${activePage}]]*/ '';
            const timezone = /*[[${timezone}]]*/ "America/Los_Angeles";
            const notificationAlerts = /*[[${currentUser.notificationAlerts}]]*/ false;
            /*]]>*/

            if (activePage !== "notifications") {
                await Util.getNotifications(notificationAlerts, timezone);
            }

            if (notificationAlerts === true) {
                setTimeout(function () {
                    const http = new Http("check compreface status");
                    http.ajax("get", "/status/compreface").then(function (data) {
                        if (data.hasOwnProperty("status") && data["status"] === false) {
                            shashin.showToastMessage("CompreFace server check failed", "Check CompreFace server connection.", {
                                icon: "bi-exclamation-triangle",
                                iconColor: "#FF0000",
                                autohide: false,
                                target: shashin.toast.target.three
                            });
                        }
                    })
                }, 0);
            }

            // Clear live toast message on close
            $('#'+shashin.toast.target.default).on('hidden.bs.toast', function () {
                $("#toastIcon").removeClass();
                $("#toastIcon").removeAttr('style');
                $("#toastTitle").text("");
                $("#toastMessage").text("");
            });

            $('#'+shashin.toast.target.one).on('hidden.bs.toast', function () {
                $("#toastIcon1").removeClass();
                $("#toastIcon1").removeAttr('style');
                $("#toastTitle1").text("");
                $("#toastMessage1").text("");
            });

            $('#'+shashin.toast.target.two).on('hidden.bs.toast', function () {
                $("#toastIcon2").removeClass();
                $("#toastIcon2").removeAttr('style');
                $("#toastTitle2").text("");
                $("#toastMessage2").text("");
            });

            $('#'+shashin.toast.target.three).on('hidden.bs.toast', function () {
                $("#toastIcon3").removeClass();
                $("#toastIcon3").removeAttr('style');
                $("#toastTitle3").text("");
                $("#toastMessage3").text("");
            });

            $('#'+shashin.toast.target.four).on('hidden.bs.toast', function () {
                $("#toastIcon4").removeClass();
                $("#toastIcon4").removeAttr('style');
                $("#toastTitle4").text("");
                $("#toastMessage4").text("");
            });

            // Focus and select search input
            $("#appSearchInput").focus(function() { $(this).select(); } );

            // Get updates from media scans
            let stompClient = null;
            let scanInProgress = false;

            connectSP();

            $("#scanPhotos").on("click", function (e) {
                e.preventDefault();
                postToScan(false);
            });

            $("#deleteThread").on("click", function (e) {
                e.preventDefault();
                let posting = $.post(
                    "/settings/scan",
                    {"submit": "", "deleteThread": true, "stopScan": false, "reindexFiles": false}
                );

                posting.done(function (data) {
                    if (data.hasOwnProperty("msg")) {
                        showMessageSP(data["msg"]);
                    }
                });
            });

            $("#stopScanPhotos").on("click", function (e) {
                e.preventDefault();
                let posting = $.post(
                    "/settings/scan",
                    {"submit": "", "deleteThread": false, "stopScan": true, "reindexFiles": false}
                );

                posting.done(function (data) {
                    if (data.hasOwnProperty("msg")) {
                        showMessageSP(data["msg"]);
                        window.top.location = window.top.location
                    }
                });
            });

            function postToScan(deleteThread) {
                let posting = $.post(
                    "/settings/scan",
                    {"submit": "Scan", "deleteThread": deleteThread, "stopScan": false, "reindexFiles": $('#reindexFiles').prop("checked")}
                );

                posting.done(function (data) {

                    showMessageSP(data.hasOwnProperty("msg") ? data["msg"] : "")
                    if (scanInProgress === false) {
                        if ($("#msg").text() === "Start Scan") {
                            connectSP();
                        } else {
                            scanRefresh();
                        }
                    }
                });

                return false;
            }

            function scanRefresh() {
                sendMessageSP();
                let msgVal = $("#scanPhotoMsg").val();
                if (activePage === "scan") {
                    msgVal = $("#msg").text();
                }

                if (msgVal === "Scan Stopped" || msgVal === "No directories configured" || msgVal === "Scan Complete") {
                    scanInProgress = false;
                } else {
                    scanInProgress = true;
                    setTimeout(scanRefresh, 1000);
                }
            }

            let counterSP = 0;
            function connectSP() {
                const socket = new SockJS('/websocket-endpoint');
                stompClient = Stomp.over(socket);
                if (shashin.showDebug === false) {
                    stompClient.debug = null
                }

                shashin.printMessageToConsole("Socket Connecting");

                stompClient.connect({}, function() {
                    if (scanInProgress === false) {
                        scanRefresh();
                    }
                    shashin.printMessageToConsole( "Connected STOMP client");
                    this.subscribe("/topic/messages", function (message) {
                        let respMessage = JSON.parse(message.body).content;
                        shashin.printMessageToConsole("message: "+message);
                        if (respMessage === "Scan Stopped" || respMessage === "No directories configured" || respMessage === "Scan Complete") {
                            $("#mediaScanSpinner").css("display", "none");
                        } else {
                            $("#mediaScanSpinner").css("display", "block");
                        }
                        showMessageSP(respMessage);
                    });
                }, function(e) {
                    shashin.printMessageToConsole( "scan files connectSP() error" );
                    shashin.printMessageToConsole( e.toString() );
                    //showMessageSP("Socket connection error: " + e.toString())

                    if (counterSP > 10) {
                        showMessageSP("Oops, something went wrong! " + e.toString() + ". Probably already scanning.");
                        if (activePage === "scan") {
                            window.top.location = window.top.location
                        }
                        counterSP = 0;
                    } else {
                        showMessageSP("Oops, something went wrong! " + e.toString() + ". Click the Scan button once, to proceed with indexing.");
                        disconnectSP();
                        connectSP();
                    }

                    scanInProgress = false;
                    counterSP++;
                });
            }

            function disconnectSP() {
                if (stompClient !== null) {
                    stompClient.disconnect();
                }
                shashin.printMessageToConsole("Disconnected");
            }

            function sendMessageSP() {
                if (stompClient !== null) {
                    stompClient.send("/app/scanmessage", {}, JSON.stringify({'message': "getScanMessage"}));
                } else {
                    showMessageSP("Trying to send message but STOMP client is null")
                    scanInProgress = false;
                }
            }

            function showMessageSP(message) {
                $("#scanPhotoMsg").val(message);
                if (activePage === "scan") {
                    $("#msg").text(message);
                }
            }
        });
    </script>
</header>

</body>
</html>
