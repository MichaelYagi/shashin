<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body th:fragment="timelinebatchmodal(recognitionLabels,allAlbumList)">
<div class="modal fade" id="propBatchMetadata" tabindex="-1" role="dialog" aria-labelledby="labelBatchMetadata" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="editPhotosModalLabel">Edit Photos<br><span id="editPhotosNamesModalLabel"></span></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body ui-front">
                <p class="text-muted">Empty fields will be ignored</p>
                <form id="saveBatchData">
                    <input type="hidden" id="batchMetadataIds" name="batchMetadataIds" value="">
                    <input type="hidden" id="batchFilenames" name="batchFilenames" value="">

                    <div class="form-group row">
                        <div class="col-sm">
                            <label for="cameraBatchData" class="col-form-label">Camera</label>
                            <input type="text" class="form-control" id="cameraBatchData" name="cameraBatchData" value="">
                            <input type="hidden" id="camerasBatchString" th:value="${cameras}">
                        </div>
                    </div>
                    <div class="form-group row">
                        <div class="col-sm">
                            <label for="yearTakenBatchData" class="col-form-label">Year taken</label>
                            <input type="text" class="form-control" id="yearTakenBatchData" name="yearTakenBatchData" value="">
                        </div>
                        <div class="col-sm">
                            <label for="monthTakenBatchData" class="col-form-label">Month taken</label>
                            <input type="text" class="form-control" id="monthTakenBatchData" name="monthTakenBatchData" value="">
                        </div>
                        <div class="col-sm">
                            <label for="dayTakenBatchData" class="col-form-label">Day taken</label>
                            <input type="text" class="form-control" id="dayTakenBatchData" name="dayTakenBatchData" value="">
                        </div>
                        <div class="col-sm">
                            <label for="offsetTakenBatchData" class="col-form-label">GMT Offset</label>
                            <select class="form-select" id="offsetTakenBatchData" name="offsetTakenBatchData">
                                <option value="">--GMT--</option>
                                <th:block th:each="offset, iterStat: ${timeOffsets}">
                                    <option th:value="${offset}" th:text="${offset}"></option>
                                </th:block>
                            </select>
                        </div>
                    </div>
                    <div class="form-group row">
                        <div class="col-sm">
                            <label for="latlngBatchData" class="col-form-label">Latitude, Longitude</label>
                            <input type="text" class="form-control" id="latlngBatchData" name="latlngBatchData" value="">
                        </div>
                        <div class="col-sm">
                            <label for="keywordsBatchData" class="col-form-label">Keywords (comma separated)</label>
                            <input type="text" class="form-control" id="keywordsBatchData" name="keywordsBatchData" value="">
                            <input type="hidden" id="keywordsBatchString" th:value="${keywords}">
                        </div>
                    </div>
                    <div class="form-group row">
                        <div class="col-sm">
                            <label for="albumNameInput" class="col-form-label">Add to Album (comma separated)</label>
                            <div class="input-group" id="batchAlbumNames">
                                <div class="input-group" id="albumListForModal">
                                    <input type="text" class="form-control" aria-label="Albums Name" id="albumNameInput" name="albumNameInput" value="">

                                    <th:block th:if="${#lists.size(allAlbumList)} > 0">
                                        <div class="input-group-append dropdown">
                                            <button class="btn btn-outline-secondary dropdown-toggle" onclick="return timelineBatchModal.toggleBatchTagAlbumDropdown();" id="tagalbumdropdown" type="button" aria-haspopup="true" aria-expanded="false">Albums</button>
                                            <div class="dropdown-menu" id="albumNameList">
                                                <th:block th:each="album, iterStat: ${allAlbumList}">
                                                    <button class="dropdown-item" type="button">
                                                        <input type="checkbox" onclick="return timelineBatchModal.populateBatchAlbum();" th:id="${album.id}" th:value="${album.name}" name="albums[]">
                                                        <label th:for="${album.id}" th:text="${album.name}"></label>
                                                    </button>
                                                </th:block>
                                            </div>
                                        </div>
                                    </th:block>
                                </div>
                            </div>
                        </div>
                        <div class="col-sm">
                            <label for="tagBatchDataInput" class="col-form-label">Tag People (comma separated)</label>
                            <div class="input-group" id="batchLabelIds">
                                <input type="text" class="form-control" onfocus="return timelineBatchModal.closeBatchTagPeopleDropdown();" aria-label="Tag People" id="tagBatchDataInput" name="tagBatchDataInput" value="">

                                <th:block th:if="${#lists.size(recognitionLabels)} > 0">
                                    <div class="input-group-append">
                                        <button class="btn btn-outline-secondary dropdown-toggle" onclick="return timelineBatchModal.toggleBatchTagPeopleDropdown();" id="tagpeopledropdown" type="button" aria-haspopup="true" aria-expanded="false">People</button>
                                        <div class="dropdown-menu" id="peopleNameList">
                                            <th:block th:each="recognitionLabel, iterStat: ${recognitionLabels}">
                                                <button class="dropdown-item" type="button">
                                                    <input type="checkbox" onclick="return timelineBatchModal.populateBatchLabel();" th:id="${recognitionLabel.id}" th:value="${recognitionLabel.name}" name="recognitionLabel[]">
                                                    <label th:for="${recognitionLabel.id}" th:text="${recognitionLabel.name}"></label>
                                                </button>
                                            </th:block>
                                        </div>
                                    </div>
                                </th:block>
                            </div>
                            <div class="form-group row">
                                <div class="col-sm">
                                    <input type="checkbox" name="batchisobject" id="batchisobject">
                                    <label class="form-check-label" for="batchisobject">These are objects</label>
                                </div>
                            </div>
                        </div>
                    </div>
                    <hr>
                    <div class="form-group row">
                        <div class="col-sm">
                            <input type="checkbox" name="batchhidden" id="batchhidden">
                            <label class="form-check-label" for="batchhidden">Remove Photos</label>
                        </div>
                    </div>
                    <br>
                    <div class="form-group row">
                        <div class="col-sm">
                            <span id="msgBatchMetadata"></span>
                        </div>
                    </div>
                </form>

            </div>
            <div class="modal-footer">
                <div id="timelineBatchModalStatus" class="spinner-grow me-auto" style="visibility: hidden;font-size: 2rem;" role="status" aria-hidden="true"></div>
                <button type="button" class="btn btn-primary" id="saveBatchMetadata">Save</button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            </div>
        </div>
    </div>
</div>

<th:block th:if="${@environment.getProperty('app.js.useMinified') == 'false'}">
    <script src="/js/site/timelinebatchmodal.js" type="text/javascript"></script>
</th:block>
<th:block th:if="${@environment.getProperty('app.js.useMinified') == 'true'}">
    <script src="/js/site/timelinebatchmodal.min.js" type="text/javascript"></script>
</th:block>
</body>
</html>
