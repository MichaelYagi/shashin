<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:insert="fragments/head :: head(${activePage},${titleDescriptor})"></head>
<body class="thumb d-flex flex-column vh-100">

<div th:replace="fragments/topnav :: topnav(${currentUser},${activePage},'')"></div>

<!--<div th:replace="fragments/metadatamodal :: metadatamodal(${currentUser})"></div>-->

<div id="container" class="container-fluid pb-3 flex-grow-1 d-flex flex-column overflow-auto">
    <div class="row flex-grow-sm-1 flex-grow-0">
        <div th:replace="fragments/sidebaroffcanvas :: sidebaroffcanvas(${activeSidebar},${currentUser})"></div>
        <main role="main" class="col overflow-auto h-100">

            <div th:replace="fragments/content :: content(${message},${activePage},${authority},${parameter},${counts},${faceRecogServicesAvailable},${objectRecogEnabled})" class="col-sm p-3 min-vh-100"></div>

            <h1>Slideshow</h1>

            <div id="infinite-scroll-gallery">
                <th:block th:if="${not #lists.isEmpty(metadataList)}">
                    <div class="row image-group-padding">
                        <th:block th:each="metadata, iterStat: ${metadataList}">
                            <div th:id="${'photoThumbnailContainer'+metadata.id}" class="photo-thumbnail-container photo-thumbnail" th:style="${'width:'+metadata.thumbnailSmallWidth+'px;height:'+metadata.thumbnailSmallHeight+'px;padding-left:0;padding-right:0;'}">
                                <a class="lightGalleryIndexAnchor" th:name="${'lightGalleryIndex'+iterStat.index}"></a>

                                <img loading="lazy" th:src="${#uris.escapePath(metadata.thumbnailUrlSmall)}" class="photo-thumbnail-image" th:width="${metadata.thumbnailSmallWidth}" th:height="${metadata.thumbnailSmallHeight}" th:id="'image'+${metadata.id}">
                                <input type="hidden" th:name="'filename'+${metadata.id}" th:id="'filename'+${metadata.id}" th:value="${metadata.fileName}">
                                <input type="hidden" th:name="'thumbnailCentered'+${metadata.id}" th:id="'thumbnailCentered'+${metadata.id}" th:value="${metadata.thumbnailUrlCentered}">

<!--                                <div th:replace="fragments/toprightoverlay :: toprightoverlay(${metadata.type},${metadata.id},${metadata.duration != null ? metadata.duration : '0:00'},${metadata.originalImageWidth},${metadata.originalImageHeight},${metadata.expectedExtension},false)"></div>-->

<!--                                <div th:replace="fragments/topleftoverlay :: topleftoverlay(${metadata.id})"></div>-->
<!--                                <div th:replace="fragments/bottomleftoverlay :: bottomleftoverlay(${metadata}, null, null, null, null)"></div>-->

                                <div th:replace="fragments/centeredoverlay :: centeredoverlay(${metadata},null,${iterStat.index})"></div>
                            </div>

                            <span th:id="'slideshow'+${metadata.id}" style="width:0;height:0;padding:0"></span>

                            <script th:inline="javascript" type="text/javascript" th:nonce="${cspNonce}">
                                /*<![CDATA[*/
                                shashin.setPhotoOverlays(/*[[${metadata}]]*/{}, /*[[${activePage}]]*/'matches');
                                $("#mediaLink"+/*[[${metadata.id}]]*/"00000000-00000000-00000000-00000000").attr("tag",/*[[${metadata.id}]]*/"00000000-00000000-00000000-00000000");
                                $("#infoModalEdit"+/*[[${metadata.id}]]*/"00000000-00000000-00000000-00000000").on("click", function(e) {
                                    e.preventDefault();
                                    shashin.openEditMetadataModal(/*[[${metadata.id}]]*/"00000000-00000000-00000000-00000000");
                                });
                                /*]]>*/
                            </script>

                        </th:block>

<!--                        <div th:replace="fragments/metadatabatchmodal :: metadatabatchmodal(${recognitionLabels},${allAlbumList})"></div>-->
                    </div>

                </th:block>
                <th:block th:unless="${not #lists.isEmpty(metadataList)}">
                    <p>No images to show</p>
                </th:block>
            </div>

            <div th:replace="fragments/footer :: footer(${copyrightYear},${operatingSystemInfo},${buildProperties},${activeProfile})"></div>
        </main>
    </div>
</div>

<th:block th:if="${@environment.getProperty('app.js.useMinified') == 'false'}">
    <script src="/js/site/applisteners.js" type="text/javascript" th:nonce="${cspNonce}"></script>
</th:block>
<th:block th:if="${@environment.getProperty('app.js.useMinified') == 'true'}">
    <script src="/js/site/min/applisteners.min.js" type="text/javascript" th:nonce="${cspNonce}"></script>
</th:block>
<script type="text/javascript" th:inline="javascript" th:nonce="${cspNonce}">
    $(document).ready(function () {
        /*<![CDATA[*/
        shashin.nonce = /*[[${cspNonce}]]*/ '';
        /*]]>*/

        const $infiniteScrollGallery = document.getElementById('infinite-scroll-gallery');
        let lg = null;

        $infiniteScrollGallery.addEventListener('lgSlideItemLoad', function(e) {
            if ($(".lg-show-autoplay").length === 0 && lg !== null) {
                $(".lg-autoplay-button.lg-icon")[0].click();
            }
        });

        lg = lightGallery($infiniteScrollGallery, {
            plugins: [lgRelativeCaption, lgCastMedia, lgFullscreen, lgAutoplay],
            preload: "auto",
            autoplay: true,
            slideShowAutoplay: true,
            progressBar: false,
            counter: false,
            controls: false,
            allowMediaOverlap: true,
            showBarsAfter: 5000,
            hideBarsDelay: 5000,
            slideDelay: 6000,
            castMedia: true,
            fullScreen: true,
            selector: ".mediaLink",
            licenseKey: Util.lgApiKey()
        });

        shashin.mouseMoveListener();
        Util.checkErrorImage();

        // Autoplay gallery
        if ($(".mediaLink").length > 0) {
            lg.openGallery(0);
        }
    });
</script>
</body>
</html>
