<!DOCTYPE html>
<th:block th:insert="~{fragments/asciiart :: asciiart()}"></th:block>
<html th:lang="${locale}" xmlns:th="http://www.thymeleaf.org">
<head th:insert="~{fragments/head :: head(${activePage},${titleDescriptor})}"></head>
<body class="thumb d-flex flex-column vh-100">

<th:block th:if="${not #lists.isEmpty(albumMetadataList)}">
    <header class="py-2 mb-2">
        <div class="container-fluid align-items-center d-flex">
            <div class="flex-shrink-0">
                <span class="display-6" th:utext="${'&lt;span id=&quot;albumNameTitle&quot;&gt;&lt;strong&gt;'+album.name + '&lt;/strong&gt;&lt;/span&gt;'}"></span>
            </div>
            <div class="flex-grow-1 d-flex align-items-center"></div>
            <span style="font-size: 1rem;display: none;background: none;border: none;" th:class="${(darkMode != null && darkMode == true) ? 'darkmodeIcons' : 'lightmodeIcons'}" id="albumNumberSelected"></span>&nbsp;&nbsp;&nbsp;
            <button th:class="'bi-x-circle '+${(darkMode != null && darkMode == true) ? 'darkmodeIcons' : 'lightmodeIcons'}" style="font-size: 1.5rem;display: none;background: none;border: none;" title="Cancel multi select" id="clearMultiSelect"></button>&nbsp;
            <th:block th:if="${loggedIn == false}">
                <a class="nav-link dropdown-toggle" data-bs-toggle="dropdown" href="#" role="button" aria-expanded="false"><th:block th:text="#{main.language}"></th:block></a>
                <ul class="dropdown-menu" id="languageSelect">
                    <th:block th:each="lang : ${languageList}">
                        <li><a th:class="'dropdown-item' + ${locale == lang.code ? ' active' : ''}" th:id="${lang.code}" href="#"><th:block th:text="${lang.label}"></th:block></a></li>
                    </th:block>
                </ul>
            </th:block>
            <form id="downloadWrapper" method="post" th:action="${'/download/share/' + shareLink + '/album/' + albumId}" style="display: inline-block;white-space: nowrap;">
                <button th:id="${'download' + albumId}" th:class="'bi-download '+${(darkMode != null && darkMode == true) ? 'darkmodeIcons' : 'lightmodeIcons'}" style="font-size: 1.5rem;background: none;border: none;" type="submit" name="download" th:value="${albumId}" title="Download all photos"></button>
            </form>
        </div>
    </header>
</th:block>

<!-- For live toast messages, use shashin.showToastMessage() to display toast messages -->
<div th:replace="~{fragments/toastmessages :: toastmessages()}"></div>

<div id="container" class="container-fluid pb-3 flex-grow-1 d-flex flex-column overflow-auto">
    <div class="row flex-grow-sm-1 flex-grow-0">
        <main role="main" class="col overflow-auto h-100">

            <div th:replace="~{fragments/hiddenfields :: hiddenfields(${message})}"></div>

            <div id="infinite-scroll-gallery">
                <th:block th:if="${not #lists.isEmpty(albumMetadataList)}">
                    <input id="albumId" type="hidden" th:value="${album.id}">
                    <input id="albumName" type="hidden" th:value="${album.name}">
                    <input id="shareLink" type="hidden" th:value="${shareLink}">

                    <th:block th:if="${pageParam == null}">
                        <div><a th:href="${'/share/' + shareLink + '/album/' + album.id}" class="ms-1" style="text-decoration:none;"><th:block th:text="#{main.view.default}"></th:block></a></div>
                    </th:block>
                    <th:block th:if="${pageParam != null}">
                        <div><a th:href="${'/share/' + shareLink + '/album/' + album.id + '/0'}" class="ms-1" style="text-decoration:none;"><th:block th:text="#{main.view.paged}"></th:block></a></div>
                    </th:block>

                    <div th:class="'row' + ${isMobile ? '' : ' image-group-padding'}">
                        <th:block th:each="metadata, iterStat: ${albumMetadataList}">

                            <th:block th:if="${iterStat.count > 0}" th:unless="${!iterStat.first and albumMetadataList[iterStat.index-1].year==metadata.year and albumMetadataList[iterStat.index-1].month==metadata.month and albumMetadataList[iterStat.index-1].day==metadata.day}">
                                <th:block th:unless="${metadata.year==null or metadata.month==null or metadata.day==null}">
                                    <section class="dateSection" th:id="${metadata.year+'-'+metadata.month+'-'+metadata.day}"><p><strong th:text="${formattedDateMap[metadata.id]}"></strong></p><div th:id="'dateBody'+${metadata.year+'-'+metadata.month+'-'+metadata.day}" class="row" style="margin-left: -2px;">
                                </th:block>
                            </th:block>

                            <div th:id="${'photoThumbnailContainer'+metadata.id}" class="photo-thumbnail-container photo-thumbnail"
                                 th:style="${'width:'+(isMobile ? thumbnailHeight : metadata.thumbnailSmallWidth)+'px;height:'+(isMobile ? thumbnailHeight : metadata.thumbnailSmallHeight)+'px;padding-left:0;padding-right:0;'}">
                                <img loading="lazy" draggable="false" th:data-smallthumb="'/api/v1/thumbnails/'+${isMobile?'centered':'225'}+'/'+${metadata.id}" th:data-xsmallthumb="${metadata.thumbnailUrlExtraSmall==null?'':'/api/v1/thumbnails/112/'+metadata.id}" th:src="'/api/v1/thumbnails/'+${isMobile?'centered':'225'}+'/'+${metadata.id}" class="photo-thumbnail-image"
                                     th:id="'image'+${metadata.id}" th:width="${isMobile ? thumbnailHeight : metadata.thumbnailSmallWidth}" th:height="${isMobile ? thumbnailHeight : metadata.thumbnailSmallHeight}">

                                <div th:replace="~{fragments/toprightoverlay :: toprightoverlay(${metadata.type},${metadata.id},${metadata.duration != null ? metadata.duration : '0:00'},${metadata.originalImageWidth},${metadata.originalImageHeight},${metadata.expectedExtension},false)}"></div>

                                <div th:replace="~{fragments/centeredoverlay :: centeredoverlay(${metadata},${activePage},${currentUser},'shashin.openGallery',${iterStat.index},${isMobile},${thumbnailType},${thumbnailHeight})}"></div>

                                <div th:replace="~{fragments/topleftoverlay :: topleftoverlay(${metadata})}"></div>

                                <div class="thumbnail-bl" th:id="${'tnbl'+metadata.id}">
                                    <th:block th:if="${metadata.type.contains('video')}">
                                        <a th:href="'/api/v1/video/'+${metadata.id}+'/download'" th:id="${'download'+metadata.id}">
                                            <span class="bi-download" style="font-size: 1rem;color: lightgray;"></span>
                                        </a>
                                    </th:block>
                                    <th:block th:unless="${metadata.type.contains('video')}">
                                        <a th:href="'/api/v1/image/'+${metadata.id}+'/download'" th:id="${'download'+metadata.id}">
                                            <span class="bi-download" style="font-size: 1rem;color: lightgray;"></span>
                                        </a>
                                    </th:block>
                                </div>
                            </div>

                            <script th:inline="javascript" type="text/javascript" th:nonce="${cspNonce}">
                                /*<![CDATA[*/
                                shashin.setPhotoOverlays({id:[[${metadata.id}]],lat:[[${metadata.lat}]],lng:[[${metadata.lng}]],year:[[${metadata.year}]],month:[[${metadata.month}]],day:[[${metadata.day}]],fileName:[[${metadata.fileName}]],thumbnailUrlSmall:[[${metadata.thumbnailUrlSmall}]],type:[[${metadata.type}]]}, /*[[${activePage}]]*/'share');
                                $("#mediaLink"+/*[[${metadata.id}]]*/"00000000-00000000-00000000-00000000").attr("tag",/*[[${metadata.id}]]*/"00000000-00000000-00000000-00000000");
                                /*]]>*/
                            </script>

                            <th:block th:if="${iterStat.count > 0 and !iterStat.last and metadata.year!=null and (albumMetadataList[iterStat.index+1].year+'-'+albumMetadataList[iterStat.index+1].month+'-'+albumMetadataList[iterStat.index+1].day)!=metadata.year+'-'+metadata.month+'-'+metadata.day}">
                                <th:block th:remove="tag" th:utext="'&lt;/div&gt;&lt;/section&gt;'"></th:block>
                                <span class="appendAlbumPhotos" style="width:0;height:0;padding:0"></span>
                            </th:block>
                            <th:block th:if="${iterStat.last and metadata.year!=null}">
                                <th:block th:remove="tag" th:utext="'&lt;/div&gt;&lt;/section&gt;'"></th:block>
                                <span class="appendAlbumPhotos" style="width:0;height:0;padding:0"></span>
                            </th:block>
                        </th:block>
                    </div>

                </th:block>
                <th:block th:if="${#lists.isEmpty(albumMetadataList)}">
                    <span class="appendAlbumPhotos" style="width:0;height:0;padding:0;display:none;">EOL</span>
                </th:block>
            </div>

            <th:block th:if="${pageParam == null and albumMetadataSize > 0 and currentPage > 0}">
                <nav id="pagination"><ul class="pagination flex-wrap justify-content-center mt-3"></ul></nav>
            </th:block>

            <!-- Back to top button -->
            <button type="button" class="btn btn-primary btn-floating btn-lg" id="btn-back-to-top">
                <i class="bi-arrow-up-circle"></i>
            </button>

            <div id="spinner" class="spinner-border justify-content-center align-items-center" role="status" style="display: none"></div>
            <div th:replace="~{fragments/footer :: footer(${copyrightYear},${operatingSystemInfo},${buildProperties},${activeProfile},${activePage})}"></div>
        </main>
    </div>
</div>

<th:block th:if="${@environment.getProperty('app.js.useMinified') == 'false'}">
    <script src="/js/site/applisteners.js" type="text/javascript" th:nonce="${cspNonce}"></script>
</th:block>
<th:block th:if="${@environment.getProperty('app.js.useMinified') == 'true'}">
    <script src="/js/site/min/applisteners.min.js" type="text/javascript" th:nonce="${cspNonce}"></script>
</th:block>
<script th:inline="javascript" type="text/javascript" th:nonce="${cspNonce}">
    $(document).ready(function () {
        /*<![CDATA[*/
        shashin.nonce = /*[[${cspNonce}]]*/ '';
        const shareLink = /*[[${shareLink}]]*/ '';
        const activePage = /*[[${activePage}]]*/ 'share';
        const albumId = /*[[${album.id}]]*/ 0;
        const albumListSize = /*[[${albumMetadataSize}]]*/ 0;
        const page = /*[[${pageParam}]]*/ -1;
        const currentPage = /*[[${currentPage}]]*/ 0;
        const totalPages = /*[[${totalPages}]]*/ 0;
        const locale = /*[[${locale}]]*/ 'en';
        /*]]>*/

        $("#languageSelect li a").on("click", async function (e) {
            e.preventDefault();

            const language = $(this).attr("id");
            window.location.replace("/share/"+shareLink+"/album/"+albumId+"?lang="+language);
        });

        if (albumListSize > 0 && page === 0) {
            const section = $("section");
            let lastDate = "";
            if (section.length > 0) {
                const lastSection = $("section").last();
                lastDate = lastSection.attr("id")
                lastDate = dateFormat(lastDate.replace(/-/g, "/"), "yyyy-m-d");
            }

            const http = new Http(activePage);
            http.ajax("get", "/share/" + shareLink + "/album/" + albumId + "/page/0").then(function (data) {
                if (data.hasOwnProperty("albumMetadataList") === true) {
                    const albumMetadataList = data["albumMetadataList"];
                    const shareAlbumInstance = new ShareAlbum(shareLink, activePage, albumId, albumMetadataList, lastDate, locale);
                    shareAlbumInstance.init();
                    // Util.checkErrorImage();
                }
            });
        } else {
            Util.scrollToTopListener("#container");
            shashin.createPagination(currentPage,totalPages,activePage,null,albumId,shareLink);
            const shareAlbumInstance = new ShareAlbum();
            shareAlbumInstance.clearMultiSelectListener();
        }
    });
</script>
</body>
</html>
