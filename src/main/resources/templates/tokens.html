            <h2>Decode Remember Me Token</h2>
            <input type="text" id="decodePersistentLogin" size="100">
            <button type="button" id="decode">Decode</button><br>
            <span id="decoded"></span>

            <br><br>

            <h2>Tokens</h2>

            <p>Current remember-me cookie value: <span th:utext="${currentRememberMeToken}"></span></p>
            <p>Current time: <span id="currentTime" th:utext="${currentTimeMS}"></span> - <span id="currentTimeLocal"></span></p>

            <script type="text/javascript">
                $(document).ready(function() {
                    function readCookie(name) {
                        const nameEQ = name + "=";
                        const ca = document.cookie.split(';');
                        for (let i = 0; i < ca.length; i++) {
                            let c = ca[i];
                            while (c.charAt(0) === ' ') c = c.substring(1, c.length);
                            if (c.indexOf(nameEQ) === 0) return c.substring(nameEQ.length, c.length);
                        }
                        return null;
                    }

                    $('.expiries').each(function(i, obj) {
                        const idunixtime = $(obj).attr("id");
                        const localDateTime = timeConverter(parseInt(idunixtime));
                        $("#"+idunixtime).text(" - "+localDateTime);
                    });

                    function timeConverter(UNIX_timestamp) {
                        const date = new Date(UNIX_timestamp).toLocaleDateString("en-US");
                        const time = new Date(UNIX_timestamp).toLocaleTimeString("en-US");

                        return date + ' ' + time;
                    }

                    $("#decode").on("click", function (e) {
                        e.preventDefault();
                        $("#decoded").text("");

                        const cookieVal = $("#decodePersistentLogin").val();
                        if (cookieVal.length > 0) {
                            let decodedSeriesToken = atob(cookieVal);

                            decodedSeriesToken = decodeURIComponent(decodedSeriesToken)
                            const decodedSeriesTokenArray = decodedSeriesToken.split(":")
                            console.log(decodedSeriesTokenArray[0])
                            $("#decoded").text(decodedSeriesTokenArray[0]+":"+decodedSeriesTokenArray[1]);
                        }
                    });

                    const currentTime = parseInt($("#currentTime").text());
                    const currentDateLocal = new Date(currentTime).toLocaleDateString("en-US");
                    const currentTimeLocal = new Date(currentTime).toLocaleTimeString("en-US");
                    $("#currentTimeLocal").text(currentDateLocal + ' ' + currentTimeLocal);
                });
            </script>

            <div th:replace="~{fragments/hiddenfields :: hiddenfields(${message})}"></div>
