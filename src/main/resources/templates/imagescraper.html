<!DOCTYPE html>
<th:block th:include="fragments/asciiart :: asciiart()"></th:block>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:insert="~{fragments/head :: head(${activePage},${titleDescriptor})}"></head>
<body class="thumb d-flex flex-column vh-100">

<div th:replace="~{fragments/topnav :: topnav(${currentUser},${activePage},'')}"></div>

<div id="container" class="container-fluid pb-3 flex-grow-1 d-flex flex-column overflow-auto">
    <div class="row flex-grow-sm-1 flex-grow-0">
        <div th:replace="~{fragments/sidebaroffcanvas :: sidebaroffcanvas(${activeSidebar},${currentUser})}"></div>
        <main role="main" class="col overflow-auto h-100">
            <div th:replace="~{fragments/hiddenfields :: hiddenfields(${message})}"></div>

            <div th:class="row' + ${isMobile ? '' : ' image-group-padding'} + 'mt-4">
                <div class="input-group mb-3">
                    <button class="btn btn-primary" type="submit" id="submitForm" title="Get images from URL"><span class="bi-images"></span></button>
                    <input type="text" id="pageUrl" name="pageUrl" class="form-control" placeholder="Page URL" th:value="${pageUrl != ''?pageUrl:''}">
                </div>
            </div>

            <span id="imageScraperContainer"></span>

            <button type="button" class="btn btn-primary btn-floating btn-lg" id="btn-back-to-top">
                <i class="bi-arrow-up-circle"></i>
            </button>

            <div id="footer"
                 th:replace="~{fragments/footer :: footer(${copyrightYear},${operatingSystemInfo},${buildProperties},${activeProfile},${activePage})}"></div>
        </main>
    </div>
</div>

<script type="text/javascript" th:inline="javascript" th:nonce="${cspNonce}">
    $(document).ready(function () {
        /*<![CDATA[*/
        shashin.nonce = /*[[${cspNonce}]]*/ '';
        const darkMode = /*[[${currentUser.darkMode}]]*/ false;
        const classMode = darkMode ? "link-button-darkmode":"link-button-lightmode";
        /*]]>*/

        function urlHistoryAutoComplete() {
            const http = new Http("url search history");
            const version = Util.getMetadataLocalStorage();
            http.ajax("get", "/tools/imagescraper/history/"+(version === "" ? "" : "?v=" + version)).then(function (data) {
                if (data.hasOwnProperty("status") && data.hasOwnProperty("msg")) {
                    if (data["status"] === "success") {
                        if (data.hasOwnProperty("urlHistoryList")) {
                            const urlHistoryList = data["urlHistoryList"];

                            if (urlHistoryList.length > 0) {
                                let urlHistoryData = [];
                                for (const index in urlHistoryList) {
                                    const urlHistoryObj = urlHistoryList[index];
                                    urlHistoryData.push(urlHistoryObj.term)
                                }
                                shashin.createAutocomplete("#pageUrl", urlHistoryData, false);
                                Util.setMetadataLocalStorage();
                            }
                        }
                    }
                }
            });
        }

        urlHistoryAutoComplete();

        let startTime, endTime;

        shashin.updateSearchInput("Image Scraper");

        $("#pageUrl").on('keypress',function(e) {
            if(e.which === 13) {
                makeImageScraperRequest();
            }
        });

        $("#submitForm").on("click", function (e) {
            e.preventDefault();

            urlHistoryAutoComplete();
            makeImageScraperRequest();
        });

        function makeImageScraperRequest() {
            connect();

            const pageUrl = $("#pageUrl").val().trim();

            if (pageUrl === "") {
                shashin.showToastMessage("Invalid URL", "Enter a valid URL", {icon:"bi-exclamation-triangle", iconColor:"#FF0000", borderColor:"danger"});
            } else {
                shashin.showToastMessage("Starting", "Starting scan, please wait ...", {icon:"bi-info-circle", iconColor:"#777777"});

                $("#imageScraperContainer").html("");

                $("#progressBarWrapper").visible();
                $("#progressBar").attr("aria-valuenow", "0");
                $("#progressBar").css("width", "0%");

                startTime = new Date();

                const http = new Http("scraper images");
                let json = {pageUrl: pageUrl}
                http.ajax("post", "/tools/imagescraper", JSON.stringify(json)).then(function (data) {

                    if (data.hasOwnProperty("status")) {
                        if (data.status === shashin.apiResponse.SUCCESS) {
                            endTime = new Date();
                            let timeDiff = endTime - startTime;
                            shashin.showToastMessage("Page processed", data.toastMessage + " in " + timeDiff + " ms.", {
                                icon: "bi-info-circle",
                                iconColor: "#777777"
                            });
                        } else {
                            shashin.showToastMessage("Something went wrong", data.toastMessage, {
                                icon: "bi-exclamation-triangle",
                                iconColor: "#FF0000",
                                borderColor:"danger"
                            });

                            let html = '<div class="row mt-2 ms-1">';
                            html += '<span class="lead mb-1">';
                            if (data.toastMessage === "Invalid URL") {
                                html += data.toastMessage+'.';
                            } else {
                                html += 'Something went wrong. Could not render images from <a href="' + pageUrl + '" target="_blank">' + pageUrl + '</a>.';
                            }
                            html += '</span></div>';

                            $("#imageScraperContainer").html(html);
                        }
                    }
                    // console.log(data)
                    if (data.hasOwnProperty("imgList") && data["imgList"].length > 0) {
                        let html = '<div class="row mt-2 ms-1">';
                        html += '<span class="lead mb-4">';
                        html += data["numOfImages"] + ' image' + ((data["numOfImages"] === 1) ? '' : 's') + ' found!';
                        html += '<a class="ms-1 bi-link-45deg ' + classMode + '" href=\"' + data["pageUrl"] + '\" target="_blank"></a>';
                        html += '<form method="post" action="/tools/download/images" style="display: inline-block;white-space: nowrap;">';
                        html += '<button class="bi-download ' + classMode + '" type="submit" title="Download all images"></button>';
                        html += '<input type="hidden" value="' + data["pageUrl"] + '" name="pageUrl">';
                        html += '</form></span>';

                        html += '<div class="row ms-0">';

                        const imgList = data["imgList"].reverse();
                        for (let index in imgList) {
                            const imgObj = imgList[index];

                            html += '<div class="card" style="width:235px;padding-top:10px;margin-right:-1px;margin-bottom:-1px;">';
                            html += '<a href="' + imgObj.imgRealSrc + '" target="_blank"><img src="' + imgObj.imgThumbBase64 + '" title="' + imgObj.imgTitle + '" alt="' + imgObj.imgAlt + '" data-src="' + imgObj.imgRealSrc + '" style="width: ' + imgObj.imgThumbWidth + 'px;height: ' + imgObj.imgThumbHeight + 'px;"></a>';
                            html += '<div class="card-body">';
                            html += '<strong>' + ((imgObj.imgTitle !== '') ? imgObj.imgTitle : imgObj.imgAlt) + '</strong><br>';
                            html += '<form method="post" action="/tools/download/image" style="display: inline-block;white-space: nowrap;"><input type="hidden" name="imageUrl" value="' + imgObj.imgRealSrc + '"><button class="bi-download ' + classMode + '" type="submit" name="download" title="Download image"></button></form>';
                            html += '<small>' + imgObj.imgRealWidth + 'x' + imgObj.imgRealHeight + '</small>';
                            html += '</div></div>';
                        }

                        html += '</div>';
                        $("#imageScraperContainer").html(html);
                    }

                    $("#progressBarWrapper").invisible();
                });
            }
            disconnect();
        }

        shashin.activateScrollToTop();

        let stompClient = null;
        // Socket polling refresh rate
        const refreshRateMS = 1000;
        let elapsedMS = 0;

        function scanRefresh() {
            sendMessage();
            elapsedMS += refreshRateMS
            setTimeout(scanRefresh, refreshRateMS);
        }

        let counter = 0;
        function connect() {
            const socket = new SockJS('/websocket-endpoint');
            stompClient = Stomp.over(socket);
            if (shashin.showDebug === false) {
                stompClient.debug = null
            }

            shashin.printMessageToConsole("Socket Connecting");

            stompClient.connect({}, function() {
                scanRefresh();
                shashin.printMessageToConsole( "Connected STOMP client");

                this.subscribe("/topic/scrapermessages", function (message) {
                    let respMessageJsonString = JSON.parse(message.body).content;
                    const scraperMap = JSON.parse(respMessageJsonString);
                    const currentIndex = scraperMap["currentIndex"];
                    const totalIndex = scraperMap["totalIndex"];

                    $("#progressBar")
                        .css("width", (currentIndex*100)/totalIndex + "%")
                        .attr("aria-valuenow", (currentIndex*100)/totalIndex);
                });
            }, function(e) {
                if (counter > 0) {
                    shashin.printMessageToConsole("Oops, something went wrong! " + e.toString() + ". Probably already scanning.", {
                        consoleType: shashin.consoleTypes.warn
                    });
                } else {
                    shashin.printMessageToConsole("Oops, something went wrong! " + e.toString() + ". Click the Scan button once, to proceed with indexing.", {
                        consoleType: shashin.consoleTypes.warn
                    });
                }

                if (counter < 10) {
                    counter = 0;
                    scanRefresh();
                }

                counter++;
            });
        }

        function disconnect() {
            if (stompClient !== null) {
                stompClient.disconnect();
            }
            shashin.printMessageToConsole("Disconnected");
        }

        function sendMessage() {
            if (stompClient !== null) {
                stompClient.send("/app/scrapermessage", {}, JSON.stringify({'message': "getScraperMessage"}));
            } else {
                shashin.printMessageToConsole("Trying to send message but STOMP client is null", {
                    consoleType: shashin.consoleTypes.warn
                });
            }
        }
    });
</script>

</body>
</html>
