<!DOCTYPE html>
<html lang="en" xmlns:th="http://thymeleaf.org" th:fragment="page(title,activePage)">
<head th:insert="fragments/docshead :: docshead(${title})"></head>

<body>

<div id="container" class="container-fluid pb-3 flex-grow-1 d-flex flex-column overflow-auto">

    <div class="row px-4 py-3 ml-3 mr-3" th:insert="fragments/docstopnav :: docstopnav()"></div>

    <div class="row">
        <div class="col-12 col-md-2 col-xl-1 bd-sidebar" th:insert="fragments/articlessidebar :: articlessidebar(${activePage})"></div>

        <main class="col overflow-auto h-100" role="main">
            <div th:replace="this :: content"></div>

            <button type="button" class="btn btn-primary btn-floating btn-lg" id="btn-back-to-top">
                <i class="bi-arrow-up-circle"></i>
            </button>
        </main>

        <th:block th:if="${activePage == 'articles/endpoints'}">
            <nav class="d-none d-xl-block col-xl-4 float-end">
                <ul class="section-nav">
                    <li class="toc-entry toc-h2"><a href="#apiendpoints">API Endpoints</a>
                        <ul>
                            <th:block th:each="endpoint, iterStat: ${apiEndpointsMapList}">
                                <th:block th:if="${iterStat.count > 0}" th:unless="${!iterStat.first and (apiEndpointsMapList[iterStat.index-1].role)==(endpoint.role)}">
                                    <li class="toc-entry toc-h3"><a th:href="${'#role'+endpoint.roleAnchor}" th:text="${endpoint.role+' APIs'}"></a>
                                        <th:block th:remove="tag" th:utext="'&lt;ul&gt;'"></th:block>
                                </th:block>

                                <li class="toc-entry toc-h2"><a th:href="${'#'+endpoint.rolePath}"><th:block th:text="${endpoint.requestType}"></th:block>&nbsp;<th:block th:text="${endpoint.apiCall}"></th:block></a></li>

                                <th:block th:if="${iterStat.count > 0 and !iterStat.first and !iterStat.last and (apiEndpointsMapList[iterStat.index+1].role)!=(endpoint.role)}">
                                    <th:block th:remove="tag" th:utext="'&lt;/ul&gt;&lt;/li&gt;'"></th:block>
                                </th:block>

                            </th:block>
                        </ul>
                    </li>
                </ul>
            </nav>
        </th:block>

    </div>

    <div class="row">
        <footer class="pt-3 mt-4 text-muted border-top">
            <p>&copy; <span id="copyrightYear"></span> Shashin</p>
        </footer>
    </div>

    <script type="application/javascript">
        $(document).ready(function() {
            const scrollToTopButton = $("#btn-back-to-top");
            const showScrollToTop = function (scrollEl) {
                if (scrollToTopButton.length > 0) {
                    if (scrollEl.scrollTop() > 0) {
                        scrollToTopButton.css("display", "block");
                    } else {
                        scrollToTopButton.css("display", "none");
                    }
                }
            }

            const elToScroll = window;

            $(elToScroll).on('scroll', function () {
                showScrollToTop($(elToScroll));
            });

            if (scrollToTopButton.length > 0) {
                scrollToTopButton.on("click", function () {
                    $(elToScroll)[0].scrollTo({top: 0, behavior: 'smooth'});
                });
            }

            // Dark mode operations
            const dmCookieName = "shashinlogindmcookie";
            const darkModeCookie = Util.getCookie(dmCookieName);

            Util.darkModeToggle(darkModeCookie !== null && darkModeCookie === "on");

            const mode = Util.getParameterByName("m");

            if (mode === "dark" || (darkModeCookie !== null && darkModeCookie === "on")) {
                $("#darkmodeSwitch").prop('checked', true);
            }

            $('#darkmodeSwitch').on("click", function() {
                let html = $("html");
                html.hide();

                Util.deleteCookie(dmCookieName);
                if ($("#darkmodeSwitch").is(':checked')) {
                    Util.setCookie(dmCookieName, "", "/", 365);
                }
                Util.darkModeToggle($("#darkmodeSwitch").is(':checked'));
                html.show();
            });
        });
    </script>
</div>

<script type="text/javascript" th:nonce="${cspNonce}">
    $("#copyrightYear").text("2021-" + new Date().getFullYear());
</script>

</body>
</html>
