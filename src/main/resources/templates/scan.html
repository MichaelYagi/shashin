<!DOCTYPE html>
<html lang="en" xmlns:th="http://thymeleaf.org">
<head th:insert="fragments/head :: head(${titleDescriptor})"></head>
<body>

<div th:replace="fragments/topnav :: topnav(${authority},${username},${activePage})"></div>

<div class="container-fluid">
    <div class="row">
        <div th:replace="fragments/sidebar :: sidebar(${activeSidebar},${authority})"></div>
        <main role="main" class="col-md-11 col-lg-11 pt-3 px-4">
            <div th:replace="fragments/content :: content(${message},${activePage},${authority},${parameter})" class="col-sm p-3 min-vh-100"></div>
            <button class="btn btn-primary" id="scanPhotos">Scan</button>
            <button class="btn btn-danger" id="deleteThread">Delete Thread</button>
            <div th:replace="fragments/footer :: footer(${copyrightYear},${operatingSystemInfo},${buildProperties})"></div>
        </main>
    </div>
</div>

<script type="text/javascript">
    $(document).ready(function () {
        // Web socket
        var stompClient = null;
        var scanInProgress = false;
        var showDebug = false;

        connect();

        $("#scanPhotos").click(function (e) {
            e.preventDefault();
            postToScan(false);
        });

        $("#deleteThread").click(function (e) {
            e.preventDefault();
            let posting = $.post(
                "/settings/scan",
                {"submit": "", "deleteThread": true}
            );

            posting.done(function (data) {
                if (data.hasOwnProperty("msg")) {
                    showMessage(data["msg"]);
                }
            });
        });

        function postToScan(deleteThread) {
            let posting = $.post(
                "/settings/scan",
                {"submit": "Scan", "deleteThread": deleteThread}
            );

            posting.done(function (data) {
                showMessage(data.hasOwnProperty("msg") ? data["msg"] : "")
                //console.log($("#msg").text());
                if (scanInProgress === false) {
                    // console.log($("#msg").text());
                    if ($("#msg").text() === "Start Scan") {
                        connect();
                    } else {
                        scanRefresh();
                    }
                }
            });

            return false;
        }

        function scanRefresh() {
            sendMessage();
            let msgId = "#msg";
            if ($(msgId).text() === "No directories configured" || $(msgId).text() === "Scan Complete") {
                scanInProgress = false;
                disconnect();
            } else {
                scanInProgress = true;
                setTimeout(scanRefresh, 5000);
            }
        }

        function connect() {
            var socket = new SockJS('/websocket-endpoint');
            stompClient = Stomp.over(socket);
            if (showDebug === false) {
                stompClient.debug = null
            }

            // console.log("Socket Connecting");

            stompClient.connect({}, function() {
                if (scanInProgress === false) {
                    scanRefresh();
                }
                // console.log( "Connected STOMP client");
                this.subscribe("/topic/messages", function (message) {
                    let respMessage = JSON.parse(message.body).content;
                    //console.log("message: "+message);
                    showMessage(respMessage);
                });
            }, function(e) {
                // console.log( "connect() error" );
                // console.log( error );
                showMessage("Socket connection error: " + e.toString())
                scanInProgress = false;
            });
        }

        function disconnect() {
            if (stompClient !== null) {
                stompClient.disconnect();
            }
            //console.log("Disconnected");
        }

        function sendMessage() {
            if (stompClient !== null) {
                stompClient.send("/app/scanmessage", {}, JSON.stringify({'message': "getScanMessage"}));
            } else {
                showMessage("Trying to send message but STOMP client is null")
                scanInProgress = false;
            }
        }

        function showMessage(message) {
            $("#msg").text(message);
        }
    });
</script>
</body>
</html>
