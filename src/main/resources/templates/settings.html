<!DOCTYPE html>
<html lang="en">
<head th:insert="fragments/head :: head(${titleDescriptor})"></head>
<body>
<div id="contents">
    <div class="container-fluid">
        <div class="row">
            <div th:insert="fragments/sidebar :: sidebar()"></div>
            <div class="container">
                <div th:replace="fragments/content :: content(${data},${activePage})" class="col-sm p-3 min-vh-100"></div>
                <div th:replace="fragments/footer :: footer(${copyrightYear})"></div>
            </div>
        </div>
    </div>
</div>

<script type="text/babel">
    var app = new Vue({
        el: '#contents'
    });
</script>
</body>
</html>
