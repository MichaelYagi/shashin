<!DOCTYPE html>
<th:block th:insert="~{fragments/asciiart :: asciiart()}"></th:block>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:insert="~{fragments/head :: head(${activePage},${titleDescriptor})}"></head>
<body class="thumb d-flex flex-column vh-100">

<div th:replace="~{fragments/topnav :: topnav(${currentUser},${activePage},'')}"></div>

<div th:replace="~{fragments/settingsgroup :: settings(${activePage},${faceRecogServicesAvailable},${objectRecogEnabled},${facialRecogEnabled})}"></div>

<div id="container" class="container-fluid pb-3 flex-grow-1 d-flex flex-column overflow-auto">
    <div class="row flex-grow-sm-1 flex-grow-0">
        <div th:replace="~{fragments/sidebaroffcanvas :: sidebaroffcanvas(${activeSidebar},${currentUser})}"></div>

        <main role="main" class="col overflow-auto h-100">
            <th:block th:if="${authority == 'ROLE_SUPER'}">
                <div th:replace="~{fragments/hiddenfields :: hiddenfields(${message})}"></div>

                <br>

                <th:block th:if="${settings != null}">
                    <form id="saveSettingsForm" method="post" action="/settings">
                        <input type="hidden" id="pathInput" value="">
                        <input type="hidden" id="selectedPathInput" value="">

                        <div class="input-group mb-2">
                            <h1 class="display-1" style="font-size:1.5rem;"><th:block th:text="#{main.pages.settings.basic}"></th:block></h1>
                        </div>
                        <div class="card mt-2 px-2 pt-2 pb-2">
                            <div class="row">
                                <div class="col-12">
                                    <label for="mediaDirTextArea" class="form-label"><strong><th:block th:text="#{main.pages.settings.directories}"></th:block></strong> (<th:block th:text="#{main.pages.settings.seperated}"></th:block>)</label>&nbsp;<span id="inclusionListInfo" style="color: blue;font-size: 1rem;" class="bi-info-circle" data-bs-toggle="tooltip" th:title="#{main.pages.settings.directories.tooltip}"></span>
                                    <div>
                                        <textarea class="form-control" id="mediaDirTextArea" name="mediaDirList" rows="5"><th:block th:text="${mediaDirList}"></th:block></textarea>
                                    </div>

                                    <label for="mediaExcludeDirTextArea" class="form-label"><strong><th:block th:text="#{main.pages.settings.excluded}"></th:block></strong> (<th:block th:text="#{main.pages.settings.seperated}"></th:block>)</label>&nbsp;<span id="exclusionListInfo" style="color: blue;font-size: 1rem;" class="bi-info-circle" data-bs-toggle="tooltip" th:title="#{main.pages.settings.seperated.tooltip}"></span>
                                    <div>
                                        <textarea class="form-control" id="mediaExcludeDirTextArea" name="mediaExcludeDirList" rows="3"><th:block th:text="${mediaExcludeDirList}"></th:block></textarea>
                                    </div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-12">
                                    <label for="uploadMediaDirectory" class="form-label"><strong><th:block th:text="#{main.pages.settings.uploaded}"></th:block></strong></label>&nbsp;<span id="mediaUploadInfo" style="color: blue;font-size: 1rem;" class="bi-info-circle" data-bs-toggle="tooltip" th:title="#{main.pages.settings.uploaded.tooltip}"></span>
                                    <input class="form-control" id="uploadMediaDirectory" name="uploadMediaDirectory" th:value="${settings.uploadMediaDirectory}">
                                </div>
                            </div>
                            <div class="card mt-2">
                                <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="collapse" data-bs-target="#collapseDirectories" aria-expanded="false" aria-controls="collapseDirectories">
                                    <th:block th:text="#{main.pages.settings.control.browse}"></th:block>
                                </button>
                                <div class="collapse" id="collapseDirectories">
                                    <input class="form-control" type="text" id="selectedPath" th:placeholder="#{main.pages.settings.control.browse.selectdirectory}" readonly>
                                    <button id="parentFolder" type="button" class="btn btn-secondary btn-sm mt-1"><i class="bi-arrow-90deg-up"></i></button>&nbsp;<button type="button" id="selectFolder" class="btn btn-primary btn-sm mt-1"><th:block th:text="#{main.pages.settings.control.browse.button.select}"></th:block></button>

                                    <div class="card-body scroll" style="height: 300px">
                                        <ul class="card-body list-group list-group-flush" id="dirList" style="list-style-type: none;">
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <br>

                        <div class="input-group mb-2">
                            <h1 class="display-1" style="font-size:1.5rem;"><th:block th:text="#{main.pages.settings.advanced}"></th:block></h1>
                        </div>
                        <div class="card mt-2 px-2 pt-2 pb-2">
                            <div class="row">
                                <div class="col-3">
                                    <label for="recognitionConfidenceThreshold" class="form-label"><strong><th:block th:text="#{main.pages.settings.tweaks.facial}"></th:block></strong> (<th:block th:text="#{main.pages.settings.tweaks.default}"></th:block> 0.8)</label>
                                    <input class="form-control" id="recognitionConfidenceThreshold" name="recognitionConfidenceThreshold" th:value="${settings.recognitionConfidenceThreshold}">
                                </div>
                                <div class="col-3">
                                    <label for="objectRecognitionConfidenceThreshold" class="form-label"><strong><th:block th:text="#{main.pages.settings.tweaks.object}"></th:block></strong> (<th:block th:text="#{main.pages.settings.tweaks.default}"></th:block> 0.45)</label>
                                    <input class="form-control" id="objectRecognitionConfidenceThreshold" name="objectRecognitionConfidenceThreshold" th:value="${settings.objectRecognitionConfidenceThreshold}">
                                </div>
                                <div class="col-3">
                                    <label for="queryLimit" class="form-label"><strong><th:block th:text="#{main.pages.settings.tweaks.pagination}"></th:block></strong> (<th:block th:text="#{main.pages.settings.tweaks.default}"></th:block> 30)</label>
                                    <input class="form-control" id="queryLimit" name="queryLimit" th:value="${settings.queryLimit}">
                                </div>
                                <div class="col-3">
                                    <label for="notificationLimit" class="form-label"><strong><th:block th:text="#{main.pages.settings.tweaks.notification}"></th:block></strong> (<th:block th:text="#{main.pages.settings.tweaks.default}"></th:block> 20)</label>
                                    <input class="form-control" id="notificationLimit" name="notificationLimit" th:value="${settings.notificationLimit}">
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-4">
                                    <label for="searchHistoryLimit" class="form-label"><strong><th:block th:text="#{main.pages.settings.tweaks.search}"></th:block></strong> (<th:block th:text="#{main.pages.settings.tweaks.default}"></th:block> 10)</label>
                                    <input class="form-control" id="searchHistoryLimit" name="searchHistoryLimit" th:value="${settings.searchHistoryLimit}">
                                </div>
                                <div class="col-4">
                                    <label for="matchScanLimit" class="form-label"><strong><th:block th:text="#{main.pages.settings.tweaks.match}"></th:block></strong> (<th:block th:text="#{main.pages.settings.tweaks.default}"></th:block> 30)</label>
                                    <input class="form-control" id="matchScanLimit" name="matchScanLimit" th:value="${settings.matchScanLimit}">
                                </div>
                                <div class="col-4">
                                    <label for="trainingDataLimit" class="form-label"><strong><th:block th:text="#{main.pages.settings.tweaks.training}"></th:block></strong> (<th:block th:text="#{main.pages.settings.tweaks.default}"></th:block> 100)</label>
                                    <input class="form-control" id="trainingDataLimit" name="trainingDataLimit" th:value="${settings.trainingDataLimit}">
                                </div>
<!--                                <div class="col-3">-->
<!--                                    <label for="changePort" class="form-label"><strong>Change Port</strong></label>&nbsp;<span id="changePortInfo" style="color: blue;font-size: 1rem;" class="bi-info-circle" data-bs-toggle="tooltip" title="Restarts app after updated and saved"></span>-->
                                    <input type="hidden" class="form-control" id="changePort" name="changePort" th:value="${settings.port}">
<!--                                </div>-->
                            </div>
                            <div class="row">
                                <div class="col-6">
                                    <label for="compreFaceServer" class="form-label"><strong><th:block th:text="#{main.pages.settings.comprefaceurl}"></th:block></strong> (<th:block th:text="#{main.pages.settings.comprefaceurl.example}"></th:block> http://127.0.0.1:8000/)&nbsp;<span id="compreFaceInfo" style="color: blue;font-size: 1rem;" class="bi-info-circle" data-bs-toggle="tooltip" th:title="#{main.pages.settings.comprefaceurl.tooltip}"></span></label>
                                    <input class="form-control" id="compreFaceServer" name="compreFaceServer" th:value="${settings.compreFaceServer}">
                                </div>
                                <div class="col-6">
                                    <label for="compreFaceKey" class="form-label"><strong><th:block th:text="#{main.pages.settings.comprefacekey}"></th:block></strong></label>&nbsp;<span id="faceRecogAvailableStatusInfo" th:style="${'color: '+faceRecogAvailableStatusColor+';font-size: 1rem;'}" th:class="${faceRecogAvailableStatusIcon}" data-bs-toggle="tooltip" th:title="${faceRecogAvailableStatusText}"></span>
                                    <input class="form-control" id="compreFaceKey" name="compreFaceKey" th:value="${settings.compreFaceKey}">
                                </div>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="objectDetection" name="objectDetection" th:checked="${settings.objectDetection}">
                                <label class="form-check-label" for="objectDetection">
                                    <strong><th:block th:text="#{main.pages.settings.enableobject}"></th:block></strong>&nbsp;<span id="objectDetectionInfo" style="color: blue;font-size: 1rem;" class="bi-info-circle" data-bs-toggle="tooltip" th:title="#{main.pages.settings.enableobject.tooltip}"></span>
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="facialDetection" name="facialDetection" th:checked="${settings.facialDetection}">
                                <label class="form-check-label" for="objectDetection">
                                    <strong><th:block th:text="#{main.pages.settings.enableface}"></th:block></strong>&nbsp;<span id="objectFacialInfo" style="color: blue;font-size: 1rem;" class="bi-info-circle" data-bs-toggle="tooltip" th:title="#{main.pages.settings.enableface.tooltip}"></span>
                                </label>
                            </div>
                            <div class="form-check">
                                <div>
                                    <input class="form-check-input" type="checkbox" id="scheduledMatching" name="scheduledMatching" th:checked="${settings.scheduledMatching}">
                                    <label class="form-check-label" for="scheduledMatching">
                                        <strong><th:block th:text="#{main.pages.settings.enableschedule}"></th:block></strong>&nbsp;<span id="scheduledMatchingInfo" style="color: blue;font-size: 1rem;" class="bi-info-circle" data-bs-toggle="tooltip" th:title="#{main.pages.settings.enableschedule.tooltip}"></span>
                                    </label>
                                </div>

                                <div class="form-group">
                                    <label for="scheduledTime"><th:block th:text="#{main.pages.settings.taskschedule}"></th:block></label>&nbsp;<span id="scheduledTimeInfo" style="color: blue;font-size: 1rem;" class="bi-info-circle" data-bs-toggle="tooltip" th:title="#{main.pages.settings.taskschedule.tooltip}"></span>
                                    <div class="col-sm-1">
                                        <select class="form-select" id="scheduledTime" name="scheduledTime">
                                            <th:block th:each="time, iterStat: ${timeScheduleList}">
                                                <th:block th:if="${scheduledTime==time}">
                                                    <option th:value="${time}" th:text="${time}" selected></option>
                                                </th:block>
                                                <th:block th:if="${scheduledTime!=time}">
                                                    <option th:value="${time}" th:text="${time}"></option>
                                                </th:block>
                                            </th:block>
                                        </select>
                                    </div>
                                    &nbsp;<span th:text="${currentTimezone}"></span>
                                </div>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="scanAutomatically" name="scanAutomatically" th:checked="${settings.scanAutomatically}">
                                <label class="form-check-label" for="scanAutomatically">
                                    <strong><th:block th:text="#{main.pages.settings.autoscanning}"></th:block></strong>&nbsp;<span id="scanAutomaticallyInfo" style="color: blue;font-size: 1rem;" class="bi-info-circle" data-bs-toggle="tooltip" th:title="#{main.pages.settings.autoscanning.tooltip}"></span>
                                </label>
                            </div>
                        </div>

                        <br>

                        <div class="row">
                            <div class="col-12">
                                <button type="submit" class="btn btn-primary" name="saveSettings" id="saveSettings" value="Save"><th:block th:text="#{main.modal.save}"></th:block></button>
                            </div>
                        </div>

                        <hr>

                        <div class="card mt-2">
                            <button class="btn btn-danger dropdown-toggle" type="button" data-bs-toggle="collapse" data-bs-target="#collapseDelete" aria-expanded="false" aria-controls="collapseDelete">
                                <th:block th:text="#{main.pages.settings.control.delete}"></th:block>
                            </button>
                            <div class="collapse alert-danger" id="collapseDelete">
                                <div class="alert" role="alert">
                                    <p><span class="bi-exclamation-triangle-fill"></span> <th:block th:text="#{main.pages.settings.control.delete.warning}"></th:block></p>
                                    <p><th:block th:text="#{main.pages.settings.control.delete.message}"></th:block></p>
                                    <a href="#" class="btn btn-danger" id="deleteContent"><th:block th:text="#{main.pages.settings.control.delete.button}"></th:block></a>
                                </div>
                            </div>
                        </div>
                    </form>
                </th:block>
            </th:block>

            <div th:replace="~{fragments/footer :: footer(${copyrightYear},${operatingSystemInfo},${buildProperties},${activeProfile},${activePage})}"></div>
        </main>
    </div>
</div>

<div class="modal fade" id="propDeleteContent" tabindex="-1" role="dialog" aria-labelledby="labelDeleteContent">
    <div class="modal-dialog modal-dialog-scrollable modal-sm" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="deleteContentLabel">Delete Content</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                Type <strong>DELETE</strong> to confirm<br>
                <input class="form-control" type="text" id="deleteConfirm" value="">
            </div>
            <div class="modal-footer">
                <div id="deleteContentModalStatus" class="spinner-grow me-auto" style="visibility: hidden;font-size: 1.55rem;" role="status" data-bs-toggle="tooltip" data-bs-placement="right" title=""></div>
                <button type="button" class="btn btn-danger" id="deleteContentConfirm">Confirm</button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript" th:inline="javascript" th:nonce="${cspNonce}">
    $(document).ready(async function () {
        /*<![CDATA[*/
        shashin.nonce = /*[[${cspNonce}]]*/ '';
        const statusMessage = /*[[${statusMessage}]]*/ '';
        const status = /*[[${status}]]*/ '';
        /*]]>*/

        if (statusMessage !== '' && status !== '') {
            if (status === "warning") {
                shashin.showToastMessage("Error", statusMessage, {icon:"bi-exclamation-triangle", iconColor:"#FF0000", autohide: false, borderColor:"danger", placement:shashin.toast.placement.top.center});
            } else {
                shashin.showToastMessage("Settings saved", statusMessage, {icon:"bi-info-circle", iconColor:"#777777", autohide: false, borderColor:"success", placement:shashin.toast.placement.top.center});
            }
        }

        const settingsInstance = new Settings();
        await settingsInstance.init();

        $('[data-bs-toggle="tooltip"]').tooltip({
            placement: "right"
        });
    });
</script>

</body>
</html>
