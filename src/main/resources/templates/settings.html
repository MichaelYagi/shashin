<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:insert="~{fragments/head :: head(${activePage},${titleDescriptor})}"></head>
<body class="thumb d-flex flex-column vh-100">

<div th:replace="~{fragments/topnav :: topnav(${currentUser},${activePage},'')}"></div>

<div th:replace="~{fragments/settingsgroup :: settings(${activePage},${faceRecogServicesAvailable},${objectRecogEnabled},${facialRecogEnabled})}"></div>

<div id="container" class="container-fluid pb-3 flex-grow-1 d-flex flex-column overflow-auto">
    <div class="row flex-grow-sm-1 flex-grow-0">
        <div th:replace="~{fragments/sidebaroffcanvas :: sidebaroffcanvas(${activeSidebar},${currentUser})}"></div>

        <main role="main" class="col overflow-auto h-100">
            <th:block th:if="${authority == 'ROLE_SUPER'}">
                <div th:replace="~{fragments/hiddenfields :: hiddenfields(${message})}"></div>

                <br>

                <th:block th:if="${settings != null}">
                    <form id="saveSettingsForm" method="post" action="/settings">
                        <input type="hidden" id="pathInput" value="">
                        <input type="hidden" id="selectedPathInput" value="">
                        <div class="card mt-2 px-2 pt-2 pb-2">
                            <div class="row">
                                <div class="col-12">
                                    <label for="mediaDirTextArea" class="form-label"><strong>Media directories and files</strong> (separate by line)</label>&nbsp;<span id="inclusionListInfo" style="color: blue;font-size: 1rem;" class="bi-info-circle" data-bs-toggle="tooltip" title="When Automatic Media Indexing is enabled, changing this value will restart the app"></span>
                                    <div>
                                        <textarea class="form-control" id="mediaDirTextArea" name="mediaDirList" rows="5"><th:block th:text="${mediaDirList}"></th:block></textarea>
                                    </div>

                                    <label for="mediaExcludeDirTextArea" class="form-label"><strong>Excluded media directories and files</strong> (separate by line)</label>&nbsp;<span id="exclusionListInfo" style="color: blue;font-size: 1rem;" class="bi-info-circle" data-bs-toggle="tooltip" title="Exclusion list takes precedence over inclusion list"></span>
                                    <div>
                                        <textarea class="form-control" id="mediaExcludeDirTextArea" name="mediaExcludeDirList" rows="3"><th:block th:text="${mediaExcludeDirList}"></th:block></textarea>
                                    </div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-12">
                                    <label for="uploadMediaDirectory" class="form-label"><strong>Media upload directory</strong></label>&nbsp;<span id="mediaUploadInfo" style="color: blue;font-size: 1rem;" class="bi-info-circle" data-bs-toggle="tooltip" title="Define with a valid directory to allow media uploads. Uploads can be done on album and explore pages."></span>
                                    <input class="form-control" id="uploadMediaDirectory" name="uploadMediaDirectory" th:value="${settings.uploadMediaDirectory}">
                                </div>
                            </div>
                            <div class="card mt-2">
                                <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="collapse" data-bs-target="#collapseDirectories" aria-expanded="false" aria-controls="collapseDirectories">
                                    Browse Directories
                                </button>
                                <div class="collapse" id="collapseDirectories">
                                    <input class="form-control" type="text" id="selectedPath" placeholder="Select Directory" readonly>
                                    <button id="parentFolder" type="button" class="btn btn-secondary btn-sm mt-1"><i class="bi-arrow-90deg-up"></i></button>&nbsp;<button type="button" id="selectFolder" class="btn btn-primary btn-sm mt-1">Select</button>

                                    <div class="card-body scroll" style="height: 300px">
                                        <ul class="card-body list-group list-group-flush" id="dirList" style="list-style-type: none;">
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-3">
                                <label for="recognitionConfidenceThreshold" class="form-label"><strong>Facial Recognition Confidence Threshold</strong> (Default 0.8)</label>
                                <input class="form-control" id="recognitionConfidenceThreshold" name="recognitionConfidenceThreshold" th:value="${settings.recognitionConfidenceThreshold}">
                            </div>
                            <div class="col-3">
                                <label for="objectRecognitionConfidenceThreshold" class="form-label"><strong>Object Recognition Confidence Threshold</strong> (Default 0.45)</label>
                                <input class="form-control" id="objectRecognitionConfidenceThreshold" name="objectRecognitionConfidenceThreshold" th:value="${settings.objectRecognitionConfidenceThreshold}">
                            </div>
                            <div class="col-3">
                                <label for="queryLimit" class="form-label"><strong>Paging Results Query Limit</strong> (Default 30)</label>
                                <input class="form-control" id="queryLimit" name="queryLimit" th:value="${settings.queryLimit}">
                            </div>
                            <div class="col-3">
                                <label for="notificationLimit" class="form-label"><strong>Notification Limit</strong> (Default 20)</label>
                                <input class="form-control" id="notificationLimit" name="notificationLimit" th:value="${settings.notificationLimit}">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-3">
                                <label for="searchHistoryLimit" class="form-label"><strong>Search History Limit</strong> (Default 10)</label>
                                <input class="form-control" id="searchHistoryLimit" name="searchHistoryLimit" th:value="${settings.searchHistoryLimit}">
                            </div>
                            <div class="col-3">
                                <label for="matchScanLimit" class="form-label"><strong>Match Scan Limit</strong> (Default 30)</label>
                                <input class="form-control" id="matchScanLimit" name="matchScanLimit" th:value="${settings.matchScanLimit}">
                            </div>
                            <div class="col-3">
                                <label for="trainingDataLimit" class="form-label"><strong>Training Data Limit</strong> (Default 100)</label>
                                <input class="form-control" id="trainingDataLimit" name="trainingDataLimit" th:value="${settings.trainingDataLimit}">
                            </div>
                            <div class="col-3">
                                <label for="changePort" class="form-label"><strong>Change Port</strong></label>&nbsp;<span id="changePortInfo" style="color: blue;font-size: 1rem;" class="bi-info-circle" data-bs-toggle="tooltip" title="Restarts app after updated and saved"></span>
                                <input class="form-control" id="changePort" name="changePort" th:value="${settings.port}">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-6">
                                <label for="compreFaceServer" class="form-label"><strong>CompreFace Endpoint</strong> (eg. http://127.0.0.1:8000/)&nbsp;<span id="compreFaceInfo" style="color: blue;font-size: 1rem;" class="bi-info-circle" data-bs-toggle="tooltip" title="Setup your own CompreFace server (https://github.com/exadel-inc/CompreFace) for facial recognition."></span></label>
                                <input class="form-control" id="compreFaceServer" name="compreFaceServer" th:value="${settings.compreFaceServer}">
                            </div>
                            <div class="col-6">
                                <label for="compreFaceKey" class="form-label"><strong>CompreFace API key</strong></label>&nbsp;<span id="faceRecogAvailableStatusInfo" th:style="${'color: '+faceRecogAvailableStatusColor+';font-size: 1rem;'}" th:class="${faceRecogAvailableStatusIcon}" data-bs-toggle="tooltip" th:title="${faceRecogAvailableStatusText}"></span>
                                <input class="form-control" id="compreFaceKey" name="compreFaceKey" th:value="${settings.compreFaceKey}">
                            </div>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="objectDetection" name="objectDetection" th:checked="${settings.objectDetection}">
                            <label class="form-check-label" for="objectDetection">
                                <strong>Enable object detection</strong>&nbsp;<span id="objectDetectionInfo" style="color: blue;font-size: 1rem;" class="bi-info-circle" data-bs-toggle="tooltip" title="Enabling puts CPU under load during processing"></span>
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="facialDetection" name="facialDetection" th:checked="${settings.facialDetection}">
                            <label class="form-check-label" for="objectDetection">
                                <strong>Enable face detection</strong>&nbsp;<span id="objectFacialInfo" style="color: blue;font-size: 1rem;" class="bi-info-circle" data-bs-toggle="tooltip" title="Enabling puts CPU under load during processing, unless CompreFace is setup"></span>
                            </label>
                        </div>
                        <div class="form-check">
                            <div class="col-3">
                                <input class="form-check-input" type="checkbox" id="scheduledMatching" name="scheduledMatching" th:checked="${settings.scheduledMatching}">
                                <label class="form-check-label" for="scheduledMatching">
                                    <strong>Enable scheduled background matching</strong>&nbsp;<span id="scheduledMatchingInfo" style="color: blue;font-size: 1rem;" class="bi-info-circle" data-bs-toggle="tooltip" title="Scans people and objects as a background job"></span>
                                </label>
                            </div>

                            <div class="col-2 form-group">
                                <label for="scheduledTime">Time at which tasks run</label>&nbsp;<span id="scheduledTimeInfo" style="color: blue;font-size: 1rem;" class="bi-info-circle" data-bs-toggle="tooltip" title="Restarts app after updated and saved"></span>
                                <div class="col-5">
                                    <select class="form-select" id="scheduledTime" name="scheduledTime">
                                        <th:block th:each="time, iterStat: ${timeScheduleList}">
                                            <th:block th:if="${scheduledTime==time}">
                                                <option th:value="${time}" th:text="${time}" selected></option>
                                            </th:block>
                                            <th:block th:if="${scheduledTime!=time}">
                                                <option th:value="${time}" th:text="${time}"></option>
                                            </th:block>
                                        </th:block>
                                    </select>&nbsp;<span th:text="${currentTimezone}"></span>
                                </div>
                            </div>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="scanAutomatically" name="scanAutomatically" th:checked="${settings.scanAutomatically}">
                            <label class="form-check-label" for="scanAutomatically">
                                <strong>Automatic Media Indexing</strong>&nbsp;<span id="scanAutomaticallyInfo" style="color: blue;font-size: 1rem;" class="bi-info-circle" data-bs-toggle="tooltip" title="Automatically scans media when changes detected in media directories"></span>
                            </label>
                        </div>

                        <br>

                        <div class="row">
                            <div class="col-12">
                                <button type="submit" class="btn btn-primary" name="saveSettings" id="saveSettings" value="Save">Save</button>
                            </div>
                        </div>

                        <hr>

                        <div class="card mt-2">
                            <button class="btn btn-danger dropdown-toggle" type="button" data-bs-toggle="collapse" data-bs-target="#collapseDelete" aria-expanded="false" aria-controls="collapseDelete">
                                Delete Content
                            </button>
                            <div class="collapse alert-danger" id="collapseDelete">
                                <div class="alert" role="alert">
                                    <p><span class="exclamation-triangle-fill"></span>Warning! This will wipe all sidecar media content - thumbnails and metadata will be removed!<br>Settings on this page and media directories configured will be not be deleted.</p>
                                    <a href="#" class="btn btn-danger" id="deleteContent">Delete</a>
                                </div>
                            </div>
                        </div>
                    </form>
                </th:block>
            </th:block>

            <div th:replace="~{fragments/footer :: footer(${copyrightYear},${operatingSystemInfo},${buildProperties},${activeProfile},${activePage})}"></div>
        </main>
    </div>
</div>

<div class="modal fade" id="propDeleteContent" tabindex="-1" role="dialog" aria-labelledby="labelDeleteContent" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="deleteContentLabel">Delete Content</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                Are you sure you want to delete all content?
                <div class="col-sm"><span id="msgDeleteContent"></span></div>
            </div>
            <div class="modal-footer">
                <div id="deleteContentModalStatus" class="spinner-grow me-auto" style="visibility: hidden;font-size: 1.55rem;" role="status" aria-hidden="true" data-bs-toggle="tooltip" data-bs-placement="right" title=""></div>
                <button type="button" class="btn btn-primary" id="deleteContentConfirm">Confirm</button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript" th:inline="javascript" th:nonce="${cspNonce}">
    $(document).ready(async function () {
        /*<![CDATA[*/
        shashin.nonce = /*[[${cspNonce}]]*/ '';
        const statusMessage = /*[[${statusMessage}]]*/ '';
        const status = /*[[${status}]]*/ '';
        /*]]>*/

        if (statusMessage !== '' && status !== '') {
            if (status === "warning") {
                shashin.showToastMessage("Error", statusMessage, {icon:"bi-exclamation-triangle", iconColor:"#FF0000", autohide: false, borderColor:"danger"});
            } else {
                shashin.showToastMessage("Settings saved", statusMessage, {icon:"bi-info-circle", iconColor:"#777777", autohide: false});
            }
        }

        const settingsInstance = new Settings();
        await settingsInstance.init();

        $('[data-bs-toggle="tooltip"]').tooltip({
            placement: "right"
        });
    });
</script>

</body>
</html>
