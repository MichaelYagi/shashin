<!DOCTYPE html>
<html lang="en" xmlns:th="http://thymeleaf.org">
<head th:insert="fragments/head :: head(${titleDescriptor})"></head>
<body class="thumb d-flex flex-column vh-100">

<div th:replace="fragments/topnav :: topnav(${currentUser},${activePage},'')"></div>

<div id="container" class="container-fluid pb-3 flex-grow-1 d-flex flex-column overflow-auto">
    <div class="row flex-grow-sm-1 flex-grow-0">
        <div th:replace="fragments/sidebaroffcanvas :: sidebaroffcanvas(${activeSidebar},${currentUser})"></div>
        <main role="main" class="col overflow-auto h-100">
            <th:block th:if="${authority == 'ROLE_ADMIN'}">
                <div th:replace="fragments/content :: content(${message},${activePage},${authority},${parameter},'')" class="col-sm p-3 min-vh-100"></div>

                <br>
                <form id="saveSettingsForm" method="post" action="/settings">
                    <th:block th:if="${statusMessage != '' and alertClass != ''}">
                        <div class="col-12">
                            <div th:if="${statusMessage}" th:text="${statusMessage}" th:class="${'alert ' + alertClass}"/>
                        </div>
                    </th:block>
                    <div class="row">
                        <div class="col-12">
                            <label for="mediaDirTextArea" class="form-label"><strong>Media directories (comma separated) <span style="color: red;font-size: 1rem;" class="bi-info-circle" data-toggle="tooltip" title="Restarts app when change detected and Automatic Media Indexing enabled"></span></strong></label>
                            <textarea class="form-control" id="mediaDirTextArea" name="mediaDirList" rows="3"><th:block th:text="${mediaDirList}"></th:block></textarea>
                            <div class="mt-1">
                                <button id="choosedirectory" class="btn btn-outline-secondary btn-sm">Choose Folder</button>
                            </div>
                        </div>
                    </div>
                    <th:block th:if="${settings != null}">
                        <div class="row">
                            <div class="col-4">
                                <label for="recognitionConfidenceThreshold" class="form-label"><strong>Recognition Confidence Threshold (Default 0.6)</strong></label>
                                <input class="form-control" id="recognitionConfidenceThreshold" name="recognitionConfidenceThreshold" th:value="${settings.recognitionConfidenceThreshold}">
                            </div>
                            <div class="col-4">
                                <label for="queryLimit" class="form-label"><strong>Paging Results Query Limit (Default 20)</strong></label>
                                <input class="form-control" id="queryLimit" name="queryLimit" th:value="${settings.queryLimit}">
                            </div>
                            <div class="col-4">
                                <label for="notificationLimit" class="form-label"><strong>Notification Limit (Default 20)</strong></label>
                                <input class="form-control" id="notificationLimit" name="notificationLimit" th:value="${settings.notificationLimit}">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-3">
                                <label for="searchHistoryLimit" class="form-label"><strong>Search History Limit (Default 15)</strong></label>
                                <input class="form-control" id="searchHistoryLimit" name="searchHistoryLimit" th:value="${settings.searchHistoryLimit}">
                            </div>
                            <div class="col-3">
                                <label for="matchScanLimit" class="form-label"><strong>Match Scan Limit (Default 50)</strong></label>
                                <input class="form-control" id="matchScanLimit" name="matchScanLimit" th:value="${settings.matchScanLimit}">
                            </div>
                            <div class="col-3">
                                <label for="trainingDataLimit" class="form-label"><strong>Training Data Limit (Default 100)</strong></label>
                                <input class="form-control" id="trainingDataLimit" name="trainingDataLimit" th:value="${settings.trainingDataLimit}">
                            </div>
                            <div class="col-3">
                                <label for="changePort" class="form-label"><strong>Change Port <span style="color: red;font-size: 1rem;" class="bi-info-circle" data-toggle="tooltip" title="Restarts app when change detected"></span></strong></label>
                                <input class="form-control" id="changePort" name="changePort" th:value="${settings.port}">
                            </div>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="scanAutomatically" name="scanAutomatically" th:checked="${settings.scanAutomatically}">
                            <label class="form-check-label" for="scanAutomatically">
                                <strong>Automatic Media Indexing</strong>
                            </label>
                        </div>
                    </th:block>
                    <br>
                    <div class="row">
                        <div class="col-12">
                            <button type="submit" class="btn btn-primary" name="saveSettings" id="saveSettings" value="Save">Save</button>
                        </div>
                    </div>
                    <hr>
                    <div class="alert alert-danger" role="alert">
                        <h4 class="alert-heading">Delete Content</h4>
                        <p><span class="exclamation-triangle-fill"></span>Warning! This will wipe all media content! (Media directories will be not be reset)</p>
                        <a href="#" class="btn btn-danger" id="deleteContent">Delete</a>
                    </div>
                </form>
            </th:block>

            <div th:replace="fragments/footer :: footer(${copyrightYear},${operatingSystemInfo},${buildProperties})"></div>
        </main>
    </div>
</div>

<div class="modal fade" id="propDeleteContent" tabindex="-1" role="dialog" aria-labelledby="labelDeleteContent" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="deleteContentLabel">Delete Content</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                Are you sure you want to delete all content?
                <div class="col-sm"><span id="msgDeleteContent"></span></div>
            </div>
            <div class="modal-footer">
                <div id="deleteContentModalStatus" class="spinner-grow me-auto" style="visibility: hidden;font-size: 2rem;" role="status" aria-hidden="true" data-bs-toggle="tooltip" data-bs-placement="right" title=""></div>
                <button type="button" class="btn btn-primary" id="deleteContentConfirm">Confirm</button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript" th:nonce="${cspNonce}">
    $(document).ready(function () {
        /*<![CDATA[*/
        shashin.nonce = /*[[${cspNonce}]]*/ '';
        /*]]>*/

        $("#choosedirectory").on("click", async function (e) {
            e.preventDefault();

            $("#choosedirectory").addClass('disabled');
            const mediaDirectories = $("#mediaDirTextArea").val().split(',');
            for (let i = 0; i < mediaDirectories.length; i++) {
                mediaDirectories[i] = mediaDirectories[i].trim();
            }
            const http = new Http("settings");
            const data = await http.ajax("post", "/settings/dirchooser");

            if (data && data.hasOwnProperty("directory") && data.hasOwnProperty("status") && data["status"] === 0) {
                mediaDirectories.push(data["directory"]);
                $("#mediaDirTextArea").val(mediaDirectories.join(', '));
            }

            $("#choosedirectory").removeClass('disabled');
        });

        $("#deleteContent").on("click", function(e) {
            e.preventDefault();
            $("#propDeleteContent").modal('show');
        });

        $("#deleteContentConfirm").on("click", async function (e) {
            e.preventDefault();

            $("#deleteContentModalStatus").css("visibility", "visible");

            const http = new Http("deleting all content");
            let json = {deleteContent: true}
            const data = await http.ajax("post", "/settings/content/delete", JSON.stringify(json));

            if (data.hasOwnProperty("status") && data.hasOwnProperty("msg")) {
                let message = "Error";
                if (data["status"] === "success") {
                    message = '<div class="alert alert-success" role="alert">' + data["msg"] + '</div>';
                } else {
                    message = '<div class="alert alert-danger" role="alert">' + data["msg"] + '</div>';
                }
                $("#msgDeleteContent").html(message);
            }
            $("#deleteContentModalStatus").css("visibility", "hidden");
        });
    });
</script>

</body>
</html>
