<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:insert="fragments/head :: head(${activePage},${titleDescriptor})"></head>
<body class="thumb d-flex flex-column vh-100 overflow-hidden">

<div th:replace="fragments/topnav :: topnav(${currentUser},${activePage},'')"></div>

<script type="text/javascript" th:nonce="${cspNonce}">
    $("#progressBarWrapper").visible();
    $("#progressBar").attr("aria-valuenow","100");
    $("#progressBar").css("width","100%");
    $("#mapFilterButton").addClass("disabled");
</script>

<div id="container" class="container-fluid pb-3 flex-grow-1 d-flex flex-column flex-sm-row overflow-auto">
    <div th:replace="fragments/sidebaroffcanvas :: sidebaroffcanvas(${activeSidebar},${currentUser})"></div>

    <main role="main" class="col overflow-auto h-100">
        <div th:replace="fragments/content :: content(${message},${activePage},${authority},${parameter},'',${faceRecogServicesAvailable},${objectRecogEnabled})" class="col-sm p-3 min-vh-100"></div>

        <div id="map" class="map" style="z-index: 0">
            <div id="light-gallery-photo"></div>
        </div>

        <div th:replace="fragments/metadatamodal :: metadatamodal(${currentUser})"></div>

    </main>
</div>

<div class="modal fade" id="propMapFilter" tabindex="-1" role="dialog" aria-labelledby="labelMapFilter" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Filter Map</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="m-1" id="filterInputs" style="visibility: visible;">
                    <div class="mb-3">
                        <label class="form-label me-2 mt-2" for="startDateInput">From</label>
                        <input class="form-control" type="date" id="startDateInput">
                    </div>

                    <div class="mb-3">
                        <label class="form-label me-2 mt-2" for="endDateInput">To</label>
                        <input class="form-control" type="date" id="endDateInput">
                    </div>

                    <th:block th:if="${not #lists.isEmpty(albums)}">
                        <div class="mb-3">
                            <label class="form-label me-2 mt-2" for="albumSelect">Filter by Album</label>
                            <select class="form-select" id="albumSelect">
                                <option selected value="0">Select Album</option>
                                <th:block th:each="album, iterStat: ${albums}">
                                    <option th:value="${album.id}" th:text="${album.name}"></option>
                                </th:block>
                            </select>
                        </div>
                    </th:block>

                    <div class="mb-3">
                        <input class="form-check-input" type="checkbox" value="" id="videoOnlyInput">
                        <label class="form-check-label" for="videoOnlyInput">&nbsp;Videos only</label>
                    </div>

                    <div class="mb-3">
                        <input class="form-check-input" type="checkbox" value="" id="showMarkersInput">
                        <label class="form-check-label" for="showMarkersInput">&nbsp;Map markers</label>
                    </div>

                    <div class="row">
                        <div class="mb-3 col-6">
                            <label class="form-label me-2 mt-2" for="mapSources">Map Sources</label>
                            <select class="form-select" id="mapSources">
                                <option selected value="osm">Standard</option>
                                <option selected value="maptiler">Street</option>
                                <option selected value="maptilerHY">Satellite</option>
<!--                                <option selected value="arcGisWSM">Street</option>-->
<!--                                <option selected value="arcGisWI">Satellite</option>-->
<!--                                <option selected value="maptiler">MapTiler</option>-->
<!--                                <option selected value="bingmaps">Bing Maps</option>-->
<!--                                <option selected value="mapbox">Mapbox</option>-->
                            </select>
                        </div>

                        <div class="mb-3 col-12" style="display: none;" id="bingMapsImageryContainer">
                            <label class="form-label me-2 mt-2" for="bingMapsImagerySet">Map Style</label>
                            <select class="form-select" id="bingMapsImagerySet">
                                <option selected value="AerialWithLabels">Aerial</option>
                                <option selected value="RoadOnDemand">Roads</option>
<!--                                <option selected value="BirdseyeV2WithLabels">Birds Eye</option>-->
                                <option selected value="CanvasDark">Dark</option>
<!--                                <option selected value="Streetside">Street Side</option>-->
                            </select>
                        </div>

<!--                        <div class="mb-3 col-6" style="display: none;" id="maptilerContainer">-->
<!--                            <label class="form-label me-2 mt-2" for="maptilerImagerySet">Map Style</label>-->
<!--                            <select class="form-select" id="maptilerImagerySet">-->
<!--                                <option selected value="maptiler">Streets</option>-->
<!--                                <option selected value="maptilerBA">Basic</option>-->
<!--                                <option selected value="maptilerSA">Satellite</option>-->
<!--                                <option selected value="maptilerHY">Hybrid</option>-->
<!--                            </select>-->
<!--                        </div>-->
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <span id="qpInfo" class="bi-info-circle me-auto" style="font-size: 1rem;"></span>
                <button type="button" class="btn btn-primary" id="filterMap">Filter</button>
                <button type="button" class="btn btn-primary" id="resetMap">Reset</button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            </div>
        </div>
    </div>
</div>

<th:block th:if="${@environment.getProperty('app.js.useMinified') == 'false'}">
    <script src="/js/site/map.js" type="text/javascript" th:nonce="${cspNonce}"></script>
</th:block>
<th:block th:if="${@environment.getProperty('app.js.useMinified') == 'true'}">
    <script src="/js/site/min/map.min.js" type="text/javascript" th:nonce="${cspNonce}"></script>
</th:block>
<script th:inline="javascript" type="text/javascript" th:nonce="${cspNonce}">
    $(document).ready(function () {
        /*<![CDATA[*/
        shashin.nonce = /*[[${cspNonce}]]*/ '';
        /*]]>*/

        $('#qpInfo').popover({
            trigger:'hover',
            title:'Query Params Available',
            html:true,
            content:'<div class="row"><div class="col-3"><strong>lat</strong></div><div class="col">Latitude</div></div>' +
                    '<div class="row"><div class="col-3"><strong>lng</strong></div><div class="col">Longitude</div></div>' +
                    '<div class="row"><div class="col-3"><strong>latlng</strong></div><div class="col">Latitude,Longitude</div></div>' +
                    '<div class="row"><div class="col-3"><strong>sd</strong></div><div class="col">Start date (yyyy-mm-dd)</div></div>' +
                    '<div class="row"><div class="col-3"><strong>ed</strong></div><div class="col">End date (yyyy-mm-dd)</div></div>' +
                    '<div class="row"><div class="col-3"><strong>vo</strong></div><div class="col">Video only</div></div>' +
                    '<div class="row"><div class="col-3"><strong>mtf</strong></div><div class="col">Media type filer (video, gif, etc)</div></div>' +
                    '<div class="row"><div class="col-3"><strong>aid</strong></div><div class="col">Album ID</div></div>' +
                    '<div class="row"><div class="col-3"><strong>an</strong></div><div class="col">Album Name</div></div>',
            placement:'bottom'
        });

        $("#mapSources").val("osm");
        $("#bingMapsImagerySet").val("AerialWithLabels");

        const http = new Http("Getting map data");
        Util.setMetadataLocalStorage();
        const version = Util.getMetadataLocalStorage();
        http.ajax("get", "/mapdata" + (version === "" ? "" : "?v=" + version)).then(function (mapdataObj) {
            let mapdata = [];

            if (mapdataObj !== null && mapdataObj.hasOwnProperty("mapdata")) {
                mapdata = mapdataObj["mapdata"];
                if (mapdata === null || mapdata === "") {
                    mapdata = [];
                }
            }

            showMap(mapdata);
        });
    });
</script>
</body>
</html>
