<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:insert="fragments/head :: head(${activePage},${titleDescriptor})"></head>
<body class="thumb d-flex flex-column vh-100 overflow-hidden">

<div th:replace="fragments/topnav :: topnav(${currentUser},${activePage},'')"></div>

<script type="text/javascript" th:nonce="${cspNonce}">
    $("#progressBarWrapper").css("visibility","visible");
    $("#progressBar").attr("aria-valuenow","100");
    $("#progressBar").css("width","100%");
</script>

<div class="row m-1" id="dateInputs" style="visibility: hidden">
    <div class="d-inline-flex align-items-center col-sm-1">
        <input class="form-check-input" type="checkbox" value="" id="videoOnlyInput">
        <label class="form-check-label" for="videoOnlyInput">&nbsp;Videos Only</label>
    </div>

    <div class="d-inline-flex align-items-center col-sm-1">
        <input class="form-check-input" type="checkbox" value="" id="showMarkersInput">
        <label class="form-check-label" for="showMarkersInput">&nbsp;Map markers</label>
    </div>

    <div class="d-inline-flex align-items-center col">
        <label class="form-label me-2 mt-2" for="startDateInput">From</label>
        <input class="form-control" type="date" id="startDateInput">
    </div>

    <div class="d-inline-flex align-items-center col">
        <label class="form-label me-2 mt-2" for="endDateInput">To</label>
        <input class="form-control" type="date" id="endDateInput">
    </div>

    <th:block th:if="${not #lists.isEmpty(albums)}">
        <div class="d-inline-flex align-items-center col">
            <select class="form-select" id="albumSelect">
                <option selected value="0">Select Album</option>
                <th:block th:each="album, iterStat: ${albums}">
                    <option th:value="${album.id}" th:text="${album.name}"></option>
                </th:block>
            </select>
        </div>
    </th:block>

    <div class="col">
        <button class="form-control" id="dateInputButton">Filter</button>
    </div>

    <div class="col">
        <button class="form-control" id="clearDateInputsButton">Reset</button>
    </div>
</div>

<div id="container" class="container-fluid pb-3 flex-grow-1 d-flex flex-column flex-sm-row overflow-auto">
    <div th:replace="fragments/sidebaroffcanvas :: sidebaroffcanvas(${activeSidebar},${currentUser})"></div>

    <main role="main" class="col overflow-auto h-100">
        <div th:replace="fragments/content :: content(${message},${activePage},${authority},${parameter},'',${faceRecogServicesAvailable},${objectRecogEnabled})" class="col-sm p-3 min-vh-100"></div>

        <div id="map" class="map" style="z-index: 0">
            <div id="light-gallery-photo"></div>
        </div>

        <div th:replace="fragments/metadatamodal :: metadatamodal(${currentUser})"></div>

    </main>
</div>

<th:block th:if="${@environment.getProperty('app.js.useMinified') == 'false'}">
    <script src="/js/site/map.js" type="text/javascript" th:nonce="${cspNonce}"></script>
</th:block>
<th:block th:if="${@environment.getProperty('app.js.useMinified') == 'true'}">
    <script src="/js/site/min/map.min.js" type="text/javascript" th:nonce="${cspNonce}"></script>
</th:block>
<script th:inline="javascript" type="text/javascript" th:nonce="${cspNonce}">
    $(document).ready(function () {
        /*<![CDATA[*/
        shashin.nonce = /*[[${cspNonce}]]*/ '';
        /*]]>*/

        const http = new Http("Getting map data");
        Util.setMetadataLocalStorage();
        const version = Util.getMetadataLocalStorage();
        http.ajax("get", "/mapdata" + (version === "" ? "" : "?v=" + version)).then(function (mapdataObj) {
            let mapdata = [];

            if (mapdataObj !== null && mapdataObj.hasOwnProperty("mapdata")) {
                mapdata = mapdataObj["mapdata"];
                if (mapdata === null || mapdata === "") {
                    mapdata = [];
                }
            }

            showMap(mapdata);
        });
    });
</script>
</body>
</html>
