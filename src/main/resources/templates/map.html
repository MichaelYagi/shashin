<!DOCTYPE html>
<html lang="en" xmlns:th="http://thymeleaf.org">
<head th:insert="fragments/head :: head(${activePage},${titleDescriptor})"></head>
<body class="thumb d-flex flex-column vh-100 overflow-hidden">

<div th:replace="fragments/topnav :: topnav(${currentUser},${activePage},'')"></div>

<script type="text/javascript" th:nonce="${cspNonce}">
    $("#progressBarWrapper").css("visibility","visible");
    $("#progressBar").attr("aria-valuenow","100");
    $("#progressBar").css("width","100%");
</script>

<div class="invalid-feedback d-block ms-3" id="dateValidationMessage"></div>
<div class="row m-1" id="dateInputs" style="visibility: hidden">
    <div class="d-inline-flex align-items-center col-sm-1">
        <input class="form-check-input" type="checkbox" value="" id="videoOnlyInput">
        <label class="form-check-label" for="videoOnlyInput">&nbsp;Videos Only</label>
    </div>

    <div class="d-inline-flex align-items-center col">
        <label class="form-label me-2 mt-2" for="startDateInput">From</label>
        <input class="form-control" type="date" id="startDateInput">
    </div>

    <div class="d-inline-flex align-items-center col">
        <label class="form-label me-2 mt-2" for="endDateInput">To</label>
        <input class="form-control" type="date" id="endDateInput">
    </div>

    <div class="col">
        <button class="form-control" id="dateInputButton">Filter</button>
    </div>

    <div class="col">
        <button class="form-control" id="clearDateInputsButton">Reset</button>
    </div>
</div>

<div id="container" class="container-fluid pb-3 flex-grow-1 d-flex flex-column flex-sm-row overflow-auto">
    <div th:replace="fragments/sidebaroffcanvas :: sidebaroffcanvas(${activeSidebar},${currentUser})"></div>

    <main role="main" class="col overflow-auto h-100">

        <div id="map" class="map" style="z-index: 0">
            <div id="light-gallery-photo"></div>
        </div>

        <div class="modal fade" id="propMetadataLocation" tabindex="-1" role="dialog" aria-labelledby="labelMetadata" aria-hidden="true">
            <div class="modal-dialog modal-dialog-scrollable modal-lg" role="document">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="editPhotoModalLabel"><th:block th:text="${{currentUser.authority == 'ROLE_ADMIN'}?'Edit Location ':'View Details '}"></th:block><span id="editPhotoLocationModalLabel"></span></h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" name="metadataId" id="metadataId" value="">
                        <th:block th:if="${currentUser.authority == 'ROLE_ADMIN'}">
                            <ul class="nav nav-tabs">
                                <li class="nav-item">
                                    <a class="nav-link active" data-bs-toggle="tab" id="locationTabLink" href="#locationTab">Location</a>
                                </li>
                                <li class="nav-item">
                                    <a class="nav-link" data-bs-toggle="tab" id="detailsTabLink" href="#detailsTab">Details</a>
                                </li>
                            </ul>
                        </th:block>
                        <div class="tab-content">
                            <th:block th:if="${currentUser.authority == 'ROLE_ADMIN'}">
                                <div class="tab-pane container show active" id="locationTab">
                                    <form id="saveData">
                                        <div class="form-group row">
                                            <div class="col-sm">
                                                <label for="locationDataInput" class="col-form-label">Edit Location</label>
                                                <div class="input-group">
                                                    <input type="text" class="form-control" aria-label="Tag Location" id="locationDataInput" name="locationDataInput" value="">
                                                    <input type="hidden" id="mapMetadataId" name="mapMetadataId" value="">
                                                </div>
                                            </div>
                                        </div>
                                    </form>
                                    <br>
                                    <div class="col-sm">
                                        <span id="locationMapResponseMsg"></span>
                                    </div>
                                </div>
                            </th:block>
                            <div th:class="'tab-pane container ' + ${currentUser.authority == 'ROLE_ADMIN' ? 'fade' : 'show active'}" id="detailsTab">
                                <div th:replace="fragments/detailsinfo :: detailsinfo(${currentUser})"></div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <th:block th:if="${currentUser.authority == 'ROLE_ADMIN'}">
                            <div id="metadataLocationModalStatus" class="spinner-grow me-auto" style="visibility: hidden;font-size: 2rem;" role="status" aria-hidden="true" data-bs-toggle="tooltip" data-bs-placement="right" title=""></div>
                            <button type="button" class="btn btn-primary" id="saveMetadata">Save</button>
                            <button id="metadataLocationModalCancel" type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        </th:block>
                        <th:block th:if="${currentUser.authority == 'ROLE_USER'}">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        </th:block>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<th:block th:if="${@environment.getProperty('app.js.useMinified') == 'false'}">
    <script src="/js/site/map.js" type="text/javascript" th:nonce="${cspNonce}"></script>
</th:block>
<th:block th:if="${@environment.getProperty('app.js.useMinified') == 'true'}">
    <script src="/js/site/min/map.min.js" type="text/javascript" th:nonce="${cspNonce}"></script>
</th:block>
<script th:inline="javascript" type="text/javascript" th:nonce="${cspNonce}">
    $(document).ready(function () {
        /*<![CDATA[*/
        shashin.nonce = /*[[${cspNonce}]]*/ '';
        const showControls = /*[[${showControls}]]*/ false;
        /*]]>*/

        const http = new Http("Getting map data");
        const version = Util.getMetadataLocalStorage();
        http.ajax("get", "api/v1/mapdata" + (version === "" ? "" : "?v=" + version)).then(function (mapdataObj) {
            let mapdata = [];

            if (mapdataObj !== null && mapdataObj.hasOwnProperty("mapdata")) {
                mapdata = mapdataObj["mapdata"];
                if (mapdata === null || mapdata === "") {
                    mapdata = [];
                }
            }

            showMap(mapdata, showControls);
        });
    });
</script>
</body>
</html>
