<!DOCTYPE html>
<html th:lang="${locale}" xmlns:th="http://www.thymeleaf.org">
<head th:insert="~{fragments/head :: head(${activePage},${titleDescriptor})}"></head>
<body class="thumb d-flex flex-column vh-100">

<div th:replace="~{fragments/topnav :: topnav(${currentUser},${activePage},'')}"></div>

<div id="container" class="container-fluid pb-3 flex-grow-1 d-flex flex-column overflow-auto mt-2">
    <div class="row flex-grow-sm-1 flex-grow-0">
        <div th:replace="~{fragments/sidebaroffcanvas :: sidebaroffcanvas(${activeSidebar},${currentUser})}"></div>
        <main role="main" class="col overflow-auto h-100">
            <div th:replace="~{fragments/hiddenfields :: hiddenfields(${message})}"></div>

            <h2 class="mt-3">Wake Page</h2>
            <button id="stopStartVideo" data-state="pause">Start wake</button>
            <span id="videoContainer"></span><br>
            <span id="statusContainer">Status:</span>
<!--            <input type="checkbox" id="dontPause" name="dontPause">-->
<!--            <label for="dontPause"> Wake in background</label>-->

            <div id="footer" th:replace="~{fragments/footer :: footer(${copyrightYear},${operatingSystemInfo},${buildProperties},${activeProfile},${activePage})}"></div>
        </main>
    </div>
</div>

<script th:inline="javascript" type="text/javascript" th:nonce="${cspNonce}">
    $(document).ready(function() {
        document.documentElement.style.cursor = "default";

        // shashin.enableDebug({tag:"wake"})

        const video = document.createElement('video');
        const source = document.createElement('source');

        source.setAttribute("src", "/media/muted-blank.mp4");
        source.setAttribute("type", "video/mp4");

        video.appendChild(source);
        document.getElementById("videoContainer").appendChild(video);
        $(video).hide();

        // Loop
        video.addEventListener("ended", function() {
            // const wakeInBackground = $('#dontPause').is(":checked");

            //if ((wakeInBackground === true) || document.hidden === false && wakeInBackground === false) {
            if (document.hidden === false && $("#stopStartVideo").attr("data-state") === "play") {
                $("#stopStartVideo").text("Stop wake");
                video.currentTime = 0;
                video.play();
                $("#stopStartVideo").attr("data-state","play");
                shashin.printMessageToConsole("Looping video", {tag: "wake"});
                $("#statusContainer").text("Status: Looping video");
            }

            document.documentElement.style.cursor = "default";
        });

        document.addEventListener("visibilitychange", () => {
            // const wakeInBackground = $('#dontPause').is(":checked");

            // if (wakeInBackground === false) {
                if (document.hidden === true) {
                    $("#stopStartVideo").text("Start wake");
                    video.pause();
                    // $("#stopStartVideo").attr("data-state", "pause");
                    shashin.printMessageToConsole("Paused video after away from tab", {tag: "wake"});
                    $("#statusContainer").text("Status: Paused video after away from tab");
                } else {
                    let state = "Start";
                    if ($("#stopStartVideo").attr("data-state") === "play") {
                        state = "Stop";
                    }
                    $("#stopStartVideo").text(state + " wake");
                    video.currentTime = 0;
                    video.play();
                    $("#stopStartVideo").attr("data-state", $("#stopStartVideo").attr("data-state"));
                    shashin.printMessageToConsole(capitalizeFirstLetter($("#stopStartVideo").attr("data-state")) + " video after returning to tab", {tag: "wake"});
                    $("#statusContainer").text("Status: " + capitalizeFirstLetter($("#stopStartVideo").attr("data-state")) + " video after returning to tab");
                }
            // }

            document.documentElement.style.cursor = "default";
        });

        function capitalizeFirstLetter(val) {
            return val.charAt(0).toUpperCase() + val.slice(1);
        }

        $("#stopStartVideo").on("click", function () {
            if ($("#stopStartVideo").attr("data-state") === "pause") {
                $("#stopStartVideo").text("Stop wake");
                video.currentTime = 0;
                video.play();
                $("#stopStartVideo").attr("data-state","play");
                shashin.printMessageToConsole("Play video button pressed", {tag: "wake"});
                $("#statusContainer").text("Status: Play video button pressed");
            } else {
                $("#stopStartVideo").text("Start wake");
                video.pause();
                $("#stopStartVideo").attr("data-state","pause");
                shashin.printMessageToConsole("Pause video button pressed", {tag: "wake"});
                $("#statusContainer").text("Status: Pause video button pressed");
            }

            document.documentElement.style.cursor = "default";
        });

        $(document).on("mousemove", function () {
            document.documentElement.style.cursor = "default";
        });
        $(document).on("click", function () {
            document.documentElement.style.cursor = "default";
        })
    });
</script>

</body>
</html>
