<!DOCTYPE html>
<th:block th:insert="~{fragments/asciiart :: asciiart()}"></th:block>
<html th:lang="${locale}" xmlns:th="http://www.thymeleaf.org">
<head th:insert="~{fragments/head :: head(${activePage},${titleDescriptor})}"></head>
<body class="thumb d-flex flex-column vh-100">

<div th:replace="~{fragments/topnav :: topnav(${currentUser},${activePage},'')}"></div>

<div id="memories-gallery" style="display:none;"></div>
<div th:replace="~{fragments/metadatamodal :: metadatamodal(${currentUser})}"></div>

<div id="container" class="container-fluid pb-3 flex-grow-1 d-flex flex-column overflow-auto">
    <div class="row flex-grow-sm-1 flex-grow-0">
        <div th:replace="~{fragments/sidebaroffcanvas :: sidebaroffcanvas(${activeSidebar},${currentUser})}"></div>
        <main role="main" class="col overflow-auto h-100">
            <div th:replace="~{fragments/hiddenfields :: hiddenfields(${message})}"></div>

            <div class="p-3">
                <div class="d-flex align-items-center gap-3 mb-2">
                    <h4 class="mb-0">Memories</h4>
                    <th:block th:if="${not memoriesDisabled}">
                        <button id="memories-regenerate-btn" type="button" class="btn btn-sm btn-outline-secondary">
                            <span class="bi-arrow-counterclockwise"></span> Regenerate
                        </button>
                        <span id="memories-regenerate-status" class="small text-muted" style="display:none;"></span>
                    </th:block>
                </div>

                <th:block th:if="${memoriesDisabled}">
                    <p class="text-muted">Memories is disabled. Enable it in <a href="/settings">Settings</a>.</p>
                </th:block>

                <th:block th:if="${not memoriesDisabled and #lists.isEmpty(memoriesList)}">
                    <p class="text-muted">No memories yet. Click Regenerate to generate them now, or they will be generated overnight during the scheduled scan when Ollama is configured.</p>
                </th:block>

                <th:block th:if="${not memoriesDisabled and not #lists.isEmpty(memoriesList)}">
                    <div class="row g-3">
                        <th:block th:each="memory, iterStat: ${memoriesList}">
                            <div class="col-12 col-sm-6 col-lg-4 col-xl-3">
                                <div class="card h-100 shadow-sm">
                                    <div class="memories-view-btn" th:data-memory-index="${iterStat.index}" style="display:flex;height:200px;overflow:hidden;gap:2px;background:#111;cursor:pointer;">
                                        <img loading="lazy" draggable="false"
                                             th:src="'/api/v1/thumbnails/centered/' + ${memory.photoIds[0]}"
                                             style="width:50%;height:200px;object-fit:cover;">
                                        <img loading="lazy" draggable="false"
                                             th:src="'/api/v1/thumbnails/centered/' + ${memory.photoIds[1]}"
                                             style="width:50%;height:200px;object-fit:cover;">
                                    </div>
                                    <div class="card-body d-flex flex-column">
                                        <div class="d-flex justify-content-between align-items-baseline mb-1">
                                            <h6 class="card-title mb-0" th:text="${memory.title}"></h6>
                                            <span class="text-muted small ms-2 text-nowrap" th:text="${#lists.size(memory.photoIds)} + ' photos'"></span>
                                        </div>
                                        <div class="d-flex gap-2 mt-2">
                                            <button type="button" class="btn btn-sm btn-primary memories-view-btn"
                                                    th:data-memory-index="${iterStat.index}"
                                                    title="View slideshow">
                                                <span class="bi-play-circle"></span> View
                                            </button>
                                            <th:block th:if="${memory.savedAlbumId != null}">
                                                <a th:href="'/album/' + ${memory.savedAlbumId}" class="btn btn-sm btn-outline-secondary">
                                                    <span class="bi-bookmark-check"></span> Saved
                                                </a>
                                            </th:block>
                                            <th:block th:if="${memory.savedAlbumId == null}">
                                                <button type="button" class="btn btn-sm btn-outline-secondary memories-save-btn"
                                                        th:data-memory-id="${memory.id}"
                                                        title="Save as album">
                                                    <span class="bi-bookmark-plus"></span> Save
                                                </button>
                                            </th:block>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </th:block>
                    </div>
                </th:block>
            </div>

            <div th:replace="~{fragments/footer :: footer(${copyrightYear},${operatingSystemInfo},${buildProperties},${activeProfile},${activePage})}"></div>
        </main>
    </div>
</div>

<script type="text/javascript" th:inline="javascript" th:nonce="${cspNonce}">
    $(document).ready(function() {
        /*<![CDATA[*/
        shashin.nonce = /*[[${cspNonce}]]*/ '';
        const memoriesJsonStr = /*[[${memoriesJson}]]*/ '[]';
        /*]]>*/

        const memoryPhotos = JSON.parse(memoriesJsonStr).map(function(m) { return m.photos || []; });

        var lgInitialised = false;
        var lgOpen = false;
        var currentMemoryPhotoIds = [];
        var memoriesVideoPoller = null;
        var memoriesVideoAutoplay = false;
        var memoriesStoppingAutoplay = false;
        var memoriesVideoAdvancing = false;
        var memoriesVideoFakeActive = false;

        $(document).on('keydown.memoriesAutoplay', function(e) {
            if (lgOpen && (e.code === 'Space' || e.keyCode === 32)) {
                e.preventDefault();
                e.stopImmediatePropagation();
                $('.lg-autoplay-button').first().trigger('click');
            }
        });

        // View slideshow
        $(document).on('click', '.memories-view-btn', function() {
            const idx = parseInt($(this).data('memory-index'), 10);
            const photoData = memoryPhotos[idx] || [];
            if (photoData.length === 0) return;

            const mediaContentList = photoData.map(function(p) {
                var item = { metadataId: p.id, metadataDetailFun: shashin.openEditMetadataModal };
                if (p.type && p.type.includes('video')) {
                    item.video = { source: [{ src: p.videoUrl, type: 'video/mp4' }], attributes: { preload: 'auto', controls: true } };
                    item.poster = '/api/v1/thumbnails/original/' + p.id;
                    if (p.w && p.h) item.lgSize = p.w + '-' + p.h;
                    item.downloadUrl = p.videoUrl;
                } else {
                    item.src = '/api/v1/thumbnails/original/' + p.id;
                    item.downloadUrl = '/api/v1/thumbnails/original/' + p.id;
                }
                return item;
            });

            if (!lgInitialised) {
                var lgPlugins = [lgZoom, lgVideo, lgFullscreen];
                var lgExtraConfig = {};
                if (typeof lgMetadataDetail !== 'undefined') {
                    lgPlugins.push(lgMetadataDetail);
                    lgExtraConfig.metadataDetail = true;
                    lgExtraConfig.metadataDetailFun = shashin.openEditMetadataModal;
                }
                lgPlugins.push(lgAutoplay);
                shashin.setLightGalleryElement('memories-gallery');
                shashin.setLightGallery(Object.assign({
                    overrideBaseConfigs: true,
                    plugins: lgPlugins,
                    counter: true,
                    download: false,
                    slideShowAutoplay: false,
                    slideShowInterval: 7000,
                    autoplayControls: true,
                    progressBar: true,
                    zoomFromOrigin: false,
                    allowMediaOverlap: true,
                    mode: 'lg-fade',
                    speed: 700,
                    preload: 1,
                    licenseKey: Util.lgApiKey()
                }, lgExtraConfig));
                lgInitialised = true;
                $('#memories-gallery').on('lgBeforeClose', function() {
                    lgOpen = false;
                    memoriesVideoAutoplay = false;
                    memoriesStoppingAutoplay = false;
                    memoriesVideoAdvancing = false;
                    memoriesVideoFakeActive = false;
                    if (memoriesVideoPoller) { clearInterval(memoriesVideoPoller); memoriesVideoPoller = null; }
                });
                $('#propMetadata').on('show.bs.modal', function() {
                    if (lgOpen && $('.lg-outer').hasClass('lg-show-autoplay')) {
                        $('.lg-autoplay-button').first().trigger('click');
                    }
                });

                // Video-aware autoplay helpers
                function memoriesAdvanceFromVideo(lg, slideIdx) {
                    if (!lg || lg.index !== slideIdx || !memoriesVideoAutoplay) return;
                    memoriesVideoAdvancing = true;
                    var nextIdx = (lg.index + 1) < lg.galleryItems.length ? lg.index + 1 : 0;
                    lg.slide(nextIdx, false, false, 'next');
                }

                function memoriesAttachEndedHandler(video, lg, slideIdx) {
                    $(video).off('ended.memories').on('ended.memories', function() {
                        memoriesAdvanceFromVideo(lg, slideIdx);
                    });
                }

                function memoriesStartVideoPoller(lg, slideIdx) {
                    if (memoriesVideoPoller) clearInterval(memoriesVideoPoller);
                    var attempts = 0;
                    memoriesVideoPoller = setInterval(function() {
                        attempts++;
                        var video = $('.lg-current .lg-video-object')[0];
                        if (video) {
                            clearInterval(memoriesVideoPoller);
                            memoriesVideoPoller = null;
                            memoriesAttachEndedHandler(video, lg, slideIdx);
                            // If browser blocks autoplay, try muted after 2s; if still blocked, advance
                            setTimeout(function() {
                                if (video.paused && memoriesVideoAutoplay && lg.index === slideIdx) {
                                    video.muted = true;
                                    video.play().catch(function() { memoriesAdvanceFromVideo(lg, slideIdx); });
                                }
                            }, 2000);
                        } else if (attempts > 50) {
                            clearInterval(memoriesVideoPoller);
                            memoriesVideoPoller = null;
                            memoriesAdvanceFromVideo(lg, slideIdx);
                        }
                    }, 100);
                }

                function memoriesStartVideoPlayback(lg, slideIdx) {
                    var video = $('.lg-current .lg-video-object')[0];
                    if (video) {
                        video.currentTime = 0;
                        video.play().catch(function() {});
                        memoriesAttachEndedHandler(video, lg, slideIdx);
                        setTimeout(function() {
                            if (video.paused && memoriesVideoAutoplay && lg.index === slideIdx) {
                                video.muted = true;
                                video.play().catch(function() { memoriesAdvanceFromVideo(lg, slideIdx); });
                            }
                        }, 2000);
                    } else {
                        setTimeout(function() { $('.lg-current .lg-video-play-button').trigger('click'); }, 50);
                        memoriesStartVideoPoller(lg, slideIdx);
                    }
                }

                function memoriesEnterVideoMode(lg, idx) {
                    memoriesVideoAutoplay = true;
                    if ($('.lg-outer').hasClass('lg-show-autoplay') && !memoriesVideoFakeActive) {
                        // Timer is genuinely running — stop it; lgAutoplayStop restores the button active state
                        memoriesStoppingAutoplay = true;
                        $('.lg-autoplay-button').first().trigger('click');
                    }
                    memoriesStartVideoPlayback(lg, idx);
                }

                // lgAutoplayStart fires when LG starts the timer.
                // If we're in fake-active state (video playing, timer stopped), user is actually pausing —
                // stop the newly started timer and exit video mode. Otherwise enter video mode.
                $('#memories-gallery').on('lgAutoplayStart', function() {
                    var lg = shashin.getLightGallery();
                    if (!lg) return;
                    if (memoriesVideoFakeActive) {
                        // User clicked to pause while video was playing — honour it
                        memoriesVideoFakeActive = false;
                        memoriesVideoAutoplay = false;
                        memoriesStoppingAutoplay = true;
                        $('.lg-autoplay-button').first().trigger('click');
                        return;
                    }
                    var item = lg.galleryItems[lg.index];
                    if (!item || !item.__slideVideoInfo) return;
                    memoriesEnterVideoMode(lg, lg.index);
                });

                // Internal stop: keep button showing active. User stop: exit video mode.
                $('#memories-gallery').on('lgAutoplayStop', function() {
                    if (memoriesStoppingAutoplay) {
                        memoriesStoppingAutoplay = false;
                        setTimeout(function() {
                            if (memoriesVideoAutoplay) {
                                $('.lg-outer').addClass('lg-show-autoplay');
                                memoriesVideoFakeActive = true;
                            }
                        }, 0);
                        return;
                    }
                    memoriesVideoAutoplay = false;
                    memoriesVideoFakeActive = false;
                });

                $('#memories-gallery').on('lgBeforeSlide', function() {
                    if (memoriesVideoPoller) { clearInterval(memoriesVideoPoller); memoriesVideoPoller = null; }
                    if (!memoriesVideoAdvancing) {
                        // Manual navigation — exit video autoplay mode
                        if (memoriesVideoAutoplay || memoriesVideoFakeActive) $('.lg-outer').removeClass('lg-show-autoplay');
                        memoriesVideoAutoplay = false;
                        memoriesVideoFakeActive = false;
                    }
                    memoriesVideoAdvancing = false;
                });

                $('#memories-gallery').on('lgAfterSlide', function(event) {
                    var idx = event.detail.index;
                    var lg = shashin.getLightGallery();
                    if (!lg) return;
                    var item = lg.galleryItems[idx];
                    var isAutoPlaying = $('.lg-outer').hasClass('lg-show-autoplay');

                    if (!item || !item.__slideVideoInfo) {
                        if (memoriesVideoAutoplay || memoriesVideoFakeActive) {
                            // Coming from video mode — restart the real autoplay timer
                            memoriesVideoAutoplay = false;
                            memoriesVideoFakeActive = false;
                            $('.lg-outer').removeClass('lg-show-autoplay');
                            setTimeout(function() { $('.lg-autoplay-button').first().trigger('click'); }, 100);
                        } else {
                            memoriesVideoAutoplay = false;
                            memoriesVideoFakeActive = false;
                        }
                        return;
                    }

                    if (!isAutoPlaying && !memoriesVideoAutoplay) return;
                    memoriesEnterVideoMode(lg, idx);
                });
            }

            currentMemoryPhotoIds = photoData.map(function(p) { return p.id; });

            // Preload image items into browser cache before opening — guarantees no spinner on any slide
            var viewBtn = $('button.memories-view-btn[data-memory-index="' + idx + '"]');
            viewBtn.prop('disabled', true).html('<span class="spinner-border spinner-border-sm me-1"></span>Loading');

            var imageItems = photoData.filter(function(p) { return !p.type || !p.type.includes('video'); });
            Promise.all(imageItems.map(function(p) {
                return new Promise(function(resolve) {
                    var img = new Image();
                    img.onload = resolve;
                    img.onerror = resolve;
                    img.src = '/api/v1/thumbnails/original/' + p.id;
                });
            })).then(function() {
                viewBtn.prop('disabled', false).html('<span class="bi-play-circle"></span> View');
                shashin.refreshAndActivateLgListener(mediaContentList);
                shashin.getLightGallery().openGallery(0);
                lgOpen = true;
                setTimeout(function() {
                    if (!$('.lg-outer').hasClass('lg-show-autoplay')) {
                        $('.lg-autoplay-button').first().trigger('click');
                    }
                }, 500);
            });
        });

        // Regenerate button + polling
        var regeneratePollInterval = null;
        var regeneratePreviousCount = null;

        function startRegeneratePoll() {
            if (regeneratePollInterval) return;
            regeneratePollInterval = setInterval(function() {
                $.getJSON('/memories/status', function(data) {
                    if (!data.running) {
                        clearInterval(regeneratePollInterval);
                        regeneratePollInterval = null;
                        window.location.reload();
                    }
                });
            }, 4000);
        }

        $('#memories-regenerate-btn').on('click', function() {
            const btn = $(this);
            const statusEl = $('#memories-regenerate-status');
            btn.prop('disabled', true);
            statusEl.text('Starting…').show();

            $.getJSON('/memories/status', function(data) {
                regeneratePreviousCount = data.count;
                const http = new Http('regenerate memories');
                http.ajax('post', '/memories/generate', '{}').then(function(resp) {
                    if (resp.status === 'started' || resp.status === 'already_running') {
                        statusEl.text('Generating… this may take a few minutes.');
                        startRegeneratePoll();
                    } else {
                        statusEl.text('Error: ' + (resp.msg || resp.status));
                        btn.prop('disabled', false);
                    }
                }).catch(function() {
                    statusEl.text('Request failed');
                    btn.prop('disabled', false);
                });
            });
        });

        // Check on load if generation is already running
        $.getJSON('/memories/status', function(data) {
            if (data.running) {
                regeneratePreviousCount = data.count;
                $('#memories-regenerate-btn').prop('disabled', true);
                $('#memories-regenerate-status').text('Generating… this may take a few minutes.').show();
                startRegeneratePoll();
            }
        });

        // Save as album
        $(document).on('click', '.memories-save-btn', function() {
            const btn = $(this);
            const memoryId = btn.data('memory-id');
            btn.prop('disabled', true).text('Saving…');

            const http = new Http('save memory');
            http.ajax('post', '/memories/' + memoryId + '/save', '{}').then(function(data) {
                if (data.status === 'success') {
                    btn.replaceWith('<a href="/album/' + data.albumId + '" class="btn btn-sm btn-outline-secondary"><span class="bi-bookmark-check"></span> Saved</a>');
                } else {
                    btn.prop('disabled', false).html('<span class="bi-bookmark-plus"></span> Save');
                }
            }).catch(function() {
                btn.prop('disabled', false).html('<span class="bi-bookmark-plus"></span> Save');
            });
        });
    });
</script>


</body>
</html>
