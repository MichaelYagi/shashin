<!DOCTYPE html>
<html lang="en" xmlns:th="http://thymeleaf.org">
<head th:insert="fragments/head :: head(${titleDescriptor})"></head>
<body class="thumb d-flex flex-column vh-100">

<div th:replace="fragments/topnav :: topnav(${currentUser},${activePage},'')"></div>

<div id="container" class="container-fluid pb-3 flex-grow-1 d-flex flex-column overflow-auto">
    <div class="row flex-grow-sm-1 flex-grow-0">
        <div th:replace="fragments/sidebaroffcanvas :: sidebaroffcanvas(${activeSidebar},${currentUser})"></div>
        <main role="main" class="col overflow-auto h-100">
            <div th:replace="fragments/content :: content(${message},${activePage},${authority},${parameter},'')" class="col-sm p-3 min-vh-100"></div>
            <div class="row image-group-padding">
                <form action="/users/update" method="post">
                    <h2 class="form-signin-heading">Change Password</h2>
                    <th:block th:if="${message != '' and alertClass != ''}">
                        <div class="col-12">
                            <div th:if="${message}" th:text="${message}" th:class="${'alert ' + alertClass}"/>
                        </div>
                    </th:block>
                    <p>
                        <label for="oldpassword" class="sr-only">Old Password</label>
                        <input type="password" id="oldpassword" name="oldpassword" class="form-control" placeholder="Old password" required autofocus>
                    </p>
                    <p>
                        <label for="newpassword" class="sr-only">New Password</label>
                        <input type="password" id="newpassword" name="newpassword" class="form-control" placeholder="New password" required>
                    </p>
                    <p>
                        <label for="newpasswordconfirm" class="sr-only">New Password Confirm</label>
                        <input type="password" id="newpasswordconfirm" name="newpasswordconfirm" class="form-control" placeholder="New password confirm" required>
                    </p>
                    <button class="btn btn-lg btn-primary btn-block" type="submit">Save</button>
                </form>
            </div>

            <div id="footer" th:replace="fragments/footer :: footer(${copyrightYear},${operatingSystemInfo},${buildProperties})"></div>
        </main>
    </div>
</div>

<script type="text/javascript" th:inline="javascript" th:nonce="${cspNonce}">
    /*<![CDATA[*/
    shashin.nonce = /*[[${cspNonce}]]*/ '';
    /*]]>*/

    $(document).ready(function(){
        $(function() {
            $('[data-bs-toggle="tooltip"]').tooltip()
        })
    });
</script>

</body>
</html>
