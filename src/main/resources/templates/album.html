<!DOCTYPE html>
<html lang="en">
<head th:insert="fragments/head :: head(${titleDescriptor})"></head>
<body>

<div th:replace="fragments/topnav :: topnav(${authority})"></div>

<div class="container-fluid">
    <div class="row">
    <div th:replace="fragments/sidebar :: sidebar(${activeSidebar}, ${authority})"></div>
        <main role="main" class="col-md-11 col-lg-11 pt-3 px-4">
            <div th:replace="fragments/content :: content(${data},${activePage})" class="col-sm p-3 min-vh-100"></div>

            <th:block th:if="${album != '' and albumMetadataList != ''}">
                <h1 th:text="${album.name}"></h1>
                <div class="row">
                    <th:block th:each="metadata, iterStat: ${albumMetadataList}">
                        <div class="photo-thumbnail-container photo-thumbnail">
                            <img th:src="${metadata.thumbnailUrlSmall}" class="photo-thumbnail-image" th:id="'albumImage'+${metadata.id}">
                        </div>
                    </th:block>
                </div>
            </th:block>

            <div th:replace="fragments/footer :: footer(${copyrightYear})"></div>
        </main>
    </div>
</div>
</div>
</body>
</html>
