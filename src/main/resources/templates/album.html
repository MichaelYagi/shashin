<!DOCTYPE html>
<html lang="en" xmlns:th="http://thymeleaf.org">
<head th:insert="fragments/head :: head(${titleDescriptor})"></head>
<body class="thumb d-flex flex-column vh-100">

<div th:replace="fragments/topnav :: topnav(${currentUser},${hasNotifications},${activePage})"></div>

<div id="container" class="container-fluid pb-3 flex-grow-1 d-flex flex-column overflow-auto">
    <div class="row flex-grow-sm-1 flex-grow-0">
        <div th:replace="fragments/sidebaroffcanvas :: sidebaroffcanvas(${activeSidebar},${currentUser},${hasNotifications})"></div>
        <main role="main" class="col overflow-auto h-100">
            <div th:replace="fragments/content :: content(${message},${activePage},${authority},${parameter})" class="col-sm p-3 min-vh-100"></div>
            <input type="hidden" id="currentlat" name="currentlat">
            <input type="hidden" id="currentlng" name="currentlng">
            <input type="hidden" id="currentyear" name="currentyear">
            <input type="hidden" id="currentmonth" name="currentmonth">
            <input type="hidden" id="currentday" name="currentday">
            <input type="hidden" id="currentPage" name="currentPage" value="0">

            <div id="albumMessage"></div>

            <th:block th:if="${album != '' and albumMetadataList != ''}">
                <h1 th:text="${album.name}"></h1>
                <span id="albumId" style="display: none" th:text="${album.id}"></span>
                <div id="infinite-scroll-gallery">
                    <div th:replace="fragments/appjs :: appjs()"></div>
                    <div th:replace="fragments/albumjs :: albumjs()"></div>
                    <div th:replace="fragments/albummodal :: albummodal()"></div>

                    <div class="row p-3">
                        <th:block th:each="metadata, iterStat: ${albumMetadataList}">
                            <div class="photo-thumbnail-container photo-thumbnail" th:style="${'width:'+metadata.thumbnailSmallWidth+'px;height:'+metadata.thumbnailSmallHeight+'px;padding-left:0;padding-right:0;'}">
                                <a class="lightGalleryIndexAnchor" th:name="${'lightGalleryIndex'+iterStat.index}"></a>

                                <img th:src="${metadata.thumbnailUrlSmall}" class="photo-thumbnail-image" th:id="'image'+${metadata.id}" th:width="${metadata.thumbnailSmallWidth}" th:height="${metadata.thumbnailSmallHeight}" style="background-color:lightgray;">

                                <th:block th:if="${metadata.type.contains('video')}">
                                    <div class="thumbnail-tr" th:id="'tntr'+${metadata.id}">
                                        <span class="bi-camera-video-fill" style="font-size: 1rem;color: red;background-color:lightcyan;padding:0 5px 0 5px;border-radius: 5px;"></span>
                                    </div>
                                </th:block>

                                <th:block th:if="${authority == 'ROLE_ADMIN'}">
                                    <div class="thumbnail-tl" th:id="'tntl'+${metadata.id}">
                                        <a href="#" th:id="'select'+${metadata.id}">
                                            <span th:id="'tlicon'+${metadata.id}" class="bi-circle" style="font-size: 1rem;color: lightgray;"></span>
                                        </a>
                                    </div>

                                    <div class="thumbnail-bl" th:id="'tnbl'+${metadata.id}">
                                        <a href="#" th:id="'albumModalEdit'+${metadata.id}"  th:onclick="return openAlbumModal(event,[[${metadata.id}]])" style="text-decoration: none;color: midnightblue">
                                            <span class="bi-pencil" style="font-size: 1rem;color: lightgray;"></span>
                                        </a>
                                    </div>
                                </th:block>

                                <div class="thumbnail-br" th:id="'tnbr'+${metadata.id}">
                                    <a href="#" th:id="'favorite'+${metadata.id}" class="text-decoration-none">
                                        <span style="background-color:lightcyan;padding:0 5px 0 5px;border-radius: 5px;">
                                            <span th:id="'briconcount'+${metadata.id}" th:text="${#maps.containsKey(favorites, metadata.id) ? favorites.get(metadata.id).get('count')+ ' ' : '0 '}"></span><span th:id="'brfavoriteicon'+${metadata.id}" th:class="${#maps.containsKey(favorites, metadata.id) and favorites.get(metadata.id).get('favorite')} ? 'bi-suit-heart-fill' : 'bi-suit-heart'" style="font-size: 1rem;color: red;"></span>
                                        </span>
                                    </a>
                                    <br>
                                    <a href="#" data-bs-toggle="modal" th:data-bs-target="'#propalbumphotocomment'+${metadata.id}" style="text-decoration: none;color: midnightblue;background-color:lightcyan;padding:3px 5px 0 5px;border-radius: 5px;">
                                        <th:block th:text="${#lists.size(albumPhotoCommentsMap.get(metadata.id))}"></th:block> <span th:id="'bricon'+${metadata.id}" class="bi-chat-square-fill position-relative" style="font-size: 1rem;color: midnightblue;">
                                            <th:block th:if="${notificationMap.get(metadata.id)}">
                                            <span class="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-light rounded-circle">
                                                <span class="visually-hidden">New alerts</span>
                                            </span>
                                            </th:block>
                                        </span>
                                    </a>
                                </div>

                                <div class="thumbnail-centered" th:id="'tncentered'+${metadata.id}">
                                    <th:block th:unless="${metadata.type.contains('video')}">
                                        <th:block th:unless="${metadata.year==null or metadata.month==null or metadata.day==null}">
                                            <th:block th:with="sdf = ${new java.text.SimpleDateFormat('yyyy-M-d')}">
                                                <a class="mediaLink" th:onclick="return openGallery(event,[[${iterStat.index}]])"
                                                   th:data-src="${metadata.thumbnailUrlOriginal}" th:href="${metadata.thumbnailUrlOriginal}"
                                                   th:data-sub-html="${(metadata.placeName != null ? '<a href=&quot;/map?lat='+metadata.lat+'&lng='+metadata.lng+'&quot; target=&quot;_blank&quot;>'+metadata.placeName+'</a><br>' : '<br>')+metadata.fileName+' taken on '+#dates.format(sdf.parse(metadata.year+'-'+metadata.month+'-'+metadata.day), 'EEE, MMM dd, yyyy')}">
                                                    <span class="bi-play-circle" style="font-size: 4rem;color: lightgray;"></span>
                                                </a>
                                            </th:block>
                                        </th:block>
                                        <th:block th:if="${metadata.year==null or metadata.month==null or metadata.day==null}">
                                            <a class="mediaLink" th:onclick="return openGallery(event,[[${iterStat.index}]])"
                                               th:data-src="${metadata.thumbnailUrlOriginal}" th:href="${metadata.thumbnailUrlOriginal}"
                                               th:data-sub-html="${(metadata.placeName != null ? '<a href=&quot;/map?lat='+metadata.lat+'&lng='+metadata.lng+'&quot; target=&quot;_blank&quot;>'+metadata.placeName+'</a><br>' : '<br>')+metadata.fileName}">
                                                <span class="bi-play-circle" style="font-size: 4rem;color: lightgray;"></span>
                                            </a>
                                        </th:block>
                                    </th:block>

                                    <th:block th:if="${metadata.type.contains('video')}">
                                        <th:block th:unless="${metadata.year==null or metadata.month==null or metadata.day==null}">
                                            <th:block th:with="sdf = ${new java.text.SimpleDateFormat('yyyy-M-d')}">
                                                <a class="mediaLink" th:onclick="return openGallery(event,[[${iterStat.index}]])"
                                                   th:data-video="${'{&quot;source&quot;: [{&quot;src&quot;:&quot;'+metadata.videoUrl+'&quot;, &quot;type&quot;:&quot;video/mp4&quot;}], &quot;attributes&quot;: {&quot;preload&quot;: false, &quot;controls&quot;: true}}'}"
                                                   th:data-sub-html="${(metadata.placeName != null ? '<a href=&quot;/map?lat='+metadata.lat+'&lng='+metadata.lng+'&quot; target=&quot;_blank&quot;>'+metadata.placeName+'</a><br>' : '<br>')+metadata.fileName+' taken on '+#dates.format(sdf.parse(metadata.year+'-'+metadata.month+'-'+metadata.day), 'EEE, MMM dd, yyyy')}">
                                                    <span class="bi-play-circle" style="font-size: 4rem;color: lightgray;"></span>
                                                </a>
                                            </th:block>
                                        </th:block>
                                        <th:block th:if="${metadata.year==null or metadata.month==null or metadata.day==null}">
                                            <a class="mediaLink" th:onclick="return openGallery(event,[[${iterStat.index}]])"
                                               th:data-video="${'{&quot;source&quot;: [{&quot;src&quot;:&quot;'+metadata.videoUrl+'&quot;, &quot;type&quot;:&quot;video/mp4&quot;}], &quot;attributes&quot;: {&quot;preload&quot;: false, &quot;controls&quot;: true}}'}"
                                               th:data-sub-html="${(metadata.placeName != null ? '<a href=&quot;/map?lat='+metadata.lat+'&lng='+metadata.lng+'&quot; target=&quot;_blank&quot;>'+metadata.placeName+'</a><br>' : '<br>')+metadata.fileName}">
                                                <span class="bi-play-circle" style="font-size: 4rem;color: lightgray;"></span>
                                            </a>
                                        </th:block>
                                    </th:block>
                                </div>
                            </div>

                            <span th:id="'albummodal'+${metadata.id}" style="width:0;height:0;padding:0"></span>

                            <script type="text/javascript">
                                /*<![CDATA[*/
                                $("#albumModalEdit[[${metadata.id}]]").attr("tag", decodeHtml("[[${metadata}]]"));
                                setPhotoOverlays("[[${metadata}]]", "[[${activePage}]]");
                                renderAlbumModal("[[${album}]]","[[${metadata}]]","[[${currentUser}]]","[[${albumPhotoCommentsMapString}]]")
                                activateAlbumListeners("[[${metadata}]]","[[${album}]]")
                                /*]]>*/
                            </script>

                            <span class="appendAlbumPhotos" style="width:0;height:0;padding:0"></span>
                        </th:block>
                    </div>
                </div>
            </th:block>

            <div th:replace="fragments/footer :: footer(${copyrightYear},${operatingSystemInfo},${buildProperties})"></div>
        </main>
    </div>
</div>

<div class="modal fade" id="propAlbumModal" tabindex="-1" role="dialog" aria-labelledby="labelAlbumModal" aria-hidden="true">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="exampleModalLabel">Edit <span id="albumModalTitle"></span><div id="propAlbumModalThumbnail"></div></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>

            </div>
            <div class="modal-body">
                <form id="saveAlbumModalForm">
                    <input type="hidden" name="metadataId" id="metadataId" value="">
                    <div class="col-auto form-check">
                        <input type="checkbox" class="form-check-input" id="removeFromAlbum" name="removeFromAlbum">
                        <label class="form-check-label" for="removeFromAlbum">Remove from album</label>
                    </div>
                    <div class="col-auto form-check">
                        <input type="checkbox" class="form-check-input" id="setCoverAlbum" name="setCoverAlbum">
                        <label class="form-check-label" for="setCoverAlbum">Set as album cover</label>
                    </div>
                </form>
                <div class="col-sm">
                    <span id="albumModalMsg"></span>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" id="saveAlbumModal">Save</button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    $(document).ready(function() {
        /*<![CDATA[*/
        const albumId = [[${albumId}]];
        /*]]>*/
        var mediaContentList = [];
        $.each($('.mediaLink'), function(index, element) {
            var mediaContent = {}
            mediaContent.subHtml =$(this).attr("data-sub-html")
            if ($(this).attr("data-src")) {
                mediaContent.src = $(this).attr("data-src");
            } else if ($(this).attr("data-video")) {
                mediaContent.video = $(this).attr("data-video");
            }
            mediaContentList.push(mediaContent);
        });
        if (typeof lg !== "undefined") {
            lg.refresh(mediaContentList);
            $infiniteScrollGallery.addEventListener('lgAfterSlide', function(e) {
                jumpToLightGalleryIndex(e.detail.index);
            })
        }

        $('#saveAlbumModal').click(function (e) {
            // $('#saveAlbum'+metadata.id).click(function (e) {
            e.preventDefault();

            const metadataId = $("#metadataId").val();
            const albumId = $("#albumId").text();

            $('#albumModalMsg').html("");

            let requestJson = {
                removeFromAlbum:$('#removeFromAlbum').prop("checked"),
                setCoverAlbum:$('#setCoverAlbum').prop("checked"),
                metadataId:metadataId,
                albumId:albumId
            }

            const posting = $.post({
                url: "/album/update",
                data: JSON.stringify(requestJson),
                contentType: 'application/json; charset=utf-8'
            });

            posting.done(function (data) {
                if (data.hasOwnProperty("status") && data.hasOwnProperty("msg")) {
                    if (data["status"] === "redirect") {
                        window.location.replace(data["msg"]);
                    } else {
                        let message = "Error";
                        if (data["status"] === "success") {
                            message = '<div class="alert alert-success" role="alert">' + data["msg"] + '</div>';
                            // window.top.location = window.top.location;
                        } else {
                            message = '<div class="alert alert-danger" role="alert">' + data["msg"] + '</div>';
                        }
                        $('#albumModalMsg').html(message);
                    }
                }
            });
            return false;
        });

        function loadNextPage() {
            var currentPage = parseInt($("#currentPage").val());
            var nextPage = currentPage+1;

            if (albumId > 0) {
                updateAlbum(albumId, nextPage, "[[${activePage}]]").then(function (additionalMediaContentList) {
                    if (additionalMediaContentList.length > 0) {
                        mediaContentList = mediaContentList.concat(additionalMediaContentList);
                        lg.refresh(mediaContentList);
                        $infiniteScrollGallery.addEventListener('lgAfterSlide', function (e) {
                            jumpToLightGalleryIndex(e.detail.index);
                        })
                    }
                });
            }

            $("#currentPage").val(nextPage);
        }

        const refreshIntervalId = window.setInterval(function () {
            if (albumId > 0 && !$("#container").hasScrollBar() && !$("main").hasScrollBar()) {
                setTimeout(() => {
                    loadNextPage();
                }, 1000);
            } else {
                clearInterval(refreshIntervalId);
            }

            if ($(".appendAlbumPhotos").last().text() === "EOL"  || '[[${albumMetadataList}]]' === '' || '[[${albumMetadataList}]]' === '[]') {
                clearInterval(refreshIntervalId);
            }
        }, 200);
        $("#container").on('scroll', function() {
            if (albumId > 0 && atEndOfPage(this) && $(".appendAlbumPhotos").last().text() !== "EOL") {
                loadNextPage();
            }
        })
        $("main").on('scroll', function() {
            if (albumId > 0 && atEndOfPage(this) && $(".appendAlbumPhotos").last().text() !== "EOL") {
                loadNextPage();
            }
        })

        $(function() {
            $('[data-bs-toggle="tooltip"]').tooltip()
        })
    });
</script>
