<!DOCTYPE html>
<html lang="en" xmlns:th="http://thymeleaf.org">
<head th:insert="fragments/head :: head(${titleDescriptor})"></head>
<body class="thumb d-flex flex-column vh-100">

<div th:replace="fragments/topnav :: topnav(${currentUser},${hasNotifications},${activePage})"></div>

<div th:replace="fragments/infomodal :: infomodal()"></div>

<div id="container" class="container-fluid pb-3 flex-grow-1 d-flex flex-column overflow-auto">
    <div class="row flex-grow-sm-1 flex-grow-0">
        <div th:replace="fragments/sidebaroffcanvas :: sidebaroffcanvas(${activeSidebar},${currentUser},${hasNotifications})"></div>
        <main role="main" class="col overflow-auto h-100">
            <div th:replace="fragments/content :: content(${message},${activePage},${authority},${parameter},'')" class="col-sm p-3 min-vh-100"></div>
            <input type="hidden" id="currentlat" name="currentlat">
            <input type="hidden" id="currentlng" name="currentlng">
            <input type="hidden" id="currentyear" name="currentyear">
            <input type="hidden" id="currentmonth" name="currentmonth">
            <input type="hidden" id="currentday" name="currentday">
            <input type="hidden" id="currentfilename" name="currentfilename">
            <input type="hidden" id="currentPage" name="currentPage" value="0">

            <div id="albumMessage"></div>

            <th:block th:if="${album != '' and albumMetadataList != ''}">
                <h1 th:text="${album.name}"></h1>
                <span id="albumId" style="display: none" th:text="${album.id}"></span>
                <div id="infinite-scroll-gallery">

                    <div class="row p-3">
                        <th:block th:each="metadata, iterStat: ${albumMetadataList}">
                            <div class="photo-thumbnail-container photo-thumbnail" th:style="${'width:'+metadata.thumbnailSmallWidth+'px;height:'+metadata.thumbnailSmallHeight+'px;padding-left:0;padding-right:0;'}">
                                <a class="lightGalleryIndexAnchor" th:name="${'lightGalleryIndex'+iterStat.index}"></a>

                                <img th:src="${#uris.escapePath(metadata.thumbnailUrlSmall)}" class="photo-thumbnail-image" th:id="'image'+${metadata.id}" th:width="${metadata.thumbnailSmallWidth}" th:height="${metadata.thumbnailSmallHeight}" style="background-color:lightgray;" th:onError="shashin.errorImg(this,[[${metadata.title}]],209)">

                                <div th:replace="fragments/toprightoverlay :: toprightoverlay(${metadata.type},${metadata.id},${metadata.duration != null ? metadata.duration : '0:00'},${metadata.originalImageWidth},${metadata.originalImageHeight},false)"></div>

                                <th:block th:if="${authority == 'ROLE_ADMIN'}">
                                    <div th:replace="fragments/topleftoverlay :: topleftoverlay(${metadata.id})"></div>
                                    <div th:replace="fragments/bottomleftoverlay :: bottomleftoverlay(${metadata.id}, null, 'albumModalEdit', 'albumSettings.openAlbumModal', 'overlayCommentText')"></div>
                                </th:block>

                                <th:block th:if="${authority == 'ROLE_USER'}">
                                    <div th:replace="fragments/bottomleftoverlay :: bottomleftoverlay(${metadata.id}, null, null, null, null)"></div>
                                </th:block>

                                <div class="thumbnail-br" th:id="'tnbr'+${metadata.id}">
                                    <a href="#" th:id="'favorite'+${metadata.id}" class="text-decoration-none">
                                        <span class="overlayIconBackground">
                                            <span th:id="'briconcount'+${metadata.id}" th:text="${#maps.containsKey(favorites, metadata.id) ? favorites.get(metadata.id).get('count')+ ' ' : '0 '}"></span><span th:id="'brfavoriteicon'+${metadata.id}" th:class="${#maps.containsKey(favorites, metadata.id) and favorites.get(metadata.id).get('favorite')} ? 'bi-suit-heart-fill overlayIcon' : 'bi-suit-heart overlayIcon'"></span>
                                        </span>
                                    </a>
                                    <br>
                                    <a href="#" data-bs-toggle="modal" th:data-bs-target="'#propalbumphotocomment'+${metadata.id}" class="overlayCommentIconBackground overlayCommentText">
                                        <span th:id="'brcommentcount'+${metadata.id}"><th:block th:text="${#lists.size(albumPhotoCommentsMap.get(metadata.id))}"></th:block></span> <span th:id="'bricon'+${metadata.id}" class="bi-chat-square position-relative overlayCommentIcon">
                                            <th:block th:if="${notificationMap.get(metadata.id)}">
                                            <span class="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-light rounded-circle">
                                                <span class="visually-hidden">New alerts</span>
                                            </span>
                                            </th:block>
                                        </span>
                                    </a>
                                </div>

                                <div th:replace="fragments/centeredoverlay :: centeredoverlay(${metadata},'albumSettings.openGallery',${iterStat.index})"></div>

                            </div>

                            <span th:id="'albummodal'+${metadata.id}" style="width:0;height:0;padding:0"></span>

                            <script th:inline="javascript" type="text/javascript">
                                /*<![CDATA[*/
                                $("#albumModalEdit"+/*[[${metadata.id}]]*/"00000000-00000000-00000000-00000000").attr("tag", shashin.decodeHtml(JSON.stringify(/*[[${metadata}]]*/{})));
                                shashin.setPhotoOverlays(/*[[${metadata}]]*/{}, /*[[${activePage}]]*/'album');
                                albumModal.renderAlbumCommentsModal(/*[[${album}]]*/{},/*[[${metadata}]]*/{},/*[[${currentUser}]]*/{},/*[[${albumPhotoCommentsMapString}]]*/{})
                                albumSettings.activateAlbumListeners(/*[[${metadata}]]*/{},/*[[${album}]]*/{})
                                $("#infoModalEdit"+/*[[${metadata.id}]]*/"00000000-00000000-00000000-00000000").attr("tag",JSON.stringify(/*[[${metadata}]]*/{}));
                                $("#infoModalEdit"+/*[[${metadata.id}]]*/"00000000-00000000-00000000-00000000").click(function(e) {
                                    e.preventDefault();
                                    const metadataObj = JSON.parse($(this).attr("tag"));
                                    shashin.openInfoModal(metadataObj);
                                });
                                /*]]>*/
                            </script>

                            <span class="appendAlbumPhotos" style="width:0;height:0;padding:0"></span>
                        </th:block>
                    </div>
                </div>
            </th:block>

            <div th:replace="fragments/footer :: footer(${copyrightYear},${operatingSystemInfo},${buildProperties})"></div>
        </main>
    </div>
</div>

<div class="modal fade" id="propAlbumModal" tabindex="-1" role="dialog" aria-labelledby="labelAlbumModal" aria-hidden="true">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="exampleModalLabel">Edit <span id="albumModalTitle"></span><div id="propAlbumModalThumbnail"></div></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>

            </div>
            <div class="modal-body">
                <form id="saveAlbumModalForm">
                    <input type="hidden" name="metadataId" id="metadataId" value="">
                    <div class="col-auto form-check">
                        <input type="checkbox" class="form-check-input" id="removeFromAlbum" name="removeFromAlbum">
                        <label class="form-check-label" for="removeFromAlbum">Remove from album</label>
                    </div>
                    <div class="col-auto form-check">
                        <input type="checkbox" class="form-check-input" id="setCoverAlbum" name="setCoverAlbum">
                        <label class="form-check-label" for="setCoverAlbum">Set as album cover</label>
                    </div>
                </form>
                <div class="col-sm">
                    <span id="albumModalMsg"></span>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" id="saveAlbumModal">Save</button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            </div>
        </div>
    </div>
</div>

<script src="/js/site/applisteners.js"></script>
<script th:inline="javascript" type="text/javascript">
    $(document).ready(function() {
        /*<![CDATA[*/
        const albumId = /*[[${albumId}]]*/ 0;
        /*]]>*/

        $("#removeFromAlbum").change(function() {
            if(this.checked) {
                $('#setCoverAlbum').prop('checked', false);
            }
        });
        $("#setCoverAlbum").change(function() {
            if(this.checked) {
                $('#removeFromAlbum').prop('checked', false);
            }
        });

        albumSettings.setLightGalleryElement('infinite-scroll-gallery');
        albumSettings.setLightGallery();

        let mediaContentList = [];
        $.each($('.mediaLink'), function(index, element) {
            const mediaContent = {};
            mediaContent.subHtml =$(this).attr("data-sub-html")
            if ($(this).attr("data-src")) {
                mediaContent.src = $(this).attr("data-src");
                mediaContent.downloadUrl = $(this).attr("data-src");
            } else if ($(this).attr("data-video")) {
                mediaContent.video = $(this).attr("data-video");
                mediaContent.downloadUrl = $(this).attr("data-video");
            }
            mediaContentList.push(mediaContent);
        });
        if (mediaContentList.length > 0 && albumSettings.getLightGallery() !== null) {
            albumSettings.getLightGallery().refresh(mediaContentList);
            albumSettings.infiniteScrollGallery.addEventListener('lgAfterSlide', function(e) {
                shashin.jumpToLightGalleryIndex(e.detail.index);
            })
        }

        $('#saveAlbumModal').click(function (e) {
            // $('#saveAlbum'+metadata.id).click(function (e) {
            e.preventDefault();

            const metadataId = $("#metadataId").val();
            const albumId = $("#albumId").text();

            $('#albumModalMsg').html("");

            let requestJson = {
                removeFromAlbum:$('#removeFromAlbum').prop("checked"),
                setCoverAlbum:$('#setCoverAlbum').prop("checked"),
                metadataId:metadataId,
                albumId:albumId
            }

            const posting = $.post({
                url: "/album/update",
                data: JSON.stringify(requestJson),
                contentType: 'application/json; charset=utf-8'
            });

            posting.done(function (data) {
                if (data.hasOwnProperty("status") && data.hasOwnProperty("msg")) {
                    if (data["status"] === "redirect") {
                        window.location.replace(data["msg"]);
                    } else {
                        let message = "Error";
                        if (data["status"] === "success") {
                            message = '<div class="alert alert-success" role="alert">' + data["msg"] + '</div>';
                            // window.top.location = window.top.location;
                        } else {
                            message = '<div class="alert alert-danger" role="alert">' + data["msg"] + '</div>';
                        }
                        $('#albumModalMsg').html(message);
                    }
                }
            });
            return false;
        });

        function loadNextPage() {
            const currentPage = parseInt($("#currentPage").val());
            const nextPage = currentPage + 1;
            /*<![CDATA[*/
            const activePage = /*[[${activePage}]]*/ 'album';
            /*]]>*/

            if (albumId > 0) {
                albumSettings.updateAlbum(albumId, nextPage, activePage).then(function (additionalMediaContentList) {
                    if (additionalMediaContentList.length > 0) {
                        mediaContentList = mediaContentList.concat(additionalMediaContentList);
                        if (albumSettings.getLightGallery() !== null) {
                            albumSettings.getLightGallery().refresh(mediaContentList);
                            albumSettings.infiniteScrollGallery.addEventListener('lgAfterSlide', function (e) {
                                shashin.jumpToLightGalleryIndex(e.detail.index);
                            })
                        }
                    }
                });
            }

            $("#currentPage").val(nextPage);
        }

        const refreshIntervalId = window.setInterval(function () {
            if (albumId > 0 && !$("#container").hasScrollBar() && !$("main").hasScrollBar()) {
                setTimeout(() => {
                    loadNextPage();
                }, 1000);
            } else {
                clearInterval(refreshIntervalId);
            }

            /*<![CDATA[*/
            const albumMetadataList = /*[[${albumMetadataList}]]*/ '[]';
            /*]]>*/
            if ($(".appendAlbumPhotos").last().text() === "EOL"  || albumMetadataList === '' || albumMetadataList === '[]') {
                clearInterval(refreshIntervalId);
            }
        }, 200);
        $("#container").on('scroll', function() {
            if (albumId > 0 && shashin.atEndOfPage(this) && $(".appendAlbumPhotos").last().text() !== "EOL") {
                loadNextPage();
            }
        })
        $("main").on('scroll', function() {
            if (albumId > 0 && shashin.atEndOfPage(this) && $(".appendAlbumPhotos").last().text() !== "EOL") {
                loadNextPage();
            }
        })

        $(function() {
            $('[data-bs-toggle="tooltip"]').tooltip()
        })
    });
</script>
</body>
</html>
