<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:insert="~{fragments/head :: head(${activePage},${titleDescriptor})}"></head>
<body class="thumb d-flex flex-column vh-100">

<div th:replace="~{fragments/topnav :: topnav(${currentUser},${activePage},'')}"></div>

<div th:replace="~{fragments/metadatamodal :: metadatamodal(${currentUser})}"></div>

<div th:replace="~{fragments/metadatabatchmodal :: metadatabatchmodal(${recognitionLabels},${allAlbumList})}"></div>

<div th:replace="~{fragments/infosidebar :: infosidebar(${currentUser})}"></div>

<div id="container" class="container-fluid pb-3 flex-grow-1 d-flex flex-column overflow-auto">
    <div class="row flex-grow-sm-1 flex-grow-0">
        <div th:replace="~{fragments/sidebaroffcanvas :: sidebaroffcanvas(${activeSidebar},${currentUser})}"></div>
        <main role="main" class="col overflow-auto h-100">
            <div th:replace="~{fragments/hiddenfields :: hiddenfields(${message})}"></div>
            <input type="hidden" id="albumId" name="albumId" th:value="${album.id}">
            <input type="hidden" id="albumNameInput" name="albumNameInput" th:value="${album.name}">

            <th:block th:if="${not #lists.isEmpty(albumMetadataList)}">
                <div id="albumNameHeader" class="mt-2">
                    <th:block th:each="albumUser, iterStat: ${sharedAlbumUsers}">
                        <th:block th:if="${albumUser.profile != null}">
                        <img th:src="${albumUser.profile}" data-bs-toggle="tooltip" data-bs-placement="bottom" th:title="${albumUser.username}" th:id="${'albumuser'+albumUser.id}" class="me-1" style="display:inline-block;width:30px;height:30px;">
                        </th:block>

                        <th:block th:if="${albumUser.profile == null}">
                        <span class="bi-person-circle me-1 align-middle" style="font-size:1.8rem;" data-bs-toggle="tooltip" data-bs-placement="bottom" th:title="${albumUser.username}" th:id="${'albumuser'+albumUser.id}"></span>
                        </th:block>
                    </th:block>
                </div>

                <div id="infinite-scroll-gallery">
                    <div class="row image-group-padding">
                        <th:block th:each="metadata, iterStat: ${albumMetadataList}">

                            <th:block th:if="${iterStat.count > 0}" th:unless="${!iterStat.first and albumMetadataList[iterStat.index-1].year==metadata.year and albumMetadataList[iterStat.index-1].month==metadata.month and albumMetadataList[iterStat.index-1].day==metadata.day}">
                                <th:block th:unless="${metadata.year==null or metadata.month==null or metadata.day==null}">
                                    <section class="dateSection" th:id="${metadata.year+'-'+metadata.month+'-'+metadata.day}"><p><strong th:text="${#strings.replace(#dates.format(#dates.create(#numbers.formatInteger(metadata.year,10),#numbers.formatInteger(metadata.month,10),#numbers.formatInteger(metadata.day,10)), 'EEE, MMM d, yyyy'),'.','')}"></strong></p><div th:id="'dateBody'+${metadata.year+'-'+metadata.month+'-'+metadata.day}" class="row" style="margin-left: -1px;">
                                </th:block>
                            </th:block>

                            <div th:id="${'photoThumbnailContainer'+metadata.id}" class="photo-thumbnail-container photo-thumbnail" th:style="${'width:'+metadata.thumbnailSmallWidth+'px;height:'+metadata.thumbnailSmallHeight+'px;padding-left:0;padding-right:0;'}">
                                <a class="lightGalleryIndexAnchor" th:name="${'lightGalleryIndex'+iterStat.index}"></a>

                                <img loading="lazy" draggable="false" th:data-smallthumb="'/api/v1/thumbnails/225/'+${metadata.id}" th:data-xsmallthumb="${metadata.thumbnailUrlExtraSmall==null?'':'/api/v1/thumbnails/112/'+metadata.id}" th:src="'/api/v1/thumbnails/225/'+${metadata.id}" class="photo-thumbnail-image" th:id="'image'+${metadata.id}" th:width="${metadata.thumbnailSmallWidth}" th:height="${metadata.thumbnailSmallHeight}" style="background-color:lightgray;">
                                <input type="hidden" th:name="'filename'+${metadata.id}" th:id="'filename'+${metadata.id}" th:value="${metadata.fileName}">
                                <input type="hidden" th:name="'thumbnailCentered'+${metadata.id}" th:id="'thumbnailCentered'+${metadata.id}" th:value="'/api/v1/thumbnails/centered/'+${metadata.id}">

                                <div th:replace="~{fragments/toprightoverlay :: toprightoverlay(${metadata.type},${metadata.id},${metadata.duration != null ? metadata.duration : '0:00'},${metadata.originalImageWidth},${metadata.originalImageHeight},${metadata.expectedExtension},false)}"></div>

                                <div th:replace="~{fragments/topleftoverlay :: topleftoverlay(${metadata.id})}"></div>

                                <th:block th:if="${authority == 'ROLE_ADMIN' || authority == 'ROLE_SUPER'}">
                                    <div th:replace="~{fragments/bottomleftoverlay :: bottomleftoverlay(${metadata}, null, 'albumModalEdit', 'albumSettings.openAlbumModal', 'overlayCommentText')}"></div>
                                </th:block>

                                <th:block th:if="${authority == 'ROLE_USER'}">
                                    <div th:replace="~{fragments/bottomleftoverlay :: bottomleftoverlay(${metadata}, null, null, null, null)}"></div>
                                </th:block>

                                <div class="thumbnail-br" th:id="'tnbr'+${metadata.id}">
                                    <a href="#" data-bs-toggle="modal" th:data-bs-target="'#propalbumphotocomment'+${metadata.id}" class="overlayCommentIconBackground overlayCommentText">
                                        <span th:id="'brcommentcount'+${metadata.id}"><th:block th:text="${albumPhotoCommentsMap.containsKey(metadata.id) ? #lists.size(albumPhotoCommentsMap.get(metadata.id)) : '0'}"></th:block></span> <span th:id="'bricon'+${metadata.id}" class="bi-chat-square position-relative overlayCommentIcon">
                                        </span>
                                    </a>
                                    <br>
                                    <a href="#" th:id="'favorite'+${metadata.id}" class="text-decoration-none">
                                        <span class="overlayIconBackground">
                                            <span th:id="'briconcount'+${metadata.id}" th:text="${#maps.containsKey(favorites, metadata.id) ? favorites.get(metadata.id).get('count') : '0'}"></span>&nbsp;<span th:id="'brfavoriteicon'+${metadata.id}" th:class="${#maps.containsKey(favorites, metadata.id) and favorites.get(metadata.id).get('favorite')} ? 'bi-suit-heart-fill overlayIcon' : 'bi-suit-heart overlayIcon'"></span>
                                        </span>
                                    </a>
                                </div>

                                <div th:replace="~{fragments/centeredoverlay :: centeredoverlay(${metadata},${activePage},${currentUser},'shashin.openGallery',${iterStat.index})}"></div>

                            </div>

                            <span th:id="'albummodal'+${metadata.id}" style="width:0;height:0;padding:0"></span>

                            <script th:inline="javascript" type="text/javascript" th:nonce="${cspNonce}">
                                /*<![CDATA[*/
                                shashin.setPhotoOverlays({id:[[${metadata.id}]],lat:[[${metadata.lat}]],lng:[[${metadata.lng}]],year:[[${metadata.year}]],month:[[${metadata.month}]],day:[[${metadata.day}]],fileName:[[${metadata.fileName}]],thumbnailUrlSmall:[[${metadata.thumbnailUrlSmall}]],type:[[${metadata.type}]]}, /*[[${activePage}]]*/'album');
                                albumModal.renderAlbumCommentsModal({id:[[${album.id}]]},{id:[[${metadata.id}]],fileName:[[${metadata.fileName}]]},/*[[${userMap}]]*/{},/*[[${albumPhotoCommentsMap}]]*/{},/*[[${canEdit}]]*/false)
                                albumSettings.activateAlbumListeners({id:[[${metadata.id}]]})
                                $("#mediaLink"+/*[[${metadata.id}]]*/"00000000-00000000-00000000-00000000").attr("tag",/*[[${metadata.id}]]*/"00000000-00000000-00000000-00000000");
                                $("#infoModalEdit"+/*[[${metadata.id}]]*/"00000000-00000000-00000000-00000000").on("click", function(e) {
                                    e.preventDefault();
                                    shashin.openEditMetadataModal(/*[[${metadata.id}]]*/"00000000-00000000-00000000-00000000");
                                });
                                /*]]>*/
                            </script>

                            <th:block th:if="${iterStat.count > 0 and !iterStat.last and metadata.year!=null and (albumMetadataList[iterStat.index+1].year+'-'+albumMetadataList[iterStat.index+1].month+'-'+albumMetadataList[iterStat.index+1].day)!=metadata.year+'-'+metadata.month+'-'+metadata.day}">
                                <th:block th:remove="tag" th:utext="'&lt;/div&gt;&lt;/section&gt;'"></th:block>
                                <span class="appendAlbumPhotos" style="width:0;height:0;padding:0"></span>
                            </th:block>
                            <th:block th:if="${iterStat.last and metadata.year!=null}">
                                <th:block th:remove="tag" th:utext="'&lt;/div&gt;&lt;/section&gt;'"></th:block>
                                <span class="appendAlbumPhotos" style="width:0;height:0;padding:0"></span>
                            </th:block>
                        </th:block>
                    </div>
                </div>
            </th:block>
            <th:block th:if="${#lists.isEmpty(albumMetadataList)}">
                <span class="appendAlbumPhotos" style="width:0;height:0;padding:0;display:none;">EOL</span>
            </th:block>

            <!-- Back to top button -->
            <button type="button" class="btn btn-primary btn-floating btn-lg" id="btn-back-to-top">
                <i class="bi-arrow-up-circle"></i>
            </button>

            <div id="spinner" class="spinner-border justify-content-center align-items-center" role="status" style="display: none"></div>
            <div th:replace="~{fragments/footer :: footer(${copyrightYear},${operatingSystemInfo},${buildProperties},${activeProfile},${activePage})}"></div>
        </main>
    </div>
</div>

<div class="modal fade" id="propAlbumModal" tabindex="-1" role="dialog" aria-labelledby="labelAlbumModal" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable modal-md" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="propAlbumModalLabel">Set &ldquo;<span id="albumModalTitle"></span>&rdquo; as album cover?<div id="propAlbumModalThumbnail"></div></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <form id="saveAlbumModalForm">
                <input type="hidden" name="setCoverAlbum" id="setCoverAlbum" value="yes">
            </form>

            <div class="col-sm">
                <span id="albumModalMsg"></span>
            </div>

            <div class="modal-footer">
                <div id="albumsModalStatus" class="spinner-grow me-auto" style="visibility: hidden;font-size: 1.55rem;" role="status" aria-hidden="true" data-bs-toggle="tooltip" data-bs-placement="right" title=""></div>
                <button type="button" class="btn btn-primary" id="saveAlbumModal">OK</button>
                <button id="albumsModalCancel" type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="proptrashcomment" tabindex="-1" role="dialog" aria-labelledby="labeltrashcomment" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable modal-sm" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="trashcommentModalLabel">Delete comment?</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">Are you sure you want to delete this comment?</div>
            <input type="hidden" id="commentMetadataId">
            <input type="hidden" id="commentCommentId">
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" id="deleteComment">Confirm</button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            </div>
        </div>
    </div>
</div>

<th:block th:if="${@environment.getProperty('app.js.useMinified') == 'false'}">
    <script src="/js/site/applisteners.js" type="text/javascript" th:nonce="${cspNonce}"></script>
    <script src="/js/site/albumlisteners.js" type="text/javascript" th:nonce="${cspNonce}"></script>
</th:block>
<th:block th:if="${@environment.getProperty('app.js.useMinified') == 'true'}">
    <script src="/js/site/min/applisteners.min.js" type="text/javascript" th:nonce="${cspNonce}"></script>
    <script src="/js/site/min/albumlisteners.min.js" type="text/javascript" th:nonce="${cspNonce}"></script>
</th:block>
<script th:inline="javascript" type="text/javascript" th:nonce="${cspNonce}">
    $(document).ready(function() {
        $('[data-bs-toggle="tooltip"]').tooltip({
            placement: "bottom"
        });

        const albumId = $("#albumId").val();
        /*<![CDATA[*/
        shashin.nonce = /*[[${cspNonce}]]*/ '';
        const activePage = /*[[${activePage}]]*/ 'album';
        const mediaTypeFilter = /*[[${mediaTypeFilter}]]*/ 'all';
        const albumName = /*[[${album.name}]]*/ '';
        /*]]>*/

        const section = $("section");
        let lastDate = "";
        if (section.length > 0) {
            const lastSection = $("section").last();
            lastDate = lastSection.attr("id")
            lastDate = dateFormat(lastDate.replace(/-/g, "/"), "yyyy-m-d");
        }

        shashin.updateSearchInput(albumName);

        const http = new Http(activePage);
        http.ajax("get", "/album/metadata/list/"+albumId+"/0").then(function (data) {
            if (data.hasOwnProperty("albumMetadataList") === true && data["albumMetadataList"].length > 0) {
                const albumMetadataList = data["albumMetadataList"];
                albumSettings.init(albumId, mediaTypeFilter, activePage, albumMetadataList, lastDate);
                // Util.checkErrorImage();
            }
        });
    });
</script>
</body>
</html>
