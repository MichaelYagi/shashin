<!DOCTYPE html>
<th:block th:insert="~{fragments/asciiart :: asciiart()}"></th:block>
<html lang="en" class="h-100">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Shashin</title>
        <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
        <link rel="manifest" href="/images/site.webmanifest">
        <link rel="mask-icon" href="/images/safari-pinned-tab.svg" color="#5bbad5">
        <meta name="msapplication-TileColor" content="#da532c">
        <meta name="theme-color" content="#ffffff">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <script src="/js/jquery-3.5.1.min.js" nonce="0"></script>
        <script src="/js/popper.min.js" nonce="0"></script>
        <script src="/js/bootstrap.min.js" nonce="0"></script>
        <link href="/css/bootstrap.min.css" rel="stylesheet">
        <link href="/css/bootstrap-icons.css" rel="stylesheet">
        <link href="/css/loginreg.css" rel="stylesheet" type="text/css">
        <script src="/js/site/min/util.min.js" th:nonce="0"></script>
    </head>

    <body class="d-flex h-100 text-center">
        <div th:class="${'d-flex w-100 h-100 ' + ((loggedIn == true) ? 'p-0' : 'p-3') + ' mx-auto flex-column'}" th:style="${'max-width: ' + ((loggedIn == true) ? '630px' : '560px;')}">
            <header class="mb-auto">
                <div>
                    <h3 class="float-md-start mb-0"><a style="color: inherit;text-decoration: inherit;" href="/">Shashin</a></h3>
                    <nav class="nav justify-content-center float-md-end">
                        <a class="nav-link" href="/features"><th:block th:text="#{main.features}"></th:block></a>
                        <a class="nav-link" href="/articles"><th:block th:text="#{main.articles}"></th:block></a>
                        <a class="nav-link" href="/users/login"><th:block th:if="${loggedIn == true}"><th:block th:text="#{main.gotoapp}"></th:block></th:block><th:block th:unless="${loggedIn == true}"><th:block th:text="#{main.login}"></th:block></th:block></a>
                        <th:block th:if="${loggedIn == false}">
                            <a class="nav-link dropdown-toggle" data-bs-toggle="dropdown" href="#" role="button" aria-expanded="false"><th:block th:text="#{main.language}"></th:block></a>

                            <ul class="dropdown-menu" id="languageSelect">
                                <th:block th:each="lang : ${languageList}">
                                    <li><a th:class="'dropdown-item' + ${locale == lang.code ? ' active' : ''}" th:id="${lang.code}" href="#"><th:block th:text="${lang.label}"></th:block></a></li>
                                </th:block>
                            </ul>
                        </th:block>
                        <th:block th:if="${loggedIn == true}"><a class="nav-link" href="/users/logout"><th:block th:text="#{main.logout}"></th:block></a></th:block>
                    </nav>
                </div>
            </header>

            <main class="px-3">
                <h1><th:block th:text="#{main.welcome.title}"></th:block></h1>
                <p class="lead"><th:block th:text="#{main.welcome.message}"></th:block></p>
                <p class="lead">
                    <a href="/features" class="btn btn-lg btn-primary fw-bold"><th:block th:text="#{main.welcome.learn}"></th:block></a>
                </p>
            </main>

            <footer class="mt-auto">
                <div class="form-switch" id="darkmodeSwitchContainer" style="display: none;">
                    <input class="form-check-input" type="checkbox" id="darkmodeSwitch">&nbsp;
                    <label class="form-check-label" for="darkmodeSwitch"><th:block th:text="#{main.pages.account.sitesettings.darkmode}"></th:block></label>
                </div>
                &copy; <span id="copyrightYear"></span> Shashin
            </footer>
        </div>

        <script type="text/javascript" nonce="0">
            $("#copyrightYear").text("2021-"+new Date().getFullYear());
            Util.activateDarkModeListener();

            $("#languageSelect li a").on("click", async function (e) {
                e.preventDefault();

                const language = $(this).attr("id");
                window.location.replace("/?lang="+language);
            });
        </script>

    </body>
</html>
