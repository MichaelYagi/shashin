<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:insert="~{fragments/head :: head(${activePage},${titleDescriptor})}"></head>
<body class="thumb d-flex flex-column vh-100">

<div th:replace="~{fragments/topnav :: topnav(${currentUser},${activePage},'')}"></div>

<div id="container" class="container-fluid pb-3 flex-grow-1 d-flex flex-column overflow-auto">
    <div class="row flex-grow-sm-1 flex-grow-0">
        <div th:replace="~{fragments/sidebaroffcanvas :: sidebaroffcanvas(${activeSidebar},${currentUser})}"></div>
        <main role="main" class="col overflow-auto h-100">
            <div th:replace="~{fragments/hiddenfields :: hiddenfields(${message})}"></div>

            <div class="row mt-3">
                <div class="col-1 me-5" id="profilePictureEditWrapper" th:style="${'width:200px;max-height:500px;display: ' + {user.profile==null or user.profile==''?'none;':'display;'}}">
                    <img id="profilePictureEdit" th:src="${user.profile==null or user.profile==''?'#':user.profile + '?' + randomString}" style="max-height: 200px;" />
                </div>
                <div id="profileInfo" class="col-10">
                    <h3 th:utext="${currentUser.username + '&lt;small class=&quot;text-muted&quot; style=&quot;font-size: 0.8rem&quot; &gt; Joined ' + dateJoined + '&lt;/small&gt;'}"></h3>
                    <p th:utext="${roleDescription}"></p>
                </div>
            </div>

            <div class="row mt-4">
                <div class="col-lg-4">
                    <div class="input-group mb-2">
                        <h1 class="display-6" style="font-size:1.5rem;">Edit Profile Picture</h1>
                    </div>

                    <div class="input-group mb-2">
                        <input type="file" th:accept="${'.'+#strings.listJoin(acceptedImageTypes, ',.')}" class="form-control" id="chooseProfilePhoto" name="chooseProfilePhoto" aria-describedby="chooseProfilePhoto" aria-label="Upload">
                        <button type="button" class="btn btn-danger rounded-end" id="removeProfile" th:style="${'display: '+{user.profile==null or user.profile==''?'none;':'block;'}}">Delete Profile Picture</button>
                        <button type="button" class="btn btn-secondary rounded-end" id="saveProfile" style="display: none;">Save</button>
                        &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                        <button type="button" id="cancelProfile" class="btn btn-secondary rounded" style="display: none;float:right;">Cancel</button>
                    </div>
                </div>
            </div>

            <th:block th:if="${message != '' and alertClass != ''}">
                <div class="col-12">
                    <div th:class="${'alert ' + alertClass + ' alert-dismissible fade show'}" role="alert" th:utext="${message+'&lt;button type=&quot;button&quot; class=&quot;btn-close&quot; data-bs-dismiss=&quot;alert&quot; aria-label=&quot;Close&quot;&gt;&lt;/button&gt;'}"/>
                </div>
            </th:block>

            <div id="footer" th:replace="~{fragments/footer :: footer(${copyrightYear},${operatingSystemInfo},${buildProperties},${activeProfile},${activePage})}"></div>
        </main>
    </div>
</div>

<div class="modal fade" id="removeProfileConfirmationModal" tabindex="-1" role="dialog" aria-labelledby="removeProfileConfirmationModal" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="removeProfileConfirmationModalLabel">Delete Profile Picture</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">Are you sure you want to delete your profile picture?</div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" data-bs-dismiss="modal" id="removeProfileConfirmation">Confirm</button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript" th:inline="javascript" th:nonce="${cspNonce}">
    /*<![CDATA[*/
    shashin.nonce = /*[[${cspNonce}]]*/ '';
    let profileUrl = /*[[${user.profile}]]*/ '';
    let userId = /*[[${user.id}]]*/ 0;
    /*]]>*/

    let randomString = Util.getMetadataLocalStorage();

    let croppieObject = null;

    if (profileUrl === null || profileUrl === "") {
        profileUrl = "#";
    }

    shashin.updateSearchInput("View Profile");

    $("#removeProfile").on("click", function() {
        $("#removeProfileConfirmationModal").modal('show');
    });

    $("#removeProfileConfirmation").on("click", function() {
        const http = new Http("delete profile picture");
        let json = {userId: userId}
        http.ajax("post", "/users/delete/profile", JSON.stringify(json)).then(function (data) {
            if (data.hasOwnProperty("status") && data["status"] === "success" && data.hasOwnProperty("msg")) {
                window.top.location = window.top.location
            } else {
                shashin.showToastMessage("Could not delete profile", "Something went wrong", {icon:"bi-exclamation-triangle", iconColor:"#FF0000", borderColor:"danger"});
            }
        });
    });

    $("#chooseProfilePhoto").on("change", function() {
        if (croppieObject !== null) {
            $("#profilePictureEdit").croppie('destroy');
            croppieObject = null;
        }
        processImage(this);
    });

    function processImage(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();

            reader.onload = function (e) {
                $("#profileInfo").css("padding-left","8em");
                $("#profilePictureEdit").attr('src', e.target.result);
                $("#profilePictureEditWrapper").css("display", "block");
                $("#removeProfile").css("display", "none");
                $("#saveProfile").css("display", "block");
                $("#cancelProfile").css("display", "block");

                croppieObject = $("#profilePictureEdit").croppie({
                    customClass: "croppieContainer",
                    enableExif: true,
                    viewport: {
                        width: 200,
                        height: 200,
                        type: 'circle'
                    },
                    boundary: {
                        width: 300,
                        height: 300
                    }
                });

                $("#cancelProfile").on("click", async function (e) {
                    e.preventDefault();

                    $("#profilePictureEdit").attr("src", profileUrl);
                    if (profileUrl === null || profileUrl === "" || profileUrl === "#") {
                        $("#profilePictureEditWrapper").css("display", "none");
                        $("#removeProfile").css("display", "none");
                    } else {
                        $("#profilePictureEditWrapper").css("display", "block");
                        $("#removeProfile").css("display", "block");
                    }

                    $("#profilePictureEdit").croppie('destroy');
                    croppieObject = null;
                    $("#profileInfo").css("padding-left","");
                    $("#saveProfile").css("display", "none");
                    $("#cancelProfile").css("display", "none");
                    $("#chooseProfilePhoto").val("");
                    location.replace(location.href.split('#')[0]);
                });

                $("#saveProfile").on("click", async function (e) {
                    e.preventDefault();
                    croppieObject.croppie('result', 'base64').then(function (base64Result) {
                        // send to server
                        const http = new Http("upload profile picture");
                        http.setAdditionalParameters({cache: false});
                        http.setAdditionalHeaders({
                            'Cache-Control': 'no-cache, no-store, max-age=0',
                            'Expires': 'Thu, 1 Jan 1970 00:00:00 GMT',
                            'Pragma': 'no-cache'
                        });
                        let json = {base64: base64Result}
                        http.ajax("post", "/users/profile", JSON.stringify(json)).then(function (data) {
                            if (data.hasOwnProperty("status") && data.hasOwnProperty("msg")) {
                                if (data.hasOwnProperty("imageUrl") && data["imageUrl"] !== "") {
                                    window.top.location = window.top.location
                                } else {
                                    shashin.showToastMessage("Could not save profile", "Could not save profile. "+data["msg"], {icon:"bi-exclamation-triangle", iconColor:"#FF0000", borderColor:"danger"});
                                }
                            } else {
                                shashin.showToastMessage("Could not save profile", "Something went wrong", {icon:"bi-exclamation-triangle", iconColor:"#FF0000", borderColor:"danger"});
                            }
                        });

                        $("#profilePictureEdit").croppie('destroy');
                        croppieObject = null;
                    });
                });
            }

            reader.readAsDataURL(input.files[0]);
        } else {
            // File dialog cancel pressed
            if (profileUrl === null || profileUrl === "" || profileUrl === "#") {
                $("#profileInfo").css("padding-left","");
                $("#profilePictureEditWrapper").css("display", "none");
                $("#removeProfile").css("display", "none");

                $("#profilePictureEdit").attr('src', "#");
                $("#profileImage").attr('src', "#");
                $("#profileImage").css({"display": "none","width":"32px","height":"32px"});
                $("#profileImagePlaceholder").css({"display": "block","font-size":"37px"});
                $("#removeProfile").css("display", "none");
            } else {
                $("#profileInfo").css("padding-left","8em");
                $("#profilePictureEditWrapper").css("display", "block");
                $("#removeProfile").css("display", "block");

                $("#profilePictureEdit").attr('src', profileUrl + '?' + randomString);
                $("#profileImage").attr('src', profileUrl + '?' + randomString);
                $("#profileImage").css({"display": "inline-block","width":"39px","height":"39px"});
                $("#profileImagePlaceholder").css("display", "none");
                $("#removeProfile").css("display", "block");
            }
            $("#saveProfile").css("display", "none");
            $("#cancelProfile").css("display", "none");
        }
    }
</script>

</body>
</html>
