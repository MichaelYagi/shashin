<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:insert="fragments/head :: head(${activePage},${titleDescriptor})"></head>
<body class="thumb d-flex flex-column vh-100">

<div th:replace="fragments/topnav :: topnav(${currentUser},${activePage},'')"></div>

<div id="container" class="container-fluid pb-3 flex-grow-1 d-flex flex-column overflow-auto">
    <div class="row flex-grow-sm-1 flex-grow-0">
        <div th:replace="fragments/sidebaroffcanvas :: sidebaroffcanvas(${activeSidebar},${currentUser})"></div>
        <main role="main" class="col overflow-auto h-100">
            <div th:replace="fragments/content :: content(${message},${activePage},${authority},${parameter},'',${faceRecogServicesAvailable},${objectRecogEnabled})" class="col-sm p-3 min-vh-100"></div>

            <h2>Change profile picture</h2>

            <div class="row mt-4">
                <div class="col-lg-4">
                    <div class="input-group mb-2">
                        <input type="file" accept=".jpg, .png, .jpeg, .gif, .bmp, .tif, .tiff|image/*" class="form-control" id="chooseProfilePhoto" name="chooseProfilePhoto" aria-describedby="chooseProfilePhoto" aria-label="Upload">
                        <button type="button" class="btn btn-secondary rounded-end" id="removeProfile" th:style="${'display: '+{user.profile==null or user.profile==''?'none;':'block;'}}">Remove Profile Picture</button>
                        <button type="button" class="btn btn-secondary rounded-end" id="saveProfile" style="display: none;">Save</button>
                        &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                        <button type="button" id="cancelProfile" class="btn btn-secondary rounded" style="display: none;float:right;">Cancel</button>
                    </div>

                    <img id="profilePictureEdit" th:src="${user.profile==null or user.profile==''?'#':user.profile + '?' + randomString}" th:style="${'float: left; max-height: 200px; visibility: ' + {user.profile==null or user.profile==''?'hidden;':'visible;'}}" />
                </div>
            </div>

            <th:block th:if="${message != '' and alertClass != ''}">
                <div class="col-12">
                    <div th:class="${'alert ' + alertClass + ' alert-dismissible fade show'}" role="alert" th:utext="${message+'&lt;button type=&quot;button&quot; class=&quot;btn-close&quot; data-bs-dismiss=&quot;alert&quot; aria-label=&quot;Close&quot;&gt;&lt;/button&gt;'}"/>
                </div>
            </th:block>

            <div id="footer" th:replace="fragments/footer :: footer(${copyrightYear},${operatingSystemInfo},${buildProperties},${activeProfile})"></div>
        </main>
    </div>
</div>

<div class="modal fade" id="apikeyUpdateConfirmation" tabindex="-1" role="dialog" aria-labelledby="apikey" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="trashModalLabel">Update API key</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">Are you sure you want to update your API key?</div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" data-bs-dismiss="modal" id="confirmUpdateApiKey">Confirm</button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript" th:inline="javascript" th:nonce="${cspNonce}">
    /*<![CDATA[*/
    shashin.nonce = /*[[${cspNonce}]]*/ '';
    let profileUrl = /*[[${user.profile}]]*/ '';
    let userId = /*[[${user.id}]]*/ 0;
    /*]]>*/

    let randomString = Util.getMetadataLocalStorage();

    let croppieObject = null;

    if (profileUrl === null || profileUrl === "") {
        profileUrl = "#";
    }

    $("#removeProfile").on("click", function() {
        const http = new Http("delete profile picture");
        let json = {userId: userId}
        http.ajax("post", "/users/profile/delete", JSON.stringify(json)).then(function (data) {
            if (data.hasOwnProperty("status") && data["status"] === "success" && data.hasOwnProperty("msg")) {
                shashin.showToastMessage("Profile deleted", data["msg"], {icon:"bi-info-circle", iconColor:"#777777"});
                profileUrl = "#";
                $("#profilePictureEdit").attr('src', "#");
                $("#profilePictureEdit").css("visibility", "hidden");
                $("#profileImage").attr('src', "#");
                $("#profileImage").css("display", "none");
                $("#profileImagePlaceholder").css("display", "");
                $("#removeProfile").css("display", "none");
            } else {
                shashin.showToastMessage("Could not delete profile", "Something went wrong", {icon:"bi-exclamation-triangle", iconColor:"#FF0000"});
            }
        });
    });

    $("#chooseProfilePhoto").on("change", function() {
        if (croppieObject !== null) {
            $("#profilePictureEdit").croppie('destroy');
            croppieObject = null;
        }
        processImage(this);
    });

    function processImage(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();

            reader.onload = function (e) {
                $("#profilePictureEdit").attr('src', e.target.result);
                $("#profilePictureEdit").css("visibility", "visible");
                $("#removeProfile").css("display", "none");
                $("#saveProfile").css("display", "block");
                $("#cancelProfile").css("display", "block");

                croppieObject = $("#profilePictureEdit").croppie({
                    customClass: "croppieContainer",
                    enableExif: true,
                    viewport: {
                        width: 200,
                        height: 200,
                        type: 'circle'
                    },
                    boundary: {
                        width: 300,
                        height: 300
                    }
                });

                $("#cancelProfile").on("click", async function (e) {
                    e.preventDefault();

                    $("#profilePictureEdit").attr("src", profileUrl);
                    if (profileUrl === null || profileUrl === "" || profileUrl === "#") {
                        $("#profilePictureEdit").css("visibility", "hidden");
                        $("#removeProfile").css("display", "none");
                    } else {
                        $("#profilePictureEdit").css("visibility", "visible");
                        $("#removeProfile").css("display", "block");
                    }

                    $("#profilePictureEdit").croppie('destroy');
                    croppieObject = null;
                    $("#saveProfile").css("display", "none");
                    $("#cancelProfile").css("display", "none");
                    $("#chooseProfilePhoto").val("");
                });

                $("#saveProfile").on("click", async function (e) {
                    e.preventDefault();
                    croppieObject.croppie('result', 'base64').then(function (base64Result) {
                        // send to server
                        const http = new Http("upload profile picture");
                        http.setAdditionalParameters({cache: false});
                        http.setAdditionalHeaders({
                            'Cache-Control': 'no-cache, no-store, max-age=0',
                            'Expires': 'Thu, 1 Jan 1970 00:00:00 GMT',
                            'Pragma': 'no-cache'
                        });
                        let json = {base64: base64Result}
                        http.ajax("post", "/users/profile", JSON.stringify(json)).then(function (data) {
                            if (data.hasOwnProperty("status") && data.hasOwnProperty("msg")) {
                                if (data.hasOwnProperty("imageUrl") && data["imageUrl"] !== "") {
                                    randomString = data["randomString"];
                                    profileUrl = data["imageUrl"];
                                    $("#profileImage").attr("src", profileUrl + '?' + data["randomString"]);
                                    $("#profileImage").css("display", "inline-block");
                                    $("#profileImagePlaceholder").css("display", "none");

                                    $("#profilePictureEdit").attr("src", profileUrl + '?' + data["randomString"]);
                                    $("#profilePictureEdit").css("visibility", "visible");
                                    $("#profilePictureEdit").croppie('destroy');
                                    croppieObject = null;
                                    $("#saveProfile").css("display", "none");
                                    $("#cancelProfile").css("display", "none");
                                    $("#chooseProfilePhoto").val("");
                                    $("#removeProfile").css("display", "block");
                                } else {
                                    shashin.showToastMessage("Could not save profile", "Could not save profile. "+data["msg"], {icon:"bi-exclamation-triangle", iconColor:"#FF0000"});
                                }
                            } else {
                                shashin.showToastMessage("Could not save profile", "Something went wrong", {icon:"bi-exclamation-triangle", iconColor:"#FF0000"});
                            }
                        });
                    });
                });
            }

            reader.readAsDataURL(input.files[0]);
        } else {
            // File dialog cancel pressed
            if (profileUrl === null || profileUrl === "" || profileUrl === "#") {
                $("#profilePictureEdit").css("visibility", "hidden");
                $("#removeProfile").css("display", "none");

                $("#profilePictureEdit").attr('src', "#");
                $("#profileImage").attr('src', "#");
                $("#profileImage").css("display", "none");
                $("#profileImagePlaceholder").css("display", "");
                $("#removeProfile").css("display", "none");
            } else {
                $("#profilePictureEdit").css("visibility", "visible");
                $("#removeProfile").css("display", "block");

                $("#profilePictureEdit").attr('src', profileUrl + '?' + randomString);
                $("#profileImage").attr('src', profileUrl + '?' + randomString);
                $("#profileImage").css("display", "");
                $("#profileImagePlaceholder").css("display", "none");
                $("#removeProfile").css("display", "block");
            }
            $("#saveProfile").css("display", "none");
            $("#cancelProfile").css("display", "none");
        }
    }
</script>

</body>
</html>
