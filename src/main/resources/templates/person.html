<!DOCTYPE html>
<th:block th:insert="~{fragments/asciiart :: asciiart()}"></th:block>
<html th:lang="${locale}" xmlns:th="http://www.thymeleaf.org">
<head th:insert="~{fragments/head :: head(${activePage},${titleDescriptor})}"></head>
<body class="thumb d-flex flex-column vh-100">

<div th:replace="~{fragments/topnav :: topnav(${currentUser},${activePage},'')}"></div>

<div th:replace="~{fragments/metadatamodal :: metadatamodal(${currentUser})}"></div>

<div th:replace="~{fragments/metadatabatchmodal :: metadatabatchmodal(${recognitionLabels},${allAlbumList})}"></div>

<div th:replace="~{fragments/persongroup :: person(${activePage},${parameter},${counts},${faceRecogServicesAvailable},${authority},${settings.facialDetection})}"></div>

<div id="container" class="container-fluid pb-3 flex-grow-1 d-flex flex-column overflow-auto mt-2">
    <div class="row flex-grow-sm-1 flex-grow-0">
        <div th:replace="~{fragments/sidebaroffcanvas :: sidebaroffcanvas(${activeSidebar},${currentUser})}"></div>
        <main role="main" class="col overflow-auto h-100">

            <div id="infinite-scroll-gallery">

                <div th:replace="~{fragments/hiddenfields :: hiddenfields(${message})}"></div>
                <input type="hidden" id="currentPerson" th:value="${personInfo.name}">
                <input type="hidden" id="personId" name="personId" th:value="${personInfo.id}">

                <th:block th:if="${not #lists.isEmpty(metadataList)}">
<!--                    <div th:replace="~{fragments/personmodal :: personmodal()}"></div>-->

<!--                    <h1 th:inline="text">[[${personInfo.name}]]</h1>-->
                    <div class="mt-2" id="personMessage"></div>

                    <div th:class="'row' + ${isMobile ? '' : ' image-group-padding'}">
                        <th:block th:each="metadata, iterStat: ${metadataList}">
                            <div th:id="${'photoThumbnailContainer'+metadata.id}" class="photo-thumbnail-container photo-thumbnail" th:style="${'width:'+(isMobile ? thumbnailHeight : metadata.thumbnailSmallWidth)+'px;height:'+(isMobile ? thumbnailHeight : metadata.thumbnailSmallHeight)+'px;padding-left:0;padding-right:0;'}">
                                <a class="lightGalleryIndexAnchor" th:name="${'lightGalleryIndex'+iterStat.index}"></a>

                                <img loading="lazy" draggable="false" th:src="'/api/v1/thumbnails/'+${isMobile?'centered':'225'}+'/'+${metadata.id}" class="photo-thumbnail-image" th:id="'image'+${metadata.id}" th:width="${isMobile ? thumbnailHeight : metadata.thumbnailSmallWidth}" th:height="${isMobile ? thumbnailHeight : metadata.thumbnailSmallHeight}">
                                <input type="hidden" th:name="'filename'+${metadata.id}" th:id="'filename'+${metadata.id}" th:value="${metadata.fileName}">
                                <input type="hidden" th:name="'thumbnailCentered'+${metadata.id}" th:id="'thumbnailCentered'+${metadata.id}" th:value="'/api/v1/thumbnails/centered/'+${metadata.id}">
                                <input type="hidden" th:name="'dateTaken'+${metadata.id}" th:id="'dateTaken'+${metadata.id}" th:value="${metadata.year+'-'+metadata.month+'-'+metadata.day}">

                                <div th:replace="~{fragments/toprightoverlay :: toprightoverlay(${metadata.type},${metadata.id},${metadata.duration != null ? metadata.duration : '0:00'},${metadata.originalImageWidth},${metadata.originalImageHeight},${metadata.expectedExtension},${(authority == 'ROLE_ADMIN' or authority == 'ROLE_SUPER') and labelPhotoMap.get(metadata.id).get('isTagged')})}"></div>

                                <div th:replace="~{fragments/topleftoverlay :: topleftoverlay(${metadata.id})}"></div>

                                <div class="thumbnail-br" th:id="'tnbr'+${metadata.id}">
                                    <a href="#" th:id="'favorite'+${metadata.id}" class="text-decoration-none">
                                        <span class="overlayIconBackground">
                                            <span th:id="'briconcount'+${metadata.id}" th:text="${#maps.containsKey(favorites, metadata.id) ? favorites.get(metadata.id).get('count') : '0'}"></span>&nbsp;<span th:id="'brfavoriteicon'+${metadata.id}" th:class="${#maps.containsKey(favorites, metadata.id) and favorites.get(metadata.id).get('favorite')} ? 'bi-suit-heart-fill overlayIcon' : 'bi-suit-heart overlayIcon'"></span>
                                        </span>
                                    </a>
                                </div>

                                <th:block th:if="${authority == 'ROLE_ADMIN' || authority == 'ROLE_SUPER'}">
                                    <div th:replace="~{fragments/bottomleftoverlay :: bottomleftoverlay(${metadata}, null, 'personModalEdit', 'personSettings.openPersonModal', 'overlayCommentText')}"></div>
                                </th:block>

                                <th:block th:if="${authority == 'ROLE_USER'}">
                                    <div th:replace="~{fragments/bottomleftoverlay :: bottomleftoverlay(${metadata}, null, null, null, null)}"></div>
                                </th:block>

                                <div th:replace="~{fragments/centeredoverlay :: centeredoverlay(${metadata},${activePage},${currentUser},'shashin.openGallery',${iterStat.index},${isMobile},${thumbnailType},${thumbnailHeight})}"></div>

                            </div>

                            <span th:id="'personmodal'+${metadata.id}" style="width:0;height:0;padding:0"></span>

                            <script th:inline="javascript" type="text/javascript" th:nonce="${cspNonce}">
                                /*<![CDATA[*/
                                shashin.updateFavorites("#favorite","#brfavoriteicon","#briconcount",/*[[${metadata.id}]]*/"");
                                shashin.setPhotoOverlays({id:[[${metadata.id}]],lat:[[${metadata.lat}]],lng:[[${metadata.lng}]],year:[[${metadata.year}]],month:[[${metadata.month}]],day:[[${metadata.day}]],fileName:[[${metadata.fileName}]],thumbnailUrlSmall:[[${metadata.thumbnailUrlSmall}]],type:[[${metadata.type}]]}, /*[[${activePage}]]*/'person');
                                // personModalSettings.renderPersonModal(/*[[${metadata}]]*/{},/*[[${recognitionLabels}]]*/"",/*[[${labelPhotoMap.get(metadata.id).get('labels')}]]*/"");
                                $("#mediaLink"+/*[[${metadata.id}]]*/"00000000-00000000-00000000-00000000").attr("tag",/*[[${metadata.id}]]*/"00000000-00000000-00000000-00000000");
                                $("#infoModalEdit"+/*[[${metadata.id}]]*/"00000000-00000000-00000000-00000000").off("click").on("click", function(e) {
                                    e.preventDefault();
                                    shashin.openEditMetadataModal(/*[[${metadata.id}]]*/"00000000-00000000-00000000-00000000");
                                });
                                /*]]>*/
                            </script>

                            <span class="appendPersonPhotos" style="width:0;height:0;padding:0"></span>
                        </th:block>
                    </div>
                </th:block>
                <th:block th:if="${#lists.isEmpty(metadataList)}">
                    <span class="appendPersonPhotos" style="width:0;height:0;padding:0;display:none;">EOL</span>
                </th:block>
            </div>

            <!-- Back to top button -->
            <button type="button" class="btn btn-primary btn-floating btn-lg" id="btn-back-to-top">
                <i class="bi-arrow-up-circle"></i>
            </button>

            <div id="spinner" class="spinner-border justify-content-center align-items-center" role="status" style="display: none"></div>
            <div th:replace="~{fragments/footer :: footer(${copyrightYear},${operatingSystemInfo},${buildProperties},${activeProfile},${activePage})}"></div>
        </main>
    </div>
</div>

<div class="modal fade" id="propPersonModal" tabindex="-1" role="dialog" aria-labelledby="labelPersonModal">
    <div class="modal-dialog modal-dialog-scrollable modal-md" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="propPersonModalLabel"><th:block th:utext="#{main.pages.albums.cover(${'&ldquo;<span id=&quot;personModalTitle&quot;></span>&rdquo;'})}"></th:block><div id="propPersonModalThumbnail"></div></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
                <form id="savePersonModalForm">
                    <input type="hidden" name="setCoverPerson" id="setCoverPerson" value="yes">
                </form>
                <div class="col-sm">
                    <span id="personModalMsg"></span>
                </div>
            <div class="modal-footer">
                <div id="personModalStatus" class="spinner-grow me-auto" style="visibility: hidden;font-size: 1.55rem;" role="status" data-bs-toggle="tooltip" data-bs-placement="right" title=""></div>
                <button type="button" class="btn btn-primary" id="savePersonModal"><th:block th:text="#{main.modal.save}"></th:block></button>
                <button id="personModalCancel" type="button" class="btn btn-secondary" data-bs-dismiss="modal"><th:block th:text="#{main.modal.cancel}"></th:block></button>
            </div>
        </div>
    </div>
</div>

<th:block th:if="${@environment.getProperty('app.js.useMinified') == 'false'}">
    <script src="/js/site/applisteners.js" type="text/javascript" th:nonce="${cspNonce}"></script>
</th:block>
<th:block th:if="${@environment.getProperty('app.js.useMinified') == 'true'}">
    <script src="/js/site/min/applisteners.min.js" type="text/javascript" th:nonce="${cspNonce}"></script>
</th:block>
<script th:inline="javascript" type="text/javascript" th:nonce="${cspNonce}">
    $(document).ready(function() {
        /*<![CDATA[*/
        shashin.nonce = /*[[${cspNonce}]]*/ '';
        const personId = /*[[${personInfo.id}]]*/ 0;
        const personName = /*[[${personInfo.name}]]*/ '';
        const activePage = /*[[${activePage}]]*/ 'person';
        const canEdit = /*[[${canEdit == "true" || canEdit == true}]]*/ false;
        /*]]>*/

        shashin.updateSearchInput(personName);

        const http = new Http("check notifications");

        http.ajax("get", "/person/metadata/"+personId+"/0").then(function (metadataList) {
            const personInstance = new Person(metadataList, activePage, personId, canEdit);
            personInstance.init();
            // Util.checkErrorImage();
        });
    });
</script>
</body>
</html>
