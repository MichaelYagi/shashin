<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Health Check</title>
</head>
<body>

<h1>Health Check</h1>

<th:block th:text="${'Status: '+status}"></th:block><br><br>
<th:block th:text="${'Uptime: '+uptime}"></th:block><br>
<th:block th:text="${'Health endpoint request elapsed time: '+healthEndpointRequestTiming}"></th:block><br>
<th:block th:text="${'SQLite connection: '+dbAvailable}"></th:block><br>
<th:block th:text="${'SQLite lookup for '+dbQueryCount+' metadata record'+(dbQueryCount != 1 ? 's' : '')+' elapsed time: '+dbQueryTiming}"></th:block><br>
<th:block th:text="${'Nominatim connection: '+nominatimAvailable}"></th:block><br>
<th:block th:text="${'Nominatim elapsed time: '+nominatimTiming}"></th:block><br>
<th:block th:if="${compreFaceAvailable != null}">
<th:block th:text="${'CompreFace connection: '+compreFaceAvailable}"></th:block><br>
<th:block th:text="${'CompreFace elapsed time: '+compreFaceTiming}"></th:block><br>
</th:block>
<th:block th:text="${'Used heap memory: '+usedHeapMemoryGB+' GB'}"></th:block><br>
<th:block th:text="${'Max heap memory: '+maxHeapMemoryGB+' GB'}"></th:block><br>
<th:block th:text="${'Committed memory: '+committedMemoryGB+' GB'}"></th:block><br>
<th:block th:text="${'System CPU Usage: '+processCpuLoadPercentDouble+'%'}"></th:block><br>
<th:block th:text="${'JVM CPU Usage: '+processCpuLoadPercentDouble+'%'}"></th:block><br>
<th:block th:text="${'Available cores: '+availableCores}"></th:block><br>
<th:block th:text="${'OS: '+os}"></th:block><br>
<th:block th:text="${'Build Version: '+buildVersion}"></th:block><br>
Actuator endpoints: <a href="/actuator" target="_blank">Link</a>

</body>
</html>
