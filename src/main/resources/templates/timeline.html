<!DOCTYPE html>
<html lang="en" xmlns:th="http://thymeleaf.org">
<head th:insert="fragments/head :: head(${titleDescriptor})"></head>
<body class="thumb d-flex flex-column vh-100 overflow-hidden">

<div th:replace="fragments/topnav :: topnav(${currentUser},${activePage},'')"></div>

<div id="container" class="container-fluid pb-3 flex-grow-1 d-flex flex-column overflow-auto">
    <div id="subcontainer" class="row flex-grow-sm-1 flex-grow-0">
        <div class="offcanvas offcanvas-start" data-bs-scroll="true" data-bs-backdrop="false" tabindex="-1" id="offcanvasToc" aria-labelledby="offcanvasTocLabel">
            <div class="offcanvas-header">
                <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" id="offcanvasTocCloseButton" aria-label="Close"></button>
            </div>

            <div class="offcanvas-body" id="offcanvasTocBody">
                <th:block th:if="${not #lists.isEmpty(metadataDates)}">
                    <th:block th:each="date, iterStat: ${metadataDates}">
                        <th:block th:unless="${date.year == null or date.month == null or date.day == null}">
                            <th:block th:with="sdf = ${new java.text.SimpleDateFormat('yyyy-M-d')}">
                                <th:block th:if="${iterStat.count > 0}" th:unless="${!iterStat.first and (metadataDates[iterStat.index-1].year)==(date.year)}">
                                    <strong th:text="${#dates.format(sdf.parse(date.year+'-'+date.month+'-'+date.day), 'yyyy')}"></strong>
                                    <th:block th:utext="'&lt;div class=&quot;list-group&quot;&gt;'" />
                                </th:block>

                                <th:block th:if="${iterStat.count > 0}" th:unless="${!iterStat.first and (metadataDates[iterStat.index-1].year+'-'+metadataDates[iterStat.index-1].month)==(date.year+'-'+date.month)}">
                                    <a th:id="${'offcanvas_'+date.year+'-'+date.month+'-'+date.day}" th:class="${'list-group-item list-group-item-action'+{iterStat.first ? ' active' : ''}}" th:onclick="return timelineSettings.jumpFromTimelineToc(event,'[[${date.year}]]-[[${date.month}]]-[[${date.day}]]',[[${mediaTypeFilter}]]);" th:href="${'#'+date.year+'-'+date.month+'-'+date.day}" th:text="${#dates.format(sdf.parse(date.year+'-'+date.month+'-'+date.day), 'MMM yyyy')}"></a>
                                </th:block>
                                <th:block th:if="${iterStat.count > 0 and !iterStat.first and (metadataDates[iterStat.index-1].year+'-'+metadataDates[iterStat.index-1].month)==(date.year+'-'+date.month)}">
                                    <a style="display:none" th:id="${'offcanvas_'+date.year+'-'+date.month+'-'+date.day}" th:class="${'list-group-item list-group-item-action'+{iterStat.first ? ' active' : ''}}" th:onclick="return timelineSettings.jumpFromTimelineToc(event,'[[${date.year}]]-[[${date.month}]]-[[${date.day}]]',[[${mediaTypeFilter}]]);" th:href="${'#'+date.year+'-'+date.month+'-'+date.day}" th:text="${#dates.format(sdf.parse(date.year+'-'+date.month+'-'+date.day), 'MMM yyyy')}"></a>
                                </th:block>

                                <th:block th:if="${iterStat.count > 0}" th:unless="${!iterStat.last and (metadataDates[iterStat.index+1].year)==(date.year)}">
                                    <th:block th:utext="'&lt;/div&gt;'" />
                                    <br>
                                </th:block>
                            </th:block>
                        </th:block>
                    </th:block>
                </th:block>
            </div>

        </div>
        <div th:replace="fragments/sidebaroffcanvas :: sidebaroffcanvas(${activeSidebar},${currentUser})"></div>

        <main role="main" class="col overflow-auto h-100" id="timelineMain">
            <th:block th:if="${not #lists.isEmpty(metadataList)}">
                <script type="text/javascript">
                    $("#progressBarWrapper").css("visibility","visible");
                    const totalSize = [[${#lists.size(metadataList)}]];
                    $("#progressBar").attr("aria-valuenow","50");
                    $("#timelineMain").css("visibility","hidden");
                </script>
            </th:block>
            <div th:replace="fragments/content :: content(${message},${activePage},${authority},${parameter},'')" class="col-sm p-3 min-vh-100"></div>
            <input type="hidden" id="multiSelectMetadataIds" name="multiSelectMetadataIds" value="[]">
            <input type="hidden" id="multiSelectFilenames" name="multiSelectFilenames" value="[]">
            <input type="hidden" id="multiSelectThumbnails" name="multiSelectThumbnails" value="[]">
            <input type="hidden" id="currentlat" name="currentlat">
            <input type="hidden" id="currentlng" name="currentlng">
            <input type="hidden" id="currentfilename" name="currentfilename">
            <input type="hidden" id="mediaTypeFilter" name="mediaTypeFilter" th:value="${mediaTypeFilter}">
            <input type="hidden" id="currentPage" name="currentPage" value="0">
            <input type="hidden" id="activePage" th:value="${activePage}">
            <input type="hidden" id="initialLgData" name="initialLgData" value="[]">

            <div th:replace="fragments/timelinemodal :: timelinemodal(${currentUser})"></div>

            <div th:replace="fragments/infosidebar :: infosidebar(${currentUser})"></div>

            <div id="spinner_top" class="spinner-border justify-content-center align-items-center" role="status" style="display: none"></div>

            <div id="infinite-scroll-gallery">
                <th:block th:if="${not #lists.isEmpty(metadataList)}">

                    <th:block th:if="${metadataList[0].year==null or metadataList[0].month==null or metadataList[0].day==null}">
                        <span class="dateContainer" id="container_undated">
                        <br id="brundated">
                        <section class="scrollspy metadataprocessed" id="undated">
                            <p><strong class="undatedTimelinePhotos p-1">Undated</strong></p>
                        </section>
                        <div class="row image-group-padding" id="rowundated">
                    </th:block>
                    <th:block th:unless="${metadataList[0].year==null or metadataList[0].month==null or metadataList[0].day==null}">
                        <span class="dateContainer" th:id="${'container_' + metadataList[0].year + '-' + metadataList[0].month + '-' + metadataList[0].day}">
                        <br th:id="${'br' + metadataList[0].year + '-' + metadataList[0].month + '-' + metadataList[0].day}">
                        <section class="scrollspy metadataprocessed" th:id="${metadataList[0].year + '-' + metadataList[0].month + '-' + metadataList[0].day}">
                            <th:block th:with="sdf = ${new java.text.SimpleDateFormat('yyyy-M-d')}">
                                <p><strong class="dateHeading p-1" th:text="${#dates.format(sdf.parse(metadataList[0].year+'-'+metadataList[0].month+'-'+metadataList[0].day), 'EEE, MMM d, yyyy')}"></strong></p>
                            </th:block>
                        </section>
                        <div class="row image-group-padding" th:id="${'row'+metadataList[0].year + '-' + metadataList[0].month + '-' + metadataList[0].day}">
                            <span style="display: none;" class="yearTaken" th:text="${metadataList[0].year}"></span>
                            <span style="display: none;" class="monthTaken" th:text="${metadataList[0].month}"></span>
                            <span style="display: none;" class="dayTaken" th:text="${metadataList[0].day}"></span>
                    </th:block>

                    <th:block th:each="metadata, iterStat: ${metadataList}">

                        <div th:id="${'photoThumbnailContainer'+metadata.id}" th:class="${'photo-thumbnail-container photo-thumbnail '+(metadata.type.contains('video') ? 'is-video' : 'is-not-video')}" th:style="${'width:'+metadata.thumbnailSmallWidth+'px;height:'+metadata.thumbnailSmallHeight+'px;padding-left:0;padding-right:0;'}">
                            <a class="lightGalleryIndexAnchor" th:id="${'lightGalleryIndex'+metadata.id}"></a>
                            <th:block th:if="${metadata.year==null or metadata.month==null or metadata.day==null}">
                                <input type="hidden" name="thumbnailUrl-undated[]" th:id="'thumbnailUrl_'+${metadata.id}" th:value="${#uris.escapePath(metadata.thumbnailUrlSmall)}">
                                <span th:id="'thumbnailTag_'+${metadata.id}" class="thumbnailTag_undated" style="display:none;"></span>
                            </th:block>
                            <th:block th:unless="${metadata.year==null or metadata.month==null or metadata.day==null}">
                                <input type="hidden" th:name="${'thumbnailUrl-'+metadata.year+'-'+metadata.month+'-'+metadata.day+'[]'}" th:id="'thumbnailUrl_'+${metadata.id}" th:value="${#uris.escapePath(metadata.thumbnailUrlSmall)}">
                                <span th:id="'thumbnailTag_'+${metadata.id}" th:class="${'thumbnailTag_'+metadata.year+'-'+metadata.month+'-'+metadata.day}" style="display:none;"></span>
                            </th:block>

                            <input type="hidden" th:name="'filename'+${metadata.id}" th:id="'filename'+${metadata.id}" th:value="${metadata.fileName}">
                            <input type="hidden" th:name="'thumbnailCentered'+${metadata.id}" th:id="'thumbnailCentered'+${metadata.id}" th:value="${metadata.thumbnailUrlCentered}">

                            <th:block th:if="${metadata.year==null or metadata.month==null or metadata.day==null}">
                                <img loading="lazy" class="photo-thumbnail-image thumbnailTag_undated" th:id="'image'+${metadata.id}" th:width="${metadata.thumbnailSmallWidth}" th:height="${metadata.thumbnailSmallHeight}">
                            </th:block>
                            <th:block th:unless="${metadata.year==null or metadata.month==null or metadata.day==null}">
                                <img loading="lazy" th:class="'photo-thumbnail-image ' + ${'thumbnailTag_'+metadata.year+'-'+metadata.month+'-'+metadata.day}" th:id="'image'+${metadata.id}" th:width="${metadata.thumbnailSmallWidth}" th:height="${metadata.thumbnailSmallHeight}">
                            </th:block>

                            <div th:id="'tntl'+${metadata.id}"></div>

                            <div th:id="'tnbr'+${metadata.id}"></div>

                            <div th:id="'tnbl'+${metadata.id}"></div>

                            <div th:id="'tntr'+${metadata.id}"></div>

                            <div th:id="'tncentered'+${metadata.id}"></div>

                            <span th:id="'timelinemodal'+${metadata.id}"></span>
                        </div>

                    </th:block>

                    <th:block th:if="${metadataList[0].year==null or metadataList[0].month==null or metadataList[0].day==null}">
                        <span class="scrollspy metadataprocessed" id="tail_undated"></span>
                        <th:block th:remove="tag" th:utext="'&lt;/div&gt;'"></th:block>
                        <th:block th:remove="tag" th:utext="'&lt;/span&gt;'"></th:block>
                        <span class="attachMetadataPhotos" id="amp_undated"></span>
                    </th:block>
                    <th:block th:unless="${metadataList[0].year==null or metadataList[0].month==null or metadataList[0].day==null}">
                        <span class="scrollspy metadataprocessed" th:id="${'tail_'+metadataList[0].year+'-'+metadataList[0].month+'-'+metadataList[0].day}"></span>
                        <th:block th:remove="tag" th:utext="'&lt;/div&gt;'"></th:block>
                        <th:block th:remove="tag" th:utext="'&lt;/span&gt;'"></th:block>
                        <span class="attachMetadataPhotos" th:id="${'amp_'+metadataList[0].year+'-'+metadataList[0].month+'-'+metadataList[0].day}"></span>
                    </th:block>

                </th:block>
            </div>
            <script type="text/javascript">
                $("#progressBarWrapper").css("visibility","hidden");
                $("#timelineMain").css("visibility","visible");
            </script>

            <div th:replace="fragments/timelinebatchmodal :: timelinebatchmodal(${recognitionLabels},${allAlbumList})"></div>

            <!-- <div id="msgTimeline"></div> -->
            <div id="spinner_bottom" class="spinner-border justify-content-center align-items-center mt-2" role="status" style="display: none"></div>

            <div id="subfooter"></div>
            <div id="footer" th:replace="fragments/footer :: footer(${copyrightYear},${operatingSystemInfo},${buildProperties})"></div>
        </main>
    </div>
</div>

<!--Date Slider-->
<th:block th:if="${not #lists.isEmpty(metadataDates)}">
    <div class="col-sm-auto sidebar-right" id="dateSliderContainer">
        <div class="flex-sm-column flex-nowrap align-items-center sidebar-right" id="dateSliderWrapper">
            <div id="dateSlider"></div>
        </div>
    </div>
</th:block>

<th:block th:if="${@environment.getProperty('app.js.useMinified') == 'false'}">
    <script src="/js/site/applisteners.js" type="text/javascript"></script>
</th:block>
<th:block th:if="${@environment.getProperty('app.js.useMinified') == 'true'}">
    <script src="/js/site/applisteners.min.js" type="text/javascript"></script>
</th:block>
<script th:inline="javascript" type="text/javascript">
    $(document).ready(function() {
        /*<![CDATA[*/
        timelineSettings.init(/*[[${mediaTypeFilter}]]*/ 'all', /*[[${metadataDates}]]*/ [], /*[[${maxWidth}]]*/ 0);
        /*]]>*/
    });
</script>
</body>
</html>
