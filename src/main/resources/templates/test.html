<!DOCTYPE html>
<html lang="en">
    <head th:insert="fragments/head :: head(${titleDescriptor})"></head>
    <body>
        <div id="contents">
            <div class="container-fluid">
                <div class="row">
                    <div th:insert="fragments/sidebar :: sidebar()" class="col-sm-auto bg-light sticky-top"></div>
                    <div th:insert="fragments/content :: content(${somevalue},${activePage})" class="col-sm p-3 min-vh-100">
                        <div th:insert="fragments/footer :: footer(${copyrightYear})"></div>
                    </div>
                </div>
            </div>
        </div>

        <script type="text/babel">
            var app = new Vue({
                el: '#contents'
            });
        </script>
    </body>
</html>
