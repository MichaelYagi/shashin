<!DOCTYPE html>
<th:block th:insert="~{fragments/asciiart :: asciiart()}"></th:block>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:insert="~{fragments/head :: head(${activePage},${titleDescriptor})}"></head>
<script src="/js/dexie.js" th:nonce="${cspNonce}"></script>
<body>
<div th:replace="~{fragments/topnav :: topnav(${currentUser},${activePage},'')}"></div>

<style>
    .overline {
        text-decoration: overline;
        text-decoration-color: red; /* optional: color of underline */
        text-decoration-thickness: 2px;
    }

    canvas {
        image-rendering: pixelated; /* helps in some browsers */
        /*border: 1px solid #ccc;*/
    }
</style>

<div class="container-fluid">
    <div class="row">
        <div th:replace="~{fragments/sidebaroffcanvas :: sidebaroffcanvas(${activeSidebar},${currentUser})}"></div>
        <main role="main" class="col">
            <h2 class="mt-3">Test Page</h2>

            <h3 class="mt-3">Dupe Detector</h3>

            <label for="algorithm"><strong>Algorithm (Default dhash)</strong></label><br>
            <select name="algorithm" id="algorithm">
                <option value="ahash">ahash</option>
                <option value="dhash" selected>dhash</option>
                <option value="phash">phash</option>
            </select><br><br>

            <label for="resolution"><strong>Resolution (Default 64)</strong></label><br>
            <select name="resolution" id="resolution">
                <option value="16">16 - very coarse, fast, prone to false positives</option>
                <option value="32">32 - very coarse, fast, prone to false positives</option>
                <option value="64" selected>64 - balanced</option>
                <option value="128">128 - more robust</option>
                <option value="256">256 - high fidelity, slower but very precise</option>
                <option value="512">512 - higher fidelity, even slower but very precise</option>
            </select><br><br>

            <label for="threshold"><strong>Distance Threshold</strong></label><br>
            <input type="text" id="threshold" name="threshold" style="width: 90%" value="10"><br><br>

            <label for="pathone"><strong>Image path 1</strong></label><br>
            <input type="text" id="pathone" name="pathone" style="width: 90%"><br><br>

            <label for="pathtwo"><strong>Image path 2</strong></label><br>
            <input type="text" id="pathtwo" name="pathtwo" style="width: 90%"><br><br>

            <button id="dupeSubmit">Is duplicate?</button><br><br>

            <span id="sometext"></span><br>
            <img id="base64_1" src="" style="width: 200px;margin-right: 5px;"><img id="base64_2" src="" style="width: 200px"><br>
            <canvas id="base64_3" style="margin-right: 5px;margin-top: 5px"></canvas><canvas id="base64_4" style="margin-top: 5px;"></canvas><br>
            <canvas id="base64_5" style="margin-right: 5px;margin-top: 5px"></canvas><canvas id="base64_6" style="margin-top: 5px;"></canvas><br>

            <span id="photos"></span>

            <div th:replace="~{fragments/hiddenfields :: hiddenfields(${message})}"></div>
            <div th:replace="~{fragments/footer :: footer(${copyrightYear},${operatingSystemInfo},${buildProperties},${activeProfile},${activePage})}"></div>
        </main>
    </div>

    <script th:inline="javascript" type="text/javascript">
        $(document).ready(function() {
            /*<![CDATA[*/
            const activePage = /*[[${activePage}]]*/ 'test';
            const currentPage = /*[[${currentPage}]]*/ 0;
            const locale = /*[[${locale}]]*/ 'en';
            /*]]>*/

            const pixelWidth = 25;
            const showOverlay = true;

            $("#base64_5").css("margin-left", pixelWidth+"px");
            $("#base64_6").css("margin-left", pixelWidth+"px");

            const urlParams = new URLSearchParams(window.location.search);

            // Get a specific parameter
            function buildUrl(baseUrl, params = {}) {
                const query = Object.entries(params)
                    .map(([key, value]) =>
                        `${encodeURIComponent(key)}=${encodeURIComponent(value)}`
                    )
                    .join("&");

                return query ? `${baseUrl}?${query}` : baseUrl;
            }
            const qpBuilder = {};

            let algorithm = $("#algorithm").val();
            if (urlParams.has('algorithm')) {
                algorithm = urlParams.get('algorithm');
                $("#algorithm").val(algorithm);
            } else if (algorithm !== null && algorithm !== "") {
                qpBuilder["algorithm"] = algorithm;
            }
            let resolution = $("#resolution").val();
            if (urlParams.has('resolution')) {
                resolution = urlParams.get('resolution');
                $("#resolution").val(resolution);
            } else if (resolution !== null && resolution !== "") {
                qpBuilder["resolution"] = resolution;
            }
            let threshold = $("#threshold").val();
            if (urlParams.has('threshold')) {
                threshold = urlParams.get('threshold');
                $("#threshold").val(threshold);
            } else if (threshold !== null && threshold !== "") {
                qpBuilder["threshold"] = threshold;
            }
            let pathone = $("#pathone").val();
            if (urlParams.has('pathone')) {
                pathone = decodeURI(urlParams.get('pathone'));
                $("#pathone").val(pathone);
            } else if (pathone !== null && pathone !== "") {
                pathone = decodeURI(urlParams.get('pathone'));
                qpBuilder["pathone"] = pathone;
            }
            let pathtwo = $("#pathtwo").val();
            if (urlParams.has('pathtwo')) {
                pathtwo = decodeURI(urlParams.get('pathtwo'));
                $("#pathtwo").val(pathtwo);
            } else if (pathtwo !== null && pathtwo !== "") {
                pathtwo = decodeURI(urlParams.get('pathtwo'));
                qpBuilder["pathtwo"] = pathtwo;
            }

            const size = Object.keys(qpBuilder).length;
            if (size > 0) {
                const baseUrl = window.location.origin;
                const url = new URL(buildUrl(`${baseUrl}/test`, qpBuilder));

                window.history.replaceState({}, "", url);
            }

            function canvasImage(canvasEl, base64Image, scale) {
                const img = new Image();
                img.src = base64Image; // Replace with your image source
                img.onload = () => {
                    const originalWidth = img.width;
                    const originalHeight = img.height;
                    const scaledWidth = originalWidth * scale;
                    const scaledHeight = originalHeight * scale;

                    const canvas = document.getElementById(canvasEl);
                    canvas.width = scaledWidth;
                    canvas.height = scaledHeight;
                    const ctx = canvas.getContext("2d");
                    ctx.imageSmoothingEnabled = false;
                    ctx.drawImage(img, 0, 0, scaledWidth, scaledHeight);
                };
            }

            function canvasImageWithGrayscaleArray(canvasEl, grayArray, cellSize) {
                const rows = grayArray.length;
                const cols = grayArray[0].length;

                const canvas = document.getElementById(canvasEl);
                canvas.width = cols * cellSize;
                canvas.height = rows * cellSize;
                const ctx = canvas.getContext("2d");

                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.font = `${cellSize * 0.4}px Arial`;

                for (let y = 0; y < rows; y++) {
                    for (let x = 0; x < cols; x++) {
                        const gray = grayArray[y][x];

                        // Fill square with grayscale color
                        ctx.fillStyle = `rgb(${gray}, ${gray}, ${gray})`;
                        ctx.fillRect(x * cellSize, y * cellSize, cellSize, cellSize);

                        if (showOverlay === true) {
                            // Overlay grayscale value text
                            ctx.fillStyle = gray < 128 ? "#fff" : "#000";
                            ctx.fillText(
                                gray,
                                x * cellSize + cellSize / 2,
                                y * cellSize + cellSize / 2
                            );
                        }
                    }
                }

                // Optional: draw grid lines
                ctx.strokeStyle = "#888";
                ctx.lineWidth = 1;
                for (let c = 0; c <= cols; c++) {
                    const pos = c * cellSize;
                    ctx.beginPath();
                    ctx.moveTo(pos, 0);
                    ctx.lineTo(pos, canvas.height);
                    ctx.stroke();
                }
                for (let r = 0; r <= rows; r++) {
                    const pos = r * cellSize;
                    ctx.beginPath();
                    ctx.moveTo(0, pos);
                    ctx.lineTo(canvas.width, pos);
                    ctx.stroke();
                }
            }

            function canvasImageWithGrayscale(canvasEl, base64Image, scale) {
                const img = new Image();
                img.src = base64Image;
                img.onload = () => {
                    const originalWidth = img.width;
                    const originalHeight = img.height;
                    const scaledWidth = originalWidth * scale;
                    const scaledHeight = originalHeight * scale;

                    const canvas = document.getElementById(canvasEl);
                    canvas.width = scaledWidth;
                    canvas.height = scaledHeight;
                    const ctx = canvas.getContext("2d");
                    ctx.imageSmoothingEnabled = false;

                    // Draw the pixelated image
                    ctx.drawImage(img, 0, 0, scaledWidth, scaledHeight);

                    // Get pixel data from the ORIGINAL image size
                    const tempCanvas = document.createElement("canvas");
                    tempCanvas.width = originalWidth;
                    tempCanvas.height = originalHeight;
                    const tempCtx = tempCanvas.getContext("2d");
                    tempCtx.drawImage(img, 0, 0, originalWidth, originalHeight);
                    const imageData = tempCtx.getImageData(0, 0, originalWidth, originalHeight);
                    const data = imageData.data;

                    const cellWidth = scale;
                    const cellHeight = scale;

                    if (showOverlay === true) {
                        ctx.textAlign = "center";
                        ctx.textBaseline = "middle";
                        ctx.font = `${Math.min(cellWidth, cellHeight) * 0.4}px Arial`;

                        // Loop through original pixels
                        for (let y = 0; y < originalHeight; y++) {
                            for (let x = 0; x < originalWidth; x++) {
                                const idx = (y * originalWidth + x) * 4;
                                const r = data[idx];
                                const g = data[idx + 1];
                                const b = data[idx + 2];

                                // Compute grayscale value
                                const gray = Math.round(0.299 * r + 0.587 * g + 0.114 * b);

                                // Overlay grayscale value text
                                ctx.fillStyle = gray < 128 ? "#fff" : "#000";
                                ctx.fillText(
                                    gray,
                                    x * cellWidth + cellWidth / 2,
                                    y * cellHeight + cellHeight / 2
                                );
                            }
                        }
                    }
                };
            }

            function drawBitString(canvasEl, bitString, resolution, cellSize) {
                const canvas = document.getElementById(canvasEl);
                const ctx = canvas.getContext("2d");

                // resolution = hash parameter (16, 32, 64, 128...)
                // bitString length = resolution / 2
                // grid side length = sqrt(resolution / 2)
                const gridSize = Math.sqrt(bitString.length);

                // Set canvas dimensions based on gridSize × cellSize
                canvas.width = gridSize * cellSize;
                canvas.height = gridSize * cellSize;

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.font = `${cellSize * 0.6}px Arial`;

                for (let i = 0; i < bitString.length; i++) {
                    const bit = bitString[i];
                    const row = Math.floor(i / gridSize);
                    const col = i % gridSize;

                    const x = col * cellSize;
                    const y = row * cellSize;

                    // Background color based on bit
                    ctx.fillStyle = bit === "1" ? "#000" : "#fff";
                    ctx.fillRect(x, y, cellSize, cellSize);

                    if (showOverlay === true) {
                        // Text color opposite of background
                        ctx.fillStyle = bit === "1" ? "#fff" : "#000";
                        ctx.fillText(bit, x + cellSize / 2, y + cellSize / 2);
                    }
                }

                // Draw grid lines
                ctx.strokeStyle = "#888";
                ctx.lineWidth = 1;

                // Vertical lines
                for (let c = 0; c <= gridSize; c++) {
                    const pos = c * cellSize;
                    ctx.beginPath();
                    ctx.moveTo(pos, 0);
                    ctx.lineTo(pos, canvas.height);
                    ctx.stroke();
                }

                // Horizontal lines
                for (let r = 0; r <= gridSize; r++) {
                    const pos = r * cellSize;
                    ctx.beginPath();
                    ctx.moveTo(0, pos);
                    ctx.lineTo(canvas.width, pos);
                    ctx.stroke();
                }
            }

            function reverseString(str) {
                return str.split('').reverse().join('');
            }

            $(document).on("keydown", function(event) {
                if (event.key === "Enter") {
                    $("#dupeSubmit").click();
                }
            });

            $("#dupeSubmit").on("click", function (e) {
                e.preventDefault();

                $("#base64_1").attr("src","");
                $("#base64_2").attr("src", "");
                let canvas = document.getElementById('base64_3');
                let ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                canvas = document.getElementById('base64_4');
                ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                canvas = document.getElementById('base64_5');
                ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                canvas = document.getElementById('base64_6');
                ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                $("#sometext").html("");

                if (algorithm !== "" &&
                    resolution !== "" &&
                    threshold !== "" &&
                    pathone !== "" &&
                    pathtwo !== ""
                ) {
                    const http = new Http("dupe detect");
                    const json = {
                        algorithm: $("#algorithm").val(),
                        pathone: $("#pathone").val(),
                        pathtwo: $("#pathtwo").val(),
                        threshold: $("#threshold").val(),
                        resolution: $("#resolution").val()
                    };
                    http.ajax("post", "/test", JSON.stringify(json)).then(function (results) {
                        console.log(results.grayScaleArray_1)
                        console.log(results.grayScaleArray_2)
                        $("#base64_1").attr("src", results.base64_1);
                        $("#base64_2").attr("src", results.base64_2);
                        // canvasImage("base64_3", results.base64_3, scale);
                        // canvasImage("base64_4", results.base64_4, scale);

                        // canvasImageWithGrayscale("base64_3", results.base64_3, pixelWidth)
                        // canvasImageWithGrayscale("base64_4", results.base64_4, pixelWidth)

                        canvasImageWithGrayscaleArray("base64_3", results.grayScaleArray_1, pixelWidth)
                        canvasImageWithGrayscaleArray("base64_4", results.grayScaleArray_2, pixelWidth)

                        drawBitString("base64_5", reverseString(results.bitString_1), resolution, pixelWidth)
                        drawBitString("base64_6", reverseString(results.bitString_2), resolution, pixelWidth)
                        $("#sometext").html(results.text);
                    });
                } else {
                    let html = "Inputs missing: " +
                    (algorithm === "") ? "algorithm, " : "" +
                    (resolution === "") ? "resolution, " : "" +
                    (threshold === "") ? "threshold, " : "" +
                    (pathone === "") ? "pathone, " : "" +
                    (pathtwo === "") ? "pathtwo, " : "";
                    $("#sometext").html(html);
                }
            });
        });
    </script>

</div>

</body>
</html>
