<!DOCTYPE html>
<th:block th:insert="~{fragments/asciiart :: asciiart()}"></th:block>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:insert="~{fragments/head :: head(${activePage},${titleDescriptor})}"></head>
<script src="/js/dexie.js" th:nonce="${cspNonce}"></script>
<body>
<div th:replace="~{fragments/topnav :: topnav(${currentUser},${activePage},'')}"></div>

<style>
    .overline {
        text-decoration: overline;
        text-decoration-color: red; /* optional: color of underline */
        text-decoration-thickness: 2px;
    }

    canvas {
        image-rendering: pixelated; /* helps in some browsers */
        /*border: 1px solid #ccc;*/
    }
</style>

<div class="container-fluid">
    <div class="row">
        <div th:replace="~{fragments/sidebaroffcanvas :: sidebaroffcanvas(${activeSidebar},${currentUser})}"></div>
        <main role="main" class="col">
            <h2 class="mt-3">Test Page</h2>

            <h3 class="mt-3">Dupe Detector</h3>

            <label for="algorithm"><strong>Algorithm (Default dhash)</strong></label><br>
            <select name="algorithm" id="algorithm">
                <option value="ahash">ahash</option>
                <option value="dhash" selected>dhash</option>
                <option value="phash">phash</option>
            </select><br><br>

            <label for="resolution"><strong>Resolution (Default 64)</strong></label><br>
            <select name="resolution" id="resolution">
                <option value="16">16 - very coarse, fast, prone to false positives</option>
                <option value="32">32 - very coarse, fast, prone to false positives</option>
                <option value="64" selected>64 - balanced</option>
                <option value="128">128 - more robust</option>
                <option value="256">256 - high fidelity, slower but very precise</option>
                <option value="512">512 - higher fidelity, even slower but very precise</option>
            </select><br><br>

            <label for="threshold"><strong>Distance Threshold</strong></label><br>
            <input type="text" id="threshold" name="threshold" style="width: 90%" value="10"><br><br>

            <label for="pathone"><strong>Image path 1</strong></label><br>
            <input type="text" id="pathone" name="pathone" style="width: 90%"><br><br>

            <label for="pathtwo"><strong>Image path 2</strong></label><br>
            <input type="text" id="pathtwo" name="pathtwo" style="width: 90%"><br><br>

            <button id="dupeSubmit">Is duplicate?</button><br><br>

            <span id="sometext"></span><br>
            <img id="base64_1" src="" style="width: 200px;margin-right: 5px;"><img id="base64_2" src="" style="width: 200px"><br>
            <canvas id="base64_3" style="margin-right: 5px;margin-top: 5px"></canvas><canvas id="base64_4" style="margin-top: 5px;"></canvas><br>
            <canvas id="base64_5" style="margin-right: 5px;margin-top: 5px"></canvas><canvas id="base64_6" style="margin-top: 5px;"></canvas><br>

            <span id="photos"></span>

            <div th:replace="~{fragments/hiddenfields :: hiddenfields(${message})}"></div>
            <div th:replace="~{fragments/footer :: footer(${copyrightYear},${operatingSystemInfo},${buildProperties},${activeProfile},${activePage})}"></div>
        </main>
    </div>

    <script th:inline="javascript" type="text/javascript">
        $(document).ready(function() {
            /*<![CDATA[*/
            const activePage = /*[[${activePage}]]*/ 'test';
            const currentPage = /*[[${currentPage}]]*/ 0;
            const locale = /*[[${locale}]]*/ 'en';
            /*]]>*/

            let urlParams = new URLSearchParams(window.location.search);
            let pixelWidth = (urlParams.has('pixelWidth') && parseInt(urlParams.get('pixelWidth'))) || 25;
            let showOverlay = urlParams.has('showOverlay') === false || (urlParams.has('showOverlay') && urlParams.get('showOverlay') === "true");

            // --- Helpers ---
            function getParamOrDefault(paramName, $el) {
                if (urlParams.has(paramName) && urlParams.get(paramName)) {
                    const val = urlParams.get(paramName);
                    $el.val(val);
                    return val;
                }
                return $el.val();
            }

            function clearCanvases(ids) {
                ids.forEach(id => {
                    const canvas = document.getElementById(id);
                    const ctx = canvas.getContext('2d');
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                });
            }

            function initFormValues() {
                return {
                    algorithm:  getParamOrDefault("algorithm", $("#algorithm")),
                    resolution: getParamOrDefault("resolution", $("#resolution")),
                    threshold:  getParamOrDefault("threshold", $("#threshold")),
                    pathone:    getParamOrDefault("pathone", $("#pathone")),
                    pathtwo:    getParamOrDefault("pathtwo", $("#pathtwo"))
                };
            }

            $("#base64_5").css("margin-left", pixelWidth+"px");
            $("#base64_6").css("margin-left", pixelWidth+"px");

            function canvasImage(canvasEl, base64Image, scale) {
                const img = new Image();
                img.src = base64Image; // Replace with your image source
                img.onload = () => {
                    const originalWidth = img.width;
                    const originalHeight = img.height;
                    const scaledWidth = originalWidth * scale;
                    const scaledHeight = originalHeight * scale;

                    const canvas = document.getElementById(canvasEl);
                    canvas.width = scaledWidth;
                    canvas.height = scaledHeight;
                    const ctx = canvas.getContext("2d");
                    ctx.imageSmoothingEnabled = false;
                    ctx.drawImage(img, 0, 0, scaledWidth, scaledHeight);
                };
            }

            function canvasImageWithGrayscaleArray(canvasEl, grayArray, cellSize, showOverlay) {
                const rows = grayArray.length;
                const cols = grayArray[0].length;

                const canvas = document.getElementById(canvasEl);
                canvas.width = cols * cellSize;
                canvas.height = rows * cellSize;
                const ctx = canvas.getContext("2d");

                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.font = `${cellSize * 0.4}px Arial`;

                for (let y = 0; y < rows; y++) {
                    for (let x = 0; x < cols; x++) {
                        const gray = grayArray[y][x];

                        // Fill square with grayscale color
                        ctx.fillStyle = `rgb(${gray}, ${gray}, ${gray})`;
                        ctx.fillRect(x * cellSize, y * cellSize, cellSize, cellSize);

                        if (showOverlay === true) {
                            // Overlay grayscale value text
                            ctx.fillStyle = gray < 128 ? "#fff" : "#000";
                            ctx.fillText(
                                gray,
                                x * cellSize + cellSize / 2,
                                y * cellSize + cellSize / 2
                            );
                        }
                    }
                }

                if (showOverlay === true) {
                    // Optional: draw grid lines
                    ctx.strokeStyle = "#888";
                    ctx.lineWidth = 1;
                    for (let c = 0; c <= cols; c++) {
                        const pos = c * cellSize;
                        ctx.beginPath();
                        ctx.moveTo(pos, 0);
                        ctx.lineTo(pos, canvas.height);
                        ctx.stroke();
                    }
                    for (let r = 0; r <= rows; r++) {
                        const pos = r * cellSize;
                        ctx.beginPath();
                        ctx.moveTo(0, pos);
                        ctx.lineTo(canvas.width, pos);
                        ctx.stroke();
                    }
                }
            }

            function drawBitString(canvasEl, bitString, resolution, cellSize, showOverlay) {
                const canvas = document.getElementById(canvasEl);
                const ctx = canvas.getContext("2d");

                // resolution = hash parameter (16, 32, 64, 128...)
                // bitString length = resolution / 2
                // grid side length = sqrt(resolution / 2)
                const gridSize = Math.sqrt(bitString.length);

                // Set canvas dimensions based on gridSize × cellSize
                canvas.width = gridSize * cellSize;
                canvas.height = gridSize * cellSize;

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.font = `${cellSize * 0.6}px Arial`;

                for (let i = 0; i < bitString.length; i++) {
                    const bit = bitString[i];
                    const row = Math.floor(i / gridSize);
                    const col = i % gridSize;

                    const x = col * cellSize;
                    const y = row * cellSize;

                    // Background color based on bit
                    ctx.fillStyle = bit === "1" ? "#000" : "#fff";
                    ctx.fillRect(x, y, cellSize, cellSize);

                    if (showOverlay === true) {
                        // Text color opposite of background
                        ctx.fillStyle = bit === "1" ? "#fff" : "#000";
                        ctx.fillText(bit, x + cellSize / 2, y + cellSize / 2);
                    }
                }

                //if (showOverlay === true) {
                    // Draw grid lines
                    ctx.strokeStyle = "#888";
                    ctx.lineWidth = 1;

                    // Vertical lines
                    for (let c = 0; c <= gridSize; c++) {
                        const pos = c * cellSize;
                        ctx.beginPath();
                        ctx.moveTo(pos, 0);
                        ctx.lineTo(pos, canvas.height);
                        ctx.stroke();
                    }

                    // Horizontal lines
                    for (let r = 0; r <= gridSize; r++) {
                        const pos = r * cellSize;
                        ctx.beginPath();
                        ctx.moveTo(0, pos);
                        ctx.lineTo(canvas.width, pos);
                        ctx.stroke();
                    }
                //}
            }

            function reverseString(str) {
                return str.split('').reverse().join('');
            }

            $(document).on("keydown", function(event) {
                if (event.key === "Enter") {
                    $("#dupeSubmit").click();
                }
            });

            $("#dupeSubmit").on("click", function (e) {
                e.preventDefault();

                $("#base64_1").attr("src", "");
                $("#base64_2").attr("src", "");
                clearCanvases(['base64_3','base64_4','base64_5','base64_6']);
                const { algorithm, resolution, threshold, pathone, pathtwo } = initFormValues();
                urlParams = new URLSearchParams(window.location.search);
                pixelWidth = (urlParams.has('pixelWidth') && parseInt(urlParams.get('pixelWidth'))) || 25;
                showOverlay = urlParams.has('showOverlay') === false || (urlParams.has('showOverlay') && urlParams.get('showOverlay') === "true");
                $("#sometext").html("");

                console.log("pixelWidth: " + pixelWidth);
                console.log("showOverlay: " + showOverlay);
                console.log("algorithm: " + algorithm);
                console.log("resolution: " + resolution);
                console.log("threshold: " + threshold);
                console.log("pathone: " + pathone);
                console.log("pathtwo: " + pathtwo);

                if (algorithm !== "" &&
                    resolution !== "" &&
                    threshold !== "" &&
                    pathone !== "" &&
                    pathtwo !== ""
                ) {
                    const http = new Http("dupe detect");
                    const json = {
                        algorithm: $("#algorithm").val(),
                        pathone: $("#pathone").val(),
                        pathtwo: $("#pathtwo").val(),
                        threshold: $("#threshold").val(),
                        resolution: $("#resolution").val()
                    };
                    console.log(json);
                    http.ajax("post", "/test", JSON.stringify(json)).then(function (results) {
                        $("#base64_1").attr("src", results.base64_1);
                        $("#base64_2").attr("src", results.base64_2);
                        console.log(results.grayScaleArray_1)
                        console.log(results.grayScaleArray_2)
                        if (algorithm !== "phash") {
                            canvasImageWithGrayscaleArray("base64_3", results.grayScaleArray_1, pixelWidth, showOverlay)
                            canvasImageWithGrayscaleArray("base64_4", results.grayScaleArray_2, pixelWidth, showOverlay)
                        }

                        drawBitString("base64_5", reverseString(results.bitString_1), resolution, pixelWidth, showOverlay)
                        drawBitString("base64_6", reverseString(results.bitString_2), resolution, pixelWidth, showOverlay)

                        $("#sometext").html(results.text);
                    });
                } else {
                    let html = "Inputs missing: " +
                        ((algorithm === null || algorithm === "") ? "algorithm, " : "") +
                        ((resolution === null || resolution === "") ? "resolution, " : "") +
                        ((threshold === null || threshold === "") ? "threshold, " : "") +
                        ((pathone === null || pathone === "") ? "pathone, " : "") +
                        ((pathtwo === null || pathtwo === "") ? "pathtwo, " : "");
                    html = html.slice(0, -2);
                    $("#sometext").html(html);
                }
            });
        });
    </script>

</div>

</body>
</html>
