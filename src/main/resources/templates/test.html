<!DOCTYPE html>
<th:block th:insert="~{fragments/asciiart :: asciiart()}"></th:block>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:insert="~{fragments/head :: head(${activePage},${titleDescriptor})}"></head>
<script src="/js/dexie.js" th:nonce="${cspNonce}"></script>
<body>
<div th:replace="~{fragments/topnav :: topnav(${currentUser},${activePage},'')}"></div>

<div class="container-fluid">
    <div class="row">
        <div th:replace="~{fragments/sidebaroffcanvas :: sidebaroffcanvas(${activeSidebar},${currentUser})}"></div>
        <main role="main" class="col">
            <h2 class="mt-3">Test Page</h2>

<!--            <span id="sometext" th:text="${text}"></span>-->
<!--            <form action="/test" method="post">-->
<!--                <input type="text" name="setone" th:value="${setone}" style="width: 90%"><br>-->
<!--                <input type="text" name="settwo" th:value="${settwo}" style="width: 90%"><br>-->
<!--                <input type="submit">-->
<!--            </form>-->

<!--            <img th:src="${base64_1}" style="width: 200px"><br>-->
<!--            <img th:src="${base64_2}" style="width: 200px"><br>-->

            <span id="dbtest" style="display: none;">
                <input type="text" id="year" placeholder="year"><input type="text" id="month" placeholder="month"><input type="text" id="day" placeholder="day"><br>
                <input type="text" id="mediaType" placeholder="media type"><br>
                <br><br>
                <input id="dateSubmit" type="submit">
            </span>

            <span id="result"></span>

            <div th:replace="~{fragments/hiddenfields :: hiddenfields(${message})}"></div>
            <div th:replace="~{fragments/footer :: footer(${copyrightYear},${operatingSystemInfo},${buildProperties},${activeProfile},${activePage})}"></div>
        </main>
    </div>

    <script th:inline="javascript" type="text/javascript">
        $(document).ready(function() {
            /*<![CDATA[*/
            const activePage = /*[[${activePage}]]*/ 'test';
            const currentPage = /*[[${currentPage}]]*/ 0;
            /*]]>*/

            let db = null;

            setTimeout(function () {
                const http = new Http("indexeddb test");
                http.ajax("get", "/timeline/all/dates").then(async function (data) {
                    if (data.hasOwnProperty("allMetadata")) {
                        $("#dbtest").css("display","block");

                        const metadataList = data.allMetadata;

                        db = new Dexie("MetadataDatabase");
                        db.version(1).stores({
                            metadataList: `
                                id,
                                [year+month+day]
                            `
                        });

                        db.metadataList.bulkPut(metadataList);

                        let year = 2024;
                        let month = 5;
                        let day = 5;
                        let mediaType = "image";

                        let query;
                        if (mediaType === "all" || mediaType === "") {
                            query = db.metadataList.where({year: year, month: month, day: day});
                        } else {
                            query = db.metadataList.where({year: year, month: month, day: day}).and(metadata => metadata.type.includes(mediaType));
                        }

                        query.toArray(function (metadataList) {
                            console.log(metadataList);
                        });

                        $("#dateSubmit").on("click", function (e) {
                            e.preventDefault();

                            year = parseInt($("#year").val());
                            month = parseInt($("#month").val());
                            day = parseInt($("#day").val());
                            mediaType = $("#mediaType").val();

                            if (mediaType === "all" || mediaType === "") {
                                console.log("test1");
                                console.log(mediaType)
                                query = db.metadataList.where({year: year, month: month, day: day});
                            } else {
                                console.log("test2");
                                console.log(mediaType)
                                query = db.metadataList.where({year: year, month: month, day: day}).and(metadata => metadata.type.includes(mediaType));
                            }

                            query.toArray(function (metadataList) {
                                console.log(metadataList);
                                $("#result").text(JSON.stringify(metadataList));
                            });
                        })
                    }
                });
            }, 0);

            $("#dateSubmit").on("click", function (e) {
                e.preventDefault();

                const year = parseInt($("#year").val());
                const month = parseInt($("#month").val());
                const day = parseInt($("#day").val());

                if (db !== null) {
                    db.metadataList.where({year: year, month: month, day: day}).toArray(function (metadataList) {
                        console.log(metadataList);
                        $("#result").text(JSON.stringify(metadataList));
                    });
                } else {
                    $("#result").text("DB not initiated");
                }
            })
        });
    </script>

</div>

</body>
</html>
