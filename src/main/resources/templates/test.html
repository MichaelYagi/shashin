<!DOCTYPE html>
<th:block th:insert="~{fragments/asciiart :: asciiart()}"></th:block>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:insert="~{fragments/head :: head(${activePage},${titleDescriptor})}"></head>
<script src="/js/dexie.js" th:nonce="${cspNonce}"></script>
<body>
<div th:replace="~{fragments/topnav :: topnav(${currentUser},${activePage},'')}"></div>

<div class="container-fluid">
    <div class="row">
        <div th:replace="~{fragments/sidebaroffcanvas :: sidebaroffcanvas(${activeSidebar},${currentUser})}"></div>
        <main role="main" class="col">
            <h2 class="mt-3">Test Page</h2>

            <h3 class="mt-3">Dupe Detector</h3>
            <span id="sometext"></span>
            <input type="text" id="setone" name="setone" style="width: 90%"><br>
            <input type="text" id="settwo" name="settwo" style="width: 90%"><br>
            <button id="dupeSubmit">Is duplicate?</button>
            <br>
            <img id="base64_1" src="" style="width: 200px"><br>
            <img id="base64_2" src="" style="width: 200px"><br>

            <h3 class="mt-3">Dexie Test</h3>

            <span id="dbtest" style="display: none;">
                <input type="text" id="year" placeholder="year"><input type="text" id="month" placeholder="month"><input type="text" id="day" placeholder="day"><br>
                <input type="text" id="mediaType" placeholder="media type"><br>
                <button id="randomDate" style="display: none">Get random date</button>
                <br>
                <input id="dateSubmit" type="submit">
            </span>

            <span id="photos"></span>

            <pre id="result"></pre>

            <div th:replace="~{fragments/hiddenfields :: hiddenfields(${message})}"></div>
            <div th:replace="~{fragments/footer :: footer(${copyrightYear},${operatingSystemInfo},${buildProperties},${activeProfile},${activePage})}"></div>
        </main>
    </div>

    <script th:inline="javascript" type="text/javascript">
        $(document).ready(function() {
            /*<![CDATA[*/
            const activePage = /*[[${activePage}]]*/ 'test';
            const currentPage = /*[[${currentPage}]]*/ 0;
            /*]]>*/

            let db = null;

            setTimeout(function () {
                const http = new Http("indexeddb test");
                http.ajax("get", "/timeline/all/dates").then(async function (data) {
                    if (data.hasOwnProperty("allMetadata")) {
                        $("#dbtest").css("display","block");

                        const metadataList = data.allMetadata;

                        db = new Dexie("MetadataDatabase");
                        db.version(1).stores({
                            metadataList: `
                                id,
                                [year+month+day]
                            `
                        });

                        db.metadataList.bulkPut(metadataList);

                        let year = 0;
                        let month = 0;
                        let day = 0;
                        let mediaType = "";
                        let query = null;

                        $("#dateSubmit").on("click", function (e) {
                            e.preventDefault();

                            year = parseInt($("#year").val());
                            month = parseInt($("#month").val());
                            day = parseInt($("#day").val());
                            mediaType = $("#mediaType").val();

                            if (mediaType === "all" || mediaType === "") {
                                query = db.metadataList.where({year: year, month: month, day: day});
                            } else {
                                query = db.metadataList.where({year: year, month: month, day: day}).and(metadata => metadata.type.includes(mediaType));
                            }

                            query.toArray(function (metadataList) {
                                let html = "";
                                for (let index in metadataList) {
                                    const metadata = metadataList[index];
                                    html += "<img src='/api/v1/thumbnails/centered/"+metadata.id+"' height='100px' width='100px'>";
                                }
                                $("#photos").html(html);
                                $("#result").text(JSON.stringify(metadataList, undefined, 2));
                            });
                        })
                    }
                });

                http.ajax("get", "/timeline/yearmonthcounts/all").then(function (data) {
                    if (data.hasOwnProperty("metadataDates") && data.hasOwnProperty("metadataYearMonthCount")) {
                        const timelineDatesData = data["metadataDates"];

                        $("#randomDate").css("display", "block");

                        const num = getRandomInteger(1, timelineDatesData.length);
                        const timelineDateData = timelineDatesData[num];
                        $("#year").val(timelineDateData.year);
                        $("#month").val(timelineDateData.month);
                        $("#day").val(timelineDateData.day);

                        $("#randomDate").on("click", function (e) {
                            e.preventDefault();

                            const num = getRandomInteger(1, timelineDatesData.length);
                            const timelineDateData = timelineDatesData[num];
                            $("#year").val(timelineDateData.year);
                            $("#month").val(timelineDateData.month);
                            $("#day").val(timelineDateData.day);
                        });
                    }

                    function getRandomInteger(min, max) {
                        min = Math.ceil(min);
                        max = Math.floor(max);
                        return Math.floor(Math.random() * (max - min + 1)) + min;
                    }
                });
            }, 0);

            $("#dupeSubmit").on("click", function (e) {
                e.preventDefault();

                const http = new Http("dupe detect");
                const json = {
                    setone: $("#setone").val(),
                    settwo: $("#settwo").val()
                };
                http.ajax("post", "/test", JSON.stringify(json)).then(function (results) {
                    // console.log(results)
                    $("#base64_1").attr("src",results.base64_1);
                    $("#base64_2").attr("src",results.base64_2);
                    $("#sometext").text(results.text);
                });
            });
        });
    </script>

</div>

</body>
</html>
