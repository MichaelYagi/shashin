<!DOCTYPE html>
<html lang="en" xmlns:th="http://thymeleaf.org">
<head th:insert="fragments/head :: head(${activePage},${titleDescriptor})"></head>
<body>

<script type="text/babel" src="/js/site/test.js"></script>

<div th:replace="fragments/topnav :: topnav(${currentUser},${activePage},'')"></div>

<div class="container-fluid">
    <div class="row">
        <div th:replace="fragments/sidebaroffcanvas :: sidebaroffcanvas(${activeSidebar},${currentUser})"></div>
        <main role="main" class="col">

<!--            <a data-bs-toggle="offcanvas" data-bs-placement="bottom" href="#offcanvasExample" aria-controls="offcanvasExample">-->
<!--                Link to open sidebar-->
<!--            </a>-->

            <div class="offcanvas offcanvas-start" data-bs-scroll="true" tabindex="-1" id="offcanvasExample" aria-labelledby="offcanvasExampleLabel">
                <div class="offcanvas-header">
                    <h5 class="offcanvas-title" id="offcanvasExampleLabel">Offcanvas</h5>
                    <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" aria-label="Close"></button>
                </div>
                <div class="offcanvas-body">
                    <div>
                        Some text as placeholder. In real life you can have the elements you have chosen. Like, text, images, lists, etc.
                    </div>
                    <div class="dropdown mt-3">
                        <button class="btn btn-secondary dropdown-toggle" type="button" id="dropdownMenuButton" data-bs-toggle="dropdown">
                            Dropdown button
                        </button>
                        <ul class="dropdown-menu" aria-labelledby="dropdownMenuButton">
                            <li><a class="dropdown-item" href="#">Action</a></li>
                            <li><a class="dropdown-item" href="#">Another action</a></li>
                            <li><a class="dropdown-item" href="#">Something else here</a></li>
                        </ul>
                    </div>
                </div>
            </div>

            <br><th:block th:text="${'Using minified JS: '+@environment.getProperty('app.js.useMinified')}"></th:block><br><br>

            <h2>API Endpoints</h2>

            <th:block th:each="endpoint, iterStat: ${apiEndpointsMap}">
                <br><th:block th:utext="${'<strong>Path</strong>: '+endpoint.key}"></th:block>
                <br><th:block th:utext="${'<strong>Method</strong>: '+endpoint.value}"></th:block>
                <br>
            </th:block>

            <br><br>
            <h2>Non API Endpoints</h2>

            <th:block th:each="endpoint, iterStat: ${nonApiEndpointsMap}">
                <br><th:block th:utext="${'<strong>Path</strong>: '+endpoint.key}"></th:block>
                <br><th:block th:utext="${'<strong>Method</strong>: '+endpoint.value}"></th:block>
                <br>
            </th:block>

            <div th:replace="fragments/content :: content(${message},${activePage},${authority},${parameter},'',${faceRecogServicesAvailable})" class="col-sm p-3 min-vh-100"></div>
            <div th:replace="fragments/footer :: footer(${copyrightYear},${operatingSystemInfo},${buildProperties},${activeProfile})"></div>
        </main>
    </div>
</div>

</body>
</html>
