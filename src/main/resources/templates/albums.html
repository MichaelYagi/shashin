<!DOCTYPE html>
<html lang="en" xmlns:th="http://thymeleaf.org">
<head th:insert="fragments/head :: head(${titleDescriptor})"></head>
<body class="thumb d-flex flex-column vh-100">

<div th:replace="fragments/topnav :: topnav(${currentUser},${activePage},'')"></div>

<div id="container" class="container-fluid pb-3 flex-grow-1 d-flex flex-column overflow-auto">
    <div class="row flex-grow-sm-1 flex-grow-0">
        <div th:replace="fragments/sidebaroffcanvas :: sidebaroffcanvas(${activeSidebar},${currentUser})"></div>
        <main role="main" class="col overflow-auto h-100">
            <div th:replace="fragments/content :: content(${message},${activePage},${authority},${parameter},'')" class="col-sm p-3 min-vh-100"></div>
            <div id="albumsMessage">&nbsp;</div><br>
            <input type="hidden" id="albumsId" name="albumsId">
            <input type="hidden" id="currentUser" th:value="${currentUser.username}">
            <input type="hidden" id="currentUserId" th:value="${currentUser.id}">

            <th:block th:if="${not #lists.isEmpty(albumsList)}">
                <div class="row image-group-padding">
                    <th:block th:each="album, iterStat: ${albumsList}">
                        <div class="card" style="width:235px;padding-top:10px;">
                            <a th:href="'/album/'+${album.id}" style="text-decoration: none !important;color: #777777;" th:id="'album'+${album.id}">
                                <img loading="lazy" class="card-img-top" th:src="${#uris.escapePath(album.coverUrl)}" width="209" height="209" style="width: 209px;height: 209px;">
                            </a>
                            <div class="card-body">
                                <strong th:id="'albumName'+${album.id}" th:text="${album.name}"></strong><br>

                                <a href="#" th:id="'comment'+${album.id}" style="text-decoration: none;" title="Comments">
                                    <span th:id="'commentcount'+${album.id}"><th:block th:text="${albumsCommentsMap.containsKey(album.id) ? #lists.size(albumsCommentsMap.get(album.id)) : '0'}"></th:block></span>
                                    <span class="bi-chat-square position-relative">
<!--                                        <th:block th:if="${notificationMap.get(album.id)}">-->
<!--                                            <span class="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-light rounded-circle">-->
<!--                                                <span class="visually-hidden">New alerts</span>-->
<!--                                            </span>-->
<!--                                        </th:block>-->
                                    </span>
                                </a>
                                <th:block th:if="${album.albumPhotoCount > 0}">
                                    <form method="post" th:action="'/album/download/'+${album.id}" style="display: inline-block;white-space: nowrap;">
                                        <button th:class="'bi-download'+${currentUser.darkMode ? ' link-button-darkmode' : ' link-button-lightmode'}" type="submit" th:id="'download'+${album.id}" name="download" th:value="${album.id}" title="Download album photos"></button>
                                    </form>
                                </th:block>
                                <th:block th:if="${album.albumPhotoCount == 0}">
                                    &nbsp;
                                </th:block>
                                <th:block th:if="${authority == 'ROLE_ADMIN'}">
                                    <a href="#" th:id="'edit'+${album.id}"><span class="bi-pencil" title="Edit album"></span></a>
                                    &nbsp;&nbsp;<a href="#" th:id="'share'+${album.id}"><span th:class="${album.shareUrl != null and album.shareUrl != '' ? 'bi-share-fill' : 'bi-share'}" title="Share with other users"></span></a>
                                    &nbsp;&nbsp;<a href="#" th:id="'trash'+${album.id}" title="Delete album"><span class="bi-trash"></span></a>
                                </th:block>
                                <p class="card-text"><small class="text-muted" th:text="${album.albumPhotoCount + (album.albumPhotoCount == 1 ? ' photo':' photos') + '&nbsp;&nbsp;&nbsp;&nbsp;' + album.albumVideoCount + (album.albumVideoCount == 1 ? ' video':' videos')}"></small></p>
                            </div>
                        </div>

                        <script type="text/javascript" th:inline="javascript" th:nonce="${cspNonce}">
                            Albums.setAlbumsEventListeners(/*[[${album.id}]]*/ 0, /*[[${baseUrl}]]*/ '', /*[[${showControls}]]*/ false, /*[[${cspNonce}]]*/ '');
                        </script>

                        <span class="appendAlbumsPhotos" style="width:0;height:0;padding:0"></span>
                    </th:block>
                </div>
            </th:block>
            <th:block th:if="${#lists.isEmpty(albumsList)}">
                <span class="appendAlbumsPhotos" style="width:0;height:0;padding:0;display:none;">EOL</span>
            </th:block>

            <!-- Back to top button -->
            <button type="button" class="btn btn-primary btn-floating btn-lg" id="btn-back-to-top">
                <i class="bi-arrow-up-circle"></i>
            </button>

            <th:block th:if="${@environment.getProperty('app.js.useMinified') == 'false'}">
                <script src="/js/site/albumsmodal.js" type="text/javascript" th:nonce="${cspNonce}"></script>
            </th:block>
            <th:block th:if="${@environment.getProperty('app.js.useMinified') == 'true'}">
                <script src="/js/site/min/albumsmodal.min.js" type="text/javascript" th:nonce="${cspNonce}"></script>
            </th:block>

            <div th:replace="fragments/footer :: footer(${copyrightYear},${operatingSystemInfo},${buildProperties},${activeProfile})"></div>
        </main>
    </div>
</div>

<!-- Modals -->
<th:block th:if="${authority == 'ROLE_ADMIN'}">
    <div class="modal fade" id="propsharealbums" tabindex="-1" role="dialog" aria-labelledby="label" aria-hidden="true">
        <div class="modal-dialog modal-dialog-scrollable modal-lg" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="exampleModalLabel">Share <span id="albumName"></span><div id="propsharelinkalbums"><img loading="lazy" id="albumCoverThumb" src="" width="100" height="100"></div></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="saveData">
                        <strong>Share with other people</strong><br>
                        <div class="input-group">
                            <input type="text" placeholder="Share Link" id="shareLink" name="shareLink" class="form-control" value="" disabled>
                            <div class="input-group-append">
                                <button class="btn btn-outline-secondary" id="generateLink" type="button" data-bs-toggle="tooltip" data-bs-placement="top" title="Generate link"><span class="bi-arrow-clockwise"></span></button>
                                <button class="btn btn-outline-secondary" id="clearLink" type="button" data-bs-toggle="tooltip" data-bs-placement="top" title="Clear link"><span class="bi-x"></span></button>
                                <button class="btn btn-outline-secondary" id="copyLink" type="button"data-bs-toggle="tooltip" data-bs-placement="top" title="Copy link" data-clipboard-text=""><span class="bi-clipboard-plus"></span></button>
                            </div>
                        </div>
                        <div id="fullShareLinkContainer" class="card" style=""><div id="fullShareLink" class="card-body"><a target="_blank" href=""><span id="fullShareLinkCard"></span></a></div></div>
                        <br>
                        <th:block th:if="${sharedAlbums !=''}">
                            <div id="shareUserList"></div>
                        </th:block>
                    </form>
                    <br>
                    <div class="col-sm">
                        <span id="msg"></span>
                    </div>
                </div>
                <div class="modal-footer">
                    <div id="albumsModalStatus" class="spinner-grow me-auto" style="visibility: hidden;font-size: 2rem;" role="status" aria-hidden="true" data-bs-toggle="tooltip" data-bs-placement="right" title=""></div>
                    <button id="saveUserShare" type="button" class="btn btn-primary">Save</button>
                    <button id="cancelUserShare" type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                </div>

            </div>
        </div>
    </div>

    <div class="modal fade" id="proptrashalbums" tabindex="-1" role="dialog" aria-labelledby="labeltrash" aria-hidden="true">
        <div class="modal-dialog modal-dialog-scrollable modal-sm" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="trashModalLabel">Delete <span id="albumNameTrash"></span><div id="proptrashalbumsthumb"><img loading="lazy" id="albumCoverTrashThumb" src="" width="100" height="100"></div></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">Are you sure you want to delete this album?</div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" id="deleteAlbum">Confirm</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="propeditalbums" tabindex="-1" role="dialog" aria-labelledby="labeledit" aria-hidden="true">
        <div class="modal-dialog modal-dialog-scrollable modal-sm" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="editModalLabel">Edit Album <span id="albumNameEdit"></span><div id="editalbumsthumb"><img loading="lazy" id="albumCoverEditThumb" src="" width="100" height="100"></div></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form method="post" id="editAlbumsModal">
                        <input type="text" id="albumEditName" name="albumEditName" class="form-control" placeholder="Album Name">
                    </form>
                </div>
                <div class="modal-footer">
                    <div id="editAlbumNameStatus" class="spinner-grow me-auto" style="visibility: hidden;font-size: 2rem;" role="status" aria-hidden="true" data-bs-toggle="tooltip" data-bs-placement="right" title=""></div>
                    <button id="editAlbum" type="button" class="btn btn-primary">Confirm</button>
                    <button id="cancelAlbum" type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                </div>
            </div>
        </div>
    </div>
</th:block>

<div class="modal fade" id="propcommentalbums" tabindex="-1" role="dialog" aria-labelledby="labelcomment" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="commentModalLabel">Comments for <span id="albumNameComments"></span><div id="propalbumphotocomment"><img loading="lazy" id="albumCoverCommentThumb" src="" width="100" height="100"></div></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="currentCommentId" name="currentCommentId">
                <ul class="list-group" id="commentList"></ul>
            </div>
            <div class="modal-footer">
                <textarea class="form-control" id="commentText" rows="2"></textarea>
                <button type="button" class="btn btn-primary" id="saveCommentAlbum">Save</button>
                <button type="button" class="btn btn-primary" id="updateCommentAlbum">Update</button>
                <button type="button" class="btn btn-secondary" id="dismissModalCommentAlbum" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-secondary" id="cancelEditCommentAlbum" data-bs-dismiss="modal">Cancel</button>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript" th:inline="javascript" th:nonce="${cspNonce}">
    $(document).ready(function() {
        /*<![CDATA[*/
        shashin.nonce = /*[[${cspNonce}]]*/ '';
        const activePage = /*[[${activePage}]]*/ 'albums';
        const albumsList = /*[[${albumsList}]]*/ '[]';
        const showControls = /*[[${showControls}]]*/ false;
        const baseUrl = /*[[${baseUrl}]]*/ '';
        const darkMode = /*[[${currentUser.darkMode}]]*/ false;
        /*]]>*/

        const albumsInstance = new Albums(albumsList, activePage, showControls, baseUrl, shashin.nonce, darkMode);
        albumsInstance.init();
        Util.checkErrorImage();
    });
</script>

</body>
</html>
