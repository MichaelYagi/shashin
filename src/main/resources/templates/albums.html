<!DOCTYPE html>
<th:block th:insert="~{fragments/asciiart :: asciiart()}"></th:block>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:insert="~{fragments/head :: head(${activePage},${titleDescriptor})}"></head>
<body class="thumb d-flex flex-column vh-100">

<div th:replace="~{fragments/topnav :: topnav(${currentUser},${activePage},'')}"></div>

<div id="container" class="container-fluid pb-3 flex-grow-1 d-flex flex-column overflow-auto">
    <div class="row flex-grow-sm-1 flex-grow-0">
        <div th:replace="~{fragments/sidebaroffcanvas :: sidebaroffcanvas(${activeSidebar},${currentUser})}"></div>
        <main role="main" class="col overflow-auto h-100">
            <div th:replace="~{fragments/hiddenfields :: hiddenfields(${message})}"></div>

            <input type="hidden" id="currentAlbumId">
            <input type="hidden" id="currentBaseUrl" th:value="${baseUrl}">
            <input type="hidden" id="currentUser" th:value="${currentUser.username}">
            <input type="hidden" id="currentUserId" th:value="${currentUser.id}">

            <div id="albumsMessage"></div>
            
            <th:block th:if="${not #lists.isEmpty(albumsList)}">
                <div th:class="'row' + ${isMobile ? '' : ' image-group-padding'}">
                    <th:block th:each="album, iterStat: ${albumsList}">
                        <div class="card" th:style="'width:'+${isMobile ? '175' : '235'}+'px;padding-top:'+${isMobile ? '14' : '10'}+'px;margin-right:-1px;margin-bottom:-1px;'">
                            <a th:href="'/album/'+${album.id}" style="text-decoration: none !important;color: #777777;" th:id="'album'+${album.id}">
                                <img loading="lazy" draggable="false" class="card-img-top" th:src="${#strings.replace(#uris.escapePath(album.coverUrl),';','%3B')}" th:width="${isMobile ? '148' : '209'}" th:height="${isMobile ? '148' : '209'}" th:style="'width: '+${isMobile ? '148' : '209'}+'px;height: '+${isMobile ? '148' : '209'}+'px;'">
                            </a>
                            <div class="card-body" style="display: flex;flex-direction: column;">
                                <p class="card-text"><a th:href="'/album/'+${album.id}" th:style="'text-decoration: none !important;color: ' + ${currentUser.darkMode ? '#FFFFFF;' : '#000000;'}"><strong th:id="'albumName'+${album.id}" th:text="${album.name}"></strong></a></p>

                                <span style="margin-top: auto;">
                                    <a href="#" th:id="'comment'+${album.id}" style="text-decoration: none;" title="Comments">
                                        <span th:id="'commentcount'+${album.id}"><th:block th:text="${albumsCommentsMap.containsKey(album.id) ? #lists.size(albumsCommentsMap.get(album.id)) : '0'}"></th:block></span>
                                        <span class="bi-chat-square position-relative">
                                        </span>
                                    </a>
                                    <th:block th:if="${album.albumPhotoCount > 0}">
                                        <form method="post" th:action="'/album/download/'+${album.id}" style="display: inline-block;white-space: nowrap;">
                                            <button th:class="'bi-download'+${currentUser.darkMode ? ' link-button-darkmode' : ' link-button-lightmode'}" type="submit" th:id="'download'+${album.id}" name="download" th:value="${album.id}" title="Download album photos"></button>
                                        </form>
                                    </th:block>
                                    <th:block th:if="${album.albumPhotoCount == 0}">
                                        &nbsp;
                                    </th:block>
                                    <th:block th:if="${authority == 'ROLE_ADMIN' || authority == 'ROLE_SUPER'}">
                                        <a href="#" th:id="'edit'+${album.id}"><span class="bi-pencil" title="Edit album"></span></a>
                                        <th:block th:unless="${isMobile}">&nbsp;</th:block>&nbsp;<a href="#" th:id="'share'+${album.id}"><span th:class="${album.shareUrl != null and album.shareUrl != '' ? 'bi-share-fill' : 'bi-share'}" th:title="${(album.shareUrl != null and album.shareUrl != '' ? 'Shared' : 'Share') + ' with other people'}"></span></a>
                                        <span th:id="'userShare'+${album.id}" title="Shared with others users" th:style="${sharedAlbumsMap.containsKey(album.id) and (authority == 'ROLE_ADMIN' || authority == 'ROLE_SUPER') ? 'display: inline-block' : 'display: none'}"><th:block th:unless="${isMobile}">&nbsp;</th:block>&nbsp;<span class="bi-person-up text-muted"></span></span>
                                        <th:block th:unless="${isMobile}">&nbsp;</th:block>&nbsp;<a href="#" th:id="'trash'+${album.id}" title="Delete album"><span class="bi-trash"></span></a>
                                    </th:block>
                                    <th:block th:if="${#strings.equals(locale, 'en')}">
                                        <p class="card-text"><small class="text-muted" th:text="${album.albumPhotoCount + (album.albumPhotoCount == 1 ? ' photo':' photos') + (isMobile ? '' : '&nbsp;&nbsp;') + '&nbsp;&nbsp;' + album.albumVideoCount + (album.albumVideoCount == 1 ? ' video':' videos')}"></small></p>
                                    </th:block>
                                    <th:block th:unless="${#strings.equals(locale, 'en')}">
                                        <p class="card-text"><small class="text-muted" th:text="${album.albumPhotoCount} + ' ' + #{main.pages.albums.photo} + (isMobile ? '' : '&nbsp;&nbsp;') + '&nbsp;&nbsp;' + ${album.albumVideoCount} + ' ' + #{main.pages.albums.video}"></small></p>
                                   </th:block>
                                </span>
                            </div>
                        </div>

                        <script type="text/javascript" th:inline="javascript" th:nonce="${cspNonce}">
                            Albums.setAlbumsEventListeners(/*[[${album.id}]]*/ 0, /*[[${baseUrl}]]*/ '', /*[[${showControls}]]*/ false, /*[[${cspNonce}]]*/ '');
                        </script>

                        <span class="appendAlbumsPhotos" style="width:0;height:0;padding:0"></span>
                    </th:block>
                </div>
            </th:block>
            <th:block th:if="${#lists.isEmpty(albumsList)}">
                <span class="appendAlbumsPhotos" style="width:0;height:0;padding:0;display:none;">EOL</span>
            </th:block>

            <!-- Back to top button -->
            <button type="button" class="btn btn-primary btn-floating btn-lg" id="btn-back-to-top">
                <i class="bi-arrow-up-circle"></i>
            </button>

            <th:block th:if="${@environment.getProperty('app.js.useMinified') == 'false'}">
                <script src="/js/site/albumsmodal.js" type="text/javascript" th:nonce="${cspNonce}"></script>
            </th:block>
            <th:block th:if="${@environment.getProperty('app.js.useMinified') == 'true'}">
                <script src="/js/site/min/albumsmodal.min.js" type="text/javascript" th:nonce="${cspNonce}"></script>
            </th:block>

            <div th:replace="~{fragments/footer :: footer(${copyrightYear},${operatingSystemInfo},${buildProperties},${activeProfile},${activePage})}"></div>
        </main>
    </div>
</div>

<!-- Modals -->
<th:block th:if="${authority == 'ROLE_ADMIN' || authority == 'ROLE_SUPER'}">
    <div class="modal fade" id="propsharealbums" tabindex="-1" role="dialog" aria-labelledby="label">
        <div class="modal-dialog modal-dialog-scrollable modal-md" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="propsharealbumsLabel"><th:block th:utext="#{main.pages.albums.share.album('&ldquo;<span id=&quot;albumName&quot;></span>&rdquo;')}"></th:block><div id="propsharelinkalbums"><img loading="lazy" draggable="false" id="albumCoverThumb" src="" width="100" height="100"></div></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="saveData">
                        <strong><th:block th:text="#{main.modal.albums.share.message}"></th:block></strong><br>
                        <div>
                            <input type="hidden" th:placeholder="#{main.modal.albums.share.link.placeholder}" id="shareLink" name="shareLink" class="form-control" value="">
                            <div id="fullShareLinkContainer" class="card mb-1">
                                <div id="fullShareLink" class="card-body">
                                    <a target="_blank" href=""><span id="fullShareLinkCard"></span></a>
                                </div>
                            </div>
                            <div class="input-group">
                                <button class="btn btn-secondary" id="generateLink" type="button" data-bs-toggle="tooltip" data-bs-placement="top" title="Generate link"><span class="bi-arrow-clockwise"></span></button>
                                <button class="btn btn-secondary" id="clearLink" type="button" data-bs-toggle="tooltip" data-bs-placement="top" title="Clear link"><span class="bi-x"></span></button>
                                <button class="btn btn-secondary" id="copyLink" type="button" data-bs-toggle="tooltip" data-bs-placement="top" title="Copy link" data-clipboard-text=""><span id="copyLinkIcon" class="bi-clipboard-plus"></span></button>
                            </div>
                        </div>
                        <br>
                        <th:block th:if="${sharedAlbums !=''}">
                            <div id="shareUserList"></div>
                        </th:block>
                    </form>
                    <br>
                    <div class="col-sm">
                        <span id="msg"></span>
                    </div>
                </div>
                <div class="modal-footer">
                    <div id="albumsModalStatus" class="spinner-grow me-auto" style="visibility: hidden;font-size: 1.55rem;" role="status" data-bs-toggle="tooltip" data-bs-placement="right" title=""></div>
                    <button id="saveUserShare" type="button" class="btn btn-primary"><th:block th:text="#{main.modal.save}"></th:block></button>
                    <button id="cancelUserShare" type="button" class="btn btn-secondary" data-bs-dismiss="modal"><th:block th:text="#{main.modal.cancel}"></th:block></button>
                </div>

            </div>
        </div>
    </div>

    <div class="modal fade" id="proptrashalbums" tabindex="-1" role="dialog" aria-labelledby="labeltrash">
        <div class="modal-dialog modal-dialog-scrollable modal-sm" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="trashModalLabel"><th:block th:utext="#{main.pages.albums.share.delete('<span id=&quot;albumNameTrash&quot;></span>')}"><div id="proptrashalbumsthumb"><img loading="lazy" draggable="false" id="albumCoverTrashThumb" src="" width="100" height="100"></div></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body"><th:block th:text="#{main.modal.albums.comment.delete.confirm}"></th:block></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" id="deleteAlbum"><th:block th:text="#{main.modal.confirm}"></th:block></button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"><th:block th:text="#{main.modal.cancel}"></th:block></button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="shareConfirmationModal" tabindex="-1" role="dialog" aria-labelledby="shareConfirmationModal">
        <div class="modal-dialog modal-dialog-scrollable modal-md" role="document">
            <div class="modal-content">
                <input id="shareConfirmationAction" type="hidden" value="">
                <div class="modal-header">
                    <h5 class="modal-title"><th:block th:utext="#{main.pages.albums.share.action('<span id=&quot;shareConfirmationModalTitle&quot;></span>')}"></th:block></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body"><th:block th:utext="#{main.pages.albums.share.action.confirm('<span id=&quot;shareConfirmationModalAction&quot;></span>')}">. <span id="shareConfirmationModalInfo"><th:block th:text="#{main.pages.albums.share.action.confirm.info}"></th:block></span></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal" id="shareConfirmation"><th:block th:text="#{main.modal.confirm}"></th:block></button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"><th:block th:text="#{main.modal.cancel}"></th:block></button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="propeditalbums" tabindex="-1" role="dialog" aria-labelledby="labeledit">
        <div class="modal-dialog modal-dialog-scrollable modal-sm" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="editModalLabel"><th:block th:utext="#{main.pages.albums.share.edit('<span id=&quot;albumNameEdit&quot;></span>')}"></th:block><div id="editalbumsthumb"><img loading="lazy" draggable="false" id="albumCoverEditThumb" src="" width="100" height="100"></div></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="originalAlbumName">
                    <form method="post" id="editAlbumsModal">
                        <input type="text" id="albumEditName" name="albumEditName" class="form-control" placeholder="Album Name">
                    </form>
                </div>
                <div class="modal-footer">
                    <div id="editAlbumNameStatus" class="spinner-grow me-auto" style="visibility: hidden;font-size: 1.55rem;" role="status" data-bs-toggle="tooltip" data-bs-placement="right" title=""></div>
                    <button id="editAlbum" type="button" class="btn btn-primary"><th:block th:text="#{main.modal.albums.comment.delete.confirm}"></th:block></button>
                    <button id="cancelAlbum" type="button" class="btn btn-secondary" data-bs-dismiss="modal"><th:block th:text="#{main.modal.cancel}"></th:block></button>
                </div>
            </div>
        </div>
    </div>
</th:block>

<div class="modal fade" id="propcommentalbums" tabindex="-1" role="dialog" aria-labelledby="labelcomment">
    <div class="modal-dialog modal-lg modal-dialog-scrollable" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="commentModalLabel"><th:block th:text="#{main.pages.albums.comment('<span id=&quot;albumNameComments&quot;></span>')}"><div id="propalbumphotocomment"><img loading="lazy" draggable="false" id="albumCoverCommentThumb" src="" width="100" height="100"></div></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" id="commentListContainer" style="display: none;">
                <input type="hidden" id="currentCommentId" name="currentCommentId">
                <ul class="list-group" id="commentList"></ul>
            </div>
            <div class="modal-footer">
                <textarea class="form-control" id="commentText" rows="2" placeholder="Comment"></textarea>
                <button type="button" class="btn btn-primary" id="saveCommentAlbum"><th:block th:text="#{main.modal.save}"></th:block></button>
                <button type="button" class="btn btn-primary" id="updateCommentAlbum"><th:block th:text="#{main.modal.tab.update}"></th:block></button>
                <button type="button" class="btn btn-secondary" id="dismissModalCommentAlbum" data-bs-dismiss="modal"><th:block th:text="#{main.modal.close}"></th:block></button>
                <button type="button" class="btn btn-secondary" id="cancelEditCommentAlbum"><th:block th:text="#{main.modal.cancel}"></th:block></button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="propalbumstrashcomment" tabindex="-1" role="dialog" aria-labelledby="labeltrashcomment">
    <div class="modal-dialog modal-dialog-scrollable modal-sm" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="trashalbumscommentModalLabel"><th:block th:text="#{main.modal.albums.comment.delete.title}"></th:block></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body"><th:block th:text="#{main.modal.albums.comment.delete.body}"></th:block></div>
            <input type="hidden" id="albumsCommentAlbumId">
            <input type="hidden" id="albumsCommentCommentId">
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" id="deleteAlbumsComment"><th:block th:text="#{main.modal.confirm}"></th:block></button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"><th:block th:text="#{main.modal.cancel}"></th:block></button>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript" th:inline="javascript" th:nonce="${cspNonce}">
    $(document).ready(function() {
        shashin.updateSearchInput(shashin.getTranslatedValue("main.sidebar.albums"));

        /*<![CDATA[*/
        shashin.nonce = /*[[${cspNonce}]]*/ '';
        const activePage = /*[[${activePage}]]*/ 'albums';
        const showControls = /*[[${showControls}]]*/ false;
        const baseUrl = /*[[${baseUrl}]]*/ '';
        const darkMode = /*[[${currentUser.darkMode}]]*/ false;
        /*]]>*/

        const http = new Http(activePage);
        http.ajax("get", "/albums/0").then(function (data) {
            if (data.hasOwnProperty("albumsList") === true) {
                const albumsList = data["albumsList"];
                const albumsInstance = new Albums(albumsList, activePage, showControls, baseUrl, shashin.nonce, darkMode);
                albumsInstance.init();
                // Util.checkErrorImage();
            }
        });
    });
</script>

</body>
</html>
