<!DOCTYPE html>
<th:block th:insert="~{fragments/asciiart :: asciiart()}"></th:block>
<html th:lang="${locale}" xmlns:th="http://www.thymeleaf.org">
<head th:insert="~{fragments/head :: head(${activePage},${titleDescriptor})}"></head>
<body class="thumb d-flex flex-column vh-100">

<div th:replace="~{fragments/topnav :: topnav(${currentUser},${activePage},'')}"></div>

<div th:replace="~{fragments/metadatamodal :: metadatamodal(${currentUser})}"></div>

<div th:replace="~{fragments/persongroup :: person(${activePage},${parameter},${counts},${faceRecogServicesAvailable},${authority},${settings.facialDetection})}"></div>

<div id="container" class="container-fluid pb-3 flex-grow-1 d-flex flex-column overflow-auto mt-2">
    <div class="row flex-grow-sm-1 flex-grow-0">
        <div th:replace="~{fragments/sidebaroffcanvas :: sidebaroffcanvas(${activeSidebar},${currentUser})}"></div>
        <main role="main" class="col overflow-auto h-100">

            <div th:replace="~{fragments/hiddenfields :: hiddenfields(${message})}"></div>
            <input type="hidden" id="currentPerson" th:value="${personInfo.name}">
            <input type="hidden" id="personId" name="personId" th:value="${parameter}">

            <div class="mt-2" id="matchesMessage"></div>

            <th:block th:if="${not #lists.isEmpty(reviewItems)}">
                <div class="row g-3 p-2">
                    <th:block th:each="item : ${reviewItems}">
                        <div class="col-12 col-sm-6 col-md-4 col-lg-3">
                            <div class="card h-100 shadow-sm" th:id="${'matchCard'+item.detectionId}">
                                <div class="row g-0">
                                    <div class="col-5">
                                        <img th:src="${item.cropUrl}" class="img-fluid rounded-start" style="height:140px;object-fit:cover;width:100%;" alt="Face crop">
                                        <div class="text-center" style="font-size:0.7rem;color:#888;">Detected face</div>
                                    </div>
                                    <div class="col-7">
                                        <th:block th:if="${item.hasPhoto}">
                                            <a th:href="${'/timeline#'+item.year+'-'+item.month+'-'+item.day}" target="_blank">
                                                <img th:src="${item.thumbnailUrl}" class="img-fluid" style="height:140px;object-fit:cover;width:100%;" alt="Photo">
                                            </a>
                                        </th:block>
                                        <th:block th:unless="${item.hasPhoto}">
                                            <div class="d-flex align-items-center justify-content-center h-100 text-muted" style="height:140px;font-size:0.8rem;">No photo</div>
                                        </th:block>
                                        <div class="text-center" style="font-size:0.7rem;color:#888;">Shashin photo</div>
                                    </div>
                                </div>
                                <div class="card-body p-2">
                                    <p class="card-text mb-1" style="font-size:0.85rem;">
                                        <strong th:text="${item.suggestedLabel}"></strong>
                                        &nbsp;<span class="badge bg-secondary" th:text="${#numbers.formatDecimal(item.similarity * 100, 1, 0) + '%'}"></span>
                                    </p>
                                    <div class="d-flex gap-1">
                                        <button class="btn btn-success btn-sm flex-grow-1 confirm-btn"
                                                th:data-detection-id="${item.detectionId}"
                                                th:data-person-id="${parameter}"
                                                th:data-crop-url="${item.cropUrl}">
                                            <span class="bi-check-lg"></span>
                                        </button>
                                        <button class="btn btn-danger btn-sm flex-grow-1 reject-btn"
                                                th:data-detection-id="${item.detectionId}">
                                            <span class="bi-x-lg"></span>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </th:block>
                </div>
            </th:block>

            <th:block th:if="${#lists.isEmpty(reviewItems)}">
                <div class="mt-3 text-muted">No pending matches for this person.</div>
            </th:block>

            <div th:replace="~{fragments/footer :: footer(${copyrightYear},${operatingSystemInfo},${buildProperties},${activeProfile},${activePage})}"></div>
        </main>
    </div>
</div>

<th:block th:if="${@environment.getProperty('app.js.useMinified') == 'false'}">
    <script src="/js/site/applisteners.js" type="text/javascript" th:nonce="${cspNonce}"></script>
</th:block>
<th:block th:if="${@environment.getProperty('app.js.useMinified') == 'true'}">
    <script src="/js/site/min/applisteners.min.js" type="text/javascript" th:nonce="${cspNonce}"></script>
</th:block>
<script type="text/javascript" th:inline="javascript" th:nonce="${cspNonce}">
    $(document).ready(function () {
        /*<![CDATA[*/
        shashin.nonce = /*[[${cspNonce}]]*/ '';
        const personName = /*[[${personInfo.name}]]*/ '';
        /*]]>*/

        shashin.updateSearchInput(personName);

        function adjustBadge(id, delta) {
            const el = $('#' + id);
            const n = parseInt(el.text(), 10) || 0;
            el.text(Math.max(0, n + delta));
        }

        function removeCard(detectionId) {
            $('#matchCard' + detectionId).parent().fadeOut(300, function() { $(this).remove(); });
        }

        $(document).on('click', '.confirm-btn', async function () {
            const detectionId = $(this).data('detection-id');
            const personId = $(this).data('person-id');
            const cropUrl = $(this).data('crop-url');
            const http = new Http('confirm match');
            const data = await http.ajax('post', '/person/matches/confirm',
                JSON.stringify({ detectionId: String(detectionId), action: 'confirm', personId: personId, cropUrl: cropUrl }));
            if (data && data.status === shashin.apiResponse.SUCCESS) {
                removeCard(detectionId);
                adjustBadge('matchesCountBadge', -1);
                adjustBadge('personCountBadge', 1);
                adjustBadge('trainingCountBadge', 1);
            }
        });

        $(document).on('click', '.reject-btn', async function () {
            const detectionId = $(this).data('detection-id');
            const http = new Http('reject match');
            const data = await http.ajax('post', '/person/matches/confirm',
                JSON.stringify({ detectionId: String(detectionId), action: 'reject' }));
            if (data && data.status === shashin.apiResponse.SUCCESS) {
                removeCard(detectionId);
                adjustBadge('matchesCountBadge', -1);
            }
        });
    });
</script>
</body>
</html>
