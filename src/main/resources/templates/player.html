<!DOCTYPE html>
<th:block th:insert="~{fragments/asciiart :: asciiart()}"></th:block>
<html th:lang="${locale}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <meta name="viewport" content="width=device-width">
    <meta name="robots" content="noindex">
    <meta property="og:type" content="video.other">
    <meta property="og:image" th:content="${baseUrl + '/api/v1/thumbnails/centered/' + metadataObj.id}">
    <meta property="og:url" th:content="${baseUrl + 'video/' + metadataObj.id + '/player'}">
    <meta property="og:video" th:content="${baseUrl + 'video/' + metadataObj.id + '/player'}">
    <meta property="og:title" th:content="${metadataObj.title}">
    <meta property="og:description" th:content="${#strings.isEmpty(metadataObj.description)?metadataObj.title:metadataObj.description}">
    <meta property="og:video:width" th:content="${metadataObj.originalImageWidth}">
    <meta property="og:video:height" th:content="${metadataObj.originalImageHeight}">
    <meta property="og:video:type" th:content="${metadataObj.type}">
    <meta property="description" th:content="${#strings.isEmpty(metadataObj.description)?metadataObj.title:metadataObj.description}">
    <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
    <style>
        body {
            background: black;
        }
    </style>
    <script src="/js/bootstrap.min.js" th:nonce="${cspNonce}"></script>
    <script src="/js/uuid4.min.js" th:nonce="${cspNonce}"></script>
    <script src="/js/jquery-3.5.1.min.js" th:nonce="${cspNonce}"></script>
    <script src="/js/jquery-ui.min.js" th:nonce="${cspNonce}"></script>
    <th:block th:if="${@environment.getProperty('app.js.useMinified') == 'false'}">
        <script src="/js/site/util.js" th:nonce="${cspNonce}"></script>
        <script src="/js/site/fragments/app/constants.js" th:nonce="${cspNonce}"></script>
        <script src="/js/site/fragments/app/toast.js" th:nonce="${cspNonce}"></script>
        <script src="/js/site/fragments/app/modal.js" th:nonce="${cspNonce}"></script>
        <script src="/js/site/fragments/app/batch.js" th:nonce="${cspNonce}"></script>
        <script src="/js/site/fragments/app/lightgallery.js" th:nonce="${cspNonce}"></script>
        <script src="/js/site/fragments/app/map.js" th:nonce="${cspNonce}"></script>
        <script src="/js/site/fragments/app/metadata.js" th:nonce="${cspNonce}"></script>
        <script src="/js/site/fragments/app/overlay.js" th:nonce="${cspNonce}"></script>
        <script src="/js/site/fragments/app/util.js" th:nonce="${cspNonce}"></script>
        <script src="/js/site/app.js" th:nonce="${cspNonce}"></script>
    </th:block>
    <th:block th:if="${@environment.getProperty('app.js.useMinified') == 'true'}">
        <script src="/js/site/min/util.min.js" th:nonce="${cspNonce}"></script>
        <script src="/js/site/min/fragments/app/constants.min.js" th:nonce="${cspNonce}"></script>
        <script src="/js/site/min/fragments/app/toast.min.js" th:nonce="${cspNonce}"></script>
        <script src="/js/site/min/fragments/app/modal.min.js" th:nonce="${cspNonce}"></script>
        <script src="/js/site/min/fragments/app/batch.min.js" th:nonce="${cspNonce}"></script>
        <script src="/js/site/min/fragments/app/lightgallery.min.js" th:nonce="${cspNonce}"></script>
        <script src="/js/site/min/fragments/app/map.min.js" th:nonce="${cspNonce}"></script>
        <script src="/js/site/min/fragments/app/metadata.min.js" th:nonce="${cspNonce}"></script>
        <script src="/js/site/min/fragments/app/overlay.min.js" th:nonce="${cspNonce}"></script>
        <script src="/js/site/min/fragments/app/util.min.js" th:nonce="${cspNonce}"></script>
        <script src="/js/site/min/app.min.js" th:nonce="${cspNonce}"></script>
    </th:block>
    <script src="/js/shoji.min.js" th:nonce="${cspNonce}"></script>
    <script src="/js/lg-download.js" th:nonce="${cspNonce}"></script>

    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/shoji.min.css">
    <title th:text="${metadataObj.title + ' - ' + @environment.getProperty('app.build.properties.name')}"></title>
</head>
<body>

<span th:replace="~{fragments/translations.html :: translations()}"></span>
<div th:replace="~{fragments/toastmessages :: toastmessages()}"></div>

<div id="player-gallery" style="display:none;"></div>

<script type="text/javascript" th:inline="javascript" th:nonce="${cspNonce}">
    (function() {
        /*<![CDATA[*/
        const description = /*[[${metadataObj.description}]]*/ '';
        const videoSrc = /*[[${metadataObj.videoUrl}]]*/ '';
        const downloadUrl = /*[[${metadataObj.videoUrl + '/download?v=' + randomString}]]*/ '';
        const thumbnailUrlOriginal = /*[[${metadataObj.thumbnailUrlOriginal}]]*/ '';
        const metadataId = /*[[${metadataObj.id}]]*/ 0;
        /*]]>*/

        const poster = (thumbnailUrlOriginal == null || thumbnailUrlOriginal === '')
            ? '/api/v1/thumbnails/225/' + metadataId
            : '/api/v1/thumbnails/original/' + metadataId;

        var plugins = [Shoji.RotateFlip];
        if (typeof lgDownload !== 'undefined') plugins.push(lgDownload);

        var gallery = new Shoji(document.getElementById('player-gallery'), {
            items: [{
                src: videoSrc,
                video: { provider: 'html5' },
                poster: poster,
                downloadUrl: downloadUrl,
                metadataId: metadataId,
                caption: description || undefined
            }],
            plugins: plugins,
            closable: false,
            counter: false,
            download: true,
            autoHideDelay: 5000
        });

        gallery.open(0);
    })();
</script>
</body>
</html>
