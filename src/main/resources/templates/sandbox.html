<script th:inline="javascript" type="text/javascript">
    $(document).ready(function() {
        /*********************************/
        // Base configs
        let lgElName = "infinite-scroll";
        let lgEl = document.getElementById(lgElName);

        let mediaContentList = [];
        $.each($(".mediaLink"), function() {
            const mediaContent = {};

            // Plugin name and argument
            mediaContent.pluginFunctionName = pluginFunction;
            mediaContent.args = $(this).attr("data-msg");

            let thumbnail = $(this).attr("data-thumb");
            if (typeof thumbnail !== 'undefined' && thumbnail !== false) {
                mediaContent.thumb = thumbnail;
            }

            let subHtmlAttr = $(this).attr("data-sub-html");
            if (typeof subHtmlAttr !== 'undefined' && subHtmlAttr !== false) {
                mediaContent.subHtml = subHtmlAttr;
            }

            if ($(this).attr("data-src")) {
                mediaContent.src = $(this).attr("data-src");
                mediaContent.downloadUrl = $(this).attr("data-download-url");
            }

            if ($(this).attr("data-video")) {
                mediaContent.video = $(this).attr("data-video");
                mediaContent.poster = $(this).attr("data-poster");
                mediaContent.lgSize = $(this).attr("data-lg-size");
            }

            mediaContent.metadataId = $(this).attr("data-metadata-id");
            mediaContentList.push(mediaContent);
        });

        function pluginFunction(message, lgId, lgIndex) {
            shashin.showToastMessage("Slide info",
                "<strong>message</strong>: " + message + "<br>" +
                "<strong>lgId</strong>: " + lgId + "<br>" +
                "<strong>lgIndex</strong>: " + lgIndex,
                {
                    tag: "pluginFunction",
                    autohide: false,
                    closeButton: true
                }
            );
        }
        /*********************************/

        /*********************************/
        // Shashin execution
        // const additionalConfig = {
        //     plugins: [lgPluginName],
        //     pluginFunctionName: pluginFunction,
        //     pluginSettingAttribute: true,
        //     dynamic: true,
        //     dynamicEl: mediaContentList,
        // };
        // mediaContentList = shashin.initLightGallery(lgElName,additionalConfig,".mediaLink");
        //
        // if (shashin.getLightGallery() !== null && typeof shashin.getLightGallery().refresh === 'function') {
        //     $("#openGallery").on("click", function () {
        //         shashin.getLightGallery().openGallery();
        //     });
        // }

        /*********************************/
        // Manual execution
        const configs = {
            plugins: [lgPluginName],
            pluginFunctionName: pluginFunction,
            pluginSettingAttribute: true,
            dynamic: true,
            dynamicEl: mediaContentList,
            licenseKey: Util.lgApiKey()
        };

        const lg = lightGallery(lgEl, configs);

        $("#openGallery").on("click", function () {
            lg.openGallery();
        });
    })
</script>
