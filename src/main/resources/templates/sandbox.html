<script th:inline="javascript" type="text/javascript">
    $(document).ready(function() {
        Util.konamiCodeListener(function(sequenceComplete) {
            if (sequenceComplete === true) {
                if (shashin.uglified === false) {
                    Util.uglify("");
                    shashin.uglified = true;
                } else {
                    Util.deuglify("");
                    shashin.uglified = false;
                }
            }
        });

        /*********************************/
        // Base configs
        let lgElName = "infinite-scroll";
        let lgEl = document.getElementById(lgElName);

        function getMediaContentList() {
            let mediaContentList = [];
            $.each($(".mediaLink"), function () {
                const mediaContent = {};

                // Plugin name and argument, or can be defined in settings
                mediaContent.pluginFunctionName = pluginFunction;
                mediaContent.args = $(this).attr("data-msg");

                let thumbnail = $(this).attr("data-thumb");
                if (typeof thumbnail !== 'undefined' && thumbnail !== false) {
                    mediaContent.thumb = thumbnail;
                }

                let subHtmlAttr = $(this).attr("data-sub-html");
                if (typeof subHtmlAttr !== 'undefined' && subHtmlAttr !== false) {
                    mediaContent.subHtml = subHtmlAttr;
                }

                if ($(this).attr("data-src")) {
                    mediaContent.src = $(this).attr("data-src");
                }

                if ($(this).attr("data-video")) {
                    mediaContent.video = $(this).attr("data-video");
                    mediaContent.poster = $(this).attr("data-poster");
                    mediaContent.lgSize = $(this).attr("data-lg-size");
                }

                mediaContentList.push(mediaContent);
            });

            return mediaContentList;
        }

        function pluginFunction(message, lgId, lgIndex) {
            shashin.showToastMessage("Slide info",
                "<strong>message</strong>: " + message + "<br>" +
                "<strong>lgId</strong>: " + lgId + "<br>" +
                "<strong>lgIndex</strong>: " + lgIndex,
                {
                    width: "300px",
                    tag: "pluginFunction",
                    autohide: false,
                    closeButton: true
                }
            );
        }

        /*********************************/

        /*********************************/
        let lg = null;

        function initShashinGallery() {
            console.log("Using Shashin");

            // Shashin execution
            const additionalConfig = {
                plugins: [lgPluginName],
                dynamic: true,
                dynamicEl: getMediaContentList(),
                pluginSettingAttribute: true,
                overrideBaseConfigs: true,
            };
            shashin.initLightGallery(lgElName,additionalConfig,".mediaLink");

            if (shashin.getLightGallery() !== null && typeof shashin.getLightGallery().refresh === 'function') {
                $("#openGallery").on("click", function (e) {
                    shashin.openGallery(e, 0);
                });

                $(".mediaLink").on("click", function (e) {
                    e.preventDefault();

                    const index = $('.mediaLink').index(this);
                    shashin.openGallery(e, index);
                });
            }
        }

        function initLgGallery() {
            console.log("Using Lightgallery");

            /*********************************/
            // Manual execution
            const configs = {
                plugins: [lgPluginName],
                pluginSettingAttribute: true,
                // pluginFunctionName: pluginFunction, // This returns the metadata as the first argument. Alternatively, define in mediaContentList to set first argument
                dynamic: true,
                download: false,
                dynamicEl: getMediaContentList(),
                licenseKey: Util.lgApiKey()
            };

            lg = lightGallery(lgEl, configs);

            $("#openGallery").on("click", function () {
                lg.openGallery();
            });

            $(".mediaLink").on("click", function (e) {
                e.preventDefault();

                const index = $('.mediaLink').index(this);
                lg.openGallery(index);
            });

            return lg;
        }

        if ($('#useShashin').is(':checked')) {
            initShashinGallery();
        } else {
            lg = initLgGallery();
        }

        $("#useShashin").on("change", function (e) {
            e.preventDefault();

            if (this.checked) {
                if (lg !== null) {
                    lg.closeGallery(true);
                    lg.destroy();
                    lg = null;

                    $("#openGallery").off("click");
                    $(".mediaLink").off("click");
                }
                initShashinGallery();
            } else if (this.checked === false && lg !== undefined) {
                if (shashin.getLightGallery() !== null) {
                    shashin.getLightGallery().closeGallery(true);
                    shashin.getLightGallery().destroy();
                    shashin.lg = null;

                    $("#openGallery").off("click");
                    $(".mediaLink").off("click");
                }
                lg = initLgGallery();
            }
        });
    })
</script>
