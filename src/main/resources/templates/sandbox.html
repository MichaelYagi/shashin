<!DOCTYPE html>
<th:block th:insert="~{fragments/asciiart :: asciiart()}"></th:block>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:insert="~{fragments/head :: head(${activePage},${titleDescriptor})}"></head>
<script src="/js/dexie.js" th:nonce="${cspNonce}"></script>
<body class="thumb d-flex flex-column vh-100">

<script type="text/babel" src="/js/site/test.js"></script>

<div th:replace="~{fragments/topnav :: topnav(${currentUser},${activePage},'')}"></div>

<div id="container" class="container-fluid pb-3 flex-grow-1 d-flex flex-column overflow-auto">
    <div class="row flex-grow-sm-1 flex-grow-0">
        <main role="main" class="col overflow-auto h-100">
            <div id="infinite-scroll-gallery">
                <th:block th:if="${not #lists.isEmpty(metadataList)}">
                    <div th:class="'row' + ${isMobile ? '' : ' image-group-padding'}">
                        <th:block th:each="metadata, iterStat: ${metadataList}">
                            <th:block th:if="${iterStat.count > 0}" th:unless="${!iterStat.first and metadataList[iterStat.index-1].year==metadata.year and metadataList[iterStat.index-1].month==metadata.month and metadataList[iterStat.index-1].day==metadata.day}">
                                <th:block th:unless="${metadata.year==null or metadata.month==null or metadata.day==null}">
                                    <section class="dateSection" th:id="${metadata.year+'-'+metadata.month+'-'+metadata.day}"><p><strong th:text="${metadata.year+'-'+metadata.month+'-'+metadata.day}"></strong></p><div th:id="'dateBody'+${metadata.year+'-'+metadata.month+'-'+metadata.day}" class="row" style="margin-left: -2px;">
                                </th:block>
                            </th:block>

                            <div th:id="${'photoThumbnailContainer'+metadata.id}" class="photo-thumbnail-container photo-thumbnail" th:style="${'width:'+(isMobile ? thumbnailHeight : metadata.thumbnailSmallWidth)+'px;height:'+(isMobile ? thumbnailHeight : metadata.thumbnailSmallHeight)+'px;padding-left:0;padding-right:0;'}">
                                <img loading="lazy" draggable="false" th:data-smallthumb="'/api/v1/thumbnails/'+${isMobile?'centered':'225'}+'/'+${metadata.id}" th:data-xsmallthumb="${metadata.thumbnailUrlExtraSmall==null?'':'/api/v1/thumbnails/112/'+metadata.id}" th:src="'/api/v1/thumbnails/'+${isMobile?'centered':'225'}+'/'+${metadata.id}" class="photo-thumbnail-image" th:id="'image'+${metadata.id}" th:width="${isMobile ? thumbnailHeight : metadata.thumbnailSmallWidth}" th:height="${isMobile ? thumbnailHeight : metadata.thumbnailSmallHeight}" style="background-color:lightgray;">
                            </div>

                            <th:block th:if="${iterStat.count > 0 and !iterStat.last and metadata.year!=null and (metadataList[iterStat.index+1].year+'-'+metadataList[iterStat.index+1].month+'-'+metadataList[iterStat.index+1].day)!=metadata.year+'-'+metadata.month+'-'+metadata.day}">
                                <th:block th:remove="tag" th:utext="'&lt;/div&gt;&lt;/section&gt;'"></th:block>
                                <span class="appendMetadataPhotos" th:id="${'append'+metadata.year+'-'+metadata.month+'-'+metadata.day}" style="width:0;height:0;padding:0"></span>
                            </th:block>
                            <th:block th:if="${iterStat.last and metadata.year!=null}">
                                <th:block th:remove="tag" th:utext="'&lt;/div&gt;&lt;/section&gt;'"></th:block>
                                <span class="appendMetadataPhotos" th:id="${'append'+metadata.year+'-'+metadata.month+'-'+metadata.day}" style="width:0;height:0;padding:0"></span>
                            </th:block>
                        </th:block>
                    </div>
                </th:block>
            </div>

            <div id="spinner" class="spinner-border justify-content-center align-items-center" role="status" style="display: none"></div>
            <div id="footer" th:replace="~{fragments/footer :: footer(${copyrightYear},${operatingSystemInfo},${buildProperties},${activeProfile},${activePage})}"></div>
        </main>
    </div>
</div>

<script type="text/javascript">
    $(document).ready(function() {
        const offset = 30;
        let direction = "down";
        const calculateDistanceToFooter = function() {
            return $(window).height() - $('footer').offset().top - offset - 1;
        };
        let http = new Http("timeline");

        http.ajax("get", "/sandbox/data").then(function (data) {
            if (data.hasOwnProperty("metadataList")) {
                const metadataList = data.metadataList;

                // Dexie
                let dbOperationComplete = false;
                const db = new Dexie("MetadataDatabase");
                db.version(1).stores({
                    metadataList: `id, [year+month+day]`
                });

                db.metadataList.bulkPut(metadataList).then(() => {
                    dbOperationComplete = true;
                });

                http = new Http("timeline");
                http.ajax("get", "/timeline/yearmonthcounts/"+shashin.mediaTypeFilter).then(function (data) {
                    if (data.hasOwnProperty("metadataDates") && data.hasOwnProperty("metadataYearMonthCount") && data.hasOwnProperty("metadataDatesHash")) {
                        const timelineYearMonthCountsData = data["metadataYearMonthCount"];
                        const timelineDatesData = data["metadataDates"];
                        const timelineDatesHash = data["metadataDatesHash"];
                        const timelineDatesHashCount = Object.keys(timelineDatesHash).length;

                        // console.log(timelineDatesData);
                        // console.log(timelineDatesHash);

                        // Functions to imitate timeline
                        $("#doit").on("click", function (e) {
                            e.preventDefault();
                        })

                        function getDateGalleryHeight(id) {
                            if ($("#" + id).length === 0) {
                                return 0;
                            }

                            return $("#" + id).outerHeight(true);
                        }

                        function removeDate(date) {
                            $("#br"+date).remove();
                            $("#row"+date).remove();
                            $("#amp_"+date).remove();
                            $("#tail_"+date).remove();
                            $("#"+date).remove();
                            $("#container_"+date).remove();
                            $("#append"+date).remove();
                        }

                        $("section").each(function(index, element) {
                            isInViewport($(element), function (inViewport) {
                                if (inViewport === false) {
                                    removeDate($(element).attr("id"));
                                }
                            });
                        });

                        document.body.addEventListener('wheel', function (event) {
                            direction = event.deltaY > 0 ? 'down' : 'up';
                        });

                        function createSection(year, month, day, attachDate) {
                            db.metadataList.where({year: year, month: month, day: day}).reverse().sortBy("time", function (metadataArray) {
                                let html = "<section class='dateSection' id='"+year+"-"+month+"-"+day+"'>" +
                                    "<p><strong>"+year+"-"+month+"-"+day+"</strong></p>" +
                                    "<div id='dateBody"+year+"-"+month+"-"+day+"' class='row' style='margin-left: -2px;'>";

                                for (const index in metadataArray) {
                                    const metadata = metadataArray[index];

                                    html += "<div id='photoThumbnailContainer"+metadata.id+"' class='photo-thumbnail-container photo-thumbnail' style='width:"+metadata.thumbnailSmallWidth+"px;height:"+metadata.thumbnailSmallHeight+"px;padding-left:0;padding-right:0;'>" +
                                        "<img loading='lazy' draggable='false' src='/api/v1/thumbnails/225/"+metadata.id+"' class='photo-thumbnail-image' id='image"+metadata.id+"' width='"+metadata.thumbnailSmallWidth+"' th:height='"+metadata.thumbnailSmallHeight+"' style='background-color:lightgray;'>" +
                                        "</div>"
                                }

                                html += "</div></section>" +
                                    "<span class='appendMetadataPhotos' id='append"+year+"-"+month+"-"+day+"' style='width:0;height:0;padding:0'></span>";

                                let htmlContent = $(html);

                                const viewportTop = $("#container").scrollTop();

                                if (direction === "up") {
                                    $("#"+attachDate).before(htmlContent);
                                } else {
                                    htmlContent.insertAfter($("#append"+attachDate));
                                }

                                // TODO: Create - look in timeline - needed for all browsers
                                const contentHeight = getDateGalleryHeight(year + "-" + month + "-" + day);

                                console.log("====================");
                                console.log("created date: " + year+"-"+month+"-"+day);
                                console.log("direction: " + direction);
                                console.log("viewportTop: " + viewportTop);
                                console.log("contentHeight: " + contentHeight);

                                if (direction === "up") {
                                    $("#container")[0].scrollTop = contentHeight;
                                } else {
                                    $("#container")[0].scrollTop = viewportTop
                                }
                            });
                        }

                        function isInViewport(element, callback) {
                            let retVal = false;

                            if (element.length > 0) {
                                const header = $('header');
                                const elementTop = element.offset().top;
                                const elementBottom = elementTop + element.outerHeight();
                                const viewportTop = header.outerHeight() - $(window).scrollTop();
                                const viewportBottom = viewportTop + ($(window).height() - header.outerHeight());

                                retVal = elementBottom > viewportTop && elementTop < viewportBottom;
                            }

                            callback(retVal);
                        }

                        // Scroll
                        document.getElementById("container").addEventListener('scroll', function() {
                            const viewportTop = $("#container").scrollTop();
                            const firstEl = $("section")[0];
                            const firstDate = $(firstEl).attr("id");
                            const lastEl = $("section")[$("section").length - 1];
                            const lastDate = $(lastEl).attr("id");

                            // View top 0 add more to the top
                            console.log(direction);
                            console.log(viewportTop);
                            console.log(offset);
                            if (direction === "up" && viewportTop < offset && timelineDatesHash[firstDate] !== 0 && timelineDatesHash[lastDate]-1 > -1) {
                                const prevDate = timelineDatesData[timelineDatesHash[firstDate]-1];
                                console.log("testzzz")
                                console.log(prevDate)
                                createSection(prevDate.year, prevDate.month, prevDate.day, firstDate);
                            } else if (direction === "down" && calculateDistanceToFooter() >= -offset && calculateDistanceToFooter() <= 0 && timelineDatesHash[lastDate]+1 <= timelineDatesHashCount) {
                                const nextDate = timelineDatesData[timelineDatesHash[lastDate]+1];
                                createSection(nextDate.year, nextDate.month, nextDate.day, lastDate);
                            }

                            // Removing anything not in viewport
                            setTimeout(function () {
                                $("section").each(function(index, element) {
                                    isInViewport($(element), function (inViewport) {
                                        console.log("-----");
                                        console.log($(element).attr("id") + " element in viewport: " + inViewport);

                                        if (inViewport === false) {
                                            const viewportTop = $("#container").scrollTop();
                                            const contentHeight = getDateGalleryHeight($(element).attr("id"));

                                            removeDate($(element).attr("id"));

                                            // TODO: Removal - Needed for Safari
                                            if (Util.isSafari()) {
                                                console.log("----------");
                                                console.log("removed date: " + $(element).attr("id"));
                                                console.log("direction: " + direction);
                                                console.log("viewportTop: " + viewportTop);
                                                console.log("contentHeight: " + contentHeight);

                                                if (direction === "down") {
                                                    $("#container")[0].scrollTop = viewportTop - contentHeight;
                                                } else {
                                                    $("#container")[0].scrollTop = viewportTop + contentHeight; // maintain relative pos
                                                }
                                            }
                                        }
                                    })
                                });
                            }, 0);
                        }, { passive: true });

                        // Scroll stop
                        document.getElementById("container").addEventListener("scrollend", () => {

                        });
                    }
                });
            }
        });
    });
</script>


<script src="/js/site/test.js" type="text/javascript" th:nonce="${cspNonce}"></script>

</body>
</html>
