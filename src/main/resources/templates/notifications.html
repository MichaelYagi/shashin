<!DOCTYPE html>
<th:block th:insert="~{fragments/asciiart :: asciiart()}"></th:block>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:insert="~{fragments/head :: head(${activePage},${titleDescriptor})}"></head>
<body class="thumb d-flex flex-column vh-100">

<div th:replace="~{fragments/topnav :: topnav(${currentUser},${activePage},'')}"></div>

<div id="container" class="container-fluid pb-3 flex-grow-1 d-flex flex-column overflow-auto">
    <div class="row flex-grow-sm-1 flex-grow-0">
        <div th:replace="~{fragments/sidebaroffcanvas :: sidebaroffcanvas(${activeSidebar},${currentUser})}"></div>
        <main role="main" class="col overflow-auto h-100">
            <div th:replace="~{fragments/hiddenfields :: hiddenfields(${message})}"></div>

            <th:block th:if="${#strings.equals(locale, 'en')}">
                <p class="mt-3" th:utext="'Latest ' + ${notificationLimit} + ' notifications available.' + ${authority == 'ROLE_SUPER' ? ' Change the limit on the &lt;a href=&quot;settings&quot; target=&quot;_blank&quot;&gt;settings&lt;/a&gt; page.' : ''}"></p>
            </th:block>
            <th:block th:if="${#strings.equals(locale, 'ja')}">
                <p class="mt-3" th:utext="'Latest ' + ${notificationLimit} + ' notifications available.' + ${authority == 'ROLE_SUPER' ? ' Change the limit on the &lt;a href=&quot;settings&quot; target=&quot;_blank&quot;&gt;settings&lt;/a&gt; page.' : ''}"></p>
            </th:block>

            <th:block th:if="${not #lists.isEmpty(notificationList)}">
                <ul class="list-group list-group-hover mt-3" id="notificationList">
                <th:block th:each="notification, iterStat: ${notificationList}">
                    <li th:id="${notification.id}" class="list-group-item"><th:block th:unless="${notification.read}"><span th:id="${'newNotification'+notification.id}" style="color: darkred;" class="notification">&bull;&nbsp;</span></th:block><th:block th:if="${notification.read}">&nbsp;&nbsp;</th:block><th:block th:remove="tag" th:utext="${notification.read ? notification.message : '<strong>'+notification.message+'</strong>'}"></th:block></li>
                </th:block>
                </ul>
            </th:block>

            <div id="footer" th:replace="~{fragments/footer :: footer(${copyrightYear},${operatingSystemInfo},${buildProperties},${activeProfile},${activePage})}"></div>
        </main>
    </div>
</div>

<script type="text/javascript" th:inline="javascript" th:nonce="${cspNonce}">
    /*<![CDATA[*/
    shashin.nonce = /*[[${cspNonce}]]*/ '';
    /*]]>*/

    shashin.updateSearchInput(shashin.getTranslatedValue("main.sidebar.notifications"));
    NotificationUtil.markNotificationRead();
</script>
</body>
</html>
