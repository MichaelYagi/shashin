<!DOCTYPE html>
<html lang="en" xmlns:th="http://thymeleaf.org">
<head th:insert="fragments/head :: head(${titleDescriptor})"></head>
<body class="thumb d-flex flex-column vh-100">

<div th:replace="fragments/topnav :: topnav(${currentUser},${hasNotifications},${activePage})"></div>

<div id="container" class="container-fluid pb-3 flex-grow-1 d-flex flex-column overflow-auto">
    <div class="row flex-grow-sm-1 flex-grow-0">
        <div th:replace="fragments/sidebaroffcanvas :: sidebaroffcanvas(${activeSidebar},${currentUser},${hasNotifications})"></div>
        <main role="main" class="col overflow-auto h-100">
            <div th:replace="fragments/content :: content(${message},${activePage},${authority},${parameter})" class="col-sm p-3 min-vh-100"></div>
            <button class="btn btn-primary" id="matchAction">Scan For Matches</button>
            <button class="btn btn-danger" id="deleteThread">Delete Thread</button>
            <div th:replace="fragments/footer :: footer(${copyrightYear},${operatingSystemInfo},${buildProperties})"></div>
        </main>
    </div>
</div>

<script type="text/javascript">
    $(document).ready(function () {
        $("#matchAction").click(function(e) {
            e.preventDefault();

            $.get("/person/matches/start", function(data) {
                if (data["status"] === "success") {
                    window.location.href = window.location.href;
                } else {
                    $("#msg").text(data["msg"]);
                }
            });
        });

        $("#deleteThread").click(function(e) {
            e.preventDefault();

            $.get("/person/matches/deletethread", function(data) {
                if (data["msg"]) {
                    $("#msg").text(data["msg"]);
                }
            });
        });

        // Web socket
        let stompClient = null;
        let scanInProgress = false;

        connect();

        function matchRefresh() {
            sendMessage();
            let msgId = "#msg";
            if ($(msgId).text() === "Matching Complete") {
                scanInProgress = false;
                disconnect();
            } else {
                scanInProgress = true;
                setTimeout(matchRefresh, 1000);
            }
        }

        function connect() {
            var socket = new SockJS('/websocket-endpoint');
            stompClient = Stomp.over(socket);
            if (shashin.showDebug === false) {
                stompClient.debug = null
            }

            shashin.printMessageToConsole("Socket Connecting");

            stompClient.connect({}, function() {
                if (scanInProgress === false) {
                    matchRefresh();
                }
                shashin.printMessageToConsole( "Connected STOMP client");
                this.subscribe("/topic/matchmessages", function (message) {
                    let respMessage = JSON.parse(message.body).content;
                    shashin.printMessageToConsole("respMessage: "+message);
                    showMessage(respMessage);
                });
            }, function(e) {
                shashin.printMessageToConsole( "connect() error" );
                shashin.printMessageToConsole( e );
                // showMessage("Socket connection error: " + e.toString())
                showMessage("Oops, something went wrong!")
                scanInProgress = false;
            });
        }

        function disconnect() {
            if (stompClient !== null) {
                stompClient.disconnect();
            }
            shashin.printMessageToConsole("Disconnected");
        }

        function sendMessage() {
            if (stompClient !== null) {
                stompClient.send("/app/matchmessage", {}, JSON.stringify({'message': "getMatchMessage"}));
            } else {
                showMessage("Trying to send message but STOMP client is null")
                scanInProgress = false;
            }
        }

        function showMessage(message) {
            $("#msg").text(message);
        }
    });
</script>
</body>
</html>
