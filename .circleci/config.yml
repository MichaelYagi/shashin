workflows:
  shashin_workflow:
    jobs:
      - node/test:
          name: Run node tests
          filters: # job runs for all branches and all tags
            tags:
              only: /^v.*/
          test-results-for: mocha
          post-steps:
            - run:
                name: Save JS test results
                command: |
                  mkdir -p test-results/mocha/
                  find . -type f -regex ".*/test-results.xml" -exec cp {} test-results/mocha/ \;
                when: always
            - store_test_results:
                path: test-results
            - store_artifacts:
                path: test-results/mocha
            - persist_to_workspace: # persist workspace across jobs
                root: .
                paths:
                  - test-results/mocha
      - maven/test: # checkout, build, test, and upload test results
          executor: java17
          name: Run junit tests # and package to tar
          filters: # job runs for all branches and all tags
            tags:
              only: /^v.*/
          requires:
            - Run node tests
          pre-steps:
            - run:
                name: Download Chromedrivers
                command: |
                  sudo apt-get update
                  sudo apt-get install libgbm1 libgconf-2-4 libnss3 libxss1 lsb-release
                  sudo apt-get install libappindicator3-1 libasound2 fonts-liberation xdg-utils
            # Install latest
            - browser-tools/install-chrome
            - browser-tools/install-chromedriver
            - run:
                command: |
                  google-chrome --version
                  chromedriver --version
                  whereis chromedriver
                name: Check install
          post-steps: # steps to run after steps
            - run:
                name: Save test results
                command: |
                  mkdir -p test-results/junit/
                  find . -type f -regex ".*/target/surefire-reports/.*" -exec cp {} test-results/junit/ \;
                when: always
            - attach_workspace: # attach from another job
                at: .
            - run:
                name: Set Version # get version from pom.xml
                command: |
                  echo 'export VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)' >> $BASH_ENV
            - run: |
                cp $BASH_ENV bash.env
            # Persist to text file
            - run: |
#                mkdir -p target/artifact/
#                touch target/artifact/shashin-version.txt
                touch shashin-version.txt
                echo $VERSION > shashin-version.txt
            - run: |
                echo $(cat /home/circleci/project/target/shashin-version.txt)
#            - run:
#                name: Move jar Artifacts
#                command: |
#                  mkdir -p target/artifact/
#                  mv target/**.jar target/artifact/shashin-$VERSION.jar
#            - run:
#                name: Move exe Artifacts
#                command: |
#                  mkdir -p target/artifact/
#                  mv target/**.exe target/artifact/Shashin-$VERSION.exe
            - run:
                name: Compress Artifacts
                command: |
                  tar -cvzf shashin-$VERSION.tar shashin-$VERSION.jar Shashin-$VERSION.exe **.sh test-results
#                  mkdir -p target/artifact/
#                  tar -cvzf target/artifact/shashin-$VERSION.tar target/artifact/shashin-$VERSION.jar target/artifact/Shashin-$VERSION.exe **.sh test-results
            - persist_to_workspace: # persist across jobs
                root: .
                paths: .
#                  - target/artifact
            - store_artifacts: .
#                path: target/artifact
      - upload_to_repoflow:
          requires:
            - Run junit tests
          filters: # job runs for no branches and only for tags starting with 'v'
#            tags:
#              only: /^v.*/
#            branches:
#              ignore: /.*/
          name: Upload to RepoFlow