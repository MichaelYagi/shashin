version: 2.1

orbs:
  maven: circleci/maven@1.2.0
  node: circleci/node@5.0.0
  artifactory: circleci/artifactory@1.0.0

workflows:
  shashin_workflow:
    jobs:
      - node/test:
          name: Run node tests
          filters: # job runs for all branches and all tags
            tags:
              only: /.*/
          test-results-for: mocha
          post-steps:
            - run:
                name: Save JS test results
                command: |
                  mkdir -p target/test-results/mocha/
                  find . -type f -regex ".*/test-results.xml" -exec cp {} target/test-results/mocha/ \;
                when: always
            - store_test_results:
                path: target/test-results
            - store_artifacts:
                path: target/test-results/mocha
            - persist_to_workspace: # persist across jobs
                root: .
                paths:
                  - target/test-results/mocha
      - maven/test: # checkout, build, test, and upload test results
          name: Run junit tests, package to tar and store artifacts
          requires:
            - Run node tests
          filters: # job runs for all branches and all tags
            tags:
              only: /.*/
          pre-steps:
            - run:
                name: Download selenium libs
                command: sudo apt-get install gconf-service libasound2 libatk1.0–0 libc6 libcairo2 libcups2 libdbus-1–3 libexpat1 libfontconfig1 libgbm-dev libgcc1 libgconf-2–4 libgdk-pixbuf2.0–0 libglib2.0–0 libgtk-3–0 libnspr4 libpango-1.0–0 libpangocairo-1.0–0 libstdc++6 libx11–6 libx11-xcb1 libxcb1 libxcomposite1 libxcursor1 libxdamage1 libxext6 libxfixes3 libxi6 libxrandr2 libxrender1 libxss1 libxtst6 ca-certificates fonts-liberation libappindicator1 libnss3 lsb-release xdg-utils wget
            - run:
                name: Download Selenium
                command: curl -O http://selenium-release.storage.googleapis.com/3.5/selenium-server-standalone-3.5.3.jar
            - run:
                name: Start Selenium
                command: java -jar selenium-server-standalone-3.5.3.jar -log target/test-results/selenium/selenium.log
                background: true
          post-steps: # steps to run after steps
            - run: mkdir -p target/test-results/selenium/
            - run:
                name: Save test results
                command: |
                  mkdir -p target/test-results/junit/
                  find . -type f -regex ".*/target/surefire-reports/.*xml" -exec cp {} target/test-results/junit/ \;
                when: always
#            - store_test_results:
#                path: target/test-results
#            - store_artifacts:
#                path: target/test-results/junit
#            - store_artifacts:
#                path: target/shashin-1.0.0.jar
#                destination: shashin-1.0.0.jar
#            - store_artifacts:
#                path: target/Shashin-1.0.0.exe
#                destination: Shashin-1.0.0.exe
            - attach_workspace: # attach from another job
                at: target/test-results/mocha
            - run:
                name: Set Version # get version from pom.xml
                command: |
                  echo 'export VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)' >> $BASH_ENV
            - run:
                name: Compress Artifacts
                command: |
                  mkdir -p target/artifact/
                  tar -cvzf target/artifact/shashin-$VERSION.tar target/**.jar target/**.exe target/test-results
            - persist_to_workspace: # persist across jobs
                root: .
                paths:
                  - target/artifact
            - store_artifacts:
                path: target/artifact
      - artifactory/upload:
          requires:
            - Run junit tests, package to tar and store artifacts
          filters: # job runs for no branches and only for tags starting with 'v'
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
          build-steps:
            - attach_workspace: # attach from another job
                at: target/artifact
            - store_artifacts:
                path: target/artifact
          name: Publish tar to Artifactory
          source: target/artifact/**
          target: shashin
