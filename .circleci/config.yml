version: 2.1

executors:
  java17:
    docker:
      - image: 'cimg/openjdk:17.0'

orbs:
  maven: circleci/maven@1.4.1
  node: circleci/node@5.3.0
  browser-tools: circleci/browser-tools@1.4.8

jobs:
  upload_to_repoflow:
    executor: java17
    steps:
      - attach_workspace: # attach from another job
          at: target/artifact
#      - store_artifacts:
#          path: target/artifact
      # Upload to RepoFlow
      - run:
          name: Upload jar artifact
          command: |
            token=$REPOFLOW_TOKEN
            version=$VERSION
            curl --request POST \
            --header "Authorization: Bearer $token" \
            --header "Content-Type: multipart/form-data" \
            --form "packageFiles=@\"target/artifact/shashin-$version.jar\"" \
            --form "packageName=\"shashin\"" \
            --form "packageVersion=\"$version\"" \
            --url "https://api.repoflow.io/upload/myagidevel-8191/shashin/single"
      - run:
          name: Upload windows artifact
          command: |
            token=$REPOFLOW_TOKEN
            version=$VERSION
            curl --request POST \
            --header "Authorization: Bearer $token" \
            --header "Content-Type: multipart/form-data" \
            --form "packageFiles=@\"target/artifact/Shashin-$version.exe\"" \
            --form "packageName=\"shashin\"" \
            --form "packageVersion=\"$version\"" \
            --url "https://api.repoflow.io/upload/myagidevel-8191/shashin/single"

workflows:
  shashin_workflow:
    jobs:
      - node/test:
          name: Run node tests
          filters: # job runs for all branches and all tags
            tags:
              only: /.*/
          test-results-for: mocha
          post-steps:
            - run:
                name: Save JS test results
                command: |
                  mkdir -p test-results/mocha/
                  find . -type f -regex ".*/test-results.xml" -exec cp {} test-results/mocha/ \;
                when: always
            - store_test_results:
                path: test-results
            - store_artifacts:
                path: test-results/mocha
            - persist_to_workspace: # persist across jobs
                root: .
                paths:
                  - test-results/mocha
      - maven/test: # checkout, build, test, and upload test results
          executor: java17
          name: Run junit tests and package to tar # and store artifacts
          requires:
            - Run node tests
#          filters: # job runs for all branches and all tags
#            tags:
#              only: /.*/
#          filters:
#            tags:
#              only: /^v.*/
#            branches:
#              ignore: /.*/
          pre-steps:
            - run:
                name: Download Chromedrivers
                command: |
                  sudo apt-get update
                  sudo apt-get install libgbm1 libgconf-2-4 libnss3 libxss1 lsb-release
                  sudo apt-get install libappindicator3-1 libasound2 fonts-liberation xdg-utils
            # Install latest
            - browser-tools/install-chrome
            - browser-tools/install-chromedriver
            - run:
                command: |
                  google-chrome --version
                  chromedriver --version
                  whereis chromedriver
                name: Check install
          post-steps: # steps to run after steps
            - run:
                name: Save test results
                command: |
                  mkdir -p test-results/junit/
                  find . -type f -regex ".*/target/surefire-reports/.*" -exec cp {} test-results/junit/ \;
                when: always
            - attach_workspace: # attach from another job
                at: .
            - run:
                name: Set Version # get version from pom.xml
                command: |
                  echo 'export VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)' >> $BASH_ENV
#            - run:
