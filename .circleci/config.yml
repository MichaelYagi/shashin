version: 2.1

orbs:
  maven: circleci/maven@1.2.0
  node: circleci/node@5.0.0

workflows:
  maven_test:
    jobs:
      - node/test:
          test-results-for: mocha
          post-steps:
            - run:
                name: Save JS test results
                command: |
                  mkdir -p ~/test-results/mocha/
                  find . -type f -regex ".*/test-results.xml" -exec cp {} ~/test-results/mocha/ \;
                when: always
            - store_test_results:
                path: ~/test-results
            - store_artifacts:
                path: ~/test-results/mocha
      - maven/test: # checkout, build, test, and upload test results
          requires:
            - node/test
          post-steps: # steps to run after steps defined in gradle/run
            - persist_to_workspace:
                root: .
                paths:
                  - target/shashin-1.0.0.jar
                  - target/Shashin-1.0.0.exe
            - run:
                name: Save test results
                command: |
                  mkdir -p ~/test-results/junit/
                  find . -type f -regex ".*/target/surefire-reports/.*xml" -exec cp {} ~/test-results/junit/ \;
                when: always
            - store_test_results:
                path: ~/test-results
            - store_artifacts:
                path: ~/test-results/junit
            - store_artifacts:
                path: target/shashin-1.0.0.jar
                destination: shashin-1.0.0.jar
            - store_artifacts:
                path: target/Shashin-1.0.0.exe
                destination: Shashin-1.0.0.exe
            - run:
                name: Compress Artifacts
                command: tar -cvzf shashin-1.0.0.tar target/shashin-1.0.0.jar target/Shashin-1.0.0.exe
            - store_artifacts:
               path: shashin-1.0.0.tar
               destination: shashin-1.0.0.tar
