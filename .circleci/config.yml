version: 2.1

orbs:
  maven: circleci/maven@1.2.0
  node: circleci/node@5.0.0
  artifactory: circleci/artifactory@1.0.0

workflows:
  shashin_workflow:
    jobs:
      - node/test:
          test-results-for: mocha
          post-steps:
            - run:
                name: Save JS test results
                command: |
                  mkdir -p target/test-results/mocha/
                  find . -type f -regex ".*/test-results.xml" -exec cp {} target/test-results/mocha/ \;
                when: always
            - store_test_results:
                path: target/test-results
            - store_artifacts:
                path: target/test-results/mocha
            - persist_to_workspace: # persist across jobs
                root: .
                paths:
                  - target/test-results/mocha
      - maven/test: # checkout, build, test, and upload test results
          requires:
            - node/test
          post-steps: # steps to run after steps
            - persist_to_workspace:
                root: .
                paths:
                  - target/shashin-1.0.0.jar
                  - target/Shashin-1.0.0.exe
            - run:
                name: Save test results
                command: |
                  mkdir -p target/test-results/junit/
                  find . -type f -regex ".*/target/surefire-reports/.*xml" -exec cp {} target/test-results/junit/ \;
                when: always
#            - store_test_results:
#                path: target/test-results
#            - store_artifacts:
#                path: target/test-results/junit
#            - store_artifacts:
#                path: target/shashin-1.0.0.jar
#                destination: shashin-1.0.0.jar
#            - store_artifacts:
#                path: target/Shashin-1.0.0.exe
#                destination: Shashin-1.0.0.exe
            - attach_workspace: # attach from another job
                at: target/test-results/mocha
            - run:
                name: Compress Artifacts
                command: tar -cvzf target/shashin-1.0.0.tar target/shashin-1.0.0.jar target/Shashin-1.0.0.exe target/test-results
            - persist_to_workspace: # persist across jobs
                root: .
                paths:
                  - target/shashin-1.0.0.tar
            - artifactory/upload:
                source: target/shashin-1.0.0.tar
                target: shashin/
